<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The World Is Your Playground</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fe0ff;touch-action:none;

  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .btn{position:absolute;bottom:calc(var(--u)*34);width:calc(var(--u)*104);height:calc(var(--u)*104);

    transition:transform .08s,box-shadow .08s;outline:none}

  .btn svg{width:56%;height:56%}

    backdrop-filter:blur(calc(var(--u)*2));-webkit-backdrop-filter:blur(calc(var(--u)*2));text-align:center;transition:opacity .4s}
  #title.hide{opacity:0;pointer-events:none}
  #title h1{margin:0;font-weight:900;line-height:.98;letter-spacing:calc(var(--u)*1);color:#fff;
    font-size:calc(var(--u)*104);-webkit-text-stroke:calc(var(--u)*14) #3b2d5c;paint-order:stroke fill;
    text-shadow:0 calc(var(--u)*10) 0 #3b2d5c;transform:rotate(-3deg);animation:wob 3s ease-in-out infinite}
  #title h1 span{display:block}

    border:calc(var(--u)*8) solid #3b2d5c;background:#35d07f;box-shadow:0 calc(var(--u)*12) 0 #3b2d5c;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*14);
    animation:bounce 1.1s ease-in-out infinite;outline:none;padding:0}

  #play svg{width:calc(var(--u)*80);height:calc(var(--u)*80)}
  #play b{color:#fff;font-size:calc(var(--u)*54);-webkit-text-stroke:calc(var(--u)*8) #3b2d5c;paint-order:stroke fill}
  @keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}

</head>
<body>
<div id="wrap">
  <canvas id="cv" width="720" height="1280"></canvas>
  <button class="btn" id="reset" aria-label="Reset world" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3b2d5c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
  </button>
  <button class="btn" id="sound" aria-label="Toggle sound" title="Sound"></button>
  <div id="title">
    <h1><span class="a">THE WORLD</span><span class="b">IS YOUR</span><span class="c">PLAYGROUND</span></h1>
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#3b2d5c" stroke-width="2.6" stroke-linejoin="round"/></svg>
      <b>PLAY</b>
    </button>
  </div>
</div>

<script>
/*
 * THE WORLD IS YOUR PLAYGROUND
 * An interactive toy diorama. Tap any object in a tiny floating island and watch it
 * transform: the sun becomes a fried egg, the house grows legs, the mountain sneezes a
 * rainbow... Curated chain reactions link neighbouring objects (max 3 linked reactions).
 * No score, no fail state, no reading required. RESET restores the world instantly.
 *
 * Systems: object registry + hit areas, per-object reaction (scripted animation, no physics),
 * chain manager (depth-limited, busy-locked), particle pool (capped), WebAudio synth,
 * UI (RESET, sound toggle, hint hand) and world reset.
 */
(function () {
'use strict';

const W = 720, H = 1280, TAU = Math.PI * 2, OUT = '#3b2d5c';
const MAXP = 240;

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function env(p, a, b, c, d) {
  if (p < a) return 0; if (p < b) return ease((p - a) / (b - a));

}
const _cc = {};
function rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }

}
function shade(h, k) {
  const key = h + k; if (_cc[key]) return _cc[key];
  return (_cc[key] = k >= 0 ? mix(h, '#ffffff', k) : mix(h, '#000000', -k));
}
const RAINBOW = ['#ff4d6d', '#ff9f1c', '#ffd23f', '#5ed66a', '#3ec6ff', '#6a7bff', '#c06cff'];

// ---------- state ----------
let cv, ctx, wrap, bg;
let state = 'title';
let time = 0, last = 0;
let parts = [], timers = [];
let camKick = 0, flash = 0;
let hover = null, lastTap = 0, cue = null, cueT = 0;
let firstTapDone = false, allDoneShown = false;
const discovered = new Set();
const OBJ = {}, ORDER = [];

// ---------- audio ----------
const Snd = {
  ctx: null, master: null, nbuf: null, muted: false,
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.nbuf = b;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(f0, f1, dur, o) {
    o = o || {}; if (!this.ctx || this.muted) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (o.d || 0), os = c.createOscillator(), g = c.createGain();
      os.type = o.type || 'sine';
      os.frequency.setValueAtTime(f0, t0);
      os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.v || 0.2, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      os.connect(g); g.connect(this.master); os.start(t0); os.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  noise(dur, f0, f1, o) {
    o = o || {}; if (!this.ctx || this.muted) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (o.d || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = this.nbuf; s.loop = true; f.type = o.ft || 'bandpass'; f.Q.value = o.q || 1;
      f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.v || 0.15, t0 + Math.min(0.05, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  pop() { this.tone(520, 900, 0.09, { v: 0.2 }); },
  tick() { this.tone(700, 500, 0.05, { v: 0.08 }); },
  boing(d) { d = d || 0; this.tone(180, 640, 0.2, { type: 'triangle', v: 0.22, d }); this.tone(640, 230, 0.26, { type: 'triangle', v: 0.18, d: d + 0.18 }); },
  whoosh(d) { this.noise(0.7, 300, 1800, { v: 0.16, q: 0.7, d: d || 0 }); },
  plop(d) { this.tone(720, 180, 0.14, { v: 0.2, d: d || 0 }); },
  splash(d) { this.noise(0.25, 3000, 900, { ft: 'highpass', v: 0.1, d: d || 0 }); this.plop(d); },
  sneeze() {
    this.noise(0.35, 500, 1600, { v: 0.1, q: 2 });
    this.tone(420, 900, 0.3, { type: 'triangle', v: 0.14 });
    this.noise(0.4, 2500, 500, { ft: 'lowpass', v: 0.22, d: 0.32, q: 0.5 });
    this.tone(260, 90, 0.35, { type: 'sawtooth', v: 0.12, d: 0.32 });
  },
  sparkle(d) { d = d || 0; [880, 1175, 1480, 1760].forEach((f, i) => this.tone(f, f * 1.01, 0.12, { v: 0.1, d: d + i * 0.06 })); },
  sizzle() { this.noise(1.1, 5000, 3500, { ft: 'highpass', v: 0.07, q: 0.5 }); this.boing(0.05); },
  rumble() { this.tone(110, 60, 0.5, { type: 'triangle', v: 0.2 }); this.tone(300, 500, 0.15, { v: 0.1, d: 0.2 }); },
  stomp(d) { this.tone(160, 70, 0.12, { type: 'triangle', v: 0.22, d: d || 0 }); },
  squeak(d) { this.tone(500, 1300, 0.12, { type: 'square', v: 0.07, d: d || 0 }); },
  rustle() { this.noise(0.5, 3500, 2500, { ft: 'highpass', v: 0.08 }); this.boing(0.1); },
  grow() { this.tone(260, 1100, 0.5, { v: 0.16 }); this.sparkle(0.35); },

function hap(p) { try { if (typeof lib !== 'undefined' && lib.haptics) lib.haptics.play(p); } catch (e) {} }

// ---------- drawing primitives ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fs(fill, lw) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.lineWidth = lw || 5; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function ball(x, y, r, col, lw) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, shade(col, 0.4)); g.addColorStop(0.6, col); g.addColorStop(1, shade(col, -0.22));
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); fs(g, lw);

function ellipse(x, y, rx, ry, fill, lw, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); if (fill || lw) fs(fill, lw);
}
function shadow(x, y, rx, ry, a) {
  ctx.save(); ctx.globalAlpha = a == null ? 0.22 : a; ctx.fillStyle = '#1f5a2a';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); ctx.restore();
}
// union of circles with a single outline (clouds, egg white)
function blobSet(cs, col, s, shadeK) {
  s = s || 1; ctx.fillStyle = OUT;
  for (const c of cs) { ctx.beginPath(); ctx.arc(c[0] * s, c[1] * s, c[2] * s + 3.5, 0, TAU); ctx.fill(); }
  ctx.fillStyle = shade(col, shadeK == null ? -0.14 : shadeK);

  ctx.fillStyle = col;

function star4(x, y, r, col) {
  ctx.beginPath();

/* face: eyes 0 dot,1 wide,2 happy,3 squint | mouth 0 smile,1 small o,2 grin,3 frown,4 angry teeth,5 flat,6 big O | brow 0 none,1 angry,2 raised */
function face(x, y, s, eyes, mouth, brow, look, nose) {
  look = look || 0;
  const ex = s * 0.34, ey = y - s * 0.08, er = s * 0.17, lw = Math.max(3, s * 0.07);
  ctx.save(); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = OUT;

    else if (eyes === 1) {
      ctx.beginPath(); ctx.arc(cx, ey, er * 1.25, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + look * er * 0.5, ey, er * 0.62, 0, TAU); ctx.fillStyle = OUT; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + look * er * 0.5 - er * 0.2, ey - er * 0.2, er * 0.2, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    } else if (eyes === 2) { ctx.beginPath(); ctx.arc(cx, ey + er * 0.4, er * 1.05, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(cx + d * er, ey - er * 0.8); ctx.lineTo(cx - d * er * 0.6, ey); ctx.lineTo(cx + d * er, ey + er * 0.8); ctx.stroke(); }
    if (brow === 1) { ctx.beginPath(); ctx.moveTo(cx + d * er * 1.5, ey - er * 2.6); ctx.lineTo(cx - d * er * 1.2, ey - er * 1.5); ctx.stroke(); }
    else if (brow === 2) { ctx.beginPath(); ctx.arc(cx, ey - er * 1.6, er * 1.0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }

  if (mouth === 0 || mouth === 2) { ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#ff5c8a'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + d * s * 0.62, y + s * 0.2, s * 0.13, s * 0.08, 0, 0, TAU); ctx.fill(); } ctx.restore(); }

  else if (mouth === 1) { ctx.beginPath(); ctx.ellipse(x, my, s * 0.09, s * 0.12, 0, 0, TAU); ctx.fillStyle = OUT; ctx.fill(); }
  else if (mouth === 2) {
    ctx.beginPath(); ctx.arc(x, my - s * 0.14, s * 0.27, 0, Math.PI); ctx.closePath(); ctx.fillStyle = '#7a1f3d'; ctx.fill(); ctx.stroke();

  else if (mouth === 4) {
    rr(x - s * 0.32, my - s * 0.2, s * 0.64, s * 0.36, s * 0.1); ctx.fillStyle = '#5a1a3a'; ctx.fill(); ctx.stroke();

// ---------- particles ----------
function spawn(type, x, y, o) {
  if (parts.length >= MAXP) parts.shift();
  const p = Object.assign({ type, x, y, vx: 0, vy: 0, g: 0, life: 1, size: 6, col: '#fff', rot: 0, vr: 0, gy: null, grow: 30 }, o || {});
  p.max = p.life; parts.push(p);
}
function burst(x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(o.min || 80, o.max || 260);
    spawn(o.type || 'spark', x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), g: o.g || 0, life: rnd(0.5, 1.1), size: rnd(o.s0 || 8, o.s1 || 16), col: o.col || pick(RAINBOW), rot: rnd(0, TAU), vr: rnd(-6, 6) });

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.gy != null && p.y > p.gy) { if (p.type === 'drop' && Math.random() < 0.3) spawn('ring', p.x, p.gy, { life: 0.35, size: 4, grow: 16, col: p.col }); p.life = 0; }
    if (p.life <= 0) parts.splice(i, 1);

}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.type === 'drop') { ctx.fillStyle = p.col; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.6, p.size * 1.15, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
    else if (p.type === 'spark') { ctx.globalAlpha = Math.min(1, a * 1.6); star4(0, 0, p.size * (0.5 + a * 0.7), p.col); }
    else if (p.type === 'puff') { ctx.globalAlpha = a * 0.75; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(0, 0, p.size * (1 + (1 - a) * 1.4), 0, TAU); ctx.fill(); }
    else if (p.type === 'splash') { ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, TAU); ctx.fill(); }
    else if (p.type === 'leaf') { ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.col; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
    else if (p.type === 'ring') { ctx.rotate(-p.rot); ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = 5 * a + 1; ctx.beginPath(); ctx.ellipse(0, 0, p.size + (1 - a) * p.grow, (p.size + (1 - a) * p.grow) * (p.flat || 1), 0, 0, TAU); ctx.stroke(); }
    else if (p.type === 'conf') { ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }

// ---------- timers ----------
function later(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); try { tm.fn(); } catch (e) {} } }
}

// ---------- object registry ----------
function def(id, cfg) {
  const o = Object.assign({ id, t: -1, dur: 3, glow: 0, pop: 0, v: 0, lastV: -1, mode: null, acc: 0, flag: {}, chains: [], depth: 0, ph: Math.random() * 6, ang: 0 }, cfg);
  OBJ[id] = o; ORDER.push(id); return o;

function pickV(o, n) { if (!n) return 0; let v; do { v = Math.floor(Math.random() * n); } while (n > 1 && v === o.lastV); o.lastV = v; return v; }

  o.t = 0; o.depth = depth || 0; o.mode = mode || null; o.acc = 0; o.flag = {};

  for (const id of DRAW_ORDER) {

    let sc = 1; if (o.pop > 0 || (cue === id && Math.sin(cueT * 9) > 0.7)) sc = 1 + 0.07 * Math.max(o.pop, 0.5) * Math.sin((1 - o.pop) * Math.PI + 0.01);

  if (state === 'play' && !firstTapDone) hand(594, 345);

}
function frame(ts) {

}

/* ============================ BOOT ============================ */
let inited = false;
function soundIcon() {
  const b = document.getElementById('sound');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#3b2d5c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/>' +
    (Snd.muted ? '<path d="M16 9l5 6M21 9l-5 6"/>' : '<path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>') + '</svg>';
}
function fit() { const r = wrap.getBoundingClientRect(); wrap.style.setProperty('--u', (r.width / 720) + 'px'); }

function run(mode) {
  if (inited) return; inited = true;
  cv = document.getElementById('cv'); ctx = cv.getContext('2d'); wrap = document.getElementById('wrap');
  buildBG(); fit(); window.addEventListener('resize', fit); soundIcon();
  cv.addEventListener('pointerdown', e => { e.preventDefault(); Snd.init(); if (state !== 'play') return; const [x, y] = toWorld(e); hover = null; tap(x, y); });
  cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || state !== 'play') return; const [x, y] = toWorld(e); const o = findObj(x, y); hover = o ? o.id : null; cv.style.cursor = o ? 'pointer' : 'default'; });
  cv.addEventListener('pointerleave', () => { hover = null; });

    Snd.init(); state = 'play'; lastTap = time; document.getElementById('title').classList.add('hide'); Snd.pop(); Snd.sparkle(0.05); hap('tap');
  });

  document.getElementById('sound').addEventListener('click', () => { Snd.init(); Snd.setMuted(!Snd.muted); soundIcon(); if (!Snd.muted) Snd.pop(); });
  window.__game = { OBJ, trigger, tap, resetWorld, get parts() { return parts; }, get state() { return state; }, discovered };

// Standalone fallback (outside the Astrocade host, `lib` is absent)

})();
