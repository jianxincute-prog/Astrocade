 * WHAT DID I JUST EAT?!  -  short-form creature transformation toy.
 *

  // flying food
  if (state === 'seq' && seq && seq.t < FLY + .05) {
    const p = eio(seq.t / FLY), cy = crCy();
    const tx = 360, ty = GY - cy + cr.eyeY + cr.mouthY;
    const x = lerp(seq.fx0, tx, p), y = lerp(seq.fy0, ty, p) - Math.sin(p * Math.PI) * 140, s = lerp(1.1, .35, p);
    c.save(); c.translate(x, y); c.rotate(p * 4); c.scale(s, s); c.globalAlpha = seq.t < FLY ? 1 : 0;
    c.save(); c.scale(1.05, 1.05); FOODDRAW[FOODDRAWMAP[seq.food]](c); c.restore(); c.restore();
  }
  // tray
  if (trayIn > .01 || state === 'ready') {
    c.save(); c.globalAlpha = clamp(trayIn * 1.6, 0, 1);
    const py = 960 + (1 - trayIn) * 340;
    rr(c, 14, py + 8, W - 28, 340, 56); c.fillStyle = 'rgba(90,40,30,.22)'; c.fill();
    rr(c, 14, py, W - 28, 340, 56); c.fillStyle = lg(c, 0, py, 0, py + 340, 'rgba(255,255,255,.74)', 'rgba(255,232,205,.62)'); c.fill(); c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.95)'; c.stroke();
    c.restore();
    for (let i = 0; i < tray.length; i++) {
      const s = tray[i]; if (s.used) continue;
      drawCard(c, s.food, s.x, s.y, s.s);
    }
    if (state === 'ready' && hintT > (everFed ? 5 : 2.2) && !drag.on) {
      const by = 960 + Math.abs(Math.sin(T * 4)) * 16;
      c.save(); c.translate(360, by - 20); c.beginPath(); c.moveTo(-26, -26); c.lineTo(26, -26); c.lineTo(26, 0); c.lineTo(46, 0); c.lineTo(0, 44); c.lineTo(-46, 0); c.lineTo(-26, 0); c.closePath();
      fo(c, '#ffe45e', 7); c.restore();
    }
  }
  // result buttons
  if (btnIn > .01) {
    drawBtn(c, BTN.again, 'AGAIN', ['#7be88a', '#2fb85a'], 'again', btnIn, pressed === 'again');
    drawBtn(c, BTN.neu, 'NEW CREATURE', ['#a58bff', '#6a45e8'], 'new', btnIn, pressed === 'neu');
  }
  // title
  if (state === 'title' || state === 'loading') {
    drawTitleDecor(c);
    drawTitleLine(c, 'WHAT DID I', 360, 168, 600, 110);
    drawTitleLine(c, 'JUST EAT?!', 360, 272, 600, 118);
    if (state === 'title') drawBtn(c, BTN.play, 'PLAY', ['#ffb23d', '#ff7a1a'], null, eo3(stT * 2.5), pressed === 'play');
    else drawLoadBar(c);
  }
  // sound toggle
  c.save(); c.translate(SND.x, SND.y);
  circ(c, 0, 0, 44); fo(c, '#fff', 7);
  c.fillStyle = OUT; c.beginPath(); c.moveTo(-18, -8); c.lineTo(-8, -8); c.lineTo(6, -20); c.lineTo(6, 20); c.lineTo(-8, 8); c.lineTo(-18, 8); c.closePath(); c.fill();
  c.lineWidth = 5; c.lineCap = 'round'; c.strokeStyle = OUT;
  if (soundOn) { c.beginPath(); c.arc(8, 0, 12, -.9, .9); c.stroke(); c.beginPath(); c.arc(8, 0, 22, -.8, .8); c.stroke(); }
  else { c.strokeStyle = '#e8274a'; c.lineWidth = 7; c.beginPath(); c.moveTo(14, -12); c.lineTo(30, 12); c.moveTo(30, -12); c.lineTo(14, 12); c.stroke(); }
  c.restore();
}

/* ------------------------------------------------------------------ loop */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - last) / 1000; last = ts; if (!(dt > 0)) dt = 1 / 60; dt = Math.min(dt, .11);
  try { update(dt * speed); render(); }
  catch (err) {
    try { if (window.lib) lib.log('recover: ' + (err && err.message)); } catch (e) { /* ignore */ }
    resetAll(); L = neutralL();
  }
}
function applyCfg() {
  const s = (window.gameConfig && window.gameConfig.settings) || {};
  speed = clamp(+s.speed || 1, .5, 1.6); soundOn = s.soundOn !== false;
}
function run(mode) {
  if (started) return; started = true;
  applyCfg();
  try {
    if (window.lib && lib.showGameParameters) lib.showGameParameters({
      name: 'WHAT DID I JUST EAT?!',
      params: {
        'Animation speed': { key: 'settings.speed', type: 'slider', min: .6, max: 1.5, step: .1, onChange(v) { speed = clamp(+v || 1, .5, 1.6); } },
        'Sound': { key: 'settings.soundOn', type: 'checkbox', onChange(v) { soundOn = !!v; applySound(); } }
      }
    });
  } catch (e) { /* ignore */ }
  cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.appendChild(cv); ctx = cv.getContext('2d');
  cr = CREATURES[0]; voicePitch = cr.voice; L = neutralL(); pickTray(); loadAudio();
  cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', () => { pressed = ''; drag.on = false; });
  window.addEventListener('keydown', onKey);
  requestAnimationFrame(frame);
}
window.run = run;
})();
</script>
