<html lang="en">

<body>
<div id="wrap">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <button class="btn" id="reset" aria-label="Reset world" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3b2d5c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
  </button>
  <button class="btn" id="sound" aria-label="Toggle sound" title="Sound"></button>
  <div id="title">
    <h1><span class="a">THE WORLD</span><span class="b">IS YOUR</span><span class="c">PLAYGROUND</span></h1>
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#3b2d5c" stroke-width="2.6" stroke-linejoin="round"/></svg>
      <b>PLAY</b>
    </button>
  </div>
</div>

<script>
/*
 * THE WORLD IS YOUR PLAYGROUND
 * An interactive toy diorama. Tap any object in a tiny floating island and watch it
 * transform: the sun becomes a fried egg, the house grows legs, the mountain sneezes a
 * rainbow... Curated chain reactions link neighbouring objects (max 3 linked reactions).
 * No score, no fail state, no reading required. RESET restores the world instantly.
 *
 * Systems: object registry + hit areas, per-object reaction (scripted animation, no physics),
 * chain manager (depth-limited, busy-locked), particle pool (capped), WebAudio synth,
 * UI (RESET, sound toggle, hint hand) and world reset.
 */
(function () {
'use strict';

const W = 720, H = 1280, TAU = Math.PI * 2, OUT = '#3b2d5c';
const MAXP = 240;
const S = 1.5;   // backing-store scale for crisp rendering
// World camera: the diorama is larger than the 720x1280 screen and is zoomed out to fit.
const Z = 0.76, TX = 360 * (1 - 0.76), TY = 60;           // screen = Z * world + (TX, TY)
const KX = 1.33, KY = 1.25, CX = 360, CY = 845;           // island/layout spread about its centre
const fx = x => CX + (x - CX) * KX, fy = y => CY + (y - CY) * KY;

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function env(p, a, b, c, d) {

const _cc = {};
function rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }

const RAINBOW = ['#ff4d6d', '#ff9f1c', '#ffd23f', '#5ed66a', '#3ec6ff', '#6a7bff', '#c06cff'];

// ---------- state ----------
let cv, ctx, wrap, bgSky, bgIsl, bgLight, bob = 0;
let state = 'title';
let time = 0, last = 0;
let parts = [], timers = [];
let camKick = 0, flash = 0;
let hover = null, lastTap = 0, cue = null, cueT = 0;

const discovered = new Set();
const OBJ = {}, ORDER = [];

// ---------- audio ----------
const Snd = {
  ctx: null, master: null, nbuf: null, muted: false,
  init() {
    try {

        this.ctx = new AC();

  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(f0, f1, dur, o) {

      g.gain.setValueAtTime(0.0001, t0);

  },
  noise(dur, f0, f1, o) {
    o = o || {}; if (!this.ctx || this.muted) return;

      const c = this.ctx, t0 = c.currentTime + (o.d || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();

      f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.v || 0.15, t0 + Math.min(0.05, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    } catch (e) {}
  },
  pop() { this.tone(520, 900, 0.09, { v: 0.2 }); },
  tick() { this.tone(700, 500, 0.05, { v: 0.08 }); },
  boing(d) { d = d || 0; this.tone(180, 640, 0.2, { type: 'triangle', v: 0.22, d }); this.tone(640, 230, 0.26, { type: 'triangle', v: 0.18, d: d + 0.18 }); },
  whoosh(d) { this.noise(0.7, 300, 1800, { v: 0.16, q: 0.7, d: d || 0 }); },
  plop(d) { this.tone(720, 180, 0.14, { v: 0.2, d: d || 0 }); },
  splash(d) { this.noise(0.25, 3000, 900, { ft: 'highpass', v: 0.1, d: d || 0 }); this.plop(d); },
  sneeze() {
    this.noise(0.35, 500, 1600, { v: 0.1, q: 2 });
    this.tone(420, 900, 0.3, { type: 'triangle', v: 0.14 });
    this.noise(0.4, 2500, 500, { ft: 'lowpass', v: 0.22, d: 0.32, q: 0.5 });
    this.tone(260, 90, 0.35, { type: 'sawtooth', v: 0.12, d: 0.32 });
  },
  sparkle(d) { d = d || 0; [880, 1175, 1480, 1760].forEach((f, i) => this.tone(f, f * 1.01, 0.12, { v: 0.1, d: d + i * 0.06 })); },
  sizzle() { this.noise(1.1, 5000, 3500, { ft: 'highpass', v: 0.07, q: 0.5 }); this.boing(0.05); },
  rumble() { this.tone(110, 60, 0.5, { type: 'triangle', v: 0.2 }); this.tone(300, 500, 0.15, { v: 0.1, d: 0.2 }); },
  stomp(d) { this.tone(160, 70, 0.12, { type: 'triangle', v: 0.22, d: d || 0 }); },
  squeak(d) { this.tone(500, 1300, 0.12, { type: 'square', v: 0.07, d: d || 0 }); },
  rustle() { this.noise(0.5, 3500, 2500, { ft: 'highpass', v: 0.08 }); this.boing(0.1); },
  grow() { this.tone(260, 1100, 0.5, { v: 0.16 }); this.sparkle(0.35); },
  moo(d) {
    if (!this.ctx || this.muted) return;

      const c = this.ctx, t0 = c.currentTime + (d || 0), o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), lf = c.createOscillator(), lg = c.createGain();

      o1.frequency.setValueAtTime(130, t0); o1.frequency.linearRampToValueAtTime(175, t0 + 0.25); o1.frequency.linearRampToValueAtTime(110, t0 + 0.9);
      o2.frequency.setValueAtTime(65, t0); o2.frequency.linearRampToValueAtTime(88, t0 + 0.25); o2.frequency.linearRampToValueAtTime(55, t0 + 0.9);
      lf.frequency.value = 6; lg.gain.value = 6; lf.connect(lg); lg.connect(o1.frequency);
      f.type = 'lowpass'; f.frequency.setValueAtTime(500, t0); f.frequency.linearRampToValueAtTime(900, t0 + 0.3); f.frequency.linearRampToValueAtTime(380, t0 + 0.9);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.95);

  },
  coin(d) { this.tone(1300, 1900, 0.12, { type: 'square', v: 0.05, d: d || 0 }); },
  creak() { this.tone(220, 120, 0.4, { type: 'sawtooth', v: 0.07 }); this.boing(0.35); },
  burp(d) { this.tone(130, 55, 0.4, { type: 'sawtooth', v: 0.12, d: d || 0 }); },
  beep(d) { this.tone(900, 900, 0.1, { type: 'square', v: 0.045, d: d || 0 }); },
  launch() { this.noise(1.6, 250, 1400, { v: 0.16, q: 0.6 }); this.tone(80, 220, 1.2, { type: 'sawtooth', v: 0.07 }); },

// ---------- drawing primitives ----------
function rr(x, y, w, h, r) {

function ellipse(x, y, rx, ry, fill, lw, rot) {

// union of circles with a single outline (clouds, egg white)
function blobSet(cs, col, s, shadeK) {

/* face: eyes 0 dot,1 wide,2 happy,3 squint | mouth 0 smile,1 small o,2 grin,3 frown,4 angry teeth,5 flat,6 big O | brow 0 none,1 angry,2 raised */

// ---------- particles ----------
function spawn(type, x, y, o) {

  const p = Object.assign({ type, x, y, vx: 0, vy: 0, g: 0, life: 1, size: 6, col: '#fff', rot: 0, vr: 0, gy: null, grow: 30 }, o || {});
  p.max = p.life; parts.push(p);
}
function burst(x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(o.min || 80, o.max || 260);
    spawn(o.type || 'spark', x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), g: o.g || 0, life: rnd(0.5, 1.1), size: rnd(o.s0 || 8, o.s1 || 16), col: o.col || pick(RAINBOW), rot: rnd(0, TAU), vr: rnd(-6, 6) });
  }

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.gy != null && p.y > p.gy) { if (p.type === 'drop' && Math.random() < 0.3) spawn('ring', p.x, p.gy, { life: 0.35, size: 4, grow: 16, col: p.col }); p.life = 0; }
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);

  ctx.drawImage(bgSky, 0, 0, W, H);
  drawFarClouds();
  ctx.save(); ctx.setTransform(S * Z, 0, 0, S * Z, S * TX, S * TY); ctx.translate(0, Math.sin(time * 40) * camKick * 5);
  ctx.save(); ctx.translate(0, bob); ctx.drawImage(bgIsl, IOX, IOY, IW, IH); drawFalls(); ctx.restore();
  const fl = o => isFloat(o) ? bob : 0;
  const glowAt = (o, a) => { if (a <= 0) return; const h = o.hit, r = Math.max(h.rx, h.ry); const g = ctx.createRadialGradient(h.cx, h.cy, 0, h.cx, h.cy, r); g.addColorStop(0, 'rgba(255,255,255,' + 0.55 * a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(h.cx, h.cy, h.rx * 1.05, h.ry * 1.05, 0, 0, TAU); ctx.fill(); };
  for (const id of ORDER) { const o = OBJ[id]; const a = Math.max(o.glow, hover === o.id ? 0.55 : 0); if (a > 0) { ctx.save(); ctx.translate(0, fl(o)); glowAt(o, a); ctx.restore(); } }
  if (cue) { const o = OBJ[cue], a = Math.abs(Math.sin(cueT * 5)); ctx.save(); ctx.translate(0, fl(o)); glowAt(o, a * 0.9); ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 - cueT / 3) + ')'; ctx.lineWidth = 6; ctx.setLineDash([14, 12]); ctx.lineDashOffset = -time * 40; ctx.beginPath(); ctx.ellipse(o.hit.cx, o.hit.cy, o.hit.rx * (0.8 + a * 0.08), o.hit.ry * (0.8 + a * 0.08), 0, 0, TAU); ctx.stroke(); ctx.restore(); }
  for (const id of DRAW_ORDER) {
    const o = OBJ[id], p = progress(o);
    let sc = 1; if (o.pop > 0 || (cue === id && Math.sin(cueT * 9) > 0.7)) sc = 1 + 0.07 * Math.max(o.pop, 0.5) * Math.sin((1 - o.pop) * Math.PI + 0.01);
    const bx = o.x, by = o.by != null ? o.by : (o.hit.cy + o.hit.ry * 0.5);
    ctx.save(); ctx.translate(0, fl(o)); ctx.translate(bx, by); ctx.scale(sc, 2 - sc); ctx.translate(-bx, -by);
    try { o.draw(o, p); } catch (e) { if (window.__dbg) console.error(o.id, e.message); o.t = -1; o.mode = null; }
    ctx.restore();
  }
  for (const id of DRAW_ORDER) { const o = OBJ[id]; if (o.over) { ctx.save(); ctx.translate(0, fl(o)); try { o.over(o, progress(o)); } catch (e) { if (window.__dbg) console.error(o.id, e.message); o.t = -1; } ctx.restore(); } }
  drawButterflies();
  drawParts();
  if (state === 'play' && !firstTapDone) hand(OBJ.sun.x + 34, OBJ.sun.y + 135);
  ctx.restore();
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.drawImage(bgLight, 0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + 0.38 * flash + ')'; ctx.fillRect(0, 0, W, H); }
}

function frame(ts) {
  const dt = Math.min(0.11, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}

/* ============================ BOOT ============================ */
let inited = false;
function soundIcon() {
  const b = document.getElementById('sound');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#3b2d5c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/>' +
    (Snd.muted ? '<path d="M16 9l5 6M21 9l-5 6"/>' : '<path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>') + '</svg>';
}
function fit() { const r = wrap.getBoundingClientRect(); wrap.style.setProperty('--u', (r.width / 720) + 'px'); }

function run(mode) {
  if (inited) return; inited = true;
  cv = document.getElementById('cv'); ctx = cv.getContext('2d'); wrap = document.getElementById('wrap');
  buildBG(); fit(); window.addEventListener('resize', fit); soundIcon();
  cv.addEventListener('pointerdown', e => { e.preventDefault(); Snd.init(); if (state !== 'play') return; const [x, y] = toWorld(e); hover = null; tap(x, y); });
  cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || state !== 'play') return; const [x, y] = toWorld(e); const o = findObj(x, y); hover = o ? o.id : null; cv.style.cursor = o ? 'pointer' : 'default'; });
  cv.addEventListener('pointerleave', () => { hover = null; });
  document.getElementById('play').addEventListener('click', () => {
    Snd.init(); state = 'play'; lastTap = time; document.getElementById('title').classList.add('hide'); Snd.pop(); Snd.sparkle(0.05); hap('tap');
  });
  document.getElementById('reset').addEventListener('click', () => { Snd.init(); if (state === 'play') resetWorld(); });
  document.getElementById('sound').addEventListener('click', () => { Snd.init(); Snd.setMuted(!Snd.muted); soundIcon(); if (!Snd.muted) Snd.pop(); });
  window.__game = { OBJ, trigger, tap, resetWorld, get parts() { return parts; }, get state() { return state; }, discovered };
  requestAnimationFrame(ts => { last = ts; frame(ts); });
}
window.run = run;
// Standalone fallback (outside the Astrocade host, `lib` is absent)
if (typeof lib === 'undefined') window.addEventListener('load', () => run('play'));
})();
</script>
