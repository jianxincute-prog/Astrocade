<!DOCTYPE html>
<html>

<title>WHAT DID I JUST EAT?!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#ffd9a8;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>

<body>
<script>
/*
 * WHAT DID I JUST EAT?!  -  short-form creature transformation toy.
 *
 * Feed one of three mystery snacks to a hungry creature (tap, or drag onto it)
 * and watch it transform into a ridiculous new form. 10 foods, 3 creatures.
 *
 * Systems: state manager (title/ready/seq/revert), food tray controller,
 * feeding controller, creature renderer + per-food scripted "pose" timelines,
 * particle system (capped), procedural WebAudio sfx, canvas UI.
 * Flow: READY -> FOOD_SELECTED -> EATING -> TRANSFORMING -> REVEAL -> READY
 * Everything is drawn with scripted squash-and-stretch (no physics engine),
 * and every experiment fully resets the creature, particles and scratch state.
 */
(function () {
'use strict';

const W = 720, H = 1280, GY = 830, TAU = Math.PI * 2, OUT = '#3a2350';
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eo3 = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const eob = t => { t = clamp(t, 0, 1); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const rnd = (a, b) => a + Math.random() * (b - a);
const MAXP = 90;
const FONT = '"Arial Black","Impact","Helvetica Neue",Arial,sans-serif';

/* ------------------------------------------------------------------ audio */
let ac = null, master = null, noiseBuf = null, soundOn = true;
function unlockAudio() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.5;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function tone(fr, dur, type, vol, delay) {
  if (!ac || !soundOn) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(fr[0], t0);
  for (let i = 1; i < fr.length; i++) o.frequency.linearRampToValueAtTime(fr[i], t0 + dur * i / (fr.length - 1));
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + Math.min(.02, dur * .25));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol, f0, f1, delay, q) {
  if (!ac || !soundOn) return;
  const t0 = ac.currentTime + (delay || 0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t0); f.frequency.linearRampToValueAtTime(f1, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + Math.min(.03, dur * .3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .05);
}
let voicePitch = 420;
const SFX = {
  tap() { tone([700, 950], .07, 'sine', .22); },
  munch() { noise(.09, .5, 700, 300, 0, 2); tone([200, 110], .1, 'sine', .45); },
  gulp() { tone([330, 120], .24, 'sine', .55); noise(.12, .22, 300, 200, .05, 1); },
  pop() { tone([240, 820], .1, 'sine', .5); noise(.14, .32, 2200, 700, 0, 1); },
  boing() { tone([200, 520, 230, 430, 250, 360, 260, 300], .55, 'sine', .45); },
  wobble() { tone([300, 380, 300, 380, 300], .45, 'triangle', .25); },
  sparkle() { [1040, 1320, 1560, 2080].forEach((f, i) => tone([f, f * 1.02], .22, 'sine', .16, i * .07)); },
  whoosh() { noise(.5, .35, 300, 2200, 0, 1.5); },
  sting() { [523, 659, 784, 1047].forEach((f, i) => tone([f], .22, 'triangle', .26, i * .09)); },
  sizzle() { noise(.9, .22, 4000, 6000, 0, .8); },
  slip() { tone([950, 300], .32, 'sine', .35); },
  thud() { tone([140, 50], .2, 'sine', .8); noise(.1, .2, 200, 120, 0, 1); },
  bubble() { tone([420, 800], .12, 'sine', .26); },
  drip() { tone([900, 400], .09, 'sine', .22); },
  slurp() { tone([520, 150], .55, 'sawtooth', .14); noise(.5, .18, 800, 300, 0, 2); },
  creak() { tone([180, 150, 200, 140], .55, 'sawtooth', .1); },
  growl() { tone([110, 80, 120, 70], .7, 'sawtooth', .16); },
  ding() { [1568, 2093, 2637].forEach((f, i) => tone([f], .3, 'sine', .18, i * .08)); },
  kpop() { noise(.05, .5, 2500, 1500, 0, 1); tone([500, 900], .05, 'square', .12); },
  spin() { tone([300, 900], .6, 'triangle', .18); },
  squeak() { tone([1300, 1500, 1250], .2, 'square', .09); },
  voice(a) {
    const p = voicePitch;
    const m = {
      yay: [p, p * 1.5, p * 1.25], ow: [p * 1.5, p * 2, p * 1.1], ew: [p * 1.2, p * .8, p * .7],
      huh: [p, p * 1.35], wee: [p * .9, p * 1.6, p * 1.2, p * 1.7], mm: [p * .8, p * .9, p * .8], hmm: [p * 1.1, p * .9]
    };
    const f = m[a] || m.yay;
    tone(f, .28, 'triangle', .3); tone(f.map(x => x * 2), .28, 'sine', .08);
  }
};
function sfx(n, a) { try { (SFX[n] || function () {})(a); } catch (e) { /* ignore */ } }

/* -------------------------------------------------------------- creatures */
const CREATURES = [
  { name: 'Bloop', a: 150, b: 140, n: 2.3, col: ['#7ff0d6', '#2fb89e'], belly: '#d5fff4', eyeSep: 58, eyeR: 34, eyeY: -10, mouthY: 62, voice: 420, acc: 'bunny' },
  { name: 'Gus', a: 122, b: 185, n: 2.2, col: ['#ffc070', '#f2791f'], belly: '#ffe6c4', eyeSep: 48, eyeR: 30, eyeY: -50, mouthY: 56, voice: 260, acc: 'antenna' },
  { name: 'Pip', a: 185, b: 128, n: 2.7, col: ['#c8b4ff', '#8059e8'], belly: '#ece2ff', eyeSep: 76, eyeR: 38, eyeY: -8, mouthY: 58, voice: 540, acc: 'cat' }
];
let cr = CREATURES[0];
const crCy = () => cr.b + 22;

/* ----------------------------------------------------------- draw helpers */
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot || 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.01, r), 0, TAU); }
function star(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? r * .36 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  c.closePath();
}
function rg(c, x0, y0, r0, x1, y1, r1, s0, s1) { const g = c.createRadialGradient(x0, y0, Math.max(0, r0), x1, y1, Math.max(1, r1)); g.addColorStop(0, s0); g.addColorStop(1, s1); return g; }
function lg(c, x0, y0, x1, y1, s0, s1, sm) { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, s0); if (sm) g.addColorStop(.5, sm); g.addColorStop(1, s1); return g; }
function fo(c, fill, lw) { c.fillStyle = fill; c.fill(); c.lineWidth = lw || 8; c.strokeStyle = OUT; c.lineJoin = 'round'; c.stroke(); }
function superPath(c, a, b, n, wob, wt) {
  const N = 60; c.beginPath();
  for (let i = 0; i <= N; i++) {
    const th = i / N * TAU, ct = Math.cos(th), st = Math.sin(th);
    let x = Math.sign(ct) * Math.pow(Math.abs(ct), 2 / n) * a, y = Math.sign(st) * Math.pow(Math.abs(st), 2 / n) * b;
    if (wob) { const k = 1 + wob * Math.sin(th * 3 + wt) + wob * .6 * Math.sin(th * 5 - wt * 1.3); x *= k; y *= k; }
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}

/* ---------------------------------------------------------- global state */
let cv, ctx, started = false, T = 0, stT = 0, state = 'title', speed = 1;
let L = null;                       // current creature look (per-frame)
const fxp = [];                     // particles (capped)
let S = { acc: {} };                // per-transformation scratch
let seq = null, rt = 0, tray = [], recent = [], lastSet = '';
let trayIn = 0, btnIn = 0, hintT = 0, everFed = false;
let drag = { on: false, slot: -1, moved: false, sx: 0, sy: 0, x: 0, y: 0 };
let ptr = { x: 360, y: 500, seen: false }, pressed = '';
let blinkT = 2, blinkV = 0, growlT = 4, growlV = 0, PXs = 0, PYs = 0;

function neutralL() {
  return {
    x: 360, y: GY, sx: 1, sy: 1, rot: 0, piv: 0, kind: 'base', c1: cr.col[0], c2: cr.col[1], bellyCol: null,
    eyes: 'normal', eyeS: 1, pupR: .55, pupX: 0, pupY: 0, blink: 0, mouth: 'smile', mo: 0, mouthDy: 0,
    faceSx: 1, faceDy: 0, faceS: 1, blush: 1, hue: 0, spin: 0, wob: 0, wt: 0, melt: 0, capS: 1, puff: 1,
    mark: '', markY: 0, glass: 1, lift: undefined, armUp: 0, earK: 0, flame: 0, peel: 0, fx: 1, wag: 0, ret: 0
  };
}

/* particles */
function P(o) {
  if (fxp.length >= MAXP && o.k !== 'puff') return null;
  if (fxp.length >= MAXP + 20) return null;
  const p = Object.assign({ k: 'puff', x: 0, y: 0, vx: 0, vy: 0, g: 0, r: 10, r1: 10, rot: 0, vr: 0, c: '#fff', life: 0, max: 1, drag: 0, sc: 1 }, o);
  fxp.push(p); return p;
}
function emit(key, rate, dt, fn) {
  S.acc[key] = (S.acc[key] || 0) + dt * rate;
  let n = 0;
  while (S.acc[key] >= 1 && n < 4) { S.acc[key] -= 1; fn(); n++; }
  if (S.acc[key] > 4) S.acc[key] = 0;
}
function burst(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rnd(-.2, .2), sp = rnd(160, 300);
    P({ k: 'puff', x: x + Math.cos(a) * 40, y: y + Math.sin(a) * 40, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 30, r1: rnd(70, 105), max: rnd(.5, .75), c: col || '#fff', drag: 3 });
  }
}
function stepParticles(dt) {
  for (let i = fxp.length - 1; i >= 0; i--) {
    const p = fxp[i];
    p.life += dt;
    if (p.k === 'kernel') {
      if (S.ret > 0) {
        if (p.rx === undefined) { p.rx = p.x; p.ry = p.y; }
        p.x = lerp(p.rx, L.x, S.ret); p.y = lerp(p.ry, L.y - 170, S.ret); p.sc = 1 - S.ret * .85; p.rot += p.vr * dt;
        if (S.ret >= 1) p.life = p.max + 1;
      } else {
        p.vy += 1700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.y > GY + 14) { p.y = GY + 14; p.vy *= -.45; p.vx *= .8; if (Math.abs(p.vy) > 140 && !p.snd) { p.snd = 1; sfx('kpop'); } }
        if (p.x < 30) { p.x = 30; p.vx = Math.abs(p.vx); }
        if (p.x > W - 30) { p.x = W - 30; p.vx = -Math.abs(p.vx); }
        p.life = Math.min(p.life, p.max - .5);
      }
    } else {
      if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.k === 'bubble') p.x += Math.sin(p.life * 6 + p.rot) * 20 * dt;
    }
    if (p.life >= p.max) fxp.splice(i, 1);
  }
}
function drawParticles(c) {
  for (const p of fxp) {
    const u = clamp(p.life / p.max, 0, 1);
    c.save(); c.translate(p.x, p.y);
    if (p.k === 'puff' || p.k === 'steam' || p.k === 'spore') {
      const r = lerp(p.r, p.r1, eo3(u));
      const a = (p.k === 'steam' ? .55 : .85) * (1 - u);
      c.globalAlpha = Math.max(0, a);
      c.fillStyle = rg(c, 0, 0, 0, 0, 0, r, p.c, p.k === 'steam' ? 'rgba(255,255,255,0)' : 'rgba(255,255,255,0)');
      circ(c, 0, 0, r); c.fill();
    } else if (p.k === 'kernel') {
      c.rotate(p.rot); c.scale(p.sc, p.sc);
      c.lineWidth = 5; c.strokeStyle = OUT;
      for (const q of [[-9, 4, 14], [10, 3, 13], [0, -9, 14]]) { circ(c, q[0], q[1], q[2]); c.fillStyle = '#fff8e6'; c.fill(); c.stroke(); }
      circ(c, 3, 4, 5); c.fillStyle = '#ffd24a'; c.fill();
    } else if (p.k === 'drop') {
      c.globalAlpha = 1 - u * u; c.fillStyle = p.c; ell(c, 0, 0, p.r * .7, p.r, 0); c.fill();
      c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
    } else if (p.k === 'bubble') {
      c.globalAlpha = .9 * (1 - u * u); circ(c, 0, 0, p.r); c.fillStyle = 'rgba(190,235,255,.45)'; c.fill();
      c.lineWidth = 4; c.strokeStyle = '#4b88b8'; c.stroke();
      circ(c, -p.r * .35, -p.r * .35, p.r * .2); c.fillStyle = '#fff'; c.fill();
    } else if (p.k === 'star') {
      const tw = .5 + .5 * Math.sin(p.life * 5 + p.rot);
      c.globalAlpha = Math.min(1, (1 - u) * 2.2) * (.55 + .45 * tw);
      star(c, 0, 0, p.r * (.7 + .3 * tw), p.rot * .2); fo(c, p.c, 4);
    } else if (p.k === 'orbit') {
      const a = p.rot + p.life * 2.2, ox = Math.cos(a) * p.r1, oy = Math.sin(a) * p.r1 * .7;
      c.translate(ox - p.x + L.x, oy - p.y + L.y - 200);
      c.globalAlpha = Math.min(1, (1 - u) * 3); star(c, 0, 0, p.r, p.life * 2); fo(c, '#ffe45e', 4);
    }
    c.restore();
  }
}

/* ------------------------------------------------------------------ face */
function drawEye(c, L, x, r, side) {
  const m = L.eyes;
  c.save(); c.translate(x, 0); c.lineCap = 'round'; c.lineJoin = 'round';
  if (m === 'squeeze') {
    c.lineWidth = 9; c.strokeStyle = OUT; c.beginPath();
    c.moveTo(-side * r * .8, -r * .65); c.lineTo(side * r * .55, 0); c.lineTo(-side * r * .8, r * .65); c.stroke();
  } else if (m === 'happy') {
    c.lineWidth = 9; c.strokeStyle = OUT; c.beginPath(); c.arc(0, r * .35, r * .75, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
  } else if (m === 'dizzy') {
    c.lineWidth = 6; c.strokeStyle = OUT; c.beginPath();
    for (let i = 0; i <= 40; i++) { const a = i / 40 * TAU * 2.4 + T * 8 * side, q = i / 40 * r; const px = Math.cos(a) * q, py = Math.sin(a) * q; if (i) c.lineTo(px, py); else c.moveTo(px, py); }
    c.stroke();
  } else if (m === 'wink' && side < 0) {
    c.lineWidth = 9; c.strokeStyle = OUT; c.beginPath();
    c.moveTo(-side * r * .8, -r * .65); c.lineTo(side * r * .55, 0); c.lineTo(-side * r * .8, r * .65); c.stroke();
  } else {
    const wide = m === 'wide', open = 1 - L.blink * .92, rr0 = wide ? r * 1.2 : r;
    ell(c, 0, 0, rr0, rr0 * 1.12 * open, 0); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 6; c.strokeStyle = OUT; c.stroke();
    if (open > .3) {
      const pr = rr0 * (wide ? .36 : L.pupR), px = L.pupX * rr0 * .4, py = L.pupY * rr0 * .4;
      ell(c, px, py, pr, pr * 1.1 * open, 0); c.fillStyle = OUT; c.fill();
      circ(c, px - pr * .3, py - pr * .38, pr * .3); c.fillStyle = '#fff'; c.fill();
    }
    if (m === 'sad') {
      c.lineWidth = 7; c.strokeStyle = OUT; c.beginPath(); c.moveTo(-side * r * 1.0, -r * 1.2); c.lineTo(side * r * .9, -r * 1.6); c.stroke();
      ell(c, side * r * .55, r * 1.35, 7, 11, 0); c.fillStyle = '#7fd4ff'; c.fill();
    }
  }
  c.restore();
}
function drawMouth(c, L, cr_) {
  const my = cr_.mouthY + L.mouthDy, mo = clamp(L.mo, 0, 1.2);
  c.save(); c.translate(0, my); c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = OUT; c.fillStyle = '#5a1d3a';
  switch (L.mouth) {
    case 'grin':
      c.beginPath(); c.moveTo(-42, -14); c.lineTo(42, -14); c.bezierCurveTo(42, 40, -42, 40, -42, -14); c.closePath(); c.fill();
      c.save(); c.clip(); ell(c, 0, 30, 26, 16, 0); c.fillStyle = '#ff7a9a'; c.fill(); c.restore();
      c.beginPath(); c.moveTo(-42, -14); c.lineTo(42, -14); c.bezierCurveTo(42, 40, -42, 40, -42, -14); c.closePath(); c.stroke();
      break;
    case 'open':
      ell(c, 0, 4, 22 + 12 * mo, 8 + 34 * mo, 0); c.fill();
      c.save(); c.clip(); ell(c, 0, 8 + 34 * mo, 18, 14 + 8 * mo, 0); c.fillStyle = '#ff7a9a'; c.fill(); c.restore();
      ell(c, 0, 4, 22 + 12 * mo, 8 + 34 * mo, 0); c.stroke();
      break;
    case 'o':
      circ(c, 0, 4, 14 + 9 * mo); c.fill(); c.stroke(); break;
    case 'hot': {
      const ry = 30 + 22 * mo, wig = Math.sin(T * 14) * 4;
      rr(c, -17, 10, 34, 56 + wig * 2 + 14 * mo, 17); c.fillStyle = '#ff6f91'; c.fill(); c.stroke();
      ell(c, 0, 4, 44, ry, 0); c.fillStyle = '#5a1d3a'; c.fill(); c.stroke();
      break;
    }
    case 'sour': {
      const s = 1.5 + .1 * Math.sin(T * 30);
      c.beginPath(); c.moveTo(-20 * s, 2); for (let i = 1; i <= 6; i++) c.lineTo(-20 * s + i * 40 * s / 6, 2 + (i % 2 ? -7 : 7)); c.stroke();
      c.lineWidth = 5; for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * 30, Math.sin(a) * 20 + 2); c.lineTo(Math.cos(a) * 42, Math.sin(a) * 30 + 2); c.stroke(); }
      break;
    }
    case 'wavy':
      c.beginPath(); for (let i = 0; i <= 20; i++) { const x = -34 + i * 3.4, y = Math.sin(i * .9 + T * 5) * 6; if (i) c.lineTo(x, y); else c.moveTo(x, y); } c.stroke(); break;
    case 'sad':
      c.beginPath(); c.arc(0, 26, 28, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); break;
    case 'smirk':
      c.beginPath(); c.moveTo(-26, 0); c.quadraticCurveTo(6, 18, 36, -10); c.stroke(); break;
    default:
      c.beginPath(); c.arc(0, -10, 30, .15 * Math.PI, .85 * Math.PI); c.stroke();
  }
  c.restore();
}
function drawFace(c, L, cr_, fx, fy, fs) {
  c.save(); c.translate(fx, fy); c.scale(fs * L.faceSx, fs);
  const es = cr_.eyeSep, er = cr_.eyeR * L.eyeS;
  if (L.blush > 0) {
    c.fillStyle = 'rgba(255,90,130,' + (.28 * Math.min(1.6, L.blush)) + ')';
    ell(c, -es - er * .9, cr_.mouthY * .5 + 8, 24, 14, 0); c.fill(); ell(c, es + er * .9, cr_.mouthY * .5 + 8, 24, 14, 0); c.fill();
  }
  drawEye(c, L, -es, er, -1); drawEye(c, L, es, er, 1);
  if (L.eyes === 'cool') {
    const gy = -L.glass * 260;
    c.save(); c.translate(0, gy); c.fillStyle = '#1b1230'; c.strokeStyle = OUT; c.lineWidth = 5;
    rr(c, -es - er * 1.25, -er * .95, er * 2.5, er * 1.8, er * .55); c.fill(); c.stroke();

function mapPt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

function activate(id) {

/* ---------------------------------------------------------------- update */
function updateIdle(L_, dt, hungry) {
  const b = Math.sin(T * 2.3);
  L_.sy *= 1 + .03 * b; L_.sx *= 1 - .02 * b;
  if (cr.acc === 'bunny') { const h = Math.max(0, Math.sin(T * 1.3)); const hp = Math.pow(h, 6); L_.y -= hp * 34; L_.sy *= 1 + hp * .06; L_.earK = hp * .2; }

  const tx = ptr.seen ? clamp((ptr.x - 360) / 260, -1, 1) : Math.sin(T * .7) * .6;

function buildL(dt) {
  const n = neutralL();

  }

    rt += dt;
    const u = seg(rt, 0, .55); const sc = lerp(.5, 1, eob(u)); n.sx *= sc; n.sy *= sc; n.eyes = 'happy'; n.mouth = 'grin';
    if (rt >= .55) { state = 'ready'; stT = 0; }

  }

      if (!seq.ant) { seq.ant = 1; sfx('squeak'); }
    } else {
      if (!seq.popped) {

        for (const key in n) { /* keep n as the base */ }
        if (seq.rare) { sfx('ding'); for (let i = 0; i < 5; i++) P({ k: 'orbit', x: 0, y: 0, r: 16, r1: 210 + i * 8, rot: i * TAU / 5, c: '#ffe45e', max: 99 }); }

function update(dt) {

/* ---------------------------------------------------------------- render */
function drawBG(c) {
  c.fillStyle = lg(c, 0, 0, 0, H, '#ffeaa6', '#ffb99f', '#ffd3b0'); c.fillRect(0, 0, W, H);
  c.save();
  for (let i = 0; i < 9; i++) {
    const x = (i * 197 + T * (8 + i % 3 * 4)) % (W + 200) - 100, y = 90 + (i * 131) % 700 + Math.sin(T * .6 + i) * 14, r = 36 + (i * 17) % 50;

  c.restore();
  c.fillStyle = '#ffc487'; c.fillRect(0, GY - 6, W, H - GY + 6);
  c.fillStyle = rg(c, 360, GY + 8, 0, 360, GY + 8, 380, '#ffe6bd', 'rgba(255,230,190,0)');
  c.save(); c.translate(360, GY + 8); c.scale(1, .2); c.translate(-360, -GY - 8); circ(c, 360, GY + 8, 380); c.fill(); c.restore();

  c.globalAlpha = .22; c.fillStyle = '#7a3b1d'; ell(c, 0, 108, 78, 14, 0); c.fill(); c.globalAlpha = 1;
  circ(c, 0, 0, 100); fo(c, FOODS[food].tint, 8);
  circ(c, 0, 0, 100); c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.7)'; c.save(); c.clip(); circ(c, 0, 0, 90); c.stroke(); c.restore();
  c.save(); c.scale(.95, .95); c.translate(0, 2); FOODDRAW[FOODDRAWMAP[food]](c); c.restore();
  c.restore();
}
function drawBtn(c, b, label, col, icon, k, press) {
  const oy = (1 - k) * 320;
  c.save(); c.translate(b.x + b.w / 2, b.y + b.h / 2 + oy); const sc = press ? .94 : 1 + .02 * Math.sin(T * 4); c.scale(sc, sc);
  rr(c, -b.w / 2, -b.h / 2 + 8, b.w, b.h, 36); c.fillStyle = 'rgba(80,30,60,.28)'; c.fill();
  rr(c, -b.w / 2, -b.h / 2, b.w, b.h, 36); fo(c, lg(c, 0, -b.h / 2, 0, b.h / 2, col[0], col[1]), 9);
  rr(c, -b.w / 2 + 14, -b.h / 2 + 10, b.w - 28, 22, 11); c.fillStyle = 'rgba(255,255,255,.3)'; c.fill();
  const big = label.length < 8; const fs = big ? 52 : 27;

  c.lineWidth = 10; c.strokeStyle = OUT; c.lineJoin = 'round'; c.strokeText(label, tx, 2); c.fillStyle = '#fff'; c.fillText(label, tx, 2);

    const tw = c.measureText(label).width; c.save(); c.translate(tx - tw / 2 - 34, 2);

function drawTitleLine(c, str, cx, y, maxW, size) {
  c.font = '900 ' + size + 'px ' + FONT; let w = c.measureText(str).width; if (w > maxW) { size *= maxW / w; c.font = '900 ' + size + 'px ' + FONT; w = c.measureText(str).width; }

function render() {

  drawCreature(c);
  drawParticles(c);
  // flying food

    const p = eio(seq.t / FLY), cy = crCy();
    const tx = 360, ty = GY - cy + cr.eyeY + cr.mouthY;

  if (btnIn > .01) {
    drawBtn(c, BTN.again, 'AGAIN', ['#7be88a', '#2fb85a'], 'again', btnIn, pressed === 'again');
    drawBtn(c, BTN.neu, 'NEW CREATURE', ['#a58bff', '#6a45e8'], 'new', btnIn, pressed === 'neu');
  }

  if (state === 'title') {

  else { c.strokeStyle = '#e8274a'; c.lineWidth = 7; c.beginPath(); c.moveTo(14, -12); c.lineTo(30, 12); c.moveTo(30, -12); c.lineTo(14, 12); c.stroke(); }
  c.restore();
}

/* ------------------------------------------------------------------ loop */
let last = 0;

}
function applyCfg() {

}
function run(mode) {
  if (started) return; started = true;
  applyCfg();
  try {
    if (window.lib && lib.showGameParameters) lib.showGameParameters({
      name: 'WHAT DID I JUST EAT?!',
      params: {
        'Animation speed': { key: 'settings.speed', type: 'slider', min: .6, max: 1.5, step: .1, onChange(v) { speed = clamp(+v || 1, .5, 1.6); } },
        'Sound': { key: 'settings.soundOn', type: 'checkbox', onChange(v) { soundOn = !!v; } }

  } catch (e) { /* ignore */ }
  cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.appendChild(cv); ctx = cv.getContext('2d');
  cr = CREATURES[0]; voicePitch = cr.voice; L = neutralL(); pickTray();

})();
