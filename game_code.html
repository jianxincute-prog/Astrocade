 * CHAOS BUTTON!  -  one button, zero good decisions.

 *   audio ............. tiny WebAudio synth (no assets) with mute toggle; every cue has a

  txt('WHAT HAPPENED', 360, y + 6, 26, '#b9a7ff', null); y += 46;
  for (i = 0; i < resultCard.list.length; i++) { txt(resultCard.list[i], 360, y, fit(resultCard.list[i], 520, 30, 20), '#fff', null); y += 40; }
  g.restore();
}
function render() {

  drawParticles();

  } else if (state === 'RESULT') {
    drawResult(); parts.forEach(function () {});
    if (resultT > 0.6) pill(UI.again, 'PLAY AGAIN', 62, '#7cf08f', '#22b24c', soundHeld === 2);
  } else { drawCaption(); }
  if (state !== 'START') drawHUD(); else drawSoundBtn();
}

/* ------------------------------------------------------------------ input */
function toGame(ev) { var r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
function primary() {
  if (state === 'START') { newRun(); }
  else if (state === 'PLAYING') pressButton();
  else if (state === 'RESULT' && resultT > 0.6) newRun();
}
canvas.addEventListener('pointerdown', function (ev) {
  ev.preventDefault(); ensureAudio();
  var p = toGame(ev);
  if (hit(UI.snd, p.x, p.y)) { setMuted(!muted); if (!muted) SFX.pop(); return; }
  if (state === 'START' && hit(UI.start, p.x, p.y)) { SFX.click(); primary(); }
  else if (state === 'PLAYING' && hit(UI.btn, p.x, p.y)) pressButton();
  else if (state === 'RESULT' && resultT > 0.6 && hit(UI.again, p.x, p.y)) { SFX.click(); newRun(); }
});
window.addEventListener('pointerup', function () { ensureAudio(); });
window.addEventListener('keydown', function (ev) {
  ensureAudio();
  if (ev.code === 'Space' || ev.code === 'Enter') { ev.preventDefault(); if (!ev.repeat) { if (state === 'START' || state === 'RESULT') SFX.click(); primary(); } }
  else if (ev.code === 'KeyM') setMuted(!muted);
});
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ------------------------------------------------------------------ loop */
var last = 0, started = false;
function frame(ts) {
  var dt = Math.min(0.11, last ? (ts - last) / 1000 : 0.016); last = ts;
  try { update(dt); render(); } catch (err) { log('frame error: ' + (err && err.stack || err)); try { clearFx(); if (state === 'EVENT') endEvents(); } catch (e2) {} }
  requestAnimationFrame(frame);
}
function runGame(mode) {
  if (started) return; started = true;
  requestAnimationFrame(frame);
}
window.run = runGame;

if (window.__CB_TEST) {   // hooks for automated QA only
  window.__cb = {
    state: function () { return state; }, presses: function () { return presses; },
    plan: function (ids) { run = run || { events: [], used: {}, usedCombos: {} }; presses++; state = 'EVENT'; btnPress = 1;
      var specs = ids.map(function (id, i) { var c = COMBOS.filter(function (c) { return c.specs.some(function (s) { return s.id === id; }); })[0]; return { id: id, dur: EVENTS[id].dur, delay: 0 }; });
      var combo = ids.length > 1 ? COMBOS.filter(function (c) { return c.specs[0].id === ids[0] && c.specs[1].id === ids[1]; })[0] : null;
      if (combo) specs = combo.specs.map(function (s) { return { id: s.id, dur: s.dur, delay: s.delay }; });
      startPlan({ combo: combo, specs: specs }); },
    t: function () { return planT; }, events: function () { return run && run.events; }, result: function () { return resultCard; },
    ents: function () { return LIST.map(function (e) { return { id: e.id, dx: e.m.dx, dy: e.m.dy, rot: e.m.rot, sx: e.m.sx, sy: e.m.sy }; }); }
  };
}
})();
