<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prankster Boy Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one full-height column. Header + room tabs on top, scrolling message list, composer pinned to the bottom. */
  :root {
    --bg: #14091f;
    --panel: #1f1130;
    --panel-2: #2a1842;
    --line: #3b2559;
    --text: #f3ebff;
    --muted: #a894c7;
    --accent: #ff7a00;
    --accent-ink: #1a0b00;
    --mine: #3a2160;
    --danger: #ff6b6b;
    --ok: #7cffcb;
    --nick-l: 70%;
    --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f0ff; --panel: #ffffff; --panel-2: #efe5ff; --line: #d9c8f5; --text: #25123d;
      --muted: #6d5a8c; --accent: #e86a00; --accent-ink: #ffffff; --mine: #e6d6ff; --danger: #c62828; --ok: #0c8a5f; --nick-l: 34%;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f0ff; --panel: #ffffff; --panel-2: #efe5ff; --line: #d9c8f5; --text: #25123d;
    --muted: #6d5a8c; --accent: #e86a00; --accent-ink: #ffffff; --mine: #e6d6ff; --danger: #c62828; --ok: #0c8a5f; --nick-l: 34%;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
    display: flex; justify-content: center;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .app {
    width: 100%; max-width: 720px; height: 100dvh; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }

  header { padding: max(14px, env(safe-area-inset-top, 0px)) 16px 0; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; letter-spacing: .3px; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-state="online"] .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status[data-state="offline"] .dot { background: var(--danger); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 0; cursor: pointer;
    padding: 10px 16px; min-height: 44px; border-radius: 12px 12px 0 0; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
  .tab:not([aria-selected="true"]):hover { color: var(--text); background: var(--panel); }
  .tab:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 28ch; }
  .msg { max-width: 82%; min-width: 0; padding: 8px 12px 9px; border-radius: 16px 16px 16px 4px; background: var(--panel-2); border: 1px solid var(--line); align-self: flex-start; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-radius: 16px 16px 4px 16px; }
  .meta { display: flex; align-items: baseline; gap: 8px; font-size: .78rem; margin-bottom: 2px; }
  .nick { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16ch; }
  time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .body { overflow-wrap: anywhere; white-space: pre-wrap; }
  .system { align-self: center; font-size: .8rem; color: var(--muted); }

  .toast { margin: 0 16px; padding: 8px 12px; border-radius: 10px; background: var(--danger); color: #fff; font-size: .88rem; }
  .toast[hidden] { display: none; }

  form.composer {
    display: flex; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom, 0px));
    background: var(--panel-2); border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  input[type="text"] {
    font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 14px; min-height: 48px; min-width: 0;
  }
  input[type="text"]:focus { border-color: var(--accent); outline: none; }
  #nick-input { flex: 1 1 100%; }
  #msg-input { flex: 1 1 0; }
  #send-btn {
    font: inherit; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 12px;
    padding: 0 22px; min-height: 48px; min-width: 96px; cursor: pointer;
  }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { flex: 1 1 100%; margin: 0; font-size: .75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .composer.has-nick #nick-input, .composer.has-nick .nick-hint { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="top">
      <h1>Prankster Boy <span>Chat</span></h1>
      <span class="status" id="status" data-state="connecting" role="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Chat rooms"></nav>
  </header>

  <section id="messages" aria-live="polite" aria-label="Messages"></section>
  <div class="toast" id="toast" role="alert" hidden></div>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="nick-input" maxlength="20" placeholder="Pick a nickname (2–20 characters)" aria-label="Nickname">
    <input type="text" id="msg-input" maxlength="200" placeholder="Say something nice…" aria-label="Message">
    <button type="submit" id="send-btn">Send</button>
    <p class="hint"><span id="who"></span><span id="counter">0 / 200</span></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  'use strict';

  // Public (anon) key: safe to ship in a client. Access is limited by row level security in the database.
  const SUPABASE_URL = 'https://wbmnwzjknmwjmitjyssn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibW53emprbm13am1pdGp5c3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MjcyMjcsImV4cCI6MjEwODQwMzIyN30.BNr3RUvDzn8-N-CUuhJ0nqrt44afbtkVe9F48ATXfRU';
  const KEEP_LAST = 100;          // matches the server-side auto-prune
  const SEND_COOLDOWN_MS = 1100;  // server rejects messages faster than 1 per second

  const $ = (id) => document.getElementById(id);
  const els = { tabs: $('tabs'), messages: $('messages'), toast: $('toast'), composer: $('composer'),
    nick: $('nick-input'), msg: $('msg-input'), send: $('send-btn'), counter: $('counter'), who: $('who'),
    status: $('status'), statusText: $('status-text') };

  // ---- Per-browser identity (kept in localStorage when it is available) ----
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
  };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  let clientId = store.get('pb_client_id');
  if (!clientId) { clientId = uuid(); store.set('pb_client_id', clientId); }
  let nickname = store.get('pb_nickname') || '';

  // ---- State ----
  let sb = null, rooms = [], currentRoom = null, channel = null, seen = new Set(), cooldownUntil = 0, toastTimer = 0;

  function setStatus(state, text) { els.status.dataset.state = state; els.statusText.textContent = text; }
  function showToast(text) {
    els.toast.textContent = text; els.toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { els.toast.hidden = true; }, 5000);
  }
  function friendlyError(err) {
    const m = (err && err.message) || 'Something went wrong';
    if (/too fast/i.test(m)) return 'Slow down: one message per second.';
    if (/message limit/i.test(m)) return 'Too many messages. Try again in a minute.';
    if (/links are not allowed/i.test(m)) return 'Links are not allowed in chat.';
    if (/blocked by chat filter/i.test(m)) return 'That message was blocked by the chat filter.';
    if (/Failed to fetch|NetworkError/i.test(m)) return 'No connection. Check your internet and try again.';
    return m;
  }

  // ---- Rendering (all user text goes through textContent, never innerHTML) ----
  function nickColor(name) {
    let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h} 70% var(--nick-l))`;
  }
  function fmtTime(iso) {
    const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function emptyState() {
    if (els.messages.querySelector('.msg')) return;
    if (els.messages.querySelector('.empty')) return;
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = 'No messages yet. Be the first to say hi!';
    els.messages.appendChild(p);
  }
  function addMessage(row, { scroll = true } = {}) {
    if (seen.has(row.id)) return;
    seen.add(row.id);
    const empty = els.messages.querySelector('.empty'); if (empty) empty.remove();

    const wrap = document.createElement('article');
    wrap.className = 'msg' + (row.client_id === clientId ? ' mine' : '');
    wrap.dataset.id = row.id;
    const meta = document.createElement('div'); meta.className = 'meta';
    const n = document.createElement('span'); n.className = 'nick'; n.textContent = row.nickname; n.style.color = nickColor(row.nickname);
    const t = document.createElement('time'); t.dateTime = row.created_at; t.textContent = fmtTime(row.created_at);
    meta.append(n, t);
    const b = document.createElement('div'); b.className = 'body'; b.textContent = row.body;
    wrap.append(meta, b);

    const nearBottom = els.messages.scrollHeight - els.messages.scrollTop - els.messages.clientHeight < 120;
    els.messages.appendChild(wrap);
    while (els.messages.querySelectorAll('.msg').length > KEEP_LAST) {
      const first = els.messages.querySelector('.msg'); seen.delete(Number(first.dataset.id)); first.remove();
    }
    if (scroll && (nearBottom || row.client_id === clientId)) els.messages.scrollTop = els.messages.scrollHeight;
  }
  function removeMessage(id) {
    const el = els.messages.querySelector(`.msg[data-id="${CSS.escape(String(id))}"]`);
    if (el) { el.remove(); seen.delete(Number(id)); }
    emptyState();
  }

  // ---- Rooms ----
  function renderTabs() {
    els.tabs.textContent = '';
    for (const r of rooms) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.role = 'tab'; b.textContent = r.title; b.dataset.room = r.id;
      b.setAttribute('aria-selected', String(r.id === currentRoom));
      b.addEventListener('click', () => joinRoom(r.id));
      els.tabs.appendChild(b);
    }
  }

  async function loadHistory(roomId) {
    const { data, error } = await sb.from('chat_messages')
      .select('id, room_id, nickname, client_id, body, created_at')
      .eq('room_id', roomId).order('id', { ascending: false }).limit(KEEP_LAST);
    if (error) { showToast(friendlyError(error)); return; }
    if (roomId !== currentRoom) return;               // user switched rooms while loading
    for (const row of data.slice().reverse()) addMessage(row, { scroll: false });
    els.messages.scrollTop = els.messages.scrollHeight;
    emptyState();
  }

  function subscribe(roomId) {
    if (channel) { sb.removeChannel(channel); channel = null; }
    channel = sb.channel('room:' + roomId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: 'room_id=eq.' + roomId },
          (payload) => { if (currentRoom === roomId) addMessage(payload.new); })
      // DELETE events cannot be filtered by column, so ids that are not on screen are simply ignored
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' },
          (payload) => { if (payload.old && payload.old.id != null) removeMessage(payload.old.id); })
      .subscribe((state) => {
        if (state === 'SUBSCRIBED') { setStatus('online', 'Online'); }
        else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT' || state === 'CLOSED') { setStatus('offline', 'Reconnecting…'); }
      });
  }

  async function joinRoom(roomId) {
    currentRoom = roomId; store.set('pb_room', roomId);
    seen = new Set(); els.messages.textContent = '';
    renderTabs(); subscribe(roomId); await loadHistory(roomId);
  }

  // ---- Composer ----
  function refreshComposer() {
    els.composer.classList.toggle('has-nick', nickname.length >= 2);
    els.who.textContent = nickname ? `Chatting as ${nickname}` : '';
    els.counter.textContent = `${els.msg.value.length} / 200`;
  }
  function useNickname() {
    const typed = els.nick.value.replace(/\s+/g, ' ').trim();
    if (nickname.length >= 2) return true;
    if (typed.length < 2 || typed.length > 20) { showToast('Pick a nickname with 2 to 20 characters.'); els.nick.focus(); return false; }
    nickname = typed; store.set('pb_nickname', nickname); refreshComposer(); return true;
  }

  els.msg.addEventListener('input', refreshComposer);
  els.composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sb || !currentRoom) return;
    if (!useNickname()) return;
    const body = els.msg.value.replace(/\s+/g, ' ').trim();
    if (!body) return;
    if (Date.now() < cooldownUntil) { showToast('Slow down: one message per second.'); return; }

    els.send.disabled = true; cooldownUntil = Date.now() + SEND_COOLDOWN_MS;
    const { data, error } = await sb.from('chat_messages')
      .insert({ room_id: currentRoom, nickname, client_id: clientId, body }).select().single();
    if (error) { showToast(friendlyError(error)); }
    else {
      els.msg.value = ''; refreshComposer();
      if (data) addMessage(data);                      // realtime echo is deduplicated by id
    }
    setTimeout(() => { els.send.disabled = false; els.msg.focus(); }, Math.max(0, cooldownUntil - Date.now()));
  });

  // ---- Boot ----
  async function boot() {
    refreshComposer();
    if (!window.supabase || !window.supabase.createClient) {
      setStatus('offline', 'Offline'); showToast('Could not load the chat library. Check your connection and reload.'); return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    const { data, error } = await sb.from('chat_rooms').select('id, title').order('title');
    if (error || !data || !data.length) { setStatus('offline', 'Offline'); showToast(error ? friendlyError(error) : 'No chat rooms found.'); return; }
    rooms = data;
    const saved = store.get('pb_room');
    await joinRoom(rooms.some(r => r.id === saved) ? saved : (rooms.find(r => r.id === 'lobby') || rooms[0]).id);
  }
  window.addEventListener('online', () => { if (currentRoom) joinRoom(currentRoom); });
  boot();
})();
</script>
</body>
</html>
