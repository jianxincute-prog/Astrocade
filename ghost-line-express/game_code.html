<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Line Express</title>
    <style>
        :root {
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
            --space-sm: 16px;
            --space-md: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            font-family: 'Orbitron', 'Arial', sans-serif;
        }

        #game-world {
            position: relative;
            width: 100%;
            height: 100%;
            background: #070711;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Shown immediately in the HTML, before Three.js finishes building the scene. */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #dffbff;
            background:
                radial-gradient(circle at 50% 24%, rgba(62, 118, 151, 0.42) 0 5%, rgba(17, 28, 53, 0.6) 24%, rgba(7, 7, 17, 0.98) 72%),
                #070711;
            pointer-events: auto;
            transition: opacity 180ms ease-out, visibility 0s linear 180ms;
        }

        #loading-screen::before,
        #loading-screen::after {
            position: absolute;
            content: '';
            border-radius: 50%;
            pointer-events: none;
        }

        #loading-screen::before {
            width: 430px;
            height: 430px;
            top: -180px;
            right: -140px;
            border: 2px solid rgba(163, 229, 255, 0.19);
            box-shadow: 0 0 80px rgba(85, 191, 255, 0.18), inset 0 0 60px rgba(156, 222, 255, 0.1);
        }

        #loading-screen::after {
            width: 760px;
            height: 150px;
            bottom: -105px;
            background: rgba(67, 157, 177, 0.09);
            filter: blur(20px);
        }

        #loading-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-panel {
            position: relative;
            z-index: 1;
            display: flex;
            width: min(82%, 430px);
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .loading-kicker {
            margin-bottom: 12px;
            color: #ffb05d;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(255, 122, 38, 0.8);
        }

        .loading-title {
            color: #aef3ff;
            font-size: clamp(31px, 7vw, 48px);
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 0.95;
            text-shadow: 0 0 18px rgba(72, 239, 255, 0.75), 0 4px 0 #11132a;
        }

        .loading-route {
            position: relative;
            width: 100%;
            height: 4px;
            margin: 34px 0 16px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(182, 241, 255, 0.18);
        }

        .loading-route::before {
            position: absolute;
            top: 0;
            left: -42%;
            width: 42%;
            height: 100%;
            content: '';
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, #5df1ff 45%, #ffc06a 100%);
            box-shadow: 0 0 14px #5df1ff;
            animation: loading-route-travel 850ms linear infinite;
        }

        .loading-copy {
            color: rgba(230, 249, 255, 0.83);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.8px;
        }

        @keyframes loading-route-travel {
            to { transform: translateX(340%); }
        }

        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: white;
            z-index: 10;
        }

        #distance {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 168px;
            padding: 8px 16px 9px;
            border: 1px solid rgba(101, 255, 156, 0.45);
            background: rgba(5, 8, 20, 0.88);
            border-radius: 12px;
            text-align: center;
            text-shadow: 0 2px 4px black;
            box-shadow: 0 0 18px rgba(101, 255, 156, 0.12);
        }

        #distance-label {
            margin-bottom: 2px;
            color: rgba(223, 251, 255, 0.72);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.4px;
        }

        #distance-value {
            color: #65ff9c;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        #score {
            position: absolute;
            top: 18px;
            left: 18px;
            padding: 10px 14px;
            border: 1px solid rgba(100, 240, 255, 0.35);
            background: rgba(5, 8, 20, 0.85);
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 2px 4px black;
        }

        #destination {
            position: absolute;
            top: 18px;
            right: 18px;
            padding: 10px 14px;
            border: 1px solid rgba(100, 240, 255, 0.35);
            background: rgba(5, 8, 20, 0.85);
            border-radius: 10px;
            text-align: right;
            font-size: 14px;
            line-height: 1.4;
            text-shadow: 0 2px 4px black;
        }

        #destination-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        #destination-value {
            font-size: 18px;
            font-weight: bold;
            color: #65ff9c;
        }

        #message {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(100, 240, 255, 0.3);
            border-radius: 20px;
            opacity: 0;
            transition: opacity var(--transition-normal);
            white-space: nowrap;
            font-size: 18px;
            text-shadow: 0 2px 4px black;
            max-width: 90%;
            text-align: center;
        }

        #controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            display: flex;
            justify-content: space-between;
            padding: 0 22px;
            pointer-events: auto;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(20, 20, 30, 0.85);
            color: white;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transition: transform var(--transition-fast) var(--ease-out),
                        background var(--transition-fast) var(--ease-out);
            cursor: pointer;
            user-select: none;
        }

        button:active {
            transform: scale(0.92);
            background: rgba(60, 60, 80, 0.95);
        }

        #brake {
            width: 86px;
            height: 70px;
            border-radius: 35px;
            border-color: rgba(255, 170, 60, 0.7);
            color: #ffc06a;
            background: rgba(30, 20, 10, 0.85);
        }

        #brake:active {
            background: rgba(80, 60, 40, 0.95);
        }

        #instruction {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
            max-width: 90%;
            pointer-events: none;
        }

        .edit-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #48efff;
            border-radius: 50%;
            background: rgba(72, 239, 255, 0.2);
            pointer-events: auto;
            cursor: move;
            transition: transform var(--transition-fast);
        }

        .edit-marker:hover {
            transform: scale(1.1);
            background: rgba(72, 239, 255, 0.4);
        }

        .edit-marker.selected {
            border-color: #ff48ef;
            background: rgba(255, 72, 239, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            button,
            .edit-marker,
            #message {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-world">
        <canvas id="game-canvas"></canvas>
    </div>

    <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading Ghost Line Express">
        <div class="loading-panel">
            <div class="loading-kicker">NIGHT ROUTE 13</div>
            <div class="loading-title">GHOST LINE<br>EXPRESS</div>
            <div class="loading-route"></div>
            <div class="loading-copy">MEMUAT RUTE MALAM...</div>
        </div>
    </div>

    <div id="ui">
        <div id="distance">
            <div id="distance-label">DISTANCE TO TARGET</div>
            <div id="distance-value">0 m</div>
        </div>

        <div id="score">
            SCORE: <span id="score-value">0</span>
        </div>

        <div id="destination">
            <div id="destination-label">DESTINATION</div>
            <div id="destination-value">Cemetery</div>
        </div>

        <div id="message"></div>

        <div id="instruction">
            Drive forward • Stop beside passengers • Deliver them correctly
        </div>

        <div id="controls">
            <div class="control-group">
                <button id="left">◀</button>
                <button id="right">▶</button>
            </div>

            <div class="control-group">
                <button id="accelerate">GAS</button>
                <button id="brake">BRAKE</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        /**
         * GHOST LINE EXPRESS
         * 
         * A 3D atmospheric driving game where players navigate an endless foggy road,
         * picking up spectral passengers from a cemetery and delivering them to their
         * destinations. Features precise stopping mechanics, endless progression, and
         * a hauntingly beautiful aesthetic.
         * 
         * Core Mechanics:
         * - Accelerate and brake to control bus speed
         * - Steer left/right to position at markers
         * - Stop precisely beside glowing markers to pickup/dropoff passengers
         * - Score points for successful deliveries
         * - Endless road that recycles seamlessly
         */

        async function run(mode) {
            const gameWorld = document.getElementById('game-world');
            const canvas = document.getElementById('game-canvas');
            const loadingScreen = document.getElementById('loading-screen');
            // The overlay exists in the initial HTML, preventing a blank frame while
            // Three.js creates the scene. It stays up for a full second once startup begins.
            const loadingStartedAt = performance.now();

            // ============================================================
            // CONFIGURATION & STATE
            // ============================================================

            // Runtime state (not in gameConfig)
            let speed = 0;
            let score = 0;
            let passengersOnBoard = false;
            let pickupCompleted = false;
            let destinationCompleted = false;
            let messageTimer = 0;
            const keys = {};

            // Edit mode state
            let selectedObject = null;

            // Delivery ceremony state. The bus pauses while the kuntilanak
            // descends and travels from the coach to the completed house.
            let deliverySequenceActive = false;
            let departureAnimation = null;
            const completedHouses = [];

            // ============================================================
            // THREE.JS SETUP
            // ============================================================

            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(
                56,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                500
            );

            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.32;
            renderer.shadowMap.enabled = true;

            function resizeCanvas() {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Apply config colors
            scene.background = new THREE.Color(window.gameConfig.visual.fogColor);
            scene.fog = new THREE.Fog(
                window.gameConfig.visual.fogColor,
                35,
                window.gameConfig.environment.fogDensity * 1.9
            );

            // ============================================================
            // LIGHTING
            // ============================================================

            const ambient = new THREE.HemisphereLight(0xd7e2ff, 0x24352d, 1.85);
            scene.add(ambient);

            const moon = new THREE.DirectionalLight(0xffe6bd, 2.35);
            moon.position.set(-30, 70, 40);
            moon.castShadow = true;
            moon.shadow.camera.left = -50;
            moon.shadow.camera.right = 50;
            moon.shadow.camera.top = 50;
            moon.shadow.camera.bottom = -50;
            scene.add(moon);

            // ============================================================
            // WORLD
            // ============================================================

            const world = new THREE.Group();
            scene.add(world);

            // Ground
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x26352f,
                roughness: 1
            });

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                groundMaterial
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.04;
            ground.receiveShadow = true;
            world.add(ground);

            // Endless road segments
            const roadSegments = [];
            const ROAD_WIDTH = 14;
            const SEGMENT_LENGTH = 40;
            const SEGMENTS = 12;

            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x353846,
                roughness: 0.9
            });

            const edgeMaterial = new THREE.MeshStandardMaterial({
                color: 0x555866,
                roughness: 0.8
            });

            const lineMaterial = new THREE.MeshBasicMaterial({
                color: window.gameConfig.visual.roadMarkingsColor
            });

            // Low, layered road shoulders visually blend the asphalt into the
            // surrounding ground instead of making the highway read like a slab.
            const gravelShoulderMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a4646,
                roughness: 1
            });
            const grassVergeMaterial = new THREE.MeshStandardMaterial({
                color: 0x2e4a36,
                roughness: 1
            });
            const grassEdgeMaterial = new THREE.MeshStandardMaterial({
                color: 0x3f6042,
                roughness: 1
            });

            // Decorative roadside scenery is deliberately kept outside |x| = 7,
            // so it never occupies the drivable highway surface.
            const roadsideSegments = [];
            const terrainSegments = [];
            const farTerrainSegments = [];
            const farMeadowMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d4a35,
                roughness: 1
            });
            const farMeadowAltMaterial = new THREE.MeshStandardMaterial({
                color: 0x24402f,
                roughness: 1
            });
            const distantForestMaterial = new THREE.MeshStandardMaterial({
                color: 0x19332c,
                roughness: 1
            });
            const distantForestAltMaterial = new THREE.MeshStandardMaterial({
                color: 0x244238,
                roughness: 1
            });

            function createFarTerrainSegment(z, index) {
                const farTerrain = new THREE.Group();
                farTerrain.position.z = z;

                [-1, 1].forEach((side) => {
                    // Broad meadow slabs continue the visible ground behind the
                    // roadside props, so the scene never falls into a dark void.
                    const meadow = new THREE.Mesh(
                        new THREE.BoxGeometry(24, 0.08, SEGMENT_LENGTH),
                        index % 2 === 0 ? farMeadowMaterial : farMeadowAltMaterial
                    );
                    meadow.position.set(side * 23, -0.005, 0);
                    meadow.receiveShadow = true;
                    farTerrain.add(meadow);

                    // A second, darker band gives the horizon a layered woodland
                    // transition instead of ending abruptly behind the trees.
                    const outerMeadow = new THREE.Mesh(
                        new THREE.BoxGeometry(22, 0.1, SEGMENT_LENGTH),
                        index % 2 === 0 ? farMeadowAltMaterial : farMeadowMaterial
                    );
                    outerMeadow.position.set(side * 46, -0.015, 0);
                    outerMeadow.receiveShadow = true;
                    farTerrain.add(outerMeadow);

                    // Low-poly distant trees fill the space behind the nearer
                    // roadside trees without narrowing or touching the highway.
                    for (let treeIndex = 0; treeIndex < 4; treeIndex++) {
                        const x = 27 + treeIndex * 4 + (index % 2) * 1.2;
                        const localZ = -15 + treeIndex * 9;
                        const height = 5.4 + ((treeIndex + index) % 2) * 1.2;
                        const trunk = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.16, 0.28, height * 0.55, 6),
                            distantForestMaterial
                        );
                        trunk.position.set(side * x, height * 0.275, localZ);
                        farTerrain.add(trunk);

                        const crown = new THREE.Mesh(
                            new THREE.ConeGeometry(1.45 + (treeIndex % 2) * 0.3, height, 7),
                            (treeIndex + index) % 2 === 0 ? distantForestMaterial : distantForestAltMaterial
                        );
                        crown.position.set(side * x, height * 0.72, localZ);
                        crown.castShadow = true;
                        farTerrain.add(crown);
                    }
                });

                return farTerrain;
            }

            const roadsideTrunkMaterial = new THREE.MeshStandardMaterial({
                color: 0x17121b,
                roughness: 1
            });
            const roadsideBranchMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a1a2e,
                roughness: 0.95
            });
            const roadsideFoliageMaterial = new THREE.MeshStandardMaterial({
                color: 0x101b20,
                roughness: 1
            });
            const roadsideStoneMaterial = new THREE.MeshStandardMaterial({
                color: 0x4f4659,
                roughness: 1
            });
            const roadsideFenceMaterial = new THREE.MeshStandardMaterial({
                color: 0x211725,
                metalness: 0.35,
                roughness: 0.8
            });
            const roadsidePumpkinMaterial = new THREE.MeshStandardMaterial({
                color: 0xe85b22,
                emissive: 0x5e1607,
                emissiveIntensity: 0.8,
                roughness: 0.6
            });
            const roadsideLanternMaterial = new THREE.MeshBasicMaterial({
                color: 0xff8a3d
            });

            function addRoadsideTree(parent, side, localZ, variant) {
                const tree = new THREE.Group();
                const treeScale = variant === 0 ? 1 : 0.78;
                tree.position.set(side * (12.2 + variant * 1.3), 0, localZ);

                const trunkHeight = 3.2 * treeScale;
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.22 * treeScale, 0.38 * treeScale, trunkHeight, 7),
                    roadsideTrunkMaterial
                );
                trunk.position.y = trunkHeight / 2;
                trunk.castShadow = true;
                tree.add(trunk);

                const branch = new THREE.Mesh(
                    new THREE.BoxGeometry(0.16 * treeScale, 0.16 * treeScale, 2.2 * treeScale),
                    roadsideBranchMaterial
                );
                branch.position.set(side * 0.45 * treeScale, trunkHeight * 0.72, 0);
                branch.rotation.y = side * 0.55;
                branch.rotation.z = side * 0.2;
                tree.add(branch);

                const crown = new THREE.Mesh(
                    new THREE.ConeGeometry(1.15 * treeScale, 1.9 * treeScale, 7),
                    roadsideFoliageMaterial
                );
                crown.position.y = trunkHeight + 0.72 * treeScale;
                crown.castShadow = true;
                tree.add(crown);
                parent.add(tree);
            }

            function addRoadsidePumpkin(parent, side, localZ, scale) {
                const pumpkin = new THREE.Group();
                pumpkin.position.set(side * 9.15, 0.42, localZ);

                const body = new THREE.Mesh(
                    new THREE.SphereGeometry(0.48 * scale, 12, 8),
                    roadsidePumpkinMaterial
                );
                body.scale.set(1, 0.78, 0.9);
                body.castShadow = true;
                pumpkin.add(body);

                const stem = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.07, 0.09, 0.2, 6),
                    roadsideTrunkMaterial
                );
                stem.position.y = 0.43 * scale;
                pumpkin.add(stem);

                const lantern = new THREE.Mesh(
                    new THREE.SphereGeometry(0.11 * scale, 8, 8),
                    roadsideLanternMaterial
                );
                lantern.position.set(0, 0.05, side * 0.42 * scale);
                pumpkin.add(lantern);
                parent.add(pumpkin);
            }

            function addRoadsideFence(parent, side) {
                const fenceX = side * 9.65;
                [-16, 0, 16].forEach((localZ) => {
                    const post = new THREE.Mesh(
                        new THREE.BoxGeometry(0.16, 1.45, 0.16),
                        roadsideFenceMaterial
                    );
                    post.position.set(fenceX, 0.72, localZ);
                    post.castShadow = true;
                    parent.add(post);
                });

                [0.45, 1.02].forEach((height) => {
                    const rail = new THREE.Mesh(
                        new THREE.BoxGeometry(0.14, 0.12, 34),
                        roadsideFenceMaterial
                    );
                    rail.position.set(fenceX, height, 0);
                    parent.add(rail);
                });
            }

            function addRoadsideStone(parent, side, localZ, offset) {
                const stone = new THREE.Mesh(
                    new THREE.BoxGeometry(0.7, 1.05 + offset * 0.18, 0.28),
                    roadsideStoneMaterial
                );
                stone.position.set(side * (10.8 + offset), 0.53, localZ);
                stone.rotation.y = offset * 0.18;
                stone.castShadow = true;
                parent.add(stone);
            }

            // Keep every cemetery clear of generic roadside decoration. The
            // clearance follows the cemetery as it is recycled, so trees,
            // fences, pumpkins, stones, and future roadside props cannot
            // visually overlap the cemetery footprint.
            const cemeteryClearance = {
                x: window.gameConfig.locations.cemeteryX,
                z: window.gameConfig.locations.cemeteryZ
            };
            const CEMETERY_CLEARANCE_HALF_WIDTH = 6.2;
            const CEMETERY_CLEARANCE_HALF_DEPTH = 13.2;

            function isInsideCemeteryClearance(x, z) {
                return Math.abs(x - cemeteryClearance.x) <= CEMETERY_CLEARANCE_HALF_WIDTH &&
                    Math.abs(z - cemeteryClearance.z) <= CEMETERY_CLEARANCE_HALF_DEPTH;
            }

            function refreshCemeteryClearance() {
                roadsideSegments.forEach((segment) => {
                    const decor = segment.userData.foreignDecor || [];
                    decor.forEach((object) => {
                        const worldX = segment.position.x + object.position.x;
                        const worldZ = segment.position.z + object.position.z;
                        object.visible = !isInsideCemeteryClearance(worldX, worldZ);
                    });
                });
            }

            function createRoadsideSegment(z, index) {
                const roadside = new THREE.Group();
                roadside.position.z = z;

                [-1, 1].forEach((side) => {
                    addRoadsideFence(roadside, side);
                    addRoadsideTree(roadside, side, -13, index % 2);
                    addRoadsideTree(roadside, side, 8, (index + 1) % 2);
                    addRoadsidePumpkin(roadside, side, -6, 0.9);
                    addRoadsidePumpkin(roadside, side, 14, 0.72);
                    addRoadsideStone(roadside, side, 2, index % 3);
                });

                // Register every direct roadside prop for the cemetery safety
                // pass. This avoids hardcoded tree/fence exceptions and also
                // protects future recycled cemetery locations automatically.
                roadside.userData.foreignDecor = roadside.children.slice();
                return roadside;
            }

            for (let i = 0; i < SEGMENTS; i++) {
                const z = -i * SEGMENT_LENGTH;

                const road = new THREE.Mesh(
                    new THREE.BoxGeometry(ROAD_WIDTH, 0.15, SEGMENT_LENGTH),
                    roadMaterial
                );
                road.position.set(0, 0, z);
                road.receiveShadow = true;
                world.add(road);
                roadSegments.push(road);

                // Left boundary
                // Low road edge strips provide a visual boundary without a
                // raised curb that makes the highway look like a platform.
                const leftEdge = new THREE.Mesh(
                    new THREE.BoxGeometry(0.18, 0.06, SEGMENT_LENGTH),
                    edgeMaterial
                );
                leftEdge.position.set(-ROAD_WIDTH / 2, 0.055, z);
                world.add(leftEdge);

                // Right boundary
                const rightEdge = new THREE.Mesh(
                    new THREE.BoxGeometry(0.18, 0.06, SEGMENT_LENGTH),
                    edgeMaterial
                );
                rightEdge.position.set(ROAD_WIDTH / 2, 0.055, z);
                world.add(rightEdge);

            // readable stopping layout without covering the whole road.
            const PICKUP_STOP_WIDTH = 3;
            const PICKUP_STOP_LENGTH = 4;
            const marker = new THREE.Mesh(
                new THREE.BoxGeometry(
                    PICKUP_STOP_WIDTH,
                    0.08,
                    PICKUP_STOP_LENGTH
                ),
                new THREE.MeshBasicMaterial({
                    color: 0x48efff,
                    transparent: true,
                    opacity: 0.2,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            marker.position.y = 0.02;
            marker.renderOrder = -1;
            pickup.add(marker);

            // Bright rectangular edge markings make the 3x4 footprint easy to
            // read against the dark shoulder, especially when approaching at
            // speed. The edge sits slightly above the translucent pad.
            const pickupStopBorderMaterial = new THREE.MeshBasicMaterial({
                color: 0x7df6ff,
                transparent: true,
                opacity: 0.92,
                side: THREE.DoubleSide
            });
            const pickupStopBorder = new THREE.Group();
            pickupStopBorder.position.y = 0.075;
            pickup.add(pickupStopBorder);

            const borderThickness = 0.08;
            const borderHeight = 0.035;
            const frontBorder = new THREE.Mesh(
                new THREE.BoxGeometry(PICKUP_STOP_WIDTH, borderHeight, borderThickness),
                pickupStopBorderMaterial
            );
            frontBorder.position.z = -PICKUP_STOP_LENGTH / 2;
            pickupStopBorder.add(frontBorder);

            const backBorder = frontBorder.clone();
            backBorder.position.z = PICKUP_STOP_LENGTH / 2;
            pickupStopBorder.add(backBorder);

            const sideBorder = new THREE.Mesh(
                new THREE.BoxGeometry(borderThickness, borderHeight, PICKUP_STOP_LENGTH),
                pickupStopBorderMaterial
            );
            sideBorder.position.x = -PICKUP_STOP_WIDTH / 2;
            pickupStopBorder.add(sideBorder);

            const otherSideBorder = sideBorder.clone();
            otherSideBorder.position.x = PICKUP_STOP_WIDTH / 2;
            pickupStopBorder.add(otherSideBorder);

            // Waiting passenger: a complete stylized 3D kuntilanak rig.
            // The rig is intentionally local to the pickup group so the existing
            // pickup zone, marker, and gameplay coordinates remain unchanged.
            const ghostSkinMaterial = new THREE.MeshStandardMaterial({
                color: 0xc8c5c9,
                roughness: 0.76,
                metalness: 0.02
            });
            const ghostSkinShadowMaterial = new THREE.MeshStandardMaterial({
                color: 0x96949b,
                roughness: 0.82,
                metalness: 0.01
            });
            const ghostDressMaterial = new THREE.MeshStandardMaterial({
                color: 0xd8d8d2,
                roughness: 0.86,
                metalness: 0.02
            });
            const ghostDressLayerMaterial = new THREE.MeshStandardMaterial({
                color: 0xbfc4c3,
                roughness: 0.9,
                metalness: 0.01
            });
            const ghostDressHighlightMaterial = new THREE.MeshStandardMaterial({
                color: 0xe7e5dc,
                roughness: 0.82,
                metalness: 0.01
            });
            // Dull grave-soil staining. Kept semi-transparent so it reads as dirt
            // soaked into the cloth instead of painted-on blocks of colour.
            const ghostDressSoilMaterial = new THREE.MeshStandardMaterial({
                color: 0x6e604c,
                roughness: 0.98,
                metalness: 0,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide
            });
            const ghostDressGrimeMaterial = new THREE.MeshStandardMaterial({
                color: 0x8d8375,
                roughness: 0.95,
                metalness: 0,
                transparent: true,
                opacity: 0.42,
                side: THREE.DoubleSide
            });
            // Thin, frayed cloth shreds are double sided so the torn edges stay
            // visible from the elevated chase camera at any angle.
            const ghostDressTatterMaterial = new THREE.MeshStandardMaterial({
                color: 0xcbc9bf,
                roughness: 0.92,
                metalness: 0.01,
                side: THREE.DoubleSide
            });
            const ghostNailMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1018,
                roughness: 0.42,
                metalness: 0.18
            });
            const ghostUnderShadowMaterial = new THREE.MeshBasicMaterial({
                color: 0x05060a,
                transparent: true,
                opacity: 0.55,
                depthWrite: false
            });
            const ghostHairMaterial = new THREE.MeshStandardMaterial({
                color: 0x090b13,
                roughness: 0.66,
                metalness: 0.08
            });
            const ghostHairHighlightMaterial = new THREE.MeshStandardMaterial({
                color: 0x1b1d2b,
                roughness: 0.58,
                metalness: 0.12
            });
            const ghostSocketMaterial = new THREE.MeshStandardMaterial({
                color: 0x171521,
                roughness: 0.78,
                metalness: 0.02
            });
            const ghostEyeWhiteMaterial = new THREE.MeshStandardMaterial({
                color: 0xb9c4c7,
                roughness: 0.58,
                metalness: 0.01
            });
            const ghostIrisMaterial = new THREE.MeshStandardMaterial({
                color: 0xd8f4ef,
                emissive: 0x29444a,
                emissiveIntensity: 0.3,
                roughness: 0.3
            });
            const ghostMouthMaterial = new THREE.MeshStandardMaterial({
                color: 0x251321,
                roughness: 0.78
            });
            const ghostMouthCavityMaterial = new THREE.MeshStandardMaterial({
                color: 0x0b080f,
                roughness: 0.92
            });
            const ghostTeethMaterial = new THREE.MeshStandardMaterial({
                color: 0xb9b8aa,
                roughness: 0.72
            });
            const ghostCheekShadowMaterial = new THREE.MeshStandardMaterial({
                color: 0x77727e,
                roughness: 0.86,
                transparent: true,
                opacity: 0.5
            });

            const waitingGhost = new THREE.Group();
            // The pickup config remains at x = 6 for the existing interaction,
            // while the visible character stands safely outside the road edge at
            // world x = 8.6, between the shoulder and cemetery footprint. The
            // extra offset keeps the new floor-length, pooled hem off the asphalt.
            waitingGhost.position.set(2.6, 0.03, 0);
            // Local +Z faces the approaching bus; the body still presents toward
            // the highway rather than looking like a generic forward-facing NPC.
            waitingGhost.rotation.y = -0.92;
            waitingGhost.castShadow = true;
            waitingGhost.userData.state = 'waiting';
            waitingGhost.userData.idleTime = 0;
            waitingGhost.userData.boardTime = 0;
            waitingGhost.userData.restPosition = waitingGhost.position.clone();
            waitingGhost.userData.restRotationY = waitingGhost.rotation.y;

            const ghostBodyRig = new THREE.Group();
            waitingGhost.add(ghostBodyRig);

            // ============================================================
            // LONG TATTERED BURIAL GOWN
            // ============================================================
            // Floor-length grave clothes built from tapered cloth layers: a full
            // inner skirt, a flared outer skirt with a torn edge, and fabric that
            // pools and drags on the ground so the feet are completely hidden
            // (the classic "floating" kuntilanak silhouette). Dull graveyard soil
            // creeps up from the hem, and frayed shreds break the clean cone
            // outline that previously made the dress look like a simple prop.

            const SKIRT_BASE_Y = -0.02;
            const SKIRT_APEX_Y = 1.95;
            const SKIRT_BASE_RADIUS = 0.96;
            const SKIRT_HEIGHT = SKIRT_APEX_Y - SKIRT_BASE_Y;

            const OVERSKIRT_TOP_Y = 1.76;
            const OVERSKIRT_BOTTOM_Y = 0.56;
            const OVERSKIRT_TOP_RADIUS = 0.22;
            const OVERSKIRT_BOTTOM_RADIUS = 0.84;

            function skirtRadiusAt(y) {
                const t = THREE.MathUtils.clamp(
                    (SKIRT_APEX_Y - y) / SKIRT_HEIGHT,
                    0,
                    1
                );
                return SKIRT_BASE_RADIUS * t;
            }

            function overskirtRadiusAt(y) {
                const t = THREE.MathUtils.clamp(
                    (OVERSKIRT_TOP_Y - y) / (OVERSKIRT_TOP_Y - OVERSKIRT_BOTTOM_Y),
                    0,
                    1
                );
                return OVERSKIRT_TOP_RADIUS +
                    t * (OVERSKIRT_BOTTOM_RADIUS - OVERSKIRT_TOP_RADIUS);
            }

            // Aligns a mesh's local +Y axis with an arbitrary direction. Used for
            // cloth folds and torn shreds so they follow the skirt's slope.
            const ghostOrientUp = new THREE.Vector3(0, 1, 0);
            const ghostOrientDir = new THREE.Vector3();
            function orientAlong(mesh, x, y, z) {
                ghostOrientDir.set(x, y, z).normalize();
                mesh.quaternion.setFromUnitVectors(ghostOrientUp, ghostOrientDir);
            }

            const lowerDress = new THREE.Mesh(
                new THREE.ConeGeometry(SKIRT_BASE_RADIUS, SKIRT_HEIGHT, 24, 4),
                ghostDressMaterial
            );
            lowerDress.position.y = (SKIRT_APEX_Y + SKIRT_BASE_Y) / 2;
            lowerDress.castShadow = true;
            lowerDress.receiveShadow = true;
            ghostBodyRig.add(lowerDress);

            // Outer skirt layer ending at mid-shin with a deliberately torn edge.
            const overskirt = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    OVERSKIRT_TOP_RADIUS,
                    OVERSKIRT_BOTTOM_RADIUS,
                    OVERSKIRT_TOP_Y - OVERSKIRT_BOTTOM_Y,
                    22
                ),
                ghostDressLayerMaterial
            );
            overskirt.position.set(0, (OVERSKIRT_TOP_Y + OVERSKIRT_BOTTOM_Y) / 2, 0.01);
            overskirt.castShadow = true;
            overskirt.receiveShadow = true;
            ghostBodyRig.add(overskirt);

            // Heavy fabric pooling where the gown drags across the soil.
            const dressPool = new THREE.Mesh(
                new THREE.CylinderGeometry(0.97, 1.18, 0.2, 26),
                ghostDressLayerMaterial
            );
            dressPool.position.y = 0.07;
            dressPool.castShadow = true;
            dressPool.receiveShadow = true;
            ghostBodyRig.add(dressPool);

            // Pure darkness beneath the hem: nothing solid reads under the gown,
            // so the legs and feet stay hidden while she appears to hover.
            const underHemShadow = new THREE.Mesh(
                new THREE.CircleGeometry(0.93, 24),
                ghostUnderShadowMaterial
            );
            underHemShadow.rotation.x = -Math.PI / 2;
            underHemShadow.position.y = 0.014;
            underHemShadow.renderOrder = -1;
            ghostBodyRig.add(underHemShadow);

            const dressBodice = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.42, 0.62, 6, 14),
                ghostDressHighlightMaterial
            );
            dressBodice.position.set(0, 2.16, 0);
            dressBodice.scale.set(1, 1, 0.78);
            dressBodice.castShadow = true;
            ghostBodyRig.add(dressBodice);

            const shoulderDrape = new THREE.Mesh(
                new THREE.SphereGeometry(0.58, 16, 10),
                ghostDressMaterial
            );
            shoulderDrape.position.set(0, 2.48, 0);
            shoulderDrape.scale.set(1.18, 0.42, 0.72);
            shoulderDrape.castShadow = true;
            ghostBodyRig.add(shoulderDrape);

            // Loose waist sash marking where the bodice meets the long skirt.
            const waistLayer = new THREE.Mesh(
                new THREE.TorusGeometry(0.4, 0.06, 8, 24),
                ghostDressHighlightMaterial
            );
            waistLayer.rotation.x = Math.PI / 2;
            waistLayer.position.y = 1.72;
            waistLayer.scale.set(1, 0.78, 1);
            waistLayer.castShadow = true;
            ghostBodyRig.add(waistLayer);

            // Raised fabric folds follow the skirt's slope so the gown reads as
            // heavy cloth rather than a single smooth white cone.
            const dressFoldMaterials = [
                ghostDressHighlightMaterial,
                ghostDressLayerMaterial,
                ghostDressMaterial
            ];
            for (let foldIndex = 0; foldIndex < 12; foldIndex++) {
                const angle = (foldIndex / 12) * Math.PI * 2;
                const midY = 0.7 + (foldIndex % 3) * 0.12;
                const foldLength = 1.08 + (foldIndex % 2) * 0.18;
                const radius = skirtRadiusAt(midY) + 0.035;
                const fold = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.058, foldLength, 4, 7),
                    dressFoldMaterials[foldIndex % dressFoldMaterials.length]
                );
                fold.position.set(
                    Math.cos(angle) * radius,
                    midY,
                    Math.sin(angle) * radius
                );
                orientAlong(fold, -Math.cos(angle) * 0.44, 1, -Math.sin(angle) * 0.44);
                fold.castShadow = true;
                ghostBodyRig.add(fold);
            }

            // Ragged strips hanging from the torn outer skirt edge.
            for (let i = 0; i < 18; i++) {
                const angle = (i / 18) * Math.PI * 2 + 0.08;
                const length = 0.24 + ((i * 7) % 5) * 0.075;
                const tatter = new THREE.Mesh(
                    new THREE.ConeGeometry(0.075, length, 5),
                    i % 3 === 0 ? ghostDressTatterMaterial : ghostDressLayerMaterial
                );
                const outward = 0.3;
                const dirLength = Math.sqrt(1 + outward * outward);
                tatter.position.set(
                    Math.cos(angle) * (OVERSKIRT_BOTTOM_RADIUS - 0.02) +
                        (Math.cos(angle) * outward / dirLength) * length * 0.5,
                    OVERSKIRT_BOTTOM_Y + 0.01 - (length * 0.5) / dirLength,
                    Math.sin(angle) * (OVERSKIRT_BOTTOM_RADIUS - 0.02) +
                        (Math.sin(angle) * outward / dirLength) * length * 0.5
                );
                orientAlong(tatter, Math.cos(angle) * outward, -1, Math.sin(angle) * outward);
                tatter.castShadow = true;
                ghostBodyRig.add(tatter);
            }

            // Frayed cloth splaying outward where the hem drags on the ground.
            for (let i = 0; i < 14; i++) {
                const angle = (i / 14) * Math.PI * 2 + 0.22;
                const length = 0.3 + ((i * 5) % 4) * 0.13;
                const shredPivot = new THREE.Group();
                shredPivot.rotation.y = -angle;
                ghostBodyRig.add(shredPivot);

                const shred = new THREE.Mesh(
                    new THREE.ConeGeometry(0.14, length, 4),
                    i % 2 === 0 ? ghostDressTatterMaterial : ghostDressLayerMaterial
                );
                shred.position.set(1.06 + length * 0.45, 0.04, 0);
                shred.rotation.z = -Math.PI / 2;
                shred.scale.set(0.34, 1, 1);
                shred.receiveShadow = true;
                shredPivot.add(shred);
            }

            // Long trailing shreds behind her, as if the gown was dragged out of
            // the grave. Local -Z is behind the character.
            [-0.55, 0, 0.55].forEach((offset, index) => {
                const angle = -Math.PI / 2 + offset;
                const length = 1.05 - Math.abs(offset) * 0.4;
                const trailPivot = new THREE.Group();
                trailPivot.rotation.y = -angle;
                ghostBodyRig.add(trailPivot);

                const trail = new THREE.Mesh(
                    new THREE.ConeGeometry(0.2, length, 4),
                    index === 1 ? ghostDressLayerMaterial : ghostDressTatterMaterial
                );
                trail.position.set(1.04 + length * 0.5, 0.035, 0);
                trail.rotation.z = -Math.PI / 2;
                trail.scale.set(0.3, 1, 1);
                trail.receiveShadow = true;
                trailPivot.add(trail);
            });

            // A soaked, soiled band rising from the hem of the inner skirt.
            const hemSoilBand = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    skirtRadiusAt(0.64) + 0.02,
                    skirtRadiusAt(SKIRT_BASE_Y) + 0.02,
                    0.66,
                    26,
                    1,
                    true
                ),
                ghostDressSoilMaterial
            );
            hemSoilBand.position.y = 0.31;
            ghostBodyRig.add(hemSoilBand);

            // Individual grave-soil patches. Each stain is a thin plate laid onto
            // the cloth surface and tilted to follow the skirt's slope.
            function addDressSoil(angle, y, width, height, material, layer) {
                const baseRadius = layer === 'over'
                    ? overskirtRadiusAt(y)
                    : skirtRadiusAt(y);
                const radius = baseRadius + 0.028;
                const stain = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 14, 10),
                    material
                );
                stain.position.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );
                stain.rotation.set(0, Math.PI / 2 - angle, 0);
                stain.rotateX(-0.4);
                stain.scale.set(width, height, 0.055);
                ghostBodyRig.add(stain);
                return stain;
            }

            [
                [0.35, 0.3, 0.62, 0.5],
                [1.5, 0.24, 0.5, 0.42],
                [2.6, 0.4, 0.55, 0.46],
                [3.5, 0.26, 0.6, 0.5],
                [4.4, 0.44, 0.45, 0.4],
                [5.5, 0.3, 0.58, 0.46]
            ].forEach(([angle, y, width, height]) => {
                addDressSoil(angle, y, width, height, ghostDressSoilMaterial, 'lower');
            });

            [
                [0.9, 0.86, 0.46, 0.36],
                [2.2, 1.04, 0.38, 0.3],
                [4.0, 0.94, 0.42, 0.34],
                [5.1, 1.2, 0.32, 0.26]
            ].forEach(([angle, y, width, height]) => {
                addDressSoil(angle, y, width, height, ghostDressGrimeMaterial, 'over');
            });

            // Wet clumps of graveyard dirt caught in the pooled hem.
            for (let i = 0; i < 9; i++) {
                const angle = (i / 9) * Math.PI * 2 + 0.4;
                const smudge = new THREE.Mesh(
                    new THREE.SphereGeometry(0.22, 10, 8),
                    i % 2 === 0 ? ghostDressSoilMaterial : ghostDressGrimeMaterial
                );
                smudge.position.set(
                    Math.cos(angle) * 1.03,
                    0.11,
                    Math.sin(angle) * 1.03
                );
                smudge.scale.set(1.15, 0.5, 0.58);
                ghostBodyRig.add(smudge);
            }

            // Faint grime smeared across the bodice, hugging its curved front.
            [
                [-0.2, 2.02, 0.34],
                [0.24, 2.3, 0.26],
                [0.03, 1.88, 0.38]
            ].forEach(([x, y, size]) => {
                const surfaceZ = 0.322 * Math.sqrt(
                    Math.max(0.2, 1 - Math.pow(x / 0.42, 2))
                );
                const smear = new THREE.Mesh(
                    new THREE.SphereGeometry(0.3, 12, 8),
                    ghostDressGrimeMaterial
                );
                smear.position.set(x, y, surfaceZ + 0.004);
                smear.scale.set(size, size * 0.8, 0.09);
                ghostBodyRig.add(smear);
            });

            // ============================================================
            // BAGGY SLEEVES AND PALE CLAWED HANDS
            // ============================================================
            // Wide, drooping bell sleeves with torn cuffs, from which long pale
            // fingers tipped with dark nails emerge. The arms angle slightly
            // outward so the hands stay clear of the flared skirt.

            function addGhostHand(parent, side, attachY) {
                const hand = new THREE.Group();
                hand.position.set(side * 0.012, attachY, 0.02);
                hand.rotation.z = side * -0.12;
                parent.add(hand);

                const palm = new THREE.Mesh(
                    new THREE.SphereGeometry(0.13, 12, 10),
                    ghostSkinMaterial
                );
                palm.scale.set(0.86, 1.02, 0.54);
                palm.castShadow = true;
                hand.add(palm);

                for (let f = 0; f < 4; f++) {
                    const fingerGroup = new THREE.Group();
                    const fingerX = (f - 1.5) * 0.058;
                    fingerGroup.position.set(fingerX, -0.1, 0.012);
                    fingerGroup.rotation.z = -fingerX * 1.05;
                    fingerGroup.rotation.x = 0.2 - Math.abs(f - 1.5) * 0.05;
                    hand.add(fingerGroup);

                    const boneLength = 0.185 - Math.abs(f - 1.1) * 0.022;
                    const boneRadius = 0.026;
                    const bone = new THREE.Mesh(
                        new THREE.CapsuleGeometry(boneRadius, boneLength, 4, 8),
                        ghostSkinMaterial
                    );
                    bone.position.y = -(boneLength / 2 + boneRadius);
                    bone.castShadow = true;
                    fingerGroup.add(bone);

                    // Long, dark, pointed nail.
                    const nail = new THREE.Mesh(
                        new THREE.ConeGeometry(boneRadius * 0.9, 0.08, 6),
                        ghostNailMaterial
                    );
                    nail.position.set(0, -(boneLength + boneRadius * 2 + 0.026), 0.008);
                    nail.rotation.x = Math.PI;
                    nail.castShadow = true;
                    fingerGroup.add(nail);
                }

                const thumbGroup = new THREE.Group();
                thumbGroup.position.set(side * -0.09, -0.04, 0.055);
                thumbGroup.rotation.set(0.45, 0, side * 0.85);
                hand.add(thumbGroup);

                const thumb = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.03, 0.12, 4, 8),
                    ghostSkinMaterial
                );
                thumb.position.y = -0.09;
                thumb.castShadow = true;
                thumbGroup.add(thumb);

                const thumbNail = new THREE.Mesh(
                    new THREE.ConeGeometry(0.026, 0.07, 6),
                    ghostNailMaterial
                );
                thumbNail.position.y = -0.195;
                thumbNail.rotation.x = Math.PI;
                thumbGroup.add(thumbNail);
            }

            function addWaitingGhostArm(side) {
                const arm = new THREE.Group();
                arm.position.set(side * 0.5, 2.34, 0.02);
                arm.rotation.z = side * 0.26;
                arm.rotation.x = -0.04;

                const shoulderCap = new THREE.Mesh(
                    new THREE.SphereGeometry(0.21, 14, 10),
                    ghostDressMaterial
                );
                shoulderCap.position.y = -0.03;
                shoulderCap.scale.set(1, 0.86, 0.95);
                shoulderCap.castShadow = true;
                arm.add(shoulderCap);

                const upperSleeve = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.185, 0.235, 0.48, 16),
                    ghostDressMaterial
                );
                upperSleeve.position.y = -0.29;
                upperSleeve.castShadow = true;
                upperSleeve.receiveShadow = true;
                arm.add(upperSleeve);

                // Wide, drooping bell sleeve.
                const bellSleeve = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.235, 0.35, 0.5, 18),
                    ghostDressLayerMaterial
                );
                bellSleeve.position.y = -0.78;
                bellSleeve.castShadow = true;
                bellSleeve.receiveShadow = true;
                arm.add(bellSleeve);

                // Torn fringe around the sleeve cuff.
                for (let i = 0; i < 10; i++) {
                    const angle = (i / 10) * Math.PI * 2;
                    const length = 0.12 + ((i * 3) % 4) * 0.045;
                    const outward = 0.24;
                    const dirLength = Math.sqrt(1 + outward * outward);
                    const fringe = new THREE.Mesh(
                        new THREE.ConeGeometry(0.052, length, 4),
                        i % 2 === 0 ? ghostDressTatterMaterial : ghostDressLayerMaterial
                    );
                    fringe.position.set(
                        Math.cos(angle) * 0.33 +
                            (Math.cos(angle) * outward / dirLength) * length * 0.5,
                        -1.02 - (length * 0.5) / dirLength,
                        Math.sin(angle) * 0.33 +
                            (Math.sin(angle) * outward / dirLength) * length * 0.5
                    );
                    orientAlong(fringe, Math.cos(angle) * outward, -1, Math.sin(angle) * outward);
                    fringe.castShadow = true;
                    arm.add(fringe);
                }

                // Grave dirt soaked into the sleeve.
                const sleeveSoil = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 10, 8),
                    ghostDressSoilMaterial
                );
                sleeveSoil.position.set(0, -0.86, 0.3);
                sleeveSoil.scale.set(0.9, 1.15, 0.35);
                arm.add(sleeveSoil);

                const wrist = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.075, 0.085, 0.16, 12),
                    ghostSkinShadowMaterial
                );
                wrist.position.y = -1.03;
                wrist.castShadow = true;
                arm.add(wrist);

                addGhostHand(arm, side, -1.12);

                ghostBodyRig.add(arm);
            }
            addWaitingGhostArm(-1);
            addWaitingGhostArm(1);

            // Head and face: a pale, readable supernatural face with deep sockets,
            // layered eyelids, cold irises, a defined nose, cheek shadows, and a
            // restrained but genuinely unsettling smile. The face stays exposed so
            // it remains legible from the elevated chase camera.
            const ghostHead = new THREE.Group();
            ghostHead.position.set(0, 3.12, 0.02);
            ghostBodyRig.add(ghostHead);

            // Facial base mesh - positioned and scaled so the pale supernatural face
            // with its eyes, nose, and sinister smile remains fully clear, open, and
            // legible, while the hair naturally frames it from the sides, top, and back.
            const headMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.42, 24, 18),
                ghostSkinMaterial

            function resetWaitingGhost() {
                waitingGhost.visible = true;

            function beginGhostBoarding() {
                if (waitingGhost.userData.state !== 'waiting') return;
                waitingGhost.userData.state = 'boarding';
                waitingGhost.userData.boardTime = 0;
            }

            function updateWaitingGhost(deltaTime) {
                const state = waitingGhost.userData.state;

                if (state === 'waiting') {
                    waitingGhost.userData.idleTime += deltaTime;
                    const idleTime = waitingGhost.userData.idleTime;
                    const breathing = Math.sin(idleTime * 1.15) * 0.018;
                    const breeze = Math.sin(idleTime * 0.7 + 0.8);

                    ghostBodyRig.position.y = breathing;
                    ghostBodyRig.scale.y = 1 + Math.sin(idleTime * 1.15) * 0.006;
                    ghostHair.rotation.z = breeze * 0.018;
                    ghostHair.rotation.y = Math.sin(idleTime * 0.43) * 0.022;
                    ghostHair.position.x = Math.sin(idleTime * 0.52) * 0.012;
                    ghostMist.rotation.z += deltaTime * 0.12;
                    ghostMist.scale.setScalar(1 + Math.sin(idleTime * 0.65) * 0.035);

                    // A slow, restrained look toward the arriving bus keeps the
                    // waiting pose alive without turning it into an attack.
                    const approach = THREE.MathUtils.clamp(
                        1 - Math.abs(bus.position.z - pickup.position.z) / 16,
                        0,
                        1
                    );
                    ghostHead.rotation.y =
                        Math.sin(idleTime * 0.34) * 0.06 + approach * 0.12;
                    ghostHead.rotation.z = Math.sin(idleTime * 0.28) * 0.012;
                    return;
                }

                if (state === 'boarding') {
                    waitingGhost.userData.boardTime += deltaTime;
                    const t = THREE.MathUtils.clamp(
                        waitingGhost.userData.boardTime / 1.05,
                        0,
                        1
                    );
                    const eased = 1 - Math.pow(1 - t, 3);

                    // Move from the safe shoulder position through the bus side,
                    // then scale down gently so the character disappears inside
                    // rather than popping or remaining duplicated outside.
                    waitingGhost.position.x = THREE.MathUtils.lerp(
                        waitingGhost.userData.restPosition.x,
                        1.42,
                        eased
                    );
                    waitingGhost.position.z = THREE.MathUtils.lerp(0, 0.18, eased);
                    waitingGhost.position.y = THREE.MathUtils.lerp(
                        waitingGhost.userData.restPosition.y,
                        0.28,
                        eased
                    );
                    waitingGhost.rotation.y = THREE.MathUtils.lerp(
                        waitingGhost.userData.restRotationY,
                        -Math.PI / 2,
                        eased
                    );
                    waitingGhost.scale.setScalar(1 - eased * 0.28);
                    ghostHair.rotation.z = Math.sin(t * Math.PI) * 0.02;

                    if (t >= 1) {
                        waitingGhost.visible = false;
                        waitingGhost.userData.state = 'boarded';
                    }
                    return;
                }

                if (state === 'departing' && departureAnimation) {
                    departureAnimation.elapsed += deltaTime;
                    const t = THREE.MathUtils.clamp(
                        departureAnimation.elapsed / departureAnimation.duration,
                        0,
                        1
                    );
                    const descentPhase = 0.24;
                    const direction = new THREE.Vector3().subVectors(
                        departureAnimation.target,
                        departureAnimation.exit
                    );

                    if (t < descentPhase) {
                        const descendT = THREE.MathUtils.smoothstep(
                            t / descentPhase,
                            0,
                            1
                        );
                        waitingGhost.position.lerpVectors(
                            departureAnimation.start,
                            departureAnimation.exit,
                            descendT
                        );
                    } else {
                        const walkT = THREE.MathUtils.smoothstep(
                            (t - descentPhase) / (1 - descentPhase),
                            0,
                            1
                        );
                        waitingGhost.position.lerpVectors(
                            departureAnimation.exit,
                            departureAnimation.target,
                            walkT
                        );
                        waitingGhost.position.y += Math.sin(walkT * Math.PI) * 0.2;
                        waitingGhost.scale.setScalar(1 - walkT * 0.16);
                    }

                    waitingGhost.rotation.y = Math.atan2(direction.x, direction.z);
                    ghostBodyRig.position.y = Math.sin(departureAnimation.elapsed * 5.2) * 0.025;
                    ghostBodyRig.rotation.z = Math.sin(departureAnimation.elapsed * 2.2) * 0.018;
                    ghostHair.rotation.z = Math.sin(departureAnimation.elapsed * 2.8) * 0.035;
                    ghostMist.rotation.z += deltaTime * 0.55;
                    ghostMist.scale.setScalar(1 + Math.sin(departureAnimation.elapsed * 2.4) * 0.04);

                departureAnimation.target.set(
                    destination.position.x + abandonedHouse.position.x + 1.35,
                    0.13,
                    destination.position.z + abandonedHouse.position.z + 3.35
                );

                // Reparenting to world lets the character cross from the bus to
                // the house while both landmarks stay in their route positions.
                world.attach(waitingGhost);
                waitingGhost.visible = true;
                waitingGhost.userData.state = 'departing';
                waitingGhost.userData.boardTime = 0;
                waitingGhost.scale.set(1, 1, 1);
                waitingGhost.position.copy(departureAnimation.start);
                ghostBodyRig.position.set(0, 0, 0);

            function finishDeliverySequence() {
                if (!deliverySequenceActive) return;

                // Preserve a copy of the completed landmark in the world before
                // moving the active destination to the next route. The house
                // therefore never disappears after delivery.
                const completedHouse = abandonedHouse.clone(true);
                const completedHouseWorldPosition = new THREE.Vector3();
                abandonedHouse.getWorldPosition(completedHouseWorldPosition);
                completedHouse.position.copy(completedHouseWorldPosition);
                world.add(completedHouse);

                const completedMist = houseMist.clone(true);
                const completedMistWorldPosition = new THREE.Vector3();
                houseMist.getWorldPosition(completedMistWorldPosition);
                completedMist.position.copy(completedMistWorldPosition);
                world.add(completedMist);
                completedHouses.push(completedHouse, completedMist);

                deliverySequenceActive = false;
                departureAnimation = null;
                passengersOnBoard = false;
                waitingGhost.visible = false;
                waitingGhost.userData.state = 'boarded';

                const spawnDist = window.gameConfig.environment.passengerSpawnDistance;
                const routeLength = Math.max(
                    120,
                    Math.abs(
                        window.gameConfig.locations.destinationZ -
                        window.gameConfig.locations.pickupZ
                    )
                );
                const nextPickupZ = bus.position.z - spawnDist;
                const nextDestinationZ = nextPickupZ - routeLength;

                pickup.position.z = nextPickupZ;
                cemetery.position.z = nextPickupZ - 2;
                destination.position.z = nextDestinationZ;
                cemeteryClearance.z = cemetery.position.z;
                refreshCemeteryClearance();

                pickupCompleted = false;
                destinationCompleted = false;
                destinationMarker.visible = true;
                destinationBorder.visible = true;

                pickup.add(waitingGhost);
                resetWaitingGhost();
                updateDestinationDisplay('Cemetery');
                showMessage('Rute baru: jemput hantu berikutnya di kuburan.');

            // ============================================================
            // GAME LOGIC
            // ============================================================

            function updateDriving(deltaTime) {
                // Limit delta time to prevent large jumps
                deltaTime = Math.min(deltaTime, 0.11);

                // Hold the bus at the completed stop while the kuntilanak exits;
                // this keeps the house and the departure animation in frame.
                if (deliverySequenceActive) {
                    speed = 0;
                    bus.userData.steeringVelocity = 0;
                    bus.rotation.z = THREE.MathUtils.lerp(bus.rotation.z, 0, 0.2);
                    bus.rotation.y = THREE.MathUtils.lerp(bus.rotation.y, 0, 0.2);
                    return;
                }

                // Steering input
                let steeringInput = 0;
                if (keys['arrowleft'] || keys['a']) {
                    steeringInput -= 1;
                }
                if (keys['arrowright'] || keys['d']) {
                    steeringInput += 1;
                }

                // Convert the original frame-tuned rates to time-based motion.
                const frameScale = deltaTime * 60;

                // Acceleration
                if (keys['arrowup'] || keys['w']) {
                    speed += window.gameConfig.gameplay.accelerationRate * frameScale;
                } else {
                    speed -= 0.006 * frameScale;
                }

                // Brake
                if (keys[' '] || keys['s']) {
                    speed -= window.gameConfig.gameplay.brakingPower * frameScale;
                }

                // Clamp speed
                speed = THREE.MathUtils.clamp(
                    speed,
                    0,
                    window.gameConfig.gameplay.maxSpeed
                );

                // Smooth steering gives the coach weight instead of snapping sideways.
                const targetSteeringVelocity = steeringInput * (0.16 + speed * 0.22);
                const steeringBlend = 1 - Math.exp(-10 * deltaTime);
                bus.userData.steeringVelocity = THREE.MathUtils.lerp(
                    bus.userData.steeringVelocity,
                    targetSteeringVelocity,
                    steeringBlend
                );
                bus.position.x += bus.userData.steeringVelocity * frameScale;
                // A small right-side shoulder is reachable for the cemetery stop;
                // the surrounding scenery still begins outside the road boundary.
                bus.position.x = THREE.MathUtils.clamp(bus.position.x, -6.2, 6.2);

                // Subtle body roll and yaw reinforce the feeling of a heavy vehicle.
                bus.rotation.z = THREE.MathUtils.lerp(
                    bus.rotation.z,
                    -bus.userData.steeringVelocity * 0.18,
                    1 - Math.exp(-7 * deltaTime)
                );
                bus.rotation.y = THREE.MathUtils.lerp(
                    bus.rotation.y,
                    bus.userData.steeringVelocity * 0.055,
                    1 - Math.exp(-7 * deltaTime)
                );

                // Forward movement is frame-rate independent.
                bus.position.z -= speed * frameScale;

                // Keep the broad base terrain centered around the bus. The road
                // is endless, so a fixed ground plane would eventually expose
                // its far edge as an empty void.
                ground.position.z = bus.position.z - 90;

                bus.userData.wheels.forEach((wheel) => {
                    wheel.rotation.x -= speed * frameScale * 0.72;
                });

                // Endless road recycling
                roadSegments.forEach(segment => {
                    if (segment.position.z > bus.position.z + 50) {
                        segment.position.z -= SEGMENT_LENGTH * SEGMENTS;
                    }
                });

                roadsideSegments.forEach(segment => {
                    if (segment.position.z > bus.position.z + 50) {
                        segment.position.z -= SEGMENT_LENGTH * SEGMENTS;
                    }
                });

                terrainSegments.forEach(segment => {
                    if (segment.position.z > bus.position.z + 50) {
                        segment.position.z -= SEGMENT_LENGTH * SEGMENTS;
                    }
                });

                farTerrainSegments.forEach(segment => {
                    if (segment.position.z > bus.position.z + 50) {
                        segment.position.z -= SEGMENT_LENGTH * SEGMENTS;
                    }
                });

                // The cemetery is the pickup landmark for the current route.
                // It must never recycle while a passenger is onboard: doing so
                // used to replace the Abandoned House target with a new Cemetery
                // stop halfway through the long delivery.
                // New cemetery/pickup positions are created only after a delivery
                // has been completed, inside the destination interaction below.

                // Pickup interaction
                const pickupDistance = Math.abs(bus.position.z - pickup.position.z);
                const pickupSide = Math.abs(bus.position.x - pickup.position.x);

                if (!pickupCompleted &&
                    pickupDistance <= PICKUP_STOP_LENGTH / 2 &&
                    pickupSide <= PICKUP_STOP_WIDTH / 2) {
                    
                    if (speed < window.gameConfig.gameplay.requiredStopSpeed) {
                        passengersOnBoard = true;
                        pickupCompleted = true;
                        beginGhostBoarding();
                        updateDestinationDisplay(DESTINATION_NAME);
                        showMessage(`Passengers boarded! Destination: ${DESTINATION_NAME}`);
                    } else {
                        showMessage('Slow down and stop beside the passengers!');
                    }
                }

                // Destination interaction
                    const destinationDistance = Math.abs(bus.position.z - destination.position.z);
                const destinationSide = Math.abs(bus.position.x - destination.position.x);

                if (passengersOnBoard && 
                    !destinationCompleted && 
                    destinationDistance <= DESTINATION_STOP_LENGTH / 2 && 
                    destinationSide <= DESTINATION_STOP_WIDTH / 2) {
                    
                    if (speed < window.gameConfig.gameplay.requiredStopSpeed) {
                        destinationCompleted = true;
                        // Keep the onboard state during the short exit ceremony so
                        // the distance panel remains tied to the house until she
                        // reaches the door.
                        score += window.gameConfig.environment.pointsPerDelivery;
                        updateScoreDisplay();
                        showMessage(`Passenger delivered! +${window.gameConfig.environment.pointsPerDelivery}`);

                        // The completed house remains in the world, while only
                        // this route's green stopping target is removed. The bus
                        // pauses for a short departure ceremony before spawning
                        // the next route far ahead.
                        destinationMarker.visible = false;
                        destinationBorder.visible = false;
                        beginGhostDeparture();
                    } else {
                        showMessage('Brake and stop at the destination!');
                    }
                }
            }

            const cameraTarget = new THREE.Vector3();

            function updateCamera(deltaTime) {
                const desiredX = bus.position.x * 0.92;
                // A lower chase camera exposes the gravel-to-grass transition
                // while keeping the road ahead and the bus silhouette readable.
                const desiredY = bus.position.y + 6.7;
                const desiredZ = bus.position.z + 20.5;
                const cameraBlend = 1 - Math.exp(-5.5 * Math.min(deltaTime, 0.11));

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, desiredX, cameraBlend);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, desiredY, cameraBlend);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredZ, cameraBlend);

                cameraTarget.set(
                    bus.position.x + bus.userData.steeringVelocity * 3,
                    bus.position.y - 0.15,
                    bus.position.z - 13
                );
                camera.lookAt(cameraTarget);
            }
