            function setupEditMode() {
                // Disable controls in edit mode
                document.getElementById('controls').style.display = 'none';
                document.getElementById('instruction').textContent = 
                    'Edit Mode: Adjust settings in the panel';

                // Allow clicking on markers to select them
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();

                function onPointerDown(event) {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);

                    const objects = [marker, destinationMarker];
                    const intersects = raycaster.intersectObjects(objects);

                    if (intersects.length > 0) {
                        selectedObject = intersects[0].object;
                    } else {
                        selectedObject = null;
                    }
                }

                function onPointerMove(event) {
                    if (!selectedObject) return;

                    const rect = canvas.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);

                    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                    const intersection = new THREE.Vector3();
                    raycaster.ray.intersectPlane(plane, intersection);

                    if (selectedObject === marker) {
                        pickup.position.x = THREE.MathUtils.clamp(intersection.x, -6.2, 10.2);
                        pickup.position.z = THREE.MathUtils.clamp(intersection.z, bus.position.z - 100, bus.position.z - 20);
                        window.gameConfig.locations.pickupX = pickup.position.x;
                        window.gameConfig.locations.pickupZ = pickup.position.z;
                    } else if (selectedObject === destinationMarker) {
                        destination.position.x = THREE.MathUtils.clamp(intersection.x, -6.2, 6.2);
                        destination.position.z = THREE.MathUtils.clamp(intersection.z, bus.position.z - 150, bus.position.z - 50);
                        window.gameConfig.locations.destinationX = destination.position.x;
                        window.gameConfig.locations.destinationZ = destination.position.z;
                    }
                }

                canvas.addEventListener('pointerdown', onPointerDown);
                canvas.addEventListener('pointermove', onPointerMove);
            }

            // ============================================================
            // MODE SETUP
            // ============================================================

            if (mode === 'edit') {
                setupEditMode();
                showMessage('Edit Mode: Adjust game parameters');
            } else {
                // Play mode
                showMessage('Drive toward the cemetery pickup point');
            }

            // ============================================================
            // GAME LOOP
            // ============================================================

            const clock = new THREE.Clock();
            let lastTime = 0;

            function gameLoop(timestamp) {
                const deltaTime = clock.getDelta();

                // Update message timer
                if (messageTimer > 0) {
                    messageTimer -= deltaTime;
                    if (messageTimer <= 0) {
                        document.getElementById('message').style.opacity = '0';
                    }
                }

                if (mode === 'play') {
                    // Play mode: full game logic
                    updateDriving(deltaTime);
                    updateCamera(deltaTime);

                    // Animate the waiting kuntilanak and its pickup marker.
                    updateWaitingGhost(deltaTime);
                    if (!pickupCompleted) {
                        // The stop bay is intentionally rectangular rather than
                        // spinning like the former circular marker.
                        pickupStopBorder.rotation.y = 0;
                    }

                    destinationMarker.rotation.y = 0;
                } else {
                    // Edit mode: static view, no gameplay
                    updateCamera(deltaTime);
                    
                    // Keep the waiting kuntilanak and markers alive in the editor
                    // without running any driving or pickup gameplay.
                    updateWaitingGhost(deltaTime);
                    pickupStopBorder.rotation.y = 0;
                    destinationMarker.rotation.y = 0;
                }

                updateDistanceDisplay();
                renderer.render(scene, camera);
                requestAnimationFrame(gameLoop);
            }

            // ============================================================
            // START
            // ============================================================

            camera.position.set(0, 10, 18);
            camera.lookAt(0, 0, -12);

            gameLoop(0);

            // Let the first rendered frame sit behind the overlay, then reveal it
            // after a consistent one-second loading beat rather than flashing blank.
            const remainingLoadingTime = Math.max(
                0,
                1000 - (performance.now() - loadingStartedAt)
            );
            window.setTimeout(() => {
                if (!loadingScreen) return;
                loadingScreen.classList.add('is-hidden');
                window.setTimeout(() => loadingScreen.remove(), 200);
            }, remainingLoadingTime);
        }
    </script>
</body>
