<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ghost Line Express</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%; overflow: hidden; touch-action: none;
        font-family: 'Trebuchet MS', Arial, sans-serif; background: #070711;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }

    #loading-screen {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        color: #dffbff; text-align: center;
        background: radial-gradient(circle at 50% 28%, #1d3a52 0, #0b1020 55%, #070711 100%);
        transition: opacity 200ms ease-out, visibility 0s linear 200ms;
    }
    #loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-kicker { color: #ffb05d; font-size: 14px; font-weight: 800; letter-spacing: 5px; margin-bottom: 14px; }
    .loading-title { font-size: 52px; font-weight: 900; letter-spacing: 3px; line-height: 1; color: #aef3ff;
        text-shadow: 0 0 18px rgba(72, 239, 255, .7), 0 4px 0 #11132a; }
    .loading-bar { width: 260px; height: 4px; margin: 32px auto 14px; border-radius: 4px; overflow: hidden; background: rgba(182, 241, 255, .18); }
    .loading-bar::before { content: ''; display: block; width: 40%; height: 100%; background: #7fe9ff;
        animation: load-slide 1s ease-in-out infinite alternate; }
    .loading-copy { font-size: 13px; letter-spacing: 2px; color: #8fb4c4; }
    @keyframes load-slide { from { transform: translateX(-10%); } to { transform: translateX(150%); } }

    #ui { position: absolute; inset: 0; pointer-events: none; color: #e6fbff; }
    .panel {
        position: absolute; padding: 10px 16px; border-radius: 14px;
        background: rgba(8, 14, 26, .6); border: 1px solid rgba(127, 233, 255, .3);
        backdrop-filter: blur(3px);
    }
    .panel small { display: block; font-size: 12px; letter-spacing: 2px; color: #7fb6c8; }
    .panel b { font-size: 26px; letter-spacing: 1px; }
    #distance { top: 24px; left: 20px; }
    #score { top: 24px; right: 20px; text-align: right; }
    #destination { top: 24px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 230px; }
    #destination b { font-size: 20px; color: #ffb05d; }
    #message {
        position: absolute; left: 50%; top: 22%; transform: translateX(-50%); width: 86%; text-align: center;
        font-size: 28px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px #000, 0 0 16px rgba(127, 233, 255, .6);
        opacity: 0; transition: opacity 250ms;
    }
    #controls {
        position: absolute; left: 0; right: 0; bottom: 40px; padding: 0 24px;
        display: flex; justify-content: space-between;
    }
    .control-group { display: flex; gap: 16px; }
    button {
        pointer-events: auto; width: 116px; height: 116px; border-radius: 30px;
        border: 2px solid rgba(160, 240, 255, .5); background: rgba(10, 20, 34, .55); color: #cff;
        font: 800 24px 'Trebuchet MS', Arial, sans-serif; letter-spacing: 1px;
        touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
    }
    button.on { background: rgba(60, 160, 190, .55); border-color: #aef3ff; }
    #brake.on { background: rgba(190, 60, 60, .55); border-color: #ff9a9a; }
    @media (prefers-reduced-motion: reduce) { #message, #loading-screen { transition: none; } }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="loading-screen" role="status" aria-live="polite">
    <div>
        <div class="loading-kicker">NIGHT ROUTE 13</div>
        <div class="loading-title">GHOST LINE<br>EXPRESS</div>
        <div class="loading-bar"></div>
        <div class="loading-copy">MEMUAT RUTE MALAM...</div>
    </div>
</div>

<div id="ui">
    <div id="distance" class="panel"><small id="distance-label">TO CEMETERY</small><b id="distance-value">0 m</b></div>
    <div id="destination" class="panel"><small>DESTINATION</small><b id="destination-value">Cemetery</b></div>
    <div id="score" class="panel"><small>SCORE</small><b id="score-value">0</b></div>
    <div id="message"></div>
    <div id="controls">
        <div class="control-group"><button id="left">◀</button><button id="right">▶</button></div>
        <div class="control-group"><button id="brake">BRAKE</button><button id="accelerate">GAS</button></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/**
 * GHOST LINE EXPRESS
 *
 * Drive a haunted night bus down an endless foggy road. Stop inside the glowing bay
 * beside the cemetery to pick up the kuntilanak, then carry her to the abandoned
 * house and stop in its bay to deliver her. Each delivery scores points, then a new
 * route starts further down the road.
 *
 * Controls: arrows / WASD or on-screen buttons (steer, gas, brake).
 * Everything is built from a handful of shared geometries and canvas textures so the
 * scene stays light on mobile: the road recycles 8 segments, props are re-randomised
 * on recycle, and the kuntilanak is a few shader-animated meshes with a painted face.
 */
async function run(mode) {
    const $ = (id) => document.getElementById(id);
    const canvas = $('game-canvas');
    const loadingScreen = $('loading-screen');
    const loadStart = performance.now();

    // ------------------------------------------------------------------
    // CONFIG
    // ------------------------------------------------------------------
    const DEFAULTS = {
        visual: { busColor: '#1f3d52', headlightColor: '#cdeeff', fogColor: '#22304a', ghostAuraColor: '#7fe9ff' },
        gameplay: { maxSpeed: 0.55, accelerationRate: 0.018, brakingPower: 0.04, requiredStopSpeed: 0.08 },
        environment: { fogDensity: 100, passengerSpawnDistance: 260, routeLength: 500, pointsPerDelivery: 100 },
        locations: { destinationName: 'Abandoned House' }
    };
    function fillDefaults(target, defs) {
        for (const k in defs) {
            if (defs[k] && typeof defs[k] === 'object') {
                if (!target[k] || typeof target[k] !== 'object') target[k] = {};
                fillDefaults(target[k], defs[k]);
            } else if (target[k] === undefined) target[k] = defs[k];
        }
        return target;
    }
    window.gameConfig = fillDefaults(window.gameConfig || {}, DEFAULTS);
    const cfg = window.gameConfig;

    // World layout constants
    const ROAD_W = 14, GRAVEL = 4, SEG_LEN = 40, SEGS = 8;
    const PICKUP_X = 6, PICKUP_W = 3.6, PICKUP_L = 5;
    const DEST_X = -5, DEST_W = 4, DEST_L = 6;
    const HOUSE_DX = -10, CEM_DX = 13;
    const DEST_NAME = cfg.locations.destinationName || 'Abandoned House';

    // Runtime state
    let speed = 0, score = 0, prevSpeed = 0;
    let onboard = false, pickupDone = false, destDone = false, delivering = false;
    let messageTimer = 0, time = 0, pendingDestZ = null;
    const keys = {};

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = THREE.MathUtils.clamp;
    const lerp = THREE.MathUtils.lerp;

    function canvasTex(w, h, draw, repeat) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        draw(c.getContext('2d'), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
        return t;
    }
    const glowTex = canvasTex(64, 64, (g) => {
        const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    });

    // ------------------------------------------------------------------
    // RENDERER, SCENE, SKY
    // ------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;

    const scene = new THREE.Scene();
    const fogColor = new THREE.Color(cfg.visual.fogColor);
    scene.fog = new THREE.Fog(fogColor, 10, cfg.environment.fogDensity * 1.9);
    // Sky dome: fog colour at the horizon fading to deep night, so the ground never ends in a hard line
    const skyGeo = new THREE.SphereGeometry(450, 24, 16);
    skyGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
    const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
    sky.renderOrder = -10; sky.frustumCulled = false;
    scene.add(sky);
    function paintSky() {
        const top = new THREE.Color(0x04070f), mid = new THREE.Color(0x0c1526), c = new THREE.Color();
        const pos = skyGeo.attributes.position, col = skyGeo.attributes.color;
        for (let i = 0; i < pos.count; i++) {
            const t = clamp(pos.getY(i) / 450, 0, 1);
            if (t < 0.35) c.copy(fogColor).lerp(mid, Math.pow(t / 0.35, 0.7)); else c.copy(mid).lerp(top, (t - 0.35) / 0.65);
            col.setXYZ(i, c.r, c.g, c.b);
        }
        col.needsUpdate = true;
    }
    paintSky();

    const camera = new THREE.PerspectiveCamera(56, 9 / 16, 0.1, 500);
    function resize() {
        const w = canvas.clientWidth || 720, h = canvas.clientHeight || 1280;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    scene.add(new THREE.HemisphereLight(0x8aa2d4, 0x252c3a, 1.7));
    const moonLight = new THREE.DirectionalLight(0x9db8ff, 0.9);
    moonLight.position.set(-30, 60, 20);
    scene.add(moonLight);

    // Stars + moon follow the camera so they never get closer
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(220 * 3);
    for (let i = 0; i < 220; i++) {
        const a = rand(0, Math.PI * 2), e = rand(0.12, 1.4);
        starPos[i * 3] = Math.cos(a) * Math.cos(e) * 420;
        starPos[i * 3 + 1] = Math.sin(e) * 420;
        starPos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * 420;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 2, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 }));
    stars.frustumCulled = false;
    scene.add(stars);
    const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x9fc4ff, fog: false, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
    moonGlow.scale.setScalar(120);
    const moonDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xf2f6ff, fog: false, transparent: true, depthWrite: false }));
    moonDisc.scale.setScalar(26);
    scene.add(moonGlow, moonDisc);

    // ------------------------------------------------------------------
    // ROAD, GROUND AND ROADSIDE PROPS
    // ------------------------------------------------------------------
    const PX = 16; // texture pixels per world unit
    function drawRoad(variant) {
        return canvasTex((ROAD_W + GRAVEL * 2) * PX, SEG_LEN * PX, (g, w, h) => {
            const rx0 = GRAVEL * PX, rx1 = w - GRAVEL * PX;
            g.fillStyle = '#3a3935'; g.fillRect(0, 0, w, h);          // gravel shoulders
            g.fillStyle = '#26272c'; g.fillRect(rx0, 0, rx1 - rx0, h); // asphalt
            for (let i = 0; i < 7000; i++) {                           // grain
                const onRoad = Math.random() < 0.7;
                const x = onRoad ? rand(rx0, rx1) : (Math.random() < 0.5 ? rand(0, rx0) : rand(rx1, w));
                g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.18)';
                g.fillRect(x, rand(0, h), rand(1, 3), rand(1, 3));
            }
            for (let i = 0; i < 2 + variant; i++) {                    // repair patches
                g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.2)' : 'rgba(255,255,255,.05)';
                g.fillRect(rand(rx0, rx1 - 80), rand(0, h - 120), rand(40, 90), rand(60, 140));
            }
            g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.2;       // cracks
            for (let i = 0; i < 4; i++) {
                let x = rand(rx0, rx1), y = rand(0, h);
                g.beginPath(); g.moveTo(x, y);
                for (let k = 0; k < 7; k++) { x += rand(-14, 14); y += rand(8, 26); g.lineTo(x, y); }
                g.stroke();
            }
            g.fillStyle = 'rgba(150,150,140,.7)';                       // worn edge lines
            g.fillRect(rx0 + 10, 0, 3, h); g.fillRect(rx1 - 13, 0, 3, h);
            for (let i = 0; i < 14; i++) {
                g.fillStyle = '#26272c';
                g.fillRect(rx0 + 8, rand(0, h), 8, rand(6, 30)); g.fillRect(rx1 - 15, rand(0, h), 8, rand(6, 30));
            }
            for (let k = 0; k < 5; k++) {                                // centre dashes (period divides the tile)
                g.fillStyle = 'rgba(205,200,160,.8)';
                g.fillRect(w / 2 - 3, k * 128 + 20, 6, 72);
                g.fillStyle = 'rgba(38,39,44,.7)';
                g.fillRect(w / 2 - 3, k * 128 + 20 + rand(0, 60), 6, rand(4, 14));
            }
        });
    }
    const roadMats = [0, 1].map((v) => new THREE.MeshStandardMaterial({ map: drawRoad(v), roughness: 0.85, metalness: 0.05 }));
    const roadGeo = new THREE.PlaneGeometry(ROAD_W + GRAVEL * 2, SEG_LEN);
    roadGeo.rotateX(-Math.PI / 2);

    const groundTex = canvasTex(128, 128, (g, w, h) => {
        g.fillStyle = '#16231d'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 900; i++) {
            g.fillStyle = Math.random() < 0.5 ? 'rgba(60,90,60,.35)' : 'rgba(0,0,0,.35)';
            g.fillRect(rand(0, w), rand(0, h), rand(1, 2), rand(2, 6));
        }
    }, 80);
    const GROUND_TILE = 500 / 80;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
    ground.position.y = -0.03;
    scene.add(ground);

    // Shared prop geometry / materials
    const trunkGeo = new THREE.CylinderGeometry(0.22, 0.4, 5, 6).translate(0, 2.5, 0);
    const crownGeo = new THREE.ConeGeometry(2.1, 7, 7).translate(0, 8, 0);
    const branchGeo = new THREE.CylinderGeometry(0.05, 0.14, 2.6, 5).translate(0, 1.3, 0);
    const poleGeo = new THREE.CylinderGeometry(0.08, 0.12, 6, 6).translate(0, 3, 0);
    const lampHeadGeo = new THREE.SphereGeometry(0.28, 8, 6);
    const pumpkinGeo = new THREE.SphereGeometry(0.6, 10, 8).scale(1, 0.8, 1);
    const stoneGeo = new THREE.BoxGeometry(0.7, 1, 0.22).translate(0, 0.5, 0);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2a1f19, roughness: 1, flatShading: true });
    const crownMat = new THREE.MeshStandardMaterial({ color: 0x14302a, roughness: 1, flatShading: true });
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x1b1d24, roughness: 0.8, metalness: 0.4 });
    const lampHeadMat = new THREE.MeshBasicMaterial({ color: 0xffe0a8 });
    const pumpkinMat = new THREE.MeshStandardMaterial({ color: 0xc4560e, emissive: 0x5a1c00, roughness: 0.8 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5c6168, roughness: 1, flatShading: true });
    const glowAmber = new THREE.SpriteMaterial({ map: glowTex, color: 0xffa83c, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
    const puddleMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0x4a6a8c, transparent: true, opacity: 0.4, depthWrite: false });
    const puddleGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

    function makeTree() {
        const t = new THREE.Group();
        t.add(new THREE.Mesh(trunkGeo, trunkMat));
        const crown = new THREE.Mesh(crownGeo, crownMat);
        const b1 = new THREE.Mesh(branchGeo, trunkMat), b2 = new THREE.Mesh(branchGeo, trunkMat);
        b1.position.y = 3.2; b1.rotation.z = 0.9;
        b2.position.y = 4.2; b2.rotation.z = -0.8; b2.rotation.x = 0.5;
        t.add(crown, b1, b2);
        t.userData = { crown, branches: [b1, b2] };
        return t;
    }
    function makeSegment(i) {
        const seg = new THREE.Group();
        seg.position.z = SEG_LEN - i * SEG_LEN;
        seg.add(new THREE.Mesh(roadGeo, roadMats[i % 2]));
        seg.children[0].position.y = 0.02;
        const p = seg.userData = { trees: [], lamp: null, pumpkin: null, stones: [], puddle: null };
        for (let k = 0; k < 2; k++) { const t = makeTree(); seg.add(t); p.trees.push(t); }
        const lamp = new THREE.Group();
        lamp.add(new THREE.Mesh(poleGeo, poleMat));
        const head = new THREE.Mesh(lampHeadGeo, lampHeadMat); head.position.set(0, 6, 0); lamp.add(head);
        const glow = new THREE.Sprite(glowAmber.clone()); glow.scale.setScalar(5); glow.position.y = 6; lamp.add(glow);
        lamp.userData.glow = glow;
        seg.add(lamp); p.lamp = lamp;
        const pump = new THREE.Group();
        pump.add(new THREE.Mesh(pumpkinGeo, pumpkinMat));
        const pg = new THREE.Sprite(glowAmber); pg.scale.setScalar(2.4); pg.position.y = 0.4; pump.add(pg);
        seg.add(pump); p.pumpkin = pump;
        for (let k = 0; k < 2; k++) { const s = new THREE.Mesh(stoneGeo, stoneMat); seg.add(s); p.stones.push(s); }
        const pd = new THREE.Mesh(puddleGeo, puddleMat); pd.position.y = 0.05; seg.add(pd); p.puddle = pd;
        return seg;
    }

    // World-space clearance so cemetery and house stay free of generic props
    function blocked(x, z) {
        if (x > 9.5 && Math.abs(z - cemetery.position.z) < 16) return true;
        if (x < -9 && Math.abs(z - destination.position.z) < 13) return true;
        return false;
    }
    function place(obj, x, z, show) {
        obj.userData.want = show; obj.userData.lx = x; obj.userData.lz = z;
        obj.position.x = x; obj.position.z = z;
    }
    function applyClearance(seg) {
        const p = seg.userData;
        const all = [...p.trees, p.lamp, p.pumpkin, ...p.stones];
        all.forEach((o) => { o.visible = o.userData.want && !blocked(o.userData.lx, seg.position.z + o.userData.lz); });
    }
    function randomizeSegment(seg) {
        const p = seg.userData;
        p.trees.forEach((t, k) => {
            const side = k === 0 ? -1 : 1, dead = Math.random() < 0.4, s = rand(0.8, 1.5);
            place(t, side * rand(11.5, 20), rand(-18, 18), Math.random() < 0.85);
            t.scale.setScalar(s); t.rotation.y = rand(0, 6);
            t.userData.crown.visible = !dead; t.userData.branches.forEach((b) => { b.visible = dead; });
        });
        const side = Math.random() < 0.5 ? -1 : 1;
        place(p.lamp, side * (ROAD_W / 2 + GRAVEL + 0.6), rand(-15, 15), Math.random() < 0.55);
        p.lamp.userData.flicker = Math.random() < 0.3 ? rand(4, 9) : 0;
        p.lamp.userData.phase = rand(0, 6);
        place(p.pumpkin, (Math.random() < 0.5 ? -1 : 1) * rand(9.5, 14), rand(-18, 18), Math.random() < 0.6);
        p.pumpkin.scale.setScalar(rand(0.7, 1.1));
        p.stones.forEach((s) => {
            place(s, (Math.random() < 0.5 ? -1 : 1) * rand(9.3, 13), rand(-18, 18), Math.random() < 0.7);
            s.rotation.set(rand(-0.15, 0.15), rand(-0.6, 0.6), rand(-0.2, 0.2));
        });
        p.puddle.visible = Math.random() < 0.4;
        p.puddle.position.x = rand(-4.5, 4.5); p.puddle.position.z = rand(-16, 16);
        p.puddle.scale.set(rand(2.5, 5), 1, rand(5, 9));
        applyClearance(seg);
    }

    const segments = [];
    for (let i = 0; i < SEGS; i++) { const s = makeSegment(i); scene.add(s); segments.push(s); }

    // ------------------------------------------------------------------
    // MARKERS: stop bays with a tall beacon
    // ------------------------------------------------------------------
    function makeBay(w, l, color, hex) {
        const g = new THREE.Group();
        const tex = canvasTex(128, 192, (c, tw, th) => {
            c.fillStyle = color + '33'; c.fillRect(0, 0, tw, th);
            c.strokeStyle = color; c.lineWidth = 8; c.strokeRect(6, 6, tw - 12, th - 12);
            c.lineWidth = 6; c.lineCap = 'round';
            for (let y = 50; y < th - 30; y += 44) { c.beginPath(); c.moveTo(34, y + 20); c.lineTo(64, y); c.lineTo(94, y + 20); c.stroke(); }
        });
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
        const bay = new THREE.Mesh(new THREE.PlaneGeometry(w, l).rotateX(-Math.PI / 2), mat);
        bay.position.y = 0.06;
        const bGeo = new THREE.CylinderGeometry(0.18, 0.18, 14, 10, 1, true).translate(0, 7, 0);
        const cols = []; const base = new THREE.Color(hex);
        const pos = bGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) { const f = (1 - pos.getY(i) / 14) * 0.45; cols.push(base.r * f, base.g * f, base.b * f); }
        bGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        const beacon = new THREE.Mesh(bGeo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide }));
        g.add(bay, beacon);
        g.userData = { mat, beacon };
        return g;
    }

    // ------------------------------------------------------------------
    // CEMETERY
    // ------------------------------------------------------------------
    function makeDeadTree(scale) {
        const t = new THREE.Group();
        t.add(new THREE.Mesh(trunkGeo, trunkMat));
        [[3.4, 1.0, 0.2], [4.2, -0.9, -0.3], [4.8, 0.6, 1.2], [2.6, -0.7, 2.2]].forEach(([y, rz, ry]) => {
            const b = new THREE.Mesh(branchGeo, trunkMat);
            b.position.y = y; b.rotation.set(0, ry, rz); t.add(b);
        });
        t.scale.setScalar(scale);
        return t;
    }
    const cemetery = new THREE.Group();
    scene.add(cemetery);
    {
        const patch = new THREE.Mesh(new THREE.PlaneGeometry(17, 22).rotateX(-Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x1a1d1a, roughness: 1 }));

                uTime: { value: 0 }, uColor: { value: new THREE.Color(color) }, uRim: { value: new THREE.Color(cfg.visual.ghostAuraColor) },
                uOpacity: { value: 1 }, uAmp: { value: amp }, uH: { value: h }, uFlip: { value: flip ? 1 : 0 }, uFade: { value: fade ? 1 : 0 }
            }]),
            transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: true,
            vertexShader: `
                uniform float uTime, uAmp, uH, uFlip;
                varying vec3 vN; varying vec3 vV; varying float vT;
                #include <fog_pars_vertex>
                void main() {
                    vec3 p = position;
                    float t = uFlip > 0.5 ? clamp(-p.y / uH, 0.0, 1.0) : clamp(1.0 - p.y / uH, 0.0, 1.0);
                    float w = t * t;
                    float a = atan(p.z, p.x);
                    p.x += sin(uTime * 1.7 + p.y * 2.3 + a * 2.0) * uAmp * w;
                    p.z += cos(uTime * 1.3 + p.y * 2.0 + a * 3.0) * uAmp * w;
                    p.xz *= 1.0 + 0.07 * sin(a * 9.0 + uTime * 1.2) * w * (1.0 - uFlip);
                    vT = t;
                    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
                    vN = normalize(normalMatrix * normal);
                    vV = normalize(-mvPosition.xyz);
                    gl_Position = projectionMatrix * mvPosition;
                    #include <fog_vertex>

                uniform vec3 uColor, uRim; uniform float uOpacity, uFade;
                varying vec3 vN; varying vec3 vV; varying float vT;
                #include <fog_pars_fragment>
                void main() {
                    float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
                    vec3 c = uColor + uRim * f * 0.8;
                    float a = mix(1.0, 1.0 - vT * 0.8, uFade) + f * 0.25;
                    gl_FragColor = vec4(c, clamp(a, 0.0, 1.0) * uOpacity);
                    #include <colorspace_fragment>
                    #include <fog_fragment>
                }`
        });
        ghostMats.push(m);
        return m;

        };
        blob(cx - 58, cy - 12, 40, 28, 0.95); blob(cx + 58, cy - 12, 40, 28, 0.95); // hollow sockets
        blob(cx - 52, cy + 52, 26, 22, 0.28); blob(cx + 52, cy + 52, 26, 22, 0.28); // cheek hollows
        [-1, 1].forEach((s) => {
            g.fillStyle = '#f2f4e8'; g.beginPath(); g.ellipse(cx + s * 58, cy - 12, 16, 9, 0, 0, 7); g.fill();
            g.fillStyle = '#b01818'; g.beginPath(); g.arc(cx + s * 58, cy - 12, 5.5, 0, 7); g.fill();
            g.fillStyle = '#000'; g.beginPath(); g.arc(cx + s * 58, cy - 12, 2.5, 0, 7); g.fill();
            g.strokeStyle = 'rgba(10,8,16,.8)'; g.lineWidth = 4;
            g.beginPath(); g.moveTo(cx + s * 30, cy - 44); g.lineTo(cx + s * 88, cy - 54 + s * 0); g.stroke();
        });
        g.strokeStyle = 'rgba(40,40,50,.45)'; g.lineWidth = 3;                      // nose
        g.beginPath(); g.moveTo(cx, cy - 6); g.lineTo(cx - 6, cy + 34); g.lineTo(cx + 8, cy + 36); g.stroke();
        g.fillStyle = '#12060a'; g.beginPath();                                       // grin
        g.moveTo(cx - 52, cy + 70); g.quadraticCurveTo(cx, cy + 118, cx + 52, cy + 70);
        g.quadraticCurveTo(cx, cy + 86, cx - 52, cy + 70); g.fill();
        g.strokeStyle = '#d8d4c0'; g.lineWidth = 3;
        for (let i = -4; i <= 4; i++) { g.beginPath(); g.moveTo(cx + i * 11, cy + 82 - Math.abs(i) * 1.2); g.lineTo(cx + i * 11, cy + 90 - Math.abs(i) * 2); g.stroke(); }
        g.strokeStyle = 'rgba(40,60,90,.35)'; g.lineWidth = 1.5;                      // veins
        for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(cx + rand(-90, 90), cy - 60); g.lineTo(cx + rand(-100, 100), cy + rand(-30, 20)); g.stroke(); }
    });

    const ghost = new THREE.Group();
    scene.add(ghost);
    const body = new THREE.Group();
    ghost.add(body);
    let head, armL, armR, ghostAura, ghostMist;
    {
        const pts = [];
        for (let i = 0; i <= 32; i++) {
            const t = i / 32, y = t * 3.1;
            const r = 0.28 + 0.95 * Math.pow(1 - t, 1.8) + 0.14 * Math.exp(-Math.pow((t - 0.9) / 0.07, 2));
            pts.push(new THREE.Vector2(r, y));
        }
        const dress = new THREE.Mesh(new THREE.LatheGeometry(pts, 36), dressMat);
        dress.renderOrder = 1; body.add(dress);

        body.add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.6, 8), skinMat).translateY(3.2));
        head = new THREE.Group(); head.position.y = 3.58; body.add(head);
        faceTex.colorSpace = THREE.SRGBColorSpace;
        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.46, 28, 20).scale(1, 1.14, 1),
            new THREE.MeshStandardMaterial({ map: faceTex, emissiveMap: faceTex, emissive: 0x8899aa, emissiveIntensity: 0.45, roughness: 0.9, transparent: true }));
        skull.material.userData.ghostSkin = true;
        head.add(skull);
        ghost.userData.skull = skull;

        const curtain = new THREE.Mesh(
            new THREE.CylinderGeometry(0.55, 0.64, 3.4, 26, 10, true, 0.95, Math.PI * 2 - 1.9).translate(0, -1.7, 0), hairMat);
        curtain.position.y = 0.38; curtain.renderOrder = 2; head.add(curtain);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 10, 0, Math.PI * 2, 0, 1.15).scale(1, 1.14, 1), hairMat);
        cap.renderOrder = 2; head.add(cap);
        [-1, 1].forEach((s) => {
            const lock = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 2.0, 2, 8).translate(0, -1.0, 0), hairMat);
            lock.position.set(s * 0.43, 0.3, 0.2); lock.rotation.set(0, s * -0.55, s * 0.06); lock.renderOrder = 3; head.add(lock);
        });

        const makeArm = (s) => {
            const a = new THREE.Group(); a.position.set(s * 0.52, 2.85, 0); a.rotation.z = s * -0.3;
            const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.34, 1.5, 12, 6, true).translate(0, -0.75, 0), sleeveMat);
            sleeve.renderOrder = 1; a.add(sleeve);
            const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 1.0, 6).translate(0, -1.95, 0), skinMat); a.add(fore);
            for (let k = -1; k <= 1; k++) {
                const f = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.38, 4).translate(0, -0.19, 0), skinMat);
                f.position.set(k * 0.04, -2.45, 0); f.rotation.z = k * 0.2; a.add(f);
            }
            body.add(a); return a;
        };
        armL = makeArm(-1); armR = makeArm(1);

        ghostAura = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: cfg.visual.ghostAuraColor, transparent: true, opacity: 0.32, depthWrite: false, blending: THREE.AdditiveBlending }));
        ghostAura.scale.set(5.5, 7.5, 1); ghostAura.position.y = 2.0; ghost.add(ghostAura);
        ghostMist = new THREE.Mesh(new THREE.PlaneGeometry(5, 5).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ map: glowTex, color: cfg.visual.ghostAuraColor, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending }));
        ghostMist.position.y = 0.07; ghost.add(ghostMist);
    }
    const skullMat = ghost.userData.skull.material;
    const ghostState = { mode: 'waiting', t: 0, from: new THREE.Vector3(), to: new THREE.Vector3(), tilt: 0, tiltTimer: rand(2, 4), tiltDir: 1, opacity: 1 };

    function setGhostOpacity(v) {
        ghostState.opacity = v;
        ghostMats.forEach((m) => { m.uniforms.uOpacity.value = v; });
        skinMat.opacity = v; skullMat.opacity = v;
        ghostAura.material.opacity = 0.32 * v; ghostMist.material.opacity = 0.4 * v;
    }
    function resetGhost() {
        ghostState.mode = 'waiting'; ghostState.t = 0;
        ghost.visible = true; ghost.scale.setScalar(1);
        ghost.position.set(pickup.position.x + 3.3, 0.12, pickup.position.z);
        ghost.rotation.set(0, -0.6, 0);
        setGhostOpacity(1);
    }
    function ease(t) { return t * t * (3 - 2 * t); }

    function updateGhost(dt) {
        ghostMats.forEach((m) => { m.uniforms.uTime.value = time; });
        const st = ghostState;
        ghost.visible = Math.abs(ghost.position.z - bus.position.z) < 230 && st.mode !== 'hidden';
        if (!ghost.visible) return;

        // Sudden head tilt every few seconds
        st.tiltTimer -= dt;
        if (st.tiltTimer <= 0) { st.tiltTimer = rand(2.5, 5.5); st.tilt = 1; st.tiltDir = Math.random() < 0.5 ? -1 : 1; }
        st.tilt = Math.max(0, st.tilt - dt * 1.3);
        const tilt = st.tilt > 0.55 ? 1 : st.tilt / 0.55;
        head.rotation.z = lerp(head.rotation.z, st.tiltDir * 0.6 * tilt, 0.25);

        if (st.mode === 'waiting') {
            const d = Math.hypot(bus.position.x - ghost.position.x, bus.position.z - ghost.position.z);
            const near = clamp(1 - d / 35, 0, 1);
            ghost.position.y = 0.12 + Math.sin(time * 1.6) * 0.12 + near * 0.15;
            ghost.rotation.z = Math.sin(time * 0.9) * 0.03;
            const yaw = Math.atan2(bus.position.x - ghost.position.x, bus.position.z - ghost.position.z) - ghost.rotation.y;
            head.rotation.y = lerp(head.rotation.y, clamp(Math.atan2(Math.sin(yaw), Math.cos(yaw)), -0.9, 0.9) * near, 0.08);
            armL.rotation.z = lerp(armL.rotation.z, -0.3 - near * 0.5, 0.1);
            armR.rotation.z = lerp(armR.rotation.z, 0.3 + near * 0.5, 0.1);
        } else if (st.mode === 'boarding') {
            st.t += dt / 1.1;
            const u = ease(Math.min(st.t, 1));
            st.to.set(bus.position.x + 1.9, 1.5, bus.position.z - 1);
            ghost.position.lerpVectors(st.from, st.to, u);
            ghost.position.y += Math.sin(u * Math.PI) * 1.2;
            ghost.scale.setScalar(lerp(1, 0.3, u));
            ghost.rotation.y += dt * 4 * u;
            setGhostOpacity(clamp(1.6 - u * 1.6, 0, 1));
            if (st.t >= 1) {
                st.mode = 'hidden'; ghost.visible = false;
                windowMat.map = winBoarded; rearMat.map = rearBoarded;
                busFlicker = 1.4;
            }
        } else if (st.mode === 'departing') {
            st.t += dt / DEPART_TIME;
            const u = Math.min(st.t, 1);
            ghost.position.lerpVectors(st.from, st.to, ease(u));
            ghost.position.y = 0.2 + Math.sin(time * 2) * 0.1;
            ghost.rotation.y = lerp(ghost.rotation.y, -Math.PI / 2, 0.08);
            ghost.rotation.z = Math.sin(time * 2.2) * 0.05;
            head.rotation.y = lerp(head.rotation.y, 0, 0.1);
            setGhostOpacity(u < 0.2 ? u / 0.2 : (u > 0.78 ? clamp((1 - u) / 0.22, 0, 1) : 1));
            houseGlow = Math.max(houseGlow, u > 0.7 ? (u - 0.7) / 0.3 : 0);
            if (st.t >= 1) finishDelivery();
        }
    }

    // ------------------------------------------------------------------
    // ROUTES
    // ------------------------------------------------------------------
    const DEPART_TIME = 3.6;
    let busFlicker = 0, houseGlow = 0, camFocus = 0;

    function setPickup(z) {
        pickup.position.set(PICKUP_X, 0, z);
        cemetery.position.set(PICKUP_X + CEM_DX, 0, z - 3);
        pickup.visible = true;
        pickupDone = false; destDone = false;
        resetGhost();
        segments.forEach(applyClearance);
    }
    function beginDeparture() {
        delivering = true; destDone = true;
        const st = ghostState;
        st.mode = 'departing'; st.t = 0;
        st.from.set(bus.position.x - 2.4, 0.2, bus.position.z - 1);
        st.to.set(destination.position.x + HOUSE_DX + 4.7, 0.2, destination.position.z);
        ghost.visible = true; ghost.scale.setScalar(1);
        ghost.rotation.set(0, -Math.PI / 2, 0);
        ghost.position.copy(st.from);
        setGhostOpacity(0);
        windowMat.map = winEmpty; rearMat.map = rearEmpty;
        destBay.visible = false;
        showMessage('Kuntilanak turun dan berjalan menuju rumah...');
    }
    function finishDelivery() {
        delivering = false; onboard = false; houseGlow = 1;
        ghostState.mode = 'hidden'; ghost.visible = false;
        // The house stays put until it is behind the camera, then moves to the next route
        const nextPickup = bus.position.z - cfg.environment.passengerSpawnDistance;
        pendingDestZ = nextPickup - cfg.environment.routeLength;
        setPickup(nextPickup);
        setDestinationLabel('Cemetery');
        showMessage('Rute baru: jemput hantu berikutnya di kuburan.');
    }
    function updateDestinationRelocation() {
        if (pendingDestZ !== null && destination.position.z > camera.position.z + 30) {
            destination.position.z = pendingDestZ; pendingDestZ = null;
            destBay.visible = true; houseGlow = 0;
            segments.forEach(applyClearance);
        }
    }

    // ------------------------------------------------------------------
    // INPUT + HUD
    // ------------------------------------------------------------------
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
    function bindButton(id, key) {
        const b = $(id);
        const set = (v) => (e) => { if (e) e.preventDefault(); keys[key] = v; b.classList.toggle('on', v); };
        b.addEventListener('pointerdown', set(true));
        ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, set(false)));
        b.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    bindButton('left', 'arrowleft'); bindButton('right', 'arrowright');
    bindButton('accelerate', 'arrowup'); bindButton('brake', ' ');

    function showMessage(text) {
        const el = $('message'); el.textContent = text; el.style.opacity = '1'; messageTimer = 2.4;
    }
    function setDestinationLabel(t) { $('destination-value').textContent = t; }
    function updateHud() {
        $('score-value').textContent = score;
        const target = onboard ? destination : pickup;
        const d = Math.max(0, Math.round(Math.hypot(bus.position.x - target.position.x, bus.position.z - target.position.z)));
        $('distance-label').textContent = delivering ? 'ARRIVED' : (onboard ? 'TO ' + DEST_NAME.toUpperCase() : 'TO CEMETERY');
        $('distance-value').textContent = delivering ? '0 m' : d + ' m';
    }

    // ------------------------------------------------------------------
    // PARAMETERS PANEL
    // ------------------------------------------------------------------
    function setPath(path, v) {
        const parts = path.split('.'); let o = cfg;
        for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
        o[parts[parts.length - 1]] = v;
    }
    const P = (key, type, extra, apply) => Object.assign({ key, type },
        extra || {}, apply ? { onChange: (v) => { setPath(key, v); apply(v); } } : {});
    lib.showGameParameters({
        name: 'Ghost Line Express',
        params: {
            'Bus Color': P('visual.busColor', 'color', null, (v) => busBodyMat.color.set(v)),
            'Headlight Color': P('visual.headlightColor', 'color', null, (v) => {
                headMat.color.set(v); spots.forEach((s) => s.color.set(v)); pool.material.color.set(v);
            }),
            'Fog Color': P('visual.fogColor', 'color', null, (v) => { fogColor.set(v); scene.fog.color.set(v); paintSky(); }),
            'Ghost Aura Color': P('visual.ghostAuraColor', 'color', null, (v) => {
                ghostMats.forEach((m) => m.uniforms.uRim.value.set(v));
                hairMat.uniforms.uRim.value.multiplyScalar(0.25);
                ghostAura.material.color.set(v); ghostMist.material.color.set(v);
            }),
            'Max Speed': P('gameplay.maxSpeed', 'slider', { min: 0.3, max: 0.8, step: 0.05 }),
            'Acceleration': P('gameplay.accelerationRate', 'slider', { min: 0.01, max: 0.03, step: 0.002 }),
            'Braking Power': P('gameplay.brakingPower', 'slider', { min: 0.02, max: 0.06, step: 0.005 }),
            'Required Stop Speed': P('gameplay.requiredStopSpeed', 'slider', { min: 0.05, max: 0.15, step: 0.01 }),
            'Fog Density': P('environment.fogDensity', 'slider', { min: 50, max: 200, step: 10 }, (v) => { scene.fog.far = v * 1.9; }),
            'Spawn Distance': P('environment.passengerSpawnDistance', 'slider', { min: 200, max: 400, step: 20 }),
            'Route Length': P('environment.routeLength', 'slider', { min: 300, max: 900, step: 50 }),
            'Points Per Delivery': P('environment.pointsPerDelivery', 'slider', { min: 50, max: 200, step: 10 })
        }
    });

    // ------------------------------------------------------------------
    // GAME LOGIC
    // ------------------------------------------------------------------
    function recycle(dt) {
        segments.forEach((s) => {
            if (s.position.z > bus.position.z + 60) { s.position.z -= SEG_LEN * SEGS; randomizeSegment(s); }
        });
        ground.position.z = Math.round(bus.position.z / GROUND_TILE) * GROUND_TILE;
    }

    function updateDriving(dt) {
        const g = cfg.gameplay;
        const f = dt * 60;
        prevSpeed = speed;

        if (delivering) {
            speed = 0; bus.userData.steer = 0;
            bus.rotation.z = lerp(bus.rotation.z, 0, 0.2); bus.rotation.y = lerp(bus.rotation.y, 0, 0.2);
            return;
        }
        let steer = 0;
        if (keys['arrowleft'] || keys['a']) steer -= 1;
        if (keys['arrowright'] || keys['d']) steer += 1;
        if (keys['arrowup'] || keys['w']) speed += g.accelerationRate * f; else speed -= 0.006 * f;
        if (keys[' '] || keys['s'] || keys['arrowdown']) speed -= g.brakingPower * f;
        speed = clamp(speed, 0, g.maxSpeed);

        const steerTarget = steer * (0.16 + speed * 0.22);
        bus.userData.steer = lerp(bus.userData.steer || 0, steerTarget, 1 - Math.exp(-10 * dt));
        bus.position.x = clamp(bus.position.x + bus.userData.steer * f, -6.2, 6.2);
        bus.rotation.z = lerp(bus.rotation.z, -bus.userData.steer * 0.18, 1 - Math.exp(-7 * dt));
        bus.rotation.y = lerp(bus.rotation.y, bus.userData.steer * 0.055, 1 - Math.exp(-7 * dt));
        bus.position.z -= speed * f;
        wheels.forEach((w) => { w.rotation.x -= speed * f * 0.72; });

        // Pickup
        if (!pickupDone && Math.abs(bus.position.z - pickup.position.z) <= PICKUP_L / 2 &&
            Math.abs(bus.position.x - pickup.position.x) <= PICKUP_W / 2) {
            if (speed < g.requiredStopSpeed) {
                pickupDone = true; onboard = true;
                ghostState.mode = 'boarding'; ghostState.t = 0; ghostState.from.copy(ghost.position);
                pickup.visible = false;
                setDestinationLabel(DEST_NAME);
                showMessage('Penumpang naik! Tujuan: ' + DEST_NAME);
            } else showMessage('Pelan-pelan dan berhenti di samping penumpang!');
        }
        // Delivery
        if (onboard && !destDone && pendingDestZ === null &&
            Math.abs(bus.position.z - destination.position.z) <= DEST_L / 2 &&
            Math.abs(bus.position.x - destination.position.x) <= DEST_W / 2) {
            if (speed < g.requiredStopSpeed) {
                destDone = true;
                score += cfg.environment.pointsPerDelivery;
                showMessage('Penumpang tiba! +' + cfg.environment.pointsPerDelivery);
                beginDeparture();
            } else showMessage('Rem dan berhenti di tujuan!');
        }
    }

    function updateBusVisuals(dt) {
        const g = cfg.gameplay;
        const accel = (speed - prevSpeed) / Math.max(dt, 0.001) / 60;     // frame-units per frame
        const pitchTarget = clamp(accel * 1.2, -0.05, 0.03);
        chassis.rotation.x = lerp(chassis.rotation.x, pitchTarget, 1 - Math.exp(-6 * dt));
        const bob = Math.sin(time * 9) * 0.015 * (0.3 + speed / g.maxSpeed) + Math.sin(time * 23) * 0.006 * speed;
        chassis.position.y = bob;
        const braking = keys[' '] || keys['s'] || keys['arrowdown'];
        tailMat.color.setHex(braking && speed > 0.01 ? 0xff2a2a : 0x7a0e0e);
        tailGlow.opacity = braking ? 0.9 : 0.35;
        chassis.userData.beacon.visible = Math.sin(time * 4) > -0.2;

        busFlicker = Math.max(0, busFlicker - dt);
        const flick = busFlicker > 0 ? (Math.sin(time * 40) > 0 ? 1.6 : 0.35) : 1;
        windowMat.color.setScalar(flick); rearMat.color.setScalar(flick);

        // Headlight scale breathes with speed for a bit of life
        spots.forEach((s) => { s.intensity = 160 * (0.95 + Math.sin(time * 30) * 0.02); });
    }

    function updateWorld(dt) {
        // Lamps: some flicker, bays pulse, house windows glow
        segments.forEach((s) => {
            const l = s.userData.lamp;
            if (!l.visible) return;
            const f = l.userData.flicker;
            l.userData.glow.material.opacity = f ? (Math.sin(time * f + l.userData.phase) > 0.3 ? 0.75 : 0.1) : 0.7;
        });
        const pulse = 0.65 + Math.sin(time * 3) * 0.2;
        pickup.userData.mat.opacity = pulse; destBay.userData.mat.opacity = pulse;
        houseGlow = Math.max(0, houseGlow - dt * 0.4);
        const base = 0.55 + Math.sin(time * 2.1) * 0.08 + (Math.sin(time * 13) > 0.92 ? 0.25 : 0);
        windowMats[0].color.setScalar(base + houseGlow * 1.2);
        windowMats[1].color.setScalar(0.5 + Math.sin(time * 1.4 + 1) * 0.12 + houseGlow * 1.2);
        doorGlow.material.opacity = clamp(houseGlow * 0.9, 0, 0.9);

        // Dynamic fog thickens close to the next stop
        const target = onboard ? destination : pickup;
        const dist = Math.hypot(bus.position.x - target.position.x, bus.position.z - target.position.z);
        const thick = clamp(1 - dist / 120, 0, 1) * 0.3;
        scene.fog.far = lerp(scene.fog.far, cfg.environment.fogDensity * 1.9 * (1 - thick), 0.03);
    }

    function updateCamera(dt) {
        const blend = 1 - Math.exp(-5.5 * dt);
        const sp = cfg.gameplay.maxSpeed ? speed / cfg.gameplay.maxSpeed : 0;
        // During the delivery ceremony the camera drifts toward the house so the exit is in frame
        camFocus = lerp(camFocus, delivering ? -3 : 0, 1 - Math.exp(-2.5 * dt));
        camera.position.x = lerp(camera.position.x, bus.position.x * 0.92 + camFocus * 0.6, blend);
        camera.position.y = lerp(camera.position.y, bus.position.y + 6.7 + Math.sin(time * 31) * 0.012 * sp, blend);
        camera.position.z = lerp(camera.position.z, bus.position.z + 20.5 + sp * 1.2, blend);
        camera.lookAt(bus.position.x + (bus.userData.steer || 0) * 3 + camFocus, bus.position.y - 0.15, bus.position.z - 13);
        const fov = 56 + sp * 6;
        if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = lerp(camera.fov, fov, 0.1); camera.updateProjectionMatrix(); }
        stars.position.copy(camera.position); sky.position.copy(camera.position);
        moonGlow.position.set(camera.position.x - 90, camera.position.y + 110, camera.position.z - 330);
        moonDisc.position.copy(moonGlow.position);
    }

    // ------------------------------------------------------------------
    // START
    // ------------------------------------------------------------------
    segments.forEach(randomizeSegment);
    destination.position.set(DEST_X, 0, -535);
    setPickup(-35);
    setDestinationLabel('Cemetery');
    camera.position.set(0, 10, 18);
    camera.lookAt(0, 0, -12);

    if (mode === 'edit') {
        $('controls').style.display = 'none';
        showMessage('Edit Mode: ubah parameter di panel');
    } else {
        showMessage('Menuju kuburan untuk menjemput penumpang');
    }

    let last = performance.now();
    function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.11);
        last = now; time += dt;

        if (messageTimer > 0) { messageTimer -= dt; if (messageTimer <= 0) $('message').style.opacity = '0'; }
        if (mode === 'play') { updateDriving(dt); recycle(dt); }
        updateBusVisuals(dt);
        updateGhost(dt);
        updateSmoke(dt);
        updateFlies();
        updateWorld(dt);
        updateDestinationRelocation();
        updateCamera(dt);
        updateHud();
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    setTimeout(() => {
        loadingScreen.classList.add('is-hidden');
        setTimeout(() => loadingScreen.remove(), 250);
    }, Math.max(0, 900 - (performance.now() - loadStart)));
}
</script>
</body>
