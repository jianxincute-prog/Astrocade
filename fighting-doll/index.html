<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fighting Doll</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d0f45; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: relative; width: 720px; height: 1280px; }
  #gl, #ui { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #gl { width: 720px; height: 935px; }
  #ui { width: 720px; height: 1280px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
