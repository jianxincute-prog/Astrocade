<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1230">
<title>Bang Bulat Naik Gunung</title>
<style>
:root{--ink:#2a1b3d;--gold:#ffcf3f;--cream:#fff4d6;--coral:#ff6b4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#1b1230;overflow:hidden;touch-action:none}
#app{position:relative;width:720px;height:1280px;margin:0 auto;overflow:hidden;font-family:'Trebuchet MS',Verdana,Tahoma,sans-serif;font-weight:800;color:var(--cream);background:#1b1230}
#sky{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:720px;height:1280px;image-rendering:auto}
.fx{position:absolute;inset:0;pointer-events:none}
#fx-glow{background:radial-gradient(ellipse 70% 45% at 80% 8%,rgba(255,214,140,.55),rgba(255,170,90,.18) 55%,transparent 75%);mix-blend-mode:screen}
#fx-warm{background:linear-gradient(180deg,rgba(255,190,120,.10),rgba(255,120,80,.14));mix-blend-mode:soft-light}
#fx-vig{background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(30,10,50,.45) 100%)}
.ts{position:absolute;left:0;width:100%;pointer-events:none;-webkit-backdrop-filter:blur(var(--tsb,4px));backdrop-filter:blur(var(--tsb,4px))}
#ts-top{top:0;height:330px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#ts-bot{bottom:0;height:380px;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
#app.low .ts,#app.low #fx-glow,#app.low #fx-warm{display:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui *{pointer-events:auto}
.scr{position:absolute;inset:0;display:none;pointer-events:none}
.scr.on{display:block}
.scr>*{pointer-events:auto}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;border:6px solid var(--ink);border-radius:36px;background:linear-gradient(#ffe27a,#ffb429);color:var(--ink);font:900 60px/1 'Trebuchet MS',Verdana,sans-serif;letter-spacing:3px;box-shadow:0 12px 0 #9a5a14,0 18px 24px rgba(20,5,40,.45);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active,.btn.dn{transform:translateY(9px);box-shadow:0 3px 0 #9a5a14,0 6px 10px rgba(20,5,40,.4)}
.btn.sec{background:linear-gradient(#fff4d6,#e9c98f);box-shadow:0 10px 0 #8c6a3a,0 16px 22px rgba(20,5,40,.4)}
.ico{position:absolute;width:104px;height:104px;border-radius:30px;border:5px solid var(--ink);background:linear-gradient(#fff4d6,#e9c98f);font-size:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #8c6a3a,0 12px 18px rgba(20,5,40,.4);cursor:pointer;color:var(--ink)}
.ico:active{transform:translateY(6px);box-shadow:0 2px 0 #8c6a3a}
.chip{white-space:nowrap;position:absolute;height:80px;padding:0 26px;border-radius:40px;border:5px solid var(--ink);background:rgba(42,27,61,.78);display:flex;align-items:center;gap:12px;font-size:40px;color:var(--cream)}
.title{position:absolute;left:0;width:100%;text-align:center;color:#fff4d6;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);line-height:.95}
#title1{top:150px;font-size:150px;letter-spacing:4px}
#title2{top:318px;font-size:96px;color:#ffcf3f}
.panel{position:absolute;left:60px;right:60px;border:8px solid var(--ink);border-radius:44px;background:linear-gradient(#3b2a57,#241636);box-shadow:0 14px 0 #120a1e,0 24px 40px rgba(0,0,0,.5);padding:36px 32px;text-align:center}
.panel h2{margin:0 0 20px;font-size:62px;color:var(--gold);letter-spacing:3px}
.dim{position:absolute;inset:0;background:rgba(18,8,32,.62)}
.ctl{position:absolute;bottom:40px;width:156px;height:156px;border-radius:44px;border:6px solid rgba(42,27,61,.85);background:rgba(255,244,214,.34);color:#fff;font-size:84px;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 8px 0 rgba(42,27,61,.5);text-shadow:0 4px 0 var(--ink)}
.ctl.dn{background:rgba(255,207,63,.6);transform:translateY(6px)}
#hud-m{left:24px;top:24px}
#hud-c{left:250px;top:24px}
#hud-f{left:24px;top:120px;height:64px;font-size:32px;padding:0 20px}
#rail{position:absolute;right:30px;top:230px;width:14px;height:640px;border-radius:7px;background:rgba(42,27,61,.6);border:3px solid rgba(255,244,214,.5)}
#knob{position:absolute;left:-14px;width:34px;height:34px;border-radius:50%;background:var(--gold);border:5px solid var(--ink);bottom:0;transition:bottom .2s}
#toast{position:absolute;left:0;width:100%;top:420px;text-align:center;font-size:64px;color:#fff4d6;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;opacity:0;transition:opacity .25s;pointer-events:none!important}
#toast.on{opacity:1}
.pop{position:absolute;font-size:56px;color:#fff4d6;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;pointer-events:none!important;white-space:nowrap;transform:translate(-50%,0);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;margin-top:20px;scale:.5}15%{opacity:1;scale:1.25}100%{opacity:0;margin-top:-110px;scale:1}}
#fade{position:absolute;inset:0;background:#1b1230;opacity:0;pointer-events:none!important;transition:opacity .3s}
#loading{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 38%,#ff9e6b,#b04a7a 48%,#2a1b3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#loading .lt{font-size:104px;line-height:.95;text-align:center;color:#fff4d6;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
#loading .lt small{display:block;font-size:64px;color:#ffcf3f}
#loading .lb{width:460px;height:34px;border-radius:20px;border:6px solid var(--ink);background:rgba(42,27,61,.7);overflow:hidden}
#loading .lb i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#ffe27a,#ff9a3f);transition:width .25s}
#loading .tip{font-size:30px;color:#ffe9c7;opacity:.9}
.lbrow{display:flex;align-items:center;gap:16px;font-size:36px;padding:10px 18px;border-radius:20px;background:rgba(255,255,255,.07);margin-bottom:10px;text-align:left}
.lbrow b{width:56px;color:var(--gold)}.lbrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help{display:flex;align-items:center;gap:22px;font-size:40px;text-align:left;margin:16px 0}
.help i{font-style:normal;font-size:60px;width:90px;text-align:center}
.row3{display:flex;justify-content:space-between;font-size:38px;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <div id="sky"></div>
  <canvas id="gl" width="720" height="1280"></canvas>
  <div class="fx" id="fx-glow"></div><div class="fx" id="fx-warm"></div>
  <div class="ts" id="ts-top"></div><div class="ts" id="ts-bot"></div>
  <div class="fx" id="fx-vig"></div>
  <div id="ui"></div>
  <div id="fade"></div>
  <div id="loading"><div class="lt">BANG BULAT<small>NAIK GUNUNG</small></div><div class="lb"><i id="lbar"></i></div><div class="tip" id="ltip">Menyiapkan gunung...</div></div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
