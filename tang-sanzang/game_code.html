              tourPose(Math.max(0, (t - CINE.b0) / CINE.bStep), tp0, tl0);
              const u = sm((t - CINE.fly0) / (CINE.b0 - CINE.fly0));
              camera.position.lerpVectors(cine.p0, tp0, u);
              controls.target.lerpVectors(cine.l0, tl0, u);
              if (t > CINE.b0) { camera.position.copy(tp0); controls.target.copy(tl0); }
            } else {
              // starts close on Tang + muyu, then pulls far back so every dancing spirit is in frame
              const a = 1.15 - (t - CINE.fly1) * 0.03, z = sm((t - CINE.muyu) / (CINE.cheer + 1.0 - CINE.muyu));
              const rad = 28 + 44 * z, h = 11 + 30 * z;
              camera.position.set(Math.sin(a) * rad, h, 94 + Math.cos(a) * rad);
              controls.target.set(0, 7 - 3 * z, 94);
            }
            camera.lookAt(controls.target);
            gp.update(dt);
            world.update(S.time, camera.position);
            updateArrows();
          }

          const LIM = HALF - 4;
          function updateExplore(dt) {
            if (cine.on) { cineUpdate(dt); return; }
            const keyX = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
            const keyZ = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
            let mx = keyX || joystick.x;
            let mz = keyZ || joystick.y;
            let length = Math.hypot(mx, mz);
            if (length > 1) { mx /= length; mz /= length; length = 1; }
            const running = (runHeld || runKey) && !gp.game.casting;
            if (gp.canMove() && length > 0.12) {
              cameraRelative(mx, mz);
              mx = moveDir.x;
              mz = moveDir.z;
              tang.rotation.y = Math.atan2(mx, mz);
              const moveSpeed = 5.4 * 1.6 * (running ? 1.5 : 1) * gp.speedMul();
              tang.position.x = THREE.MathUtils.clamp(tang.position.x + mx * moveSpeed * dt, -LIM, LIM);
              tang.position.z = THREE.MathUtils.clamp(tang.position.z + mz * moveSpeed * dt, -LIM, LIM);
              world.collide(tang.position, 1.4);
              tang.position.x = THREE.MathUtils.clamp(tang.position.x, -LIM, LIM);
              tang.position.z = THREE.MathUtils.clamp(tang.position.z, -LIM, LIM);
              S.target = running ? 'run' : 'walk';
            } else {
              S.target = 'idle';
            }
            // while casting Tang turns toward the demon he is purifying
            const fy = gp.faceYaw();
            if (fy !== null) tang.rotation.y = angLerp(tang.rotation.y, fy, 1 - Math.exp(-dt * 14));

            // Orbit around a fixed point on Tang so vertical camera rotation never pans him off-center.
            runZoom += ((S.target === 'run' ? 1 : 0) - runZoom) * (1 - Math.exp(-dt * 3));
            const elevation = baseCameraElevation + cameraPitch;
            const orbitDist = cameraOrbitDistance * (1 + 0.1 * runZoom);
            const lookAhead = cameraLookAhead + 5 * runZoom;
            const orbitHorizontal = Math.cos(elevation) * orbitDist;
            const orbitVertical = Math.sin(elevation) * orbitDist;
            camTarget.set(
              tang.position.x - Math.sin(cameraYaw) * lookAhead,
              tang.position.y + 4.0,
              tang.position.z - Math.cos(cameraYaw) * lookAhead
            );
            camWant.set(
              camTarget.x + Math.sin(cameraYaw) * orbitHorizontal,
              camTarget.y + orbitVertical,
              camTarget.z + Math.cos(cameraYaw) * orbitHorizontal
            );
            // keep the camera inside the mountain ring
            camWant.x = THREE.MathUtils.clamp(camWant.x, -HALF, HALF);
            camWant.z = THREE.MathUtils.clamp(camWant.z, -HALF, HALF);
            camWant.y = Math.max(camWant.y, 5);
            const ease = 1 - Math.exp(-dt * 4.5);
            if (cine.snap) { cine.snap = false; camera.position.copy(camWant); controls.target.copy(camTarget); }
            camera.position.lerp(camWant, ease);
            controls.target.lerp(camTarget, ease);
            camera.lookAt(controls.target);

            gp.update(dt);
            world.update(S.time, camera.position);
            updateArrows();
          }

          // ---- off-screen threat arrows (pool of 4, clamped to a rectangle inside the HUD margins) ----
          const arrows = [];
          for (let i = 0; i < 4; i++) {
            const el = document.createElement('div');
            el.style.cssText = 'position:absolute;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;display:none;pointer-events:none;text-align:center;font:900 22px/1 ui-rounded,Arial,sans-serif;color:#fff;text-shadow:0 2px 4px #000';
            el.innerHTML = '<div class="ar" style="font-size:44px;line-height:44px"></div><div class="at"></div>';
            ui.root.appendChild(el);
            arrows.push({ el, ar: el.firstChild, at: el.lastChild });
          }
          const aV = new THREE.Vector3();
          function updateArrows() {
            const W = ui.root.clientWidth || 720, H = ui.root.clientHeight || 1280;
            const list = gp.game.dead || gp.game.victory ? [] : gp.indicatorTargets();
            const x0 = 54, x1 = W - 54, y0 = 340, y1 = 850, cx = W / 2, cy = (y0 + y1) / 2;
            const placed = [];
            camera.updateMatrixWorld();
            let n = 0;
            for (const d of list) {
              if (n >= arrows.length) break;
              aV.set(d.x, 4, d.z);
              const behind = aV.clone().applyMatrix4(camera.matrixWorldInverse).z > 0;
              aV.project(camera);
              let sx = (aV.x * 0.5 + 0.5) * W, sy = (-aV.y * 0.5 + 0.5) * H;
              if (!behind && sx > x0 - 20 && sx < x1 + 20 && sy > 90 && sy < H - 150) continue; // visible on screen
              let dx = sx - cx, dy = sy - cy;
              if (behind) { dx = -dx; dy = -dy; if (Math.abs(dx) < 1 && Math.abs(dy) < 1) dy = 1; }
              const k = Math.min((x1 - cx) / (Math.abs(dx) || 1e-6), (y1 - cy) / (Math.abs(dy) || 1e-6));
              let px = cx + dx * k, py = cy + dy * k;
              for (const q of placed) if (Math.abs(px - q[0]) < 90 && Math.abs(py - q[1]) < 60) px = Math.min(x1, Math.max(x0, px + (px < cx ? 96 : -96)));
              placed.push([px, py]);
              const a = arrows[n++];
              const boss = d.kind === 2;
              a.el.style.display = 'block';
              a.el.style.transform = `translate(${px}px,${py}px)`;
              a.ar.textContent = '\u25B2';
              a.ar.style.transform = `rotate(${Math.atan2(dx, -dy)}rad)`;
              a.ar.style.color = boss ? '#c06bff' : '#ff6a4a';
              a.ar.style.textShadow = '0 0 8px #000, 0 0 14px ' + (boss ? '#7a2cff' : '#ff3a1a');
              a.at.textContent = (boss ? '\u2620 ' : '') + Math.round(Math.hypot(d.x - tang.position.x, d.z - tang.position.z)) + 'm';
            }
            for (let i = n; i < arrows.length; i++) arrows[i].el.style.display = 'none';
          }
          action = {
            update: updateExplore,
            keys,
            gp,
            world,
            layout,
            cine,
            removeKeys: () => {
              window.removeEventListener('keydown', keydown);
              window.removeEventListener('keyup', keyup);
              cameraCanvas.removeEventListener('pointerdown', startCameraDrag);
              cameraCanvas.removeEventListener('pointermove', dragCamera);
              cameraCanvas.removeEventListener('pointerup', stopCameraDrag);
              cameraCanvas.removeEventListener('pointercancel', stopCameraDrag);
              gp.destroy();
              sfx.destroy();
              ui.destroy();
            },
          };
        }

        // editor parameters
        if (mode === 'edit' && typeof lib !== 'undefined' && lib.showGameParameters) {
          lib.showGameParameters({
            name: 'Viewer Settings',
            params: {
              'Camera Distance': {
                key: 'camera_distance',
                type: 'slider',
                min: 8,
                max: 42,
                step: 0.5,
                onChange: (val) => {
                  window.gameConfig.camera_distance = val;
                  T.v1.copy(camera.position).sub(controls.target).normalize();
                  camera.position.copy(controls.target).addScaledVector(T.v1, val);
                },
              },
              'Rotation Speed': {
                key: 'rotation_speed',
                type: 'slider',
                min: 0.5,
                max: 3.0,
                step: 0.1,
                onChange: (val) => {
                  window.gameConfig.rotation_speed = val;
                  controls.rotateSpeed = val;
                },
              },
              'Ground Color': {
                key: 'ground_color',
                type: 'color',
                onChange: (val) => {
                  window.gameConfig.ground_color = val;
                  grassMat.color.set(val);
                },
              },
              'Sky Top': {
                key: 'background_top_color',
                type: 'color',
                onChange: (val) => {
                  window.gameConfig.background_top_color = val;
                  sky.userData.set(val, pick(window.gameConfig.background_bottom_color, SKY_BOT));
                },
              },
              'Sky Bottom': {
                key: 'background_bottom_color',
                type: 'color',
                onChange: (val) => {
                  window.gameConfig.background_bottom_color = val;
                  sky.userData.set(pick(window.gameConfig.background_top_color, SKY_TOP), val);
                },
              },
            },
          });
        }

        window.__tang = {
          renderer,
          camera,
          controls,
          bones: b,
          state: S,
          gp: action ? action.gp : null,
          world: action ? action.world : null,
          layout: action ? action.layout : null,
          cine: action ? action.cine : null,
          scene,
          tang,
          camera,
          setState: (s) => {
            S.target = s;
          },
        };

        // loop: real frame delta, clamped (identical speed at 60 and 120 Hz)
        let last = 0;
        function animate(ts) {
          requestAnimationFrame(animate);
          const dt = last ? Math.min((ts - last) / 1000, 0.11) : 1 / 60;
          last = ts;
          if (action && !window.__gate) action.update(dt);
          pose(dt);
          if (controls.enabled) controls.update();
          renderer.render(scene, camera);
        }
        // first frame is rendered synchronously and run() resolves at once (rAF may be paused while the game preloads)
        if (action) action.update(1 / 60);
        pose(1 / 60);
        if (controls.enabled) controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
        if (window.__loader) {
          if (mode === 'play') {
            window.__loader.ready(() => {});
          } else {
            window.__gate = false;
            window.__loader.hide();
          }
        }
      }

      window.__setRunImpl(run);
    </script>
  </body>
</html>
