<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <title>Tang Sanzang: Purify the Demon</title>
    <style>
      * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          touch-action: none;
          -ms-touch-action: none;
          background: #BFE0F7;
          font-family: ui-rounded, "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
      }

      #ld { position: fixed; inset: 0; z-index: 99999; background: #2b1a2e url(https://d16qq0o35va7kz.cloudfront.net/images/Google_107426622563564022577/1792253958331_01M55AJ65VEXPTP6368VV4Q1RF.jpg) center/cover no-repeat; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: opacity .6s ease; user-select: none; -webkit-user-select: none; touch-action: none; }
      #ld.out { opacity: 0; pointer-events: none; }
      #ld::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,12,30,.62) 0%, rgba(30,12,30,0) 30%, rgba(30,12,30,0) 62%, rgba(30,12,30,.82) 100%); }
      #ld .ld-top, #ld .ld-bot { position: relative; width: 100%; text-align: center; }
      #ld .ld-top { padding-top: 90px; }
      #ld .ld-sub { color: #ffe9b0; font-size: 34px; letter-spacing: 10px; font-weight: 800; text-shadow: 0 3px 0 #7a2418, 0 0 18px rgba(255,190,80,.7); }
      #ld .ld-title { margin-top: 10px; font-size: 112px; line-height: .95; font-weight: 900; color: #ffd24a; letter-spacing: 3px; text-shadow: 0 6px 0 #b3281d, 0 10px 0 #5a1410, 0 0 36px rgba(255,170,40,.65); -webkit-text-stroke: 3px #7a2418; paint-order: stroke fill; }
      #ld .ld-tag { margin-top: 18px; color: #fff; font-size: 30px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
      #ld .ld-bot { padding-bottom: 96px; }
      #ld .ld-tip { color: #fff1d1; font-size: 28px; font-weight: 700; min-height: 78px; padding: 0 70px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
      #ld .ld-bar { margin: 18px auto 0; width: 520px; height: 26px; border-radius: 14px; background: rgba(20,10,20,.65); border: 4px solid #fff1d1; overflow: hidden; }
      #ld .ld-fill { height: 100%; width: 4%; background: linear-gradient(90deg, #ff9a2e, #ffd24a); border-radius: 10px; transition: width .35s ease-out; }
      #ld .ld-go { margin: 18px auto 0; display: none; padding: 24px 70px; font: inherit; font-size: 46px; font-weight: 900; color: #5a1410; background: linear-gradient(#ffe27a, #ffb22e); border: 5px solid #fff1d1; border-radius: 60px; box-shadow: 0 8px 0 #a8501a, 0 0 30px rgba(255,200,80,.8); cursor: pointer; animation: ldpulse 1.1s ease-in-out infinite; }
      #ld .ld-pct { margin-top: 10px; color: #fff1d1; font-size: 26px; font-weight: 800; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
      @keyframes ldpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      ::-webkit-scrollbar { display: none; }
      #game-world { position: relative; width: 100%; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>

  <body>
    <div id="ld">
      <div class="ld-top">
        <div class="ld-sub">PURIFY THE DEMON</div>
        <div class="ld-title">TANG<br>SANZANG</div>
      </div>
      <div class="ld-bot">
        <div class="ld-tip" id="ld-tip"></div>
        <div class="ld-bar" id="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
        <div class="ld-pct" id="ld-pct">LOADING...</div>
        <button class="ld-go" id="ld-go">TAP TO START</button>
      </div>
    </div>
    <div id="game-world"></div>

    <script>
      // window.run must exist immediately (the host checks for it before the CDN modules finish loading);
      // it resolves once the module below has loaded and the first frame is drawn.
      window.__runImpl = new Promise(function (resolve) {
        window.__setRunImpl = resolve;
      });

      // ---- loading screen: static overlay that is visible before the three.js modules arrive ----
      (function () {
        var tips = [
          'Hold the RUN button to move faster.',
          'NAMO GATLING: a storm of holy beads purifies the demons ahead of you.',
          'NAMO MUYU: tok-tok-tok, then BASS DROP, and the demons start dancing!',
          'Follow the roads to the demon camps; they are free of obstacles.',
          'The monastery is a safe zone. Retreat there to recover.',
          'Purify every camp as fast as you can and reach the top 10!'
        ];
        var L = { p: 0, ready: false, tipI: 0 };
        var fill = document.getElementById('ld-fill'), pct = document.getElementById('ld-pct'), tip = document.getElementById('ld-tip');
        function setP(p, txt) {
          L.p = Math.max(L.p, Math.min(1, p));
          if (fill) fill.style.width = Math.round(4 + 96 * L.p) + '%';
          if (pct) pct.textContent = txt || ('LOADING ' + Math.round(L.p * 100) + '%');
        }
        function nextTip() { if (tip) { tip.textContent = tips[L.tipI++ % tips.length]; } }
        nextTip();
        var tipTimer = setInterval(nextTip, 2600);
        var t0 = Date.now();
        var sim = setInterval(function () {
          if (L.ready) return;
          var t = (Date.now() - t0) / 1000;
          setP(0.88 * (1 - Math.exp(-t / 2.4)));
        }, 120);
        window.__gate = true;
        window.__loader = {
          progress: setP,
          hide: function () {
            clearInterval(sim); clearInterval(tipTimer);
            var el = document.getElementById('ld');
            if (el) { el.classList.add('out'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700); }
          },
          ready: function (onStart) {
            L.ready = true; clearInterval(sim);
            setP(1, 'READY!');
            var go = document.getElementById('ld-go'), bar = document.getElementById('ld-bar');
            if (bar) bar.style.display = 'none';
            if (!go) { window.__gate = false; onStart(); return; }
            go.style.display = 'inline-block';
            var done = false;
            function start(e) {
              if (e) { e.preventDefault(); e.stopPropagation(); }
              if (done) return; done = true;
              window.__gate = false;
              window.__loader.hide();
              onStart();
            }
            go.addEventListener('pointerdown', start);
            go.addEventListener('click', start);
          }
        };
      })();
      window.run = function (mode) {
        return window.__runImpl.then(function (fn) {
          return fn(mode);
        });
      };
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

      /*
       * Tang Sanzang - voxel character viewer (three.js 0.186.1)
       * One SkinnedMesh (vertex colors, rigid box skinning) on a 20-bone skeleton.
       * FK: spine, head, left arm, skirt, ribbons.  IK: both legs (feet planted) + right hand on the staff.
       * Scene: no fog, no shadow maps, fixed 720x1280 backbuffer, no MSAA.
       */

      const C = {
        red: 0xc93232,
        gold: 0xf2b230,
        cream: 0xe8d9c0,
        brown: 0x5a3a2a,
        dark: 0x2c1810,
        skin: 0xf4c8a4,
        skinD: 0xe2a988,
        white: 0xf4f1ea,
        bead: 0x4a2f22,
        stone: 0x8c8578,
        path: 0xb9ab94,
        path2: 0xa89983,
        cloud: 0xffffff,
      };

      // Bone: name, parent, bind-pose world position
      const BONES = [
        ['hips', null, 0, 2.5, 0],
        ['chest', 'hips', 0, 3.3, 0],
        ['neck', 'chest', 0, 5.2, 0],
        ['head', 'neck', 0, 5.3, 0],
        ['ribL', 'head', 2.0, 8.2, 1.0],
        ['ribR', 'head', -2.0, 8.2, 1.0],
        ['skL', 'hips', 1.1, 2.9, 0],
        ['skR', 'hips', -1.1, 2.9, 0],
        ['shL', 'chest', 1.85, 4.85, 0],
        ['elL', 'shL', 1.85, 3.75, 0],
        ['wrL', 'elL', 1.85, 2.7, 0],
        ['shR', 'chest', -1.85, 4.85, 0],
        ['elR', 'shR', -1.85, 3.75, 0],
        ['wrR', 'elR', -1.85, 2.7, 0],
        ['hpL', 'hips', 0.6, 2.5, 0],
        ['knL', 'hpL', 0.6, 1.35, 0],
        ['anL', 'knL', 0.6, 0.35, 0],
        ['hpR', 'hips', -0.6, 2.5, 0],
        ['knR', 'hpR', -0.6, 1.35, 0],
        ['anR', 'knR', -0.6, 0.35, 0],
      ];
      const LEG1 = 1.15,
        LEG2 = 1.0,
        ARM1 = 1.1,
        ARM2 = 1.05;
      const GROUND_Y = 0.03,
        ANKLE_Y = 0.35 + GROUND_Y,
        HIP_REST = 2.38;
      const DOWN = new THREE.Vector3(0, -1, 0);

      function buildTang() {
        const bones = [],
          idx = {},
          world = {};
        BONES.forEach(([n, p, x, y, z], i) => {
          const b = new THREE.Bone();
          b.name = n;
          idx[n] = i;
          bones.push(b);
          world[n] = [x, y, z];
          if (p) {
            const w = world[p];
            b.position.set(x - w[0], y - w[1], z - w[2]);
            bones[idx[p]].add(b);
          } else b.position.set(x, y, z);
        });

        const geos = [];
        const _m = new THREE.Matrix4(),
          _e = new THREE.Euler();
        function box(bone, w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) {
          const g = new THREE.BoxGeometry(w, h, d);
          g.deleteAttribute('uv');
          if (rx || ry || rz) g.applyMatrix4(_m.makeRotationFromEuler(_e.set(rx, ry, rz)));
          g.translate(x, y, z);
          const n = g.attributes.position.count,
            c = new THREE.Color(color);
          const col = new Float32Array(n * 3),
            si = new Uint16Array(n * 4),
            sw = new Float32Array(n * 4);
          for (let i = 0; i < n; i++) {
            col[i * 3] = c.r;
            col[i * 3 + 1] = c.g;
            col[i * 3 + 2] = c.b;
            si[i * 4] = idx[bone];
            sw[i * 4] = 1;
          }
          g.setAttribute('color', new THREE.BufferAttribute(col, 3));
          g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
          g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
          geos.push(g);
        }
        const _v = new THREE.Vector3();
        function ring(bone, cx, cy, cz, size, ry, rz, t = 0.2) {
          _e.set(0, ry, rz);
          const h = size / 2;
          [
            [0, h, size, t],
            [0, -h, size, t],
            [-h, 0, t, size],
            [h, 0, t, size],
          ].forEach(([ox, oy, w, hh]) => {
            _v.set(ox, oy, 0).applyEuler(_e);
            box(bone, w, hh, t, C.gold, cx + _v.x, cy + _v.y, cz + _v.z, 0, ry, rz);
          });
        }

        // ---- legs, boots ----
        [
          ['L', 1],
          ['R', -1],
        ].forEach(([n, s]) => {
          box('hp' + n, 0.95, 1.2, 0.95, C.cream, 0.6 * s, 1.93, 0);
          box('kn' + n, 1.0, 1.05, 1.0, C.brown, 0.6 * s, 0.85, 0);
          box('kn' + n, 1.12, 0.2, 1.12, C.dark, 0.6 * s, 1.3, 0);
          box('an' + n, 1.15, 0.5, 1.6, C.brown, 0.6 * s, 0.25, 0.3);
          box('an' + n, 1.15, 0.16, 0.5, C.dark, 0.6 * s, 0.08, 0.85);
        });

        // ---- skirt: cream inner robe + red side panels with gold key pattern ----
        box('hips', 3.2, 1.7, 2.4, C.cream, 0, 2.1, 0);
        box('hips', 3.3, 0.16, 2.5, C.gold, 0, 1.27, 0);
        [
          ['L', 1],
          ['R', -1],
        ].forEach(([n, s]) => {
          box('sk' + n, 1.2, 1.7, 2.6, C.red, 1.1 * s, 2.05, 0);
          box('sk' + n, 1.25, 0.18, 2.65, C.gold, 1.1 * s, 1.2, 0);
          box('sk' + n, 0.14, 1.7, 2.65, C.gold, 0.5 * s, 2.05, 0);
          [2.35, 1.75].forEach((y) => {
            box('sk' + n, 0.4, 0.14, 0.06, C.gold, 1.1 * s, y, 1.33);
            box('sk' + n, 0.14, 0.4, 0.06, C.gold, 1.1 * s - 0.13 * s, y - 0.1, 1.33);
            box('sk' + n, 0.4, 0.14, 0.06, C.gold, 1.1 * s, y, -1.33);
          });
        });

        // ---- torso ----
        box('chest', 3.3, 2.3, 2.4, C.red, 0, 4.1, 0);
        box('chest', 3.4, 0.14, 2.5, C.gold, 0, 2.97, 0);
        box('chest', 1.0, 2.1, 0.1, C.cream, 0, 4.15, 1.23);
        [1, -1].forEach((s) => {
          box('chest', 0.16, 1.9, 0.12, C.gold, 0.62 * s, 4.2, 1.25, 0, 0, 0.1 * s);
          box('chest', 0.16, 2.1, 0.12, C.gold, 1.5 * s, 4.1, 1.22);
          [3.75, 4.6].forEach((y) => box('chest', 0.5, 0.5, 0.06, C.gold, 1.15 * s, y, 1.23));
        });
        box('chest', 1.0, 1.0, 0.06, C.gold, 0, 4.0, -1.23, 0, 0, 0.785);
        box('chest', 2.2, 0.16, 0.06, C.gold, 0, 4.9, -1.23);
        // prayer beads
        for (let i = 0; i < 9; i++) {
          const a = (i - 4) * 0.33; // equal arc spacing along a U-shaped loop
          box(
            'chest',
            0.52,
            0.56,
            0.52,
            C.bead,
            1.65 * Math.sin(a),
            5.15 - 1.95 * Math.cos(a),
            1.34 - 0.12 * Math.sin(a) ** 2,
            0.2 * (i % 3),
            0.5 * ((i % 3) - 1),
            0.15 * (i % 2)
          );
        }
        [
          [1.3, 5.3, 0.7],
          [-1.3, 5.3, 0.7],
          [1.0, 5.4, -0.1],
          [-1.0, 5.4, -0.1],
          [0.55, 5.4, -0.7],
          [-0.55, 5.4, -0.7],
          [0, 5.4, -0.95],
        ].forEach(([x, y, z], i) =>
          box('chest', 0.42, 0.42, 0.42, C.bead, x, y, z, 0.3, 0.4 * i, 0)
        );

        // ---- neck, head ----
        box('neck', 1.1, 0.5, 1.1, C.skin, 0, 5.35, 0);
        box('head', 3.4, 3.0, 3.0, C.skin, 0, 6.8, 0);
        [1, -1].forEach((s) => {
          box('head', 0.38, 0.62, 0.1, C.dark, 0.85 * s, 6.75, 1.5);
          box('head', 1.0, 0.22, 0.1, C.dark, 0.85 * s, 7.45, 1.52, 0, 0, 0.2 * s);
          box('head', 0.35, 0.8, 0.7, C.skin, 1.72 * s, 6.7, 0);
        });
        box('head', 3.0, 2.4, 0.14, C.white, 0, 7.0, -1.56); // back veil
        box('head', 3.4, 0.5, 0.2, C.brown, 0, 5.75, -1.5); // nape cloth
        box('head', 0.55, 0.09, 0.1, C.brown, 0, 5.95, 1.5);
        box('head', 0.3, 0.3, 0.15, C.skinD, 0, 6.4, 1.55);

        // ---- crown ----
        box('head', 3.9, 0.4, 3.5, C.gold, 0, 8.4, 0);
        box('head', 3.7, 0.75, 3.3, C.red, 0, 8.95, 0);
        box('head', 3.8, 0.16, 3.4, C.gold, 0, 9.4, 0);
        [1, -1].forEach((s) => {
          box('head', 1.05, 0.8, 2.9, C.red, 1.3 * s, 9.88, 0);
          box('head', 1.1, 0.14, 3.0, C.gold, 1.3 * s, 10.35, 0);
          box('head', 0.16, 0.75, 3.34, C.gold, 1.85 * s, 8.95, 0);
          box('head', 0.14, 0.8, 2.94, C.gold, 0.76 * s, 9.88, 0);
        });
        box('head', 1.4, 1.2, 2.9, C.red, 0, 10.08, 0);
        box('head', 1.5, 0.14, 3.0, C.gold, 0, 10.75, 0);
        box('head', 0.4, 0.5, 0.4, C.gold, 0, 11.1, 0, 0, 0.785, 0);
        [0.7, -0.7].forEach((x) => {
          box('head', 0.2, 0.75, 0.06, C.gold, x, 8.95, 1.66);
          box('head', 0.18, 0.8, 0.06, C.gold, x * 1.9, 9.88, 1.48);
        });

        // ---- ribbons ----
        box('ribL', 0.8, 3.7, 0.22, C.white, 2.0, 6.35, 1.0);
        box('ribR', 0.8, 3.7, 0.22, C.white, -2.0, 6.35, 1.0);

        // ---- arms ----
        [
          ['L', 1],
          ['R', -1],
        ].forEach(([n, s]) => {
          box('sh' + n, 1.2, 1.2, 1.2, C.red, 1.85 * s, 4.3, 0);
          box('sh' + n, 1.3, 0.15, 1.3, C.gold, 1.85 * s, 4.88, 0);
          box('el' + n, 1.7, 1.1, 1.7, C.cream, 1.85 * s, 3.2, 0);
          [
            [1.85, 0.2, 0, 0.9],
            [0.2, 1.85, 0.9, 0],
          ].forEach(([w, d, ox, oz]) => {
            box('el' + n, w, 0.22, d, C.gold, 1.85 * s + ox, 2.68, oz);
            if (ox) box('el' + n, w, 0.22, d, C.gold, 1.85 * s - ox, 2.68, oz);
            if (oz) box('el' + n, w, 0.22, d, C.gold, 1.85 * s + ox, 2.68, -oz);
          });
          box('el' + n, 0.16, 1.1, 1.74, C.gold, 1.85 * s + 0.85 * s, 3.2, 0);
          box('wr' + n, 0.85, 0.85, 0.85, C.skin, 1.85 * s, 2.25, 0.1);
        });

        // ---- staff (held by the right hand) ----
        box('wrR', 0.34, 9.55, 0.34, C.gold, -1.85, 3.225, 0.1);
        box('wrR', 0.55, 0.22, 0.55, C.gold, -1.85, 7.6, 0.1);
        box('wrR', 0.46, 0.5, 0.46, C.gold, -1.85, -1.45, 0.1, 0, 0.785, 0);
        ring('wrR', -1.85, 9.2, 0.1, 2.0, 0, 0, 0.32);
        ring('wrR', -2.5, 8.95, 0.1, 1.7, 1.0, 0.25, 0.3);
        ring('wrR', -1.2, 8.95, 0.1, 1.7, -1.0, -0.25, 0.3);
        box('wrR', 0.6, 1.2, 0.6, C.gold, -1.85, 10.75, 0.1, 0.785, 0, 0.785);

        const geo = mergeGeometries(geos, false);
        geos.forEach((g) => g.dispose());
        const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
        const mesh = new THREE.SkinnedMesh(geo, mat);
        mesh.add(bones[0]);
        mesh.updateMatrixWorld(true);
        mesh.bind(new THREE.Skeleton(bones));
        mesh.frustumCulled = false;
        const b = {};
        bones.forEach((x) => {
          b[x.name] = x;
        });
        return { mesh, b };
      }

      // ---- world: ledge, grass, clouds, scrolling path ----
      function vcBoxes(list) {
        const gs = list.map(([w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0]) => {
          const g = new THREE.BoxGeometry(w, h, d);
          g.deleteAttribute('uv');
          if (rx || ry || rz) g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)));
          g.translate(x, y, z);
          const c = new THREE.Color(color),
            n = g.attributes.position.count,
            a = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) {
            a[i * 3] = c.r;
            a[i * 3 + 1] = c.g;
            a[i * 3 + 2] = c.b;
          }
          g.setAttribute('color', new THREE.BufferAttribute(a, 3));
          return g;
        });
        const m = mergeGeometries(gs, false);
        gs.forEach((g) => g.dispose());
        return m;
      }

      // Low-poly monastery compound assembled from merged, flat-shaded geometry.
      function createMonastery(scene) {
        const B = [];
        const monastery = new THREE.Group();
        const put = (w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) =>
          B.push([w, h, d, color, x, y, z, rx, ry, rz]);
        const stoneA = 0xb9ad98, stoneB = 0x9d927f, stoneC = 0xd0c4ad;
        const wood = 0x713b31, darkWood = 0x482c25, roof = 0x843b32;
        const trim = C.gold, wall = C.cream, green = 0x668a4c;

        // Broad flagstone courtyard and a long central processional path.
        put(54, 0.22, 72, 0x918875, 0, 0.02, -5);
        for (let iz = 0; iz < 13; iz++) {
          const z = -34 + iz * 5.35;
          for (let ix = 0; ix < 10; ix++) {
            const x = -24.3 + ix * 5.4;
            put(5.12, 0.12, 5.05, ((ix + iz) % 3 === 0) ? stoneC : ((ix + iz) % 2 ? stoneA : stoneB), x, 0.19, z);
          }
        }
        for (let i = 0; i < 19; i++) {
          const z = -77 + i * 2.25;
          put(11.5, 0.18, 2.0, i % 2 ? stoneA : stoneC, 0, 0.17, z);
          put(0.45, 0.1, 2.0, trim, -6.1, 0.23, z);
          put(0.45, 0.1, 2.0, trim, 6.1, 0.23, z);
        }
        // Decorative side borders, garden curbs and perimeter walls.

      // ====================================================================
      // OPEN WORLD (500 x 500)

      const WORLD = 500,

      const MON = { x0: -84, x1: 84, z0: -92, z1: 72 }; // monastery walls after the 1.45 scale = safe zone
      const LAKE = { x0: 118, x1: 204, z0: -204, z1: -128 };
      const sstep = (a, b2, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b2 - a)));
        return t * t * (3 - 2 * t);
      };
      const inRect = (x, z, r, m = 0) => x > r.x0 - m && x < r.x1 + m && z > r.z0 - m && z < r.z1 + m;
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Deterministic layout so saved progress (demon ids) always matches the world.
      // Camps are hand-placed (never random) so every one is large, reachable and well separated.
      const CAMP_R = 42; // half-size of a camp platform
      const CAMP_THEMES = ['Bone Camp', 'Lava Camp', 'Toxic Swamp Camp'];
      function makeWorldLayout() {
        // main road from the gate, a ring road around the monastery walls, then one spur per camp
        const roads = [
          [0, 72, 0, 168],
          [-106, 100, 106, 100],
          [-106, 100, -106, -114],
          [106, 100, 106, -114],
          [-106, -114, 106, -114],
        ];
        const nearestOnRoads = (x, z) => {
          let best = null;
          for (const [x1, z1, x2, z2] of roads) {
            const dx = x2 - x1, dz = z2 - z1, l2 = dx * dx + dz * dz;
            const t = Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / l2));
            const px = x1 + dx * t, pz = z1 + dz * t, d = Math.hypot(x - px, z - pz);
            if (!best || d < best.d) best = { x: px, z: pz, d };
          }
          return best;
        };
        // x, z, theme (0 bone, 1 lava, 2 swamp), boss
        const spec = [
          [-165, 140, 0, false],
          [165, 145, 1, true],
          [0, 214, 2, true],
          [-175, -20, 1, false],
          [178, 20, 2, false],
          [-150, -165, 0, true],
          [30, -190, 1, false],
          [178, -80, 0, false],
        ];
        const camps = spec.map(([x, z, theme, boss], i) => {
          const P = nearestOnRoads(x, z);
          const dx = P.x - x, dz = P.z - z, l = Math.hypot(dx, dz) || 1;
          const fx = dx / l, fz = dz / l;
          if (l > CAMP_R + 2) roads.push([P.x, P.z, x + fx * (CAMP_R - 2), z + fz * (CAMP_R - 2)]);
          return { x, z, theme, boss, fx, fz, id: i, pure: false };
        });
        const roadDist = (x, z) => {
          let m = 1e9;
          for (const [x1, z1, x2, z2] of roads) {
            const dx = x2 - x1, dz = z2 - z1, l2 = dx * dx + dz * dz;
            const t = Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / l2));
            m = Math.min(m, Math.hypot(x - (x1 + dx * t), z - (z1 + dz * t)));
          }
          return m;
        };
        return { camps, roads, roadDist };
      }

      function createWorld(scene, layout) {
        const lambertVC = () => new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
        const addBoxes = (list, mat) => {
          const m = new THREE.Mesh(vcBoxes(list), mat);
          m.frustumCulled = false;
          scene.add(m);
          return m;
        };

        // ---- obstacle grid (trees, rocks, hills) so Tang cannot walk through them ----
        const CELL = 16,
          grid = new Map();
        const addObstacle = (x, z, r) => {
          const key = Math.floor(x / CELL) + ',' + Math.floor(z / CELL);
          let list = grid.get(key);
          if (!list) grid.set(key, (list = []));
          list.push([x, z, r]);
        };
        const collide = (pos, rad) => {
          const cx = Math.floor(pos.x / CELL),
            cz = Math.floor(pos.z / CELL);
          for (let ix = cx - 1; ix <= cx + 1; ix++) {
            for (let iz = cz - 1; iz <= cz + 1; iz++) {
              const list = grid.get(ix + ',' + iz);
              if (!list) continue;
              for (let k = 0; k < list.length; k++) {
                const o = list[k];
                const dx = pos.x - o[0],
                  dz = pos.z - o[1],
                  rr = rad + o[2],
                  d2 = dx * dx + dz * dz;
                if (d2 < rr * rr && d2 > 1e-6) {
                  const d = Math.sqrt(d2),
                    push = (rr - d) / d;
                  pos.x += dx * push;
                  pos.z += dz * push;
                }
              }
            }
          }
        };

        const forest = { layers: [], trees: null }, groundFx = { attr: null, base: null, clean: null, last: -1 };
        // ---- ground: vertex-colored plane, lush near the monastery and corrupted around demon camps ----
        {
          const g = new THREE.PlaneGeometry(WORLD + 40, WORLD + 40, 100, 100);
          g.rotateX(-Math.PI / 2);
          const pos = g.attributes.position,
            col = new Float32Array(pos.count * 3),
            cleanCol = new Float32Array(pos.count * 3);
          const A = new THREE.Color(0x6f9f50),
            Bc = new THREE.Color(0x5c8a44),
            Dc = new THREE.Color(0x7aa85a),
            X = new THREE.Color(0x4d3c58),
            Y = new THREE.Color(0x362a44),
            tmp = new THREE.Color();
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i),
              z = pos.getZ(i);
            const nz =
              0.5 + 0.25 * Math.sin(x * 0.07 + Math.sin(z * 0.05) * 2) + 0.25 * Math.sin(z * 0.09 - x * 0.03 + 1.7);
            tmp.copy(A).lerp(Bc, nz).lerp(Dc, Math.max(0, Math.sin(x * 0.2) * Math.sin(z * 0.17)) * 0.35);
            cleanCol[i * 3] = tmp.r; cleanCol[i * 3 + 1] = tmp.g; cleanCol[i * 3 + 2] = tmp.b;
            let c = sstep(125, 245, Math.hypot(x, z + 10)) * 0.5;
            for (const cp of layout.camps) c = Math.max(c, 1 - Math.hypot(x - cp.x, z - cp.z) / 64);
            tmp.lerp(nz > 0.5 ? X : Y, Math.min(1, Math.max(0, c)));
            col[i * 3] = tmp.r;
            col[i * 3 + 1] = tmp.g;
            col[i * 3 + 2] = tmp.b;
          }
          groundFx.attr = new THREE.BufferAttribute(col, 3);
          groundFx.base = col.slice();
          groundFx.clean = cleanCol;
          g.setAttribute('color', groundFx.attr);
          const mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
          mesh.position.y = 0.02;
          mesh.frustumCulled = false;
          scene.add(mesh);
        }

        // ---- mountain ring sealing the 500 x 500 map ----
        {
          const rocks = [];
          const colors = [0x665f57, 0x766d61, 0x817767, 0x6d685e, 0x8a7e6d];
          const OFF = HALF + 26; // box centre; 40 deep => inner face at HALF + 6
          for (let side = 0; side < 4; side++) {
            const alongX = side < 2,
              sgn = side % 2 ? 1 : -1;
            for (let i = 0; i < 27; i++) {
              const t = -312 + i * 24;
              const wave = Math.sin(i * 0.43 + side * 1.7),
                detail = Math.sin(i * 1.17 + side * 0.9);
              const height = 58 + 16 * (0.5 + 0.5 * wave) + 10 * (0.5 + 0.5 * detail);
              const color = colors[(i + side * 2) % colors.length];
              const cx = alongX ? t : sgn * OFF,
                cz = alongX ? sgn * OFF : t;
              // Match each segment's length to the 24-unit spacing. The old 26-unit
              // width caused coplanar overlap between neighboring faces (z-fighting).
              rocks.push([alongX ? 24 : 40, height + 6, alongX ? 40 : 24, color, cx, (height - 6) / 2, cz]);
              for (const y of [12, 29, 46]) {
                if (y < height - 4) {
                  const lx = alongX ? t : sgn * (HALF + 4),
                    lz = alongX ? sgn * (HALF + 4) : t;
                  // Keep the decorative strata on the same non-overlapping 24-unit segments.
                  rocks.push([alongX ? 24 : 5, 0.85, alongX ? 5 : 24, y % 2 ? 0x9a8c78 : 0x5c574f, lx, y, lz]);
                }
              }
              if (i % 3 !== 1) {
                const peakH = 15 + (i % 4) * 3,
                  shift = i % 2 ? -4 : 4;
                const px = alongX ? t + shift : sgn * (OFF + shift),
                  pz = alongX ? sgn * (OFF + shift) : t + shift;
                rocks.push([10, peakH, 12, i % 2 ? 0x756b5e : 0x91826d, px, height - 2 + peakH * 0.36, pz]);
              }
            }
          }
          addBoxes(rocks, lambertVC());
        }

        // ---- stone processional road from the monastery gate to the southern edge ----
        {
          const R = [];
          for (let z = 78, i = 0; z <= 166; z += 8, i++) {

            });
            mesh.instanceMatrix.needsUpdate = true;
            if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
            mesh.frustumCulled = false;
            scene.add(mesh);
          };
          const cone = new THREE.ConeGeometry(2.9, 5.8, 5, 1);
          const healthy = [0x4e7544, 0x668c4d, 0x7b9f57];
          const sick = 0x4a3b55;
          mk(
            new THREE.CylinderGeometry(0.3, 0.48, 5.2, 5),
            (t, c) => c.set(0x69452f).lerp(new THREE.Color(0x2e2236), t.c),
            (t, d) => {
              d.position.set(t.x, 2.6 * t.s, t.z);
              d.scale.set(t.s, t.s, t.s);
              d.rotation.set(0, t.x, 0);
            }
          );
          [
            [5.1, 1],
            [7.8, 0.76],
            [10.1, 0.52],
          ].forEach(([y, k], layer) => {
            mk(
              cone,
              (t, c) => c.set(healthy[layer]).lerp(new THREE.Color(sick), t.c * 0.85),
              (t, d) => {
                d.position.set(t.x, y * t.s, t.z);
                d.scale.set(t.s * k, t.s * k * 1.02, t.s * k);
                d.rotation.set(0, t.z, 0);
              }
            );
          });
          trees.forEach((t) => addObstacle(t.x, t.z, 1.1 * t.s));
        }

        // ---- boulders (instanced) and larger rocky hills ----
        {
          const rng = mulberry32(991);
          const rocks = [];
          for (let tries = 0; rocks.length < 240 && tries < 20000; tries++) {
            const x = (rng() * 2 - 1) * 244,
              z = (rng() * 2 - 1) * 244;
            if (inRect(x, z, MON, 8) || inRect(x, z, LAKE, 6)) continue;
            if (Math.abs(x) < 12 && z > 60) continue;
            if (layout.roadDist(x, z) < 10) continue;
            if (layout.camps.some((c) => Math.hypot(c.x - x, c.z - z) < CAMP_R + 10)) continue;
            rocks.push({ x, z, sx: 1.6 + rng() * 2.8, sy: 1.0 + rng() * 1.8, sz: 1.6 + rng() * 2.8, r: rng() * 6 });
          }
          const mesh = new THREE.InstancedMesh(
            new THREE.DodecahedronGeometry(1, 0),
            new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }),
            rocks.length
          );
          const dummy = new THREE.Object3D(),
            tint = new THREE.Color();
          rocks.forEach((r, i) => {
            dummy.position.set(r.x, r.sy * 0.55, r.z);

            dummy.rotation.set(0, r.r, 0);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);

            addObstacle(r.x, r.z, Math.max(r.sx, r.sz) * 0.85);
          });
          mesh.instanceMatrix.needsUpdate = true;
          if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
          mesh.frustumCulled = false;
          scene.add(mesh);

          const hills = [];
          const placed = [];
          for (let tries = 0; placed.length < 5 && tries < 4000; tries++) {
            const x = (rng() * 2 - 1) * 215,
              z = (rng() * 2 - 1) * 215;
            if (inRect(x, z, MON, 34) || inRect(x, z, LAKE, 30)) continue;
            if (Math.abs(x) < 24 && z > 60) continue;
            if (layout.camps.some((c) => Math.hypot(c.x - x, c.z - z) < CAMP_R + 45)) continue;
            if (layout.roadDist(x, z) < 38) continue;
            if (placed.some((p) => Math.hypot(p[0] - x, p[1] - z) < 60)) continue;
            placed.push([x, z]);
          }
          for (const [x, z] of placed) {
            hills.push([30, 9, 26, 0x8f8576, x, 4.5, z]);
            hills.push([31, 0.6, 27, 0x6f9f50, x, 9.1, z]);
            hills.push([20, 9, 17, 0x9a9080, x + 1.5, 13.5, z - 1]);
            hills.push([10, 8, 9, 0xa89e8b, x - 1, 22, z + 1]);
            hills.push([4, 3, 4, 0xd0c4ad, x - 1, 27.5, z + 1]);
            for (const y of [5, 14, 21]) hills.push([30.4 - (y - 5) * 0.4, 0.5, 26.4 - (y - 5) * 0.4, 0x5c574f, x, y, z]);
            addObstacle(x, z, 14);
          }
          addBoxes(hills, lambertVC());
        }

        // ---- lake with a sandy shore ----
        {
          const cx = (LAKE.x0 + LAKE.x1) / 2,
            cz = (LAKE.z0 + LAKE.z1) / 2,
            w = LAKE.x1 - LAKE.x0,
            d = LAKE.z1 - LAKE.z0;
          const L = [
            [w + 6, 0.2, d + 6, 0xd9c79a, cx, 0.04, cz],
            [w, 0.3, d, 0x4f93b8, cx, 0.06, cz],
            [w * 0.62, 0.02, d * 0.62, 0x6bb0cf, cx, 0.22, cz],
          ];
          for (let i = 0; i < 9; i++) {
            L.push([1.6, 0.08, 1.1, 0x75a85c, cx + Math.sin(i * 2.3) * w * 0.32, 0.24, cz + Math.cos(i * 1.7) * d * 0.32]);
          }
          addBoxes(L, lambertVC());
        }

        // ---- clouds ----
        {
          const rng = mulberry32(31337);
          const K = [];
          for (let i = 0; i < 28; i++) {
            const cx = (rng() * 2 - 1) * 380,
              cz = (rng() * 2 - 1) * 380,
              cy = 100 + rng() * 40;
            const n = 3 + Math.floor(rng() * 2);
            for (let j = 0; j < n; j++) {
              K.push([14 + rng() * 18, 3 + rng() * 2.5, 8 + rng() * 6, 0xffffff, cx + (j - 1) * 11, cy + (j % 2) * 1.5, cz + (rng() - 0.5) * 6]);
            }
          }
          const m = new THREE.Mesh(vcBoxes(K), new THREE.MeshBasicMaterial({ vertexColors: true }));
          m.frustumCulled = false;
          scene.add(m);
        }

        // ---- sky dome that follows the camera ----
        const dome = new THREE.Mesh(
          new THREE.SphereGeometry(900, 20, 14),
          new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })
        );
        {
          const p = dome.geometry.attributes.position,
            col = new Float32Array(p.count * 3);
          const top = new THREE.Color(0x4f9fe8),
            hor = new THREE.Color(0xd6eefb),
            tmp = new THREE.Color();
          for (let i = 0; i < p.count; i++) {
            tmp.copy(hor).lerp(top, Math.pow(Math.max(0, p.getY(i) / 900), 0.55));
            col[i * 3] = tmp.r;
            col[i * 3 + 1] = tmp.g;
            col[i * 3 + 2] = tmp.b;
          }
          dome.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
          dome.renderOrder = -10;
          dome.frustumCulled = false;
          scene.add(dome);
        }

        return {
          collide,
          // 0 = corrupted outskirts, 1 = the whole world restored to lush green (ending cutscene)
          setCleansed(f) {
            f = Math.max(0, Math.min(1, f));
            if (Math.abs(f - groundFx.last) < 0.01 && f !== 0 && f !== 1) return;
            groundFx.last = f;
            if (groundFx.attr) {
              const a = groundFx.attr.array, b = groundFx.base, c = groundFx.clean;
              for (let i = 0; i < a.length; i++) a[i] = b[i] + (c[i] - b[i]) * f;
              groundFx.attr.needsUpdate = true;
            }
            const tint = new THREE.Color(), tt = { c: 0 };
            for (const L of forest.layers) {
              forest.trees.forEach((t, i) => {
                tt.x = t.x; tt.z = t.z; tt.s = t.s; tt.c = t.c * (1 - f);
                L.mesh.setColorAt(i, L.color(tt, tint));
              });
              if (L.mesh.instanceColor) L.mesh.instanceColor.needsUpdate = true;
            }
          },
          setCampPure(i, on) {
            const c = campViews[i];
            if (!c) return;
            layout.camps[i].pure = on;
            c.glow.visible = !on;
            c.pLit.visible = on;
            c.pGlow.visible = on;
          },
          update(t, camPos) {
            dome.position.copy(camPos);
            glowMat.color.setScalar(0.82 + 0.18 * Math.sin(t * 3.1));
          },
        };
      }

      // ====================================================================
      // DEMONS
      // ====================================================================
      const angLerp = (a, b2, t) => {
        const d = ((((b2 - a + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) - Math.PI;
        return a + d * t;
      };

      const DEMON_TYPES = [
        { name: 'Imp', scale: 0.8, hp: 3, speed: 8.6, dmg: 4, atkRate: 1.0, reach: 3.9, aggro: 34, radius: 1.9, height: 6, pts: 10, heal: 3 },
        { name: 'Oni', scale: 0.8, hp: 14, speed: 6.0, dmg: 9, atkRate: 1.4, reach: 6.4, aggro: 30, radius: 3.6, height: 12.5, pts: 40, heal: 8 },
        { name: 'Demon King', scale: 1.5, hp: 180, speed: 5.0, dmg: 16, atkRate: 2.0, reach: 9.5, aggro: 44, radius: 5.6, height: 24, pts: 300, heal: 40 },
      ];

      // Voxel demons built from boxes (feet at y = 0, face toward +z), split into rigid parts so they can
      // be animated: body (torso + head), armA/armB (+tail for the imp), legA/legB. A = +x side, B = -x side.
      // Each part has a pivot (shoulder / hip / tail root); its boxes are stored relative to that pivot.
      function demonParts(kind) {
        const parts = {};
        const P = (name, pivot) => (parts[name] = { name, pivot, boxes: [] });
        const put = (name, w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) => {
          const pt = parts[name], pv = name === 'body' ? [0, 0, 0] : pt.pivot;
          pt.boxes.push([w, h, d, color, x - pv[0], y - pv[1], z - pv[2], rx, ry, rz]);
        };
        const black = 0x2a0a0a;
        if (kind === 0) {
          const skin = 0xc23a3a, dark = 0x7d1f2a, belly = 0xf08a4b, horn = 0xf0e6d0, eye = 0xffe14a;
          P('body', [0, 1.7, 0]);
          P('armA', [1.85, 3.8, 0.1]); P('armB', [-1.85, 3.8, 0.1]);
          P('legA', [0.75, 1.7, 0]); P('legB', [-0.75, 1.7, 0]);
          P('tail', [0, 2.4, -0.9]);
          [['A', 1], ['B', -1]].forEach(([n, s]) => {
            put('leg' + n, 0.9, 1.7, 0.9, dark, 0.75 * s, 0.85, 0);
            put('leg' + n, 1.1, 0.4, 1.5, 0x3a1218, 0.75 * s, 0.2, 0.3);
            put('arm' + n, 0.8, 2.0, 0.8, skin, 1.85 * s, 2.8, 0.1, -0.25, 0, 0.15 * s);
            put('arm' + n, 0.9, 0.6, 0.9, dark, 1.95 * s, 1.7, 0.4);
            put('body', 0.6, 0.35, 0.12, eye, 0.75 * s, 5.25, 1.24);
            put('body', 0.2, 0.28, 0.14, black, 0.75 * s, 5.22, 1.25);
            put('body', 0.55, 1.5, 0.55, horn, 1.0 * s, 6.75, 0, 0, 0, -0.3 * s);
            put('body', 0.4, 0.9, 0.9, skin, 1.65 * s, 5.5, 0, 0, 0, -0.5 * s);
            put('body', 0.25, 0.35, 0.14, horn, 0.45 * s, 4.2, 1.26);
          });
          put('body', 2.8, 2.2, 1.8, skin, 0, 2.8, 0);
          put('body', 1.5, 1.3, 0.12, belly, 0, 2.6, 0.95);
          put('body', 2.8, 2.4, 2.4, skin, 0, 5.0, 0);
          put('body', 1.4, 0.4, 0.12, black, 0, 4.4, 1.24);
          put('tail', 0.45, 0.45, 2.2, skin, 0, 2.2, -1.9, 0.5, 0, 0);
          put('tail', 0.8, 0.8, 0.8, dark, 0, 3.05, -2.95, 0.5, 0, 0.785);
          return parts;
        }
        const boss = kind === 2;
        const skin = boss ? 0x6a3a8a : 0x4f6fb0,
          dark = boss ? 0x45255e : 0x354e86,
          cloth = boss ? 0x2a2230 : 0xe0a82e,
          hornC = boss ? 0xffe9b0 : 0xf0e6d0,
          eyeC = boss ? 0xff3030 : 0xffe14a;
        P('body', [0, 4.2, 0]);
        P('armA', [4.1, 9.2, 0.3]); P('armB', [-4.1, 9.2, 0.3]);
        P('legA', [1.4, 4.2, 0]); P('legB', [-1.4, 4.2, 0]);
        [['A', 1], ['B', -1]].forEach(([n, s]) => {
          put('leg' + n, 2.2, 4.2, 2.2, dark, 1.4 * s, 2.1, 0);
          put('leg' + n, 2.6, 0.9, 3.2, 0x2a1a1a, 1.4 * s, 0.45, 0.5);
          put('body', 2.4, 2.2, 2.4, dark, 3.9 * s, 10.0, 0);
          put('arm' + n, 1.8, 4.4, 1.8, skin, 4.1 * s, 7.0, 0.3);
          put('arm' + n, 2.0, 1.8, 2.0, dark, 4.1 * s, 4.3, 0.6);
          put('body', 0.8, 0.5, 0.14, eyeC, 1.0 * s, 12.8, 1.76);
          put('body', 0.3, 0.3, 0.16, black, 1.0 * s, 12.75, 1.77);
          put('body', 1.3, 0.35, 0.16, dark, 1.0 * s, 13.45, 1.76, 0, 0, 0.3 * s);
          put('body', 0.4, 1.0, 0.4, hornC, 0.8 * s, 11.2, 1.8);
          put('body', 0.8, 2.4, 0.8, hornC, 1.3 * s, 14.9, 0, 0, 0, -0.25 * s);
        });
        put('body', 6.0, 1.8, 3.8, cloth, 0, 4.9, 0);
        for (let i = -2; i <= 2; i++) put('body', 0.55, 1.85, 3.85, boss ? 0xf2b230 : 0x2a1a10, i * 1.1, 4.9, 0);
        put('body', 6.2, 0.4, 4.0, 0x4a3020, 0, 5.95, 0);
        put('body', 5.8, 4.6, 3.6, skin, 0, 8.4, 0);
        put('body', 4.2, 0.45, 0.12, dark, 0, 9.5, 1.86);
        put('body', 4.2, 0.45, 0.12, dark, 0, 8.2, 1.86);
        put('body', 0.45, 3.4, 0.12, dark, 0, 8.6, 1.86);

        put('armB', 0.9, 7.0, 0.9, 0x5a3a2a, -4.1, 6.0, 2.0);
        put('armB', 2.4, 3.6, 2.4, 0x4a4a52, -4.1, 10.2, 2.0);
        [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([a, b2]) => put('armB', 0.6, 0.6, 0.6, 0xb0b0ba, -4.1 + a * 1.3, 10.2 + b2 * 1.3, 2.0 + a * b2 * 1.3));
        if (boss) {
          [1, -1].forEach((s) => {
            put('body', 0.7, 3.0, 0.7, hornC, 2.4 * s, 14.7, 0, 0, 0, -0.7 * s);
            put('body', 0.6, 1.8, 0.6, hornC, 4.5 * s, 11.9, 0);
          });
          put('body', 1.0, 1.8, 1.0, hornC, 0, 15.0, 0);
          put('body', 4.6, 3.2, 0.2, 0xf2b230, 0, 8.6, 1.9);
          put('body', 5.2, 7, 0.5, 0x2a1030, 0, 8.6, -2.1);
        }
        return parts;
      }

      // ====================================================================
      // GAMEPLAY: roaming demons, auto purification beads, and the special skill
      // "Namo Gatling Bodhisattva" (a 5 second storm of golden prayer beads).
      // ====================================================================
      // ---------- audio: background music + sound effects (Web Audio, assets from the asset map) ----------
      function createAudio() {
        const IDS = ['bgm_journey', 'sfx_gatling_loop', 'sfx_skill_start', 'sfx_purify', 'sfx_hurt', 'sfx_victory', 'sfx_ogre_roar', 'sfx_ogre_slam', 'sfx_muyu_tok', 'sfx_bass_drop'];
        let ctx = null, master = null, bgmGain = null, bgmSrc = null, bgmDuck = 1;
        let muted = false, loading = false, destroyed = false;
        const buffers = {}, loops = {}, last = {};
        const wantLoop = {};
        const Ctor = window.AudioContext || window.webkitAudioContext;

        function assetUrl(id) {
          try { const a = typeof lib !== 'undefined' && lib.getAsset ? lib.getAsset(id) : null; return a && a.url ? a.url : null; } catch (e) { return null; }
        }
        async function loadAll() {
          if (loading || !ctx) return;
          loading = true;
          await Promise.all(IDS.map(async (id) => {
            try {
              const url = assetUrl(id);
              if (!url) return;
              const res = await fetch(url);
              const data = await res.arrayBuffer();
              buffers[id] = await new Promise((ok, no) => ctx.decodeAudioData(data, ok, no));
            } catch (e) {}
          }));
          if (destroyed) return;
          refresh();
        }
        function unlock() {
          if (destroyed || !Ctor) return;
          try {
            if (!ctx) {
              ctx = new Ctor();
              master = ctx.createGain();
              master.gain.value = muted ? 0 : 0.9;
              master.connect(ctx.destination);
              bgmGain = ctx.createGain();
              bgmGain.gain.value = 0.32 * bgmDuck;
              bgmGain.connect(master);
            }
            if (ctx.state !== 'running') ctx.resume();
            loadAll();
          } catch (e) {}
        }
        const evs = ['pointerup', 'pointerdown', 'touchend', 'click', 'keydown'];
        evs.forEach((ev) => window.addEventListener(ev, unlock, true));

        function startLoopNode(name, id, vol) {
          const b = buffers[id];
          if (!b || !ctx || loops[name]) return;
          const src = ctx.createBufferSource();
          src.buffer = b;
          src.loop = true;
          const g = ctx.createGain();
          g.gain.value = 0;
          g.gain.setTargetAtTime(vol, ctx.currentTime, 0.04);
          src.connect(g);
          g.connect(master);
          src.start(0);
          loops[name] = { src, g };
        }
        function stopLoopNode(name) {
          const l = loops[name];
          if (!l) return;
          delete loops[name];
          try {
            l.g.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
            l.src.stop(ctx.currentTime + 0.3);
          } catch (e) {}
        }
        function refresh() {
          if (!ctx || destroyed) return;
          if (wantLoop.bgm && !bgmSrc && buffers.bgm_journey) {
            bgmSrc = ctx.createBufferSource();
            bgmSrc.buffer = buffers.bgm_journey;
            bgmSrc.loop = true;
            bgmSrc.connect(bgmGain);
            bgmSrc.start(0);
          }
          for (const name of ['gat']) {
            const w = wantLoop[name];
            if (w && !loops[name]) startLoopNode(name, w.id, w.vol);
            else if (!w && loops[name]) stopLoopNode(name);
          }
        }
        function onVis() {
          if (!ctx) return;
          try { if (document.hidden) ctx.suspend(); else if (!muted) ctx.resume(); } catch (e) {}
        }
        document.addEventListener('visibilitychange', onVis);

        return {
          play(id, vol, rate, minGap) {
            if (!ctx || !buffers[id] || muted || destroyed) return;
            const now = ctx.currentTime;
            if (minGap && last[id] !== undefined && now - last[id] < minGap) return;
            last[id] = now;
            const src = ctx.createBufferSource();
            src.buffer = buffers[id];
            src.playbackRate.value = rate || 1;
            const g = ctx.createGain();
            g.gain.value = vol === undefined ? 1 : vol;
            src.connect(g);
            g.connect(master);
            src.start(0);
          },
          music(on) { wantLoop.bgm = !!on; if (on) refresh(); },
          loop(name, id, vol, on) { wantLoop[name] = on ? { id, vol } : null; refresh(); },
          duck(on) {
            bgmDuck = on ? 0.45 : 1;
            if (bgmGain) bgmGain.gain.setTargetAtTime(0.32 * bgmDuck, ctx.currentTime, 0.15);
          },
          setMuted(m) {
            muted = !!m;
            if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.03);
          },
          isMuted: () => muted,
          destroy() {
            destroyed = true;
            evs.forEach((ev) => window.removeEventListener(ev, unlock, true));
            document.removeEventListener('visibilitychange', onVis);
            try { if (ctx) ctx.close(); } catch (e) {}
          },
        };
      }

      function createGameplay({ scene, camera, tang, S, world, layout, ui, getYaw, sfx }) {
        const rng = mulberry32(4242);
        const tp = tang.position;
        const SKILL = { cd: 14, dur: 5, rate: 24, range: 44, dmg: 1.4 };
        const BASIC = { range: 28, rate: 0.45, dmg: 1.5 };

        // ---------- demon population ----------
        const demons = [];
        const addDemon = (kind, x, z, hx, hz, wander) => {
          demons.push({
            id: demons.length, kind, x, z, hx, hz, ox: x, oz: z, wander, hp: DEMON_TYPES[kind].hp, state: 'idle',
            purifyT: 0, face: rng() * 6.28, phase: rng() * 6.28, flash: 0, atkCd: 0.4 + rng(), lunge: 0,
            atkT: -1, atkHit: false, wph: rng() * 6.28, wb: 0, ws: 0, hit: 0,
            wanderT: rng() * 3, tx: x, tz: z, mv: false, hidden: false, slot: 0, camp: -1, ocamp: -1, ohx: hx, ohz: hz,
          });
        };
        for (const c of layout.camps) {
          const n0 = demons.length;
          for (let i = 0; i < 7; i++) {
            const a = rng() * Math.PI * 2, r = 9 + rng() * 17;
            addDemon(0, c.x + Math.cos(a) * r, c.z + Math.sin(a) * r, c.x, c.z, 20);
          }
          for (let i = 0; i < 3; i++) {
            const a = rng() * Math.PI * 2, r = 7 + rng() * 14;
            addDemon(1, c.x + Math.cos(a) * r, c.z + Math.sin(a) * r, c.x, c.z, 16);
          }
          if (c.boss) addDemon(2, c.x - c.fx * 9, c.z - c.fz * 9, c.x, c.z, 8);
          for (let k = n0; k < demons.length; k++) { demons[k].camp = c.id; demons[k].ocamp = c.id; }
        }
        // a few guards just outside the monastery gate so the first fight is close
        [[-20, 102], [24, 114], [-10, 132], [32, 100]].forEach(([x, z]) => addDemon(0, x, z, x, z, 14));
        // wandering loners across the map
        for (let n = 0, guard = 0; n < 14 && guard < 6000; guard++) {
          const x = (rng() * 2 - 1) * 232, z = (rng() * 2 - 1) * 232;
          if (inRect(x, z, MON, 60) || inRect(x, z, LAKE, 10)) continue;
          if (layout.camps.some((c) => Math.hypot(c.x - x, c.z - z) < CAMP_R + 25)) continue;
          addDemon(0, x, z, x, z, 38);
          n++;
        }
        const TOTAL = demons.length;

        const white = new THREE.Color(1, 1, 1);
        const hideMat = new THREE.Matrix4().makeScale(0, 0, 0);
        const dummy = new THREE.Object3D();
        dummy.rotation.order = 'YXZ';
        const plain = new THREE.Object3D();
        const rigs = DEMON_TYPES.map((T0, kind) => {
          const n = Math.max(1, demons.filter((d) => d.kind === kind).length);
          const def = demonParts(kind);
          const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
          const rig = { body: null, parts: {} };
          for (const name of Object.keys(def)) {
            const m = new THREE.InstancedMesh(vcBoxes(def[name].boxes), mat, n);
            m.frustumCulled = false;
            for (let i = 0; i < n; i++) m.setMatrixAt(i, hideMat);
            m.setColorAt(0, white);
            scene.add(m);
            rig.parts[name] = { mesh: m, pivot: def[name].pivot };
          }
          return rig;
        });
        const meshes = rigs.flatMap((r) => Object.values(r.parts).map((p) => p.mesh));
        const slotN = [0, 0, 0];

              }
            }
          }
          // blessed ground: demons cannot enter the monastery; stay inside the world
          for (const d of alive) {
            if (inRect(d.x, d.z, MON, 1.5)) {
              const l = d.x - MON.x0, r = MON.x1 - d.x, t = d.z - MON.z0, bt = MON.z1 - d.z, m = Math.min(l, r, t, bt);
              if (m === l) d.x = MON.x0 - 1.5; else if (m === r) d.x = MON.x1 + 1.5; else if (m === t) d.z = MON.z0 - 1.5; else d.z = MON.z1 + 1.5;
            }
            d.x = Math.max(-240, Math.min(240, d.x));
            d.z = Math.max(-240, Math.min(240, d.z));
          }
          for (const d of demons) if (d.state !== 'dead') writeDemon(d);
          for (const m of meshes) { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
        }

        function updateBullets(dt) {
          for (let i = 0; i < MAXB; i++) {
            const b2 = bullets[i];
            if (!b2.on) continue;
            b2.life -= dt;
            let hit = false;
            if (b2.tgt && !targetable(b2.tgt)) b2.tgt = nearestList(b2.x, b2.z, 40, 1)[0] || null;
            if (b2.tgt) {
              const T0 = DEMON_TYPES[b2.tgt.kind];
              const ax = b2.tgt.x - b2.x, ay = T0.height * 0.5 - b2.y, az = b2.tgt.z - b2.z, dist = Math.hypot(ax, ay, az) || 1;
              if (dist < T0.radius * 0.7 + 0.7) hit = true;
              else {
                const vl = Math.hypot(b2.vx, b2.vy, b2.vz) || 1, k = Math.min(1, dt * 9);
                let nx = b2.vx / vl + (ax / dist - b2.vx / vl) * k, ny = b2.vy / vl + (ay / dist - b2.vy / vl) * k, nz = b2.vz / vl + (az / dist - b2.vz / vl) * k;
                const nl = Math.hypot(nx, ny, nz) || 1;
                b2.vx = (nx / nl) * b2.speed; b2.vy = (ny / nl) * b2.speed; b2.vz = (nz / nl) * b2.speed;
              }
            }
            b2.x += b2.vx * dt; b2.y += b2.vy * dt; b2.z += b2.vz * dt;
            if (hit) {
              sparks(b2.x, b2.y, b2.z, b2.big ? 2 : 4);
              damageDemon(b2.tgt, b2.dmg);
              b2.on = false;
              bMesh.setMatrixAt(i, hideMat);
              continue;
            }
            if (b2.life <= 0 || b2.y < 0) {
              b2.on = false;
              bMesh.setMatrixAt(i, hideMat);
              continue;
            }
            if (b2.big && rng() < 0.55) emit(b2.x, b2.y, b2.z, 0, 0, 0, 0.25, 0.5, 0xffd45a, 0, false);
            const sc = b2.big ? 1.9 : 1.15;
            plain.position.set(b2.x, b2.y, b2.z);
            plain.scale.set(sc, sc, sc);
            plain.updateMatrix();
            bMesh.setMatrixAt(i, plain.matrix);
          }
          bMesh.instanceMatrix.needsUpdate = true;
        }

        function updateParticles(dt) {
          for (let i = 0; i < MAXP; i++) {
            const p = parts[i];
            if (!p.on) continue;
            p.life -= dt;
            if (p.life <= 0) { p.on = false; pMesh.setMatrixAt(i, hideMat); continue; }
            p.vy += p.grav * dt;
            p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
            if (p.y < 0.1) { p.y = 0.1; p.vy = 0; p.vx *= 0.9; p.vz *= 0.9; }
            p.rx += p.sx * dt; p.ry += p.sy * dt;
            const f = Math.min(1, p.life / p.max / 0.4), s = p.size * f;
            plain.position.set(p.x, p.y, p.z);
            plain.rotation.set(p.rx, p.ry, 0);
            if (p.flat) plain.scale.set(s, s * 0.18, s * 0.7); else plain.scale.set(s, s, s);
            plain.updateMatrix();
            pMesh.setMatrixAt(i, plain.matrix);
          }
          plain.rotation.set(0, 0, 0);
          pMesh.instanceMatrix.needsUpdate = true;
          if (colorDirty && pMesh.instanceColor) { pMesh.instanceColor.needsUpdate = true; colorDirty = false; }
        }

        function updateBars() {
          let nb = 0;
          camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
          for (const d of demons) {
            if (nb >= MAXBARS) break;
            if (!targetable(d)) continue;
            const T0 = DEMON_TYPES[d.kind];
            if (d.hp >= T0.hp && !(d.kind === 2 && d.state === 'chase')) continue;
            const ratio = Math.max(0, d.hp / T0.hp);
            const w = d.kind === 0 ? 3.8 : d.kind === 1 ? 6.5 : 15, hh = d.kind === 2 ? 1.1 : 0.55;
            const px = d.x, py = T0.height + 1.4, pz = d.z;
            plain.quaternion.copy(camera.quaternion);
            plain.position.set(px, py, pz);
            plain.scale.set(w, hh, 1);
            plain.updateMatrix();
            barBg.setMatrixAt(nb, plain.matrix);
            const fw = Math.max(0.001, w * ratio);
            plain.position.set(px - camRight.x * (w - fw) / 2, py - camRight.y * (w - fw) / 2, pz - camRight.z * (w - fw) / 2);
            plain.scale.set(fw, hh * 0.72, 1);
            plain.updateMatrix();
            barFill.setMatrixAt(nb, plain.matrix);
            barFill.setColorAt(nb, tint.set(ratio > 0.5 ? 0x66e07a : ratio > 0.25 ? 0xf2c230 : 0xe5483c));
            nb++;
          }
          plain.quaternion.identity();
          barBg.count = barFill.count = nb;
          barBg.instanceMatrix.needsUpdate = barFill.instanceMatrix.needsUpdate = true;
          if (barFill.instanceColor) barFill.instanceColor.needsUpdate = true;
        }

        function drawMini() {
          const c = ui.miniCtx, W = 176, R = 88, scale = R / 150;
          const yaw = getYaw(), cs = Math.cos(yaw), sn = Math.sin(yaw);
          const map = (x, z) => {
            const dx = x - tp.x, dz = z - tp.z;
            return [R + (dx * cs - dz * sn) * scale, R - (-dx * sn - dz * cs) * scale];
          };
          c.clearRect(0, 0, W, W);
          c.save();
          c.beginPath(); c.arc(R, R, R - 2, 0, Math.PI * 2); c.clip();
          c.fillStyle = 'rgba(46,70,44,0.92)'; c.fillRect(0, 0, W, W);
          const poly = (r, fill, stroke) => {
            c.beginPath();
            [[r.x0, r.z0], [r.x1, r.z0], [r.x1, r.z1], [r.x0, r.z1]].forEach(([x, z], i) => { const [mx, my] = map(x, z); if (i) c.lineTo(mx, my); else c.moveTo(mx, my); });
            c.closePath();
            if (fill) { c.fillStyle = fill; c.fill(); }
            if (stroke) { c.strokeStyle = stroke; c.lineWidth = 2; c.stroke(); }
          };
          poly(LAKE, 'rgba(79,147,184,0.9)');
          poly({ x0: -HALF, x1: HALF, z0: -HALF, z1: HALF }, null, 'rgba(255,255,255,0.35)');
          c.beginPath();
          const [rx0, ry0] = map(0, 76), [rx1, ry1] = map(0, HALF);
          c.moveTo(rx0, ry0); c.lineTo(rx1, ry1);
          c.strokeStyle = 'rgba(217,200,160,0.9)'; c.lineWidth = 3; c.stroke();
          c.strokeStyle = 'rgba(217,200,160,0.75)'; c.lineWidth = 2.5;
          for (const [x1, z1, x2, z2] of layout.roads) { const [ax, ay] = map(x1, z1), [bx, by] = map(x2, z2); c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke(); }
          for (const cp of layout.camps) {
            const [mx, my] = map(cp.x, cp.z);
            c.fillStyle = cp.pure ? 'rgba(255,225,120,0.55)' : cp.theme === 0 ? 'rgba(220,210,180,0.4)' : cp.theme === 1 ? 'rgba(255,90,30,0.4)' : 'rgba(110,230,70,0.38)';
            c.beginPath(); c.arc(mx, my, CAMP_R * 0.85 * scale, 0, Math.PI * 2); c.fill();
          }
          poly(MON, 'rgba(242,178,48,0.55)', 'rgba(255,225,140,0.95)');
          for (const d of demons) {
            if (!targetable(d)) continue;
            const [mx, my] = map(d.x, d.z);
            if (mx < -4 || my < -4 || mx > W + 4 || my > W + 4) continue;
            c.fillStyle = d.kind === 2 ? '#c06bff' : d.kind === 1 ? '#ff9a3c' : '#ff4a3a';
            c.beginPath(); c.arc(mx, my, d.kind === 2 ? 5 : d.kind === 1 ? 3.4 : 2.4, 0, Math.PI * 2); c.fill();
          }
          // pointer to the closest demon when it is off the map
          let best = null, bd = 1e9;
          for (const d of demons) if (targetable(d)) { const dd = Math.hypot(d.x - tp.x, d.z - tp.z); if (dd < bd) { bd = dd; best = d; } }
          if (best && bd > 140) {
            const [mx, my] = map(best.x, best.z), ang = Math.atan2(my - R, mx - R);
            c.save(); c.translate(R + Math.cos(ang) * (R - 11), R + Math.sin(ang) * (R - 11)); c.rotate(ang);
            c.fillStyle = '#ffe27a'; c.beginPath(); c.moveTo(7, 0); c.lineTo(-5, -5); c.lineTo(-5, 5); c.closePath(); c.fill(); c.restore();
          }
          // Tang
          const hy = tang.rotation.y, hx = Math.sin(hy), hz = Math.cos(hy);
          const sx = hx * cs - hz * sn, sy = -(-hx * sn - hz * cs), ha = Math.atan2(sy, sx);
          c.save(); c.translate(R, R); c.rotate(ha);
          c.fillStyle = '#fff'; c.strokeStyle = '#3a1608'; c.lineWidth = 1.5;
          c.beginPath(); c.moveTo(8, 0); c.lineTo(-5, -5.5); c.lineTo(-2.5, 0); c.lineTo(-5, 5.5); c.closePath(); c.fill(); c.stroke(); c.restore();
          // north marker
          c.fillStyle = 'rgba(255,255,255,0.85)'; c.font = '900 13px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText('U', R + sn * (R - 10), R - cs * (R - 10));
          c.restore();
          c.beginPath(); c.arc(R, R, R - 1.5, 0, Math.PI * 2); c.strokeStyle = 'rgba(242,178,48,0.9)'; c.lineWidth = 2; c.stroke();
        }

        function update(dt) {
          clock += dt;
          const safe = tangSafe();
          if (!game.dead && !game.victory) game.time += dt;
          game.invuln = Math.max(0, game.invuln - dt);
          game.sinceHit += dt;

          // regeneration: fast inside the monastery, slow after a calm moment elsewhere
          if (!game.dead && !game.victory) {
            if (safe) game.hp = Math.min(game.maxHp, game.hp + 28 * dt);
            else if (game.sinceHit > 5) game.hp = Math.min(game.maxHp, game.hp + 3 * dt);
          }

          // skill state
          if (game.casting) {
            game.castT -= dt;
            game.tgtT -= dt;
            if (game.tgtT <= 0) { game.tgtT = 0.12; game.castTargets = nearestList(tp.x, tp.z, SKILL.range, 6); }
            game.fireT += dt;
            const step = 1 / SKILL.rate;
            while (game.fireT >= step) { game.fireT -= step; fireGatling(); }
            if (game.castT <= 0) endCast();
          } else if (game.skillCd > 0) game.skillCd = Math.max(0, game.skillCd - dt);
          if (game.muyu) {
            const prev = game.muyuT;
            game.muyuT += dt;
            const ks = MUYU.knocks;
            while (game.muyuK < ks.length && game.muyuT >= ks[game.muyuK]) {
              game.muyuK++;
              sfx.play('sfx_muyu_tok', 0.9, 0.9 + game.muyuK * 0.08, 0);
              muyuPunch = 0.6;
            }
            if (prev < MUYU.final && game.muyuT >= MUYU.final) { game.muyuK++; muyuBlast(); }
            if (game.muyuT >= MUYU.dur) { game.muyu = false; S.muyu = 0; game.skill2Cd = MUYU.cd; }
          } else if (game.skill2Cd > 0) game.skill2Cd = Math.max(0, game.skill2Cd - dt);
          if (game.muyu || muyuPunch > 0.01) {
            muyu.visible = game.muyu || muyuPunch > 0.2;
            const f = Math.min(1, game.muyuT / 0.3), out = game.muyu ? 1 : 0;
            const ya = tang.rotation.y;
            muyu.position.set(tp.x + Math.sin(ya) * 9, 0, tp.z + Math.cos(ya) * 9);
            muyu.rotation.y = ya;
            const sc = 1.25 * (0.2 + 0.8 * Math.min(1, f * 1.4)) * out * (1 + 0.28 * muyuPunch) + (out ? 0 : 0.0001);
            muyu.scale.setScalar(Math.max(0.0001, sc));
            muyuPunch = Math.max(0, muyuPunch - dt * 5);
            S.punch = Math.min(1, muyuPunch);
          } else muyu.visible = false;
          if (waveT < 1) {
            waveT += dt * 1.8;
            const r = 2 + waveT * MUYU.range;
            wave.visible = true;
            wave.position.set(waveX, 0.5, waveZ);
            wave.scale.set(r, r, r);
            waveMat.opacity = Math.max(0, 0.9 * (1 - waveT));
          } else wave.visible = false;

          // basic auto purification bead
          game.basicCd -= dt;
          if (game.basicCd <= 0 && !game.casting && !game.dead && !game.victory) {
            const t = nearestList(tp.x, tp.z, BASIC.range, 1)[0];
            if (t) { fireBasic(t); game.basicCd = BASIC.rate; } else game.basicCd = 0.1;
          }

          updateDemons(dt, safe);
          updateBullets(dt);
          updateParticles(dt);
          updateBars();

          // visuals tied to casting
          const cast = S.cast;
          if (game.casting) {
            for (let k = 0; k < 2; k++) {
              const a = clock * 9 + k * Math.PI;
              emit(tp.x + Math.cos(a) * 3.6, 0.4, tp.z + Math.sin(a) * 3.6, 0, 10 + rng() * 4, 0, 0.75, 0.42, 0xffe27a, 0, false);
            }
          }
          // Gatling gun: rises in front of Tang, barrels spin up while firing, muzzle flash flickers
          const gTarget = game.casting ? 1 : 0;
          gunScale += (gTarget - gunScale) * (1 - Math.exp(-dt * 12));
          gun.visible = gunScale > 0.03;
          if (gun.visible) {
            gun.scale.setScalar(GUN_S * gunScale);
            gunSpin += dt * (game.casting ? 34 : 6) * gunScale;
            barrels.rotation.z = gunSpin;
            gun.position.y = GUN_POS.y + 0.06 * Math.sin(clock * 55) * (game.casting ? 1 : 0);
            gun.rotation.x = game.casting ? -0.02 + 0.015 * Math.sin(clock * 47) : 0;
            const fl = game.casting ? 0.55 + 0.45 * Math.sin(clock * 90) * Math.sin(clock * 37) : 0;
            flashMat.opacity = Math.max(0, fl) * 0.85;
            flash.scale.setScalar(0.8 + 0.5 * Math.abs(Math.sin(clock * 70)));
          }
          mand.visible = cast > 0.02;
          if (mand.visible) {
            mand.position.set(tp.x, 0, tp.z);
            mand.rotation.y = tang.rotation.y;
            floorRing.rotation.y += dt * 1.6;
            halo.rotation.z -= dt * 1.2;
            goldMat.opacity = 0.85 * cast;
          }
          const fov = 47 + 3 * cast + 4 * S.run; // wide lens, widens a bit more while running
          if (Math.abs(camera.fov - fov) > 0.02) { camera.fov = fov; camera.updateProjectionMatrix(); }
          ui.setCastGlow(cast * 0.9);

          // HUD
          ui.setHP(game.hp, game.maxHp);
          if (game.casting) ui.setSkill('cast', game.castT / SKILL.dur, Math.ceil(game.castT));
          else if (game.skillCd > 0) ui.setSkill('cool', game.skillCd / SKILL.cd, Math.ceil(game.skillCd));
          else ui.setSkill('ready', 0, 0);
          if (game.muyu) ui.setSkill2('cast', 1 - game.muyuT / MUYU.dur, Math.ceil(MUYU.dur - game.muyuT));
          else if (game.skill2Cd > 0) ui.setSkill2('cool', game.skill2Cd / MUYU.cd, Math.ceil(game.skill2Cd));
          else ui.setSkill2('ready', 0, 0);
          nearT -= dt;
          if (nearT <= 0) {
            nearT = 0.3;
            let bd = 1e9;
            for (const d of demons) if (targetable(d)) bd = Math.min(bd, Math.hypot(d.x - tp.x, d.z - tp.z));
            ui.setNear(bd < 1e8 ? 'NEAREST DEMON: ' + Math.round(bd) + ' M' : '');
          }
          miniT -= dt;
          if (miniT <= 0) { miniT = 0.1; drawMini(); }
          if (saveDirty) { saveTimer -= dt; if (saveTimer <= 0) { saveDirty = false; saveNow(); } }
        }

        ui.setProgress(game.purified, TOTAL);
        ui.setHP(game.hp, game.maxHp);

        return {
          game,
          demons,
          damageDemon,
          update,
          activateSkill,
          activateSkill2,
          cineMuyu,
          cineBurst,
          cineCheer,
          showResult,
          hooks: gpHooks,
          indicatorTargets,
          tangSafe,
          canMove: () => !game.dead && !game.victory,
          speedMul: () => (game.muyu ? 0.15 : game.casting ? 0.4 : 1),
          faceYaw: () => {
            const t = game.casting ? game.castTargets.find(targetable) : null;
            return t ? Math.atan2(t.x - tp.x, t.z - tp.z) : null;
          },
          destroy() {
            document.removeEventListener('visibilitychange', onHide);
            window.removeEventListener('pagehide', onHide);
            sfx.loop('gat', 'sfx_gatling_loop', 0, false);
          },
        };
      }

      function skyPlane(top, bottom) {
        const g = new THREE.PlaneGeometry(120, 90);
        const n = g.attributes.position.count,
          a = new Float32Array(n * 3);
        g.setAttribute('color', new THREE.BufferAttribute(a, 3));
        const mesh = new THREE.Mesh(
          g,
          new THREE.MeshBasicMaterial({ vertexColors: true, depthWrite: false })
        );
        mesh.position.set(0, 18, -34);
        mesh.renderOrder = -1;
        mesh.userData.set = (t, bt) => {
          const ct = new THREE.Color(t),
            cb = new THREE.Color(bt),
            p = g.attributes.position,
            col = g.attributes.color;
          for (let i = 0; i < p.count; i++) {
            const c = p.getY(i) > 0 ? ct : cb;
            col.setXYZ(i, c.r, c.g, c.b);
          }
          col.needsUpdate = true;
        };
        mesh.userData.set(top, bottom);
        return mesh;
      }

      // No enemies or combat actors are part of this character exploration scene.

      const SKY_TOP = '#5FA8EE',
        SKY_BOT = '#D6EEFB',
        GRASS = '#7FB65A';
      const LEGACY = ['#4A6FA5', '#1a1a2e', '#5A6B55']; // old defaults stored in game_config.json
      const pick = (v, d) => (!v || LEGACY.includes(v) ? d : v);

      async function run(mode) {

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 5.6, 0);

        } else camera.position.set(0.34 * camDist, 6.8, 0.9 * camDist);

        controls.update();

        scene.add(new THREE.HemisphereLight(0xfff3e0, 0x8a9a6a, 2.3));
        const sun = new THREE.DirectionalLight(0xffe9c8, 2.8);
        sun.position.set(6, 14, 10);
        scene.add(sun);
        const rim = new THREE.DirectionalLight(0xbfdfff, 1.0);
        rim.position.set(-6, 8, -8);
        scene.add(rim);

        const sky = skyPlane(
          pick(config.background_top_color, SKY_TOP),
          pick(config.background_bottom_color, SKY_BOT)
        );
        scene.add(sky);
        const stone = new THREE.Mesh(
          vcBoxes([
            [15, 2.4, 15, C.stone, 0, -1.55, 0],
            [11, 1.2, 11, 0x7a746a, 0, -3.3, 0],
            [6, 1.4, 6, 0x6e695f, 0, -4.8, 0],
          ]),
          new THREE.MeshLambertMaterial({ vertexColors: true })
        );
        scene.add(stone);
        const grassMat = new THREE.MeshLambertMaterial({ color: pick(config.ground_color, GRASS) });
        const grass = new THREE.Mesh(new THREE.BoxGeometry(15.4, 0.34, 15.4), grassMat);
        grass.position.y = -0.17;
        scene.add(grass);
        const clouds = new THREE.Mesh(
          vcBoxes([
            [6, 1.4, 2.5, C.cloud, -22, 14, -26], [4, 1.1, 2.5, C.cloud, -19, 15, -26],
            [3, 0.9, 2.5, C.cloud, -25, 14.8, -26], [7, 1.5, 2.5, C.cloud, 22, 17, -28],
            [4, 1.1, 2.5, C.cloud, 19, 18.1, -28], [3, 0.9, 2.5, C.cloud, 26, 17.9, -28],
            [5, 1.2, 2.5, C.cloud, 4, 24, -34], [3, 0.9, 2.5, C.cloud, 7, 25, -34],
          ]),
          new THREE.MeshBasicMaterial({ vertexColors: true })
        );
        scene.add(clouds);
        const slabs = [];
        for (let k = -9; k <= 9; k++) slabs.push([2.6, 0.1, 1.5, k % 2 ? C.path : C.path2, 0, -0.02, k * 2]);
        const path = new THREE.Mesh(vcBoxes(slabs), new THREE.MeshLambertMaterial({ vertexColors: true }));
        scene.add(path);
        const blob = new THREE.Mesh(
          new THREE.CircleGeometry(2.3, 24),
          new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false })
        );
        blob.rotation.x = -Math.PI / 2;
