                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.size, fp.size * 0.4, 0, 0, Math.PI * 2);
                        ctx.stroke();
                        // Inner puddle
                        ctx.fillStyle = 'rgba(62, 39, 35, 0.4)';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.size * 0.5, fp.size * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                ctx.restore();
            }

            // Obstacles drawn separately for proper depth sorting
        }

        function drawRacer(racer) {
            const camOffset = (challengeMode === 'jumpacar') ? 0.18 : 0.3;
            const screenX = racer.x - cameraX + canvas.width * camOffset;
            const screenY = racer.y;

            if (screenX < -150 || screenX > canvas.width + 150) return;

            const imgId = racer.getImageId();
            let drawH = racer.height;
            let drawW = racer.width;

            // Chibi-style proportions adjustment
            const cachedAR = getAssetAspect(imgId);
            if (cachedAR) drawW = drawH * cachedAR;

            // Soft shadow under character
            const shadowScale = racer.state === 'airborne' ? 
                Math.max(0.4, 1 - Math.abs(racer.y - racer.groundY) / 200) : 1;
            const shadowAlpha = shadowScale * 0.2;
            ctx.save();
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
            ctx.beginPath();
            ctx.ellipse(screenX, racer.groundY + 5, drawW * 0.35 * shadowScale, 8 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Smooth animated transforms with interpolation
            let targetRot = 0;
            let targetSX = 1;
            let targetSY = 1;

            // Idle breathing animation
            const breath = Math.sin(racer.breathTimer) * 0.02;
            const idleBob = Math.sin(racer.breathTimer * 0.7) * 2;

            if (racer.state === 'tumbling') {
                const t = racer.tumbleTimer;
                if (racer.tumbleType === 'slide') {
                    // Gentle forward lean while sliding
                    const slideProgress = Math.min(1, t / 1.2);
                    targetRot = 0.25 * (1 - slideProgress) + Math.sin(t * 4) * 0.06;
                    targetSX = 1.0 + Math.sin(t * 5) * 0.03;
                    targetSY = 0.95 + slideProgress * 0.05;
                } else if (racer.tumbleType === 'mud_splat') {
                    // Soft forward stumble into mud, then gentle recovery
                    if (t < 0.25) {
                        // Gentle forward tilt
                        const fall = t / 0.25;
                        targetRot = fall * 0.6;
                        targetSX = 1.0 + fall * 0.1;
                        targetSY = 1.0 - fall * 0.15;
                    } else if (t < 0.7) {
                        // Soft wobble while stuck
                        const wobble = (t - 0.25) / 0.45;
                        targetRot = 0.6 * (1 - wobble * 0.5) + Math.sin(t * 6) * 0.08;
                        targetSX = 1.1 - wobble * 0.1;
                        targetSY = 0.85 + Math.sin(t * 5) * 0.03;
                    } else {
                        // Smooth recovery back to upright
                        const recovery = Math.min(1, (t - 0.7) / 0.6);
                        targetRot = 0.3 * (1 - recovery);
                        targetSX = 1.0;
                        targetSY = 0.88 + recovery * 0.12;
                    }
                } else if (racer.tumbleType === 'rock_trip') {
                    // Quick stumble forward, brief wobble, recover
                    if (t < 0.2) {
                        targetRot = (t / 0.2) * 0.5;
                        targetSX = 1.05;
                        targetSY = 0.92;
                    } else if (t < 0.6) {
                        const wobble = (t - 0.2) / 0.4;
                        targetRot = 0.5 * (1 - wobble) + Math.sin(t * 8) * 0.1;
                        targetSX = 1.0 + Math.sin(t * 7) * 0.04;
                        targetSY = 0.92 + wobble * 0.08;
                    } else {
                        const recovery = Math.min(1, (t - 0.6) / 0.5);
                        targetRot = 0.15 * (1 - recovery);
                        targetSX = 1.0;
                        targetSY = 1.0;
                    }
                } else {
                    // Generic fall: gentle tilt and soft bounce-back
                    if (t < 0.2) {
                        targetRot = (t / 0.2) * 0.4;
                        targetSX = 1.0 + (t / 0.2) * 0.08;
                        targetSY = 1.0 - (t / 0.2) * 0.1;
                    } else if (t < 0.5) {
                        const wobble = (t - 0.2) / 0.3;
                        targetRot = 0.4 * (1 - wobble * 0.6) + Math.sin(t * 7) * 0.08;
                        targetSX = 1.08 - wobble * 0.08;
                        targetSY = 0.9 + wobble * 0.05;
                    } else {
                        const recovery = Math.min(1, (t - 0.5) / 0.6);
                        targetRot = 0.16 * (1 - recovery);
                        targetSX = 1.0;
                        targetSY = 0.95 + recovery * 0.05;
                    }
                }
            } else if (racer.state === 'airborne') {
                const stretch = Math.min(Math.abs(racer.vy) * 0.0004, 0.35);
                targetSX = 1 - stretch;
                targetSY = 1 + stretch;
                targetRot = Math.sin(performance.now() * 0.008) * 0.06;
            } else if (racer.state === 'charging') {
                const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
                targetSX = 1 + chargeRatio * 0.35;
                targetSY = 1 - chargeRatio * 0.45;
                targetRot = Math.sin(performance.now() * (0.05 + chargeRatio * 0.15)) * (chargeRatio * 0.08);
            } else if (racer.state === 'balancing') {
                if (racer.mudWobble) {
                    // Gentle muddy wobble - arms out for balance
                    targetRot = Math.sin(performance.now() * 0.03) * 0.15;
                    targetSX = 1 + Math.sin(performance.now() * 0.04) * 0.04;
                    targetSY = 0.96 + Math.sin(performance.now() * 0.05) * 0.03;
                } else {
                    targetRot = Math.sin(performance.now() * 0.02) * 0.1;
                    targetSX = 1 + Math.sin(performance.now() * 0.03) * 0.02;
                    targetSY = 1;
                }
            } else if (racer.state === 'idle') {
                // Gentle idle breathing
                targetSX = 1 + breath;
                targetSY = 1 - breath;
                targetRot = Math.sin(racer.breathTimer * 0.5) * 0.015;
            }

            // Smooth interpolation for all transforms (frame-rate independent)
            const lerpFactor = smoothFactor(10);
            racer.currentScaleX += (targetSX - racer.currentScaleX) * lerpFactor;
            racer.currentScaleY += (targetSY - racer.currentScaleY) * lerpFactor;
            racer.currentRotation += (targetRot - racer.currentRotation) * lerpFactor;

            const scaleX = racer.currentScaleX;
            const scaleY = racer.currentScaleY;
            const rotation = racer.currentRotation;

            // Apply idle bob for grounded states
            const bobOffset = (racer.state === 'idle' || racer.state === 'balancing') ? idleBob : 0;

            // Apply body shake from expression reactions
            const shakeX = racer.bodyShakeX || 0;
            const shakeY = racer.bodyShakeY || 0;

            ctx.save();
            ctx.translate(screenX + shakeX, screenY - drawH * 0.5 * scaleY + bobOffset + shakeY);
            ctx.rotate(rotation);
            ctx.scale(scaleX, scaleY);
            
            // Draw character
            drawImage(imgId, 0, drawH * 0.5, drawW, drawH, false);

            // Procedural Sack Skins (Flower & Wave motifs)
            if (racer.isPlayer) {
                const time = performance.now() * 0.001;
                if (playerData.equippedSkin === 'flower_sack') {
                    ctx.save();
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.beginPath();
                    ctx.rect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);
                    ctx.clip();

                    // Soft warm cream-burlap background base
                    ctx.fillStyle = '#EFE5C9';
                    ctx.fillRect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);

                    // Gentle fabric texture lines
                    ctx.strokeStyle = '#DFD5B9';
                    ctx.lineWidth = 1;
                    for (let x = -drawW * 0.5; x < drawW * 0.5; x += 6) {
                        ctx.beginPath();
                        ctx.moveTo(x, -drawH * 0.1);
                        ctx.lineTo(x + 5, drawH * 0.5);
                        ctx.stroke();
                    }
                    for (let y = -drawH * 0.1; y < drawH * 0.5; y += 6) {
                        ctx.beginPath();
                        ctx.moveTo(-drawW * 0.5, y);
                        ctx.lineTo(drawW * 0.5, y + 5);
                        ctx.stroke();
                    }

                    // Repeating traditional batik flowers
                    const flowerSpacing = 24;
                    const cols = Math.ceil(drawW / flowerSpacing) + 1;
                    const rows = Math.ceil((drawH * 0.6) / flowerSpacing) + 1;
                    
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const fx = -drawW * 0.55 + c * flowerSpacing + (r % 2 === 0 ? flowerSpacing * 0.5 : 0);
                            const fy = -drawH * 0.15 + r * flowerSpacing;
                            
                            ctx.save();
                            ctx.translate(fx, fy);
                            
                            // 5 Petals
                            ctx.fillStyle = '#E91E63'; // Bright batik pink
                            for (let p = 0; p < 5; p++) {
                                const angle = (p / 5) * Math.PI * 2;
                                ctx.beginPath();
                                ctx.arc(Math.cos(angle) * 4, Math.sin(angle) * 4, 3.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            
                            // Center
                            ctx.fillStyle = '#FFEB3B'; // Gold/yellow
                            ctx.beginPath();
                            ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Little green leaves
                            ctx.fillStyle = '#4CAF50';
                            ctx.beginPath();
                            ctx.ellipse(-3, 3, 2, 1.2, Math.PI * 0.25, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.restore();
                        }
                    }
                    ctx.restore();
                } else if (playerData.equippedSkin === 'halloween_sack_skin') {
                    ctx.save();
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.beginPath();
                    ctx.rect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);
                    ctx.clip();
                    const halloweenSackGrad = ctx.createLinearGradient(0, -drawH * 0.1, 0, drawH * 0.5);
                    halloweenSackGrad.addColorStop(0, '#8E44AD');
                    halloweenSackGrad.addColorStop(0.55, '#6A1B9A');
                    halloweenSackGrad.addColorStop(1, '#3B1458');
                    ctx.fillStyle = halloweenSackGrad;
                    ctx.fillRect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);
                    ctx.strokeStyle = 'rgba(255,183,77,0.3)';
                    ctx.lineWidth = 1;
                    for (let wx = -drawW * 0.5; wx < drawW * 0.5; wx += 6) {
                        ctx.beginPath(); ctx.moveTo(wx, -drawH * 0.1); ctx.lineTo(wx + 4, drawH * 0.5); ctx.stroke();
                    }
                    for (let wy = -drawH * 0.1; wy < drawH * 0.5; wy += 7) {
                        ctx.beginPath(); ctx.moveTo(-drawW * 0.5, wy); ctx.lineTo(drawW * 0.5, wy + 4); ctx.stroke();
                    }
                    ctx.fillStyle = '#FF9800';
                    ctx.beginPath();
                    ctx.arc(0, drawH * 0.18, drawW * 0.19, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3B1458';
                    ctx.beginPath(); ctx.moveTo(-drawW * 0.11, drawH * 0.12); ctx.lineTo(-drawW * 0.04, drawH * 0.16); ctx.lineTo(-drawW * 0.11, drawH * 0.2); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(drawW * 0.11, drawH * 0.12); ctx.lineTo(drawW * 0.04, drawH * 0.16); ctx.lineTo(drawW * 0.11, drawH * 0.2); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.arc(-drawW * 0.06, drawH * 0.24, 2, 0, Math.PI * 2); ctx.arc(drawW * 0.06, drawH * 0.24, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#3B1458'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, drawH * 0.18, drawW * 0.1, 0.2, Math.PI - 0.2); ctx.stroke();
                    ctx.restore();
                } else if (playerData.equippedSkin === 'spider_sack') {
                    ctx.save();
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.beginPath();
                    ctx.rect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);
                    ctx.clip();

                    // Dark red base — karung goni merah tua
                    ctx.fillStyle = '#5C0A0A';
                    ctx.fillRect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);

                    // Subtle burlap weave texture
                    ctx.strokeStyle = 'rgba(100, 10, 10, 0.5)';
                    ctx.lineWidth = 0.8;
                    for (let wx = -drawW * 0.5; wx < drawW * 0.5; wx += 6) {
                        ctx.beginPath();
                        ctx.moveTo(wx, -drawH * 0.1);
                        ctx.lineTo(wx + 4, drawH * 0.5);
                        ctx.stroke();
                    }
                    for (let wy = -drawH * 0.1; wy < drawH * 0.5; wy += 6) {
                        ctx.beginPath();
                        ctx.moveTo(-drawW * 0.5, wy);
                        ctx.lineTo(drawW * 0.5, wy + 4);
                        ctx.stroke();
                    }

                    // === SPIDER WEB PATTERN ===
                    const webCenters = [
                        { cx: 0, cy: drawH * 0.15 },
                        { cx: -drawW * 0.38, cy: -drawH * 0.02 },
                        { cx: drawW * 0.38, cy: -drawH * 0.02 },
                        { cx: -drawW * 0.18, cy: drawH * 0.38 },
                        { cx: drawW * 0.18, cy: drawH * 0.38 }
                    ];

                    webCenters.forEach(wc => {
                        const maxR = drawW * 0.28;
                        const rings = 4;
                        const spokes = 8;
                        ctx.save();
                        ctx.translate(wc.cx, wc.cy);

                        // Spokes
                        ctx.strokeStyle = 'rgba(255, 80, 80, 0.75)';
                        ctx.lineWidth = 0.9;
                        for (let s = 0; s < spokes; s++) {
                            const ang = (s / spokes) * Math.PI * 2;
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(Math.cos(ang) * maxR, Math.sin(ang) * maxR);
                            ctx.stroke();
                        }

                        // Concentric web rings
                        ctx.strokeStyle = 'rgba(255, 130, 130, 0.65)';
                        ctx.lineWidth = 0.85;
                        for (let ring = 1; ring <= rings; ring++) {
                            const rr = (ring / rings) * maxR;
                            ctx.beginPath();
                            for (let s = 0; s <= spokes; s++) {
                                const ang = (s / spokes) * Math.PI * 2;
                                const px = Math.cos(ang) * rr;
                                const py = Math.sin(ang) * rr;
                                if (s === 0) ctx.moveTo(px, py);
                                else {
                                    const prevAng = ((s - 1) / spokes) * Math.PI * 2;
                                    const midAng = (prevAng + ang) / 2;
                                    ctx.quadraticCurveTo(
                                        Math.cos(midAng) * rr * 0.92,
                                        Math.sin(midAng) * rr * 0.92,
                                        px, py
                                    );
                                }
                            }
                            ctx.stroke();
                        }

                        // Center dot
                        ctx.fillStyle = 'rgba(255, 60, 60, 0.9)';
                        ctx.beginPath();
                        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });

                    // Sack edge shading (3D depth)
                    const spiderEdgeGrad = ctx.createLinearGradient(-drawW * 0.5, 0, drawW * 0.5, 0);
                    spiderEdgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
                    spiderEdgeGrad.addColorStop(0.12, 'rgba(0, 0, 0, 0)');
                    spiderEdgeGrad.addColorStop(0.88, 'rgba(0, 0, 0, 0)');
                    spiderEdgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                    ctx.fillStyle = spiderEdgeGrad;
                    ctx.fillRect(-drawW * 0.5, -drawH * 0.1, drawW, drawH * 0.6);

                    // Fold/crease lines
                    ctx.globalAlpha = 0.35;
                    ctx.strokeStyle = '#3A0505';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -drawH * 0.08);
                    ctx.quadraticCurveTo(2, drawH * 0.2, -1, drawH * 0.45);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-drawW * 0.25, -drawH * 0.05);
                    ctx.quadraticCurveTo(-drawW * 0.22, drawH * 0.15, -drawW * 0.27, drawH * 0.4);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(drawW * 0.25, -drawH * 0.05);
                    ctx.quadraticCurveTo(drawW * 0.22, drawH * 0.15, drawW * 0.27, drawH * 0.4);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // Mud stains (Irregular blobs) - intensity-based rendering
            if (racer.mudTimer > 0) {
                ctx.save();
                const stainAlpha = Math.min(1, racer.mudTimer) * (racer.mudIntensity || 0.5);
                ctx.globalAlpha = stainAlpha;
                racer.mudStains.forEach((stain, idx) => {
                    // Vary colors for more natural look
                    const mudColors = ['rgba(75, 54, 33, 0.8)', 'rgba(93, 64, 55, 0.7)', 'rgba(62, 39, 35, 0.75)'];
                    ctx.fillStyle = mudColors[idx % mudColors.length];
                    ctx.beginPath();
                    ctx.arc(stain.rx * drawW, stain.ry * drawH + drawH * 0.5, stain.size * (0.7 + stainAlpha * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                });
                // Dripping effect from bottom when heavily muddy
                if (racer.mudIntensity > 0.6) {
                    ctx.fillStyle = 'rgba(75, 54, 33, 0.5)';
                    const dripPhase = performance.now() * 0.003;
                    for (let d = 0; d < 3; d++) {
                        const dripY = drawH * 0.5 + Math.sin(dripPhase + d * 2) * 5 + d * 4;
                        const dripX = (d - 1) * drawW * 0.25;
                        ctx.beginPath();
                        ctx.ellipse(dripX, dripY, 3, 5 + Math.sin(dripPhase + d) * 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
            
            ctx.restore();

            // Charging meter for player
            if (racer.isPlayer && racer.state === 'charging') {
                const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
                const meterX = screenX;
                const meterY = screenY - drawH - 30;
                const meterW = 60;
                const meterH = 12;

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(meterX - meterW/2 - 2, meterY - 2, meterW + 4, meterH + 4);

                // Color based on charge
                let color;
                if (chargeRatio < 0.4) color = '#4CAF50';
                else if (chargeRatio < 0.75) color = '#FFC107';
                else color = '#F44336';

                ctx.fillStyle = color;
                ctx.fillRect(meterX - meterW/2, meterY, meterW * chargeRatio, meterH);

                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.strokeRect(meterX - meterW/2, meterY, meterW, meterH);
            }

            // Balance indicator
            if (racer.isPlayer && racer.state === 'balancing') {
                const wobble = Math.sin(racer.balanceTimer * 15) * 5;
                ctx.fillStyle = 'rgba(255,255,0,0.7)';
                ctx.font = '20px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ TAP!', screenX + wobble, screenY - drawH - 15);
            }

            // Recovery indicator
            if (racer.isPlayer && racer.state === 'tumbling') {
                ctx.fillStyle = 'rgba(255,100,100,0.9)';
                ctx.font = '18px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText(`TAP! (${Math.max(0, GET_RECOVERY_TAPS() - racer.recoveryTaps)})`, screenX, screenY - drawH - 15);
            }

            // Sack color tint for player (disabled if custom skin is equipped to prevent mixing)
            if (racer.isPlayer && config.playerSackColor && config.playerSackColor !== '#D2B48C' && !playerData.equippedSkin) {
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = config.playerSackColor;
                ctx.fillRect(screenX - drawW/2, screenY - drawH, drawW, drawH);
                ctx.restore();
            }

            // Draw equipped accessory on player (disabled if custom full outfit skin is equipped to avoid visual clashes)
            if (racer.isPlayer && playerData.equippedAccessory && (!playerData.equippedSkin || playerData.equippedSkin === 'flower_sack' || playerData.equippedSkin === 'spider_sack')) {
                drawEquippedAccessory(screenX, screenY, drawW, drawH, racer);
            }

            // Freeze visual effect (ice overlay on frozen racers)
            if (racer.isFrozen) {
                const freezeTime = performance.now() * 0.001;
                ctx.save();
                // Ice blue tint overlay
                ctx.globalAlpha = 0.4 + Math.sin(freezeTime * 3) * 0.1;
                ctx.fillStyle = '#B3E5FC';
                ctx.beginPath();
                ctx.ellipse(screenX, screenY - drawH * 0.5, drawW * 0.45, drawH * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Ice crystal sparkles
                ctx.globalAlpha = 0.7;
                for (let i = 0; i < 5; i++) {
                    const sparkX = screenX + Math.sin(freezeTime * 2 + i * 1.3) * drawW * 0.35;
                    const sparkY = screenY - drawH * 0.2 - i * drawH * 0.15 + Math.cos(freezeTime * 1.5 + i) * 5;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `${10 + Math.sin(freezeTime + i) * 3}px serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('❄️', sparkX, sparkY);
                }
                
                // Frozen timer bar above head
                const timerRatio = racer.frozenTimer / 5.0;
                const barW = 50;
                const barH = 6;
                const barX = screenX - barW / 2;
                const barY = screenY - drawH - 25;
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = '#4FC3F7';
                ctx.fillRect(barX, barY, barW * timerRatio, barH);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);
                
                ctx.restore();
            }

            // Draw facial expression overlays
            drawRacerExpression(racer, screenX + shakeX, screenY + bobOffset + shakeY, drawW, drawH);

            // Multiplayer name tag
            if (mp.active && (racer.mpName || racer.isPlayer)) {
                ctx.save();
                ctx.font = '600 22px Fredoka, sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 5;
                ctx.strokeStyle = 'rgba(0,0,0,0.7)';
                ctx.fillStyle = racer.isPlayer ? '#FFD54F' : '#FFFFFF';
                const tag = racer.isPlayer ? mp.name : racer.mpName;
                ctx.strokeText(tag, screenX, screenY - drawH - 8);
                ctx.fillText(tag, screenX, screenY - drawH - 8);
                ctx.restore();
            }
        }

        // Draw procedural expression indicators on racers
        function drawRacerExpression(racer, screenX, screenY, drawW, drawH) {
            if (racer.expression === 'neutral' && racer.sweatDrops.length === 0 && racer.reactionMarks.length === 0) return;
            
            const intensity = racer.expressionIntensity || 0;
            const time = performance.now() * 0.001;
            const headY = screenY - drawH * 0.85; // Top of head area
            const headX = screenX;

            ctx.save();

            // === EXPRESSION EMOTE BUBBLE (drawn above the character's head) ===
            if (intensity > 0.1) {
                const bubbleY = headY - 25; // Float above head
                const bubbleScale = 0.7 + intensity * 0.3;
                
                ctx.save();
                ctx.translate(headX + 22, bubbleY); // Offset to the right
                ctx.scale(bubbleScale, bubbleScale);
                ctx.globalAlpha = Math.min(1.0, intensity * 1.5);
                
                // Draw cute bubble background
                ctx.fillStyle = '#FFF9C4'; // Pale yellow to make white eyes pop
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fill();
                
                // Bubble tail pointing to character
                ctx.beginPath();
                ctx.moveTo(-12, 14);
                ctx.lineTo(-20, 24);
                ctx.lineTo(-4, 18);
                ctx.fill();
                
                ctx.strokeStyle = '#FBC02D'; // Darker yellow border
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.stroke();

                // Draw face slightly scaled down inside bubble
                ctx.scale(0.85, 0.85);
                ctx.translate(0, 2);

                if (racer.expression === 'shocked') {
                    // Wide eyes + open mouth
                    // Left eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(-8, -4, 7, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(-8, -3 + Math.sin(time * 8) * 0.5, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Right eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(8, -4, 7, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(8, -3 + Math.sin(time * 8) * 0.5, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Open mouth (O shape)
                    ctx.fillStyle = '#8B4513';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 5 + Math.sin(time * 6) * 0.8, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#5D2906';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 3, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (racer.expression === 'nervous') {
                    // Worried eyes + wobbly smile
                    // Eyes (slightly squinted, angled brows)
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(-8, -3, 6, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(-8, -2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(8, -3, 6, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(8, -2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // Worried eyebrows
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(-5, -8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(12, -10); ctx.lineTo(5, -8);
                    ctx.stroke();
                    // Wobbly nervous smile
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    const wobble = Math.sin(time * 10) * 1.5;
                    ctx.moveTo(-5, 9 + wobble);
                    ctx.quadraticCurveTo(0, 12 + wobble * 0.5, 5, 9 - wobble);
                    ctx.stroke();
                } else if (racer.expression === 'panicked') {
                    // Spiral/spinning eyes + zigzag mouth
                    // Spiral eyes
                    ctx.strokeStyle = '#2C1810';
                    ctx.lineWidth = 1.8;
                    const spiralTime = time * 4;
                    [-8, 8].forEach(ex => {
                        ctx.beginPath();
                        for (let a = 0; a < Math.PI * 4; a += 0.2) {
                            const r = a * 0.8;
                            const px = ex + Math.cos(a + spiralTime) * r;
                            const py = -3 + Math.sin(a + spiralTime) * r;
                            if (a === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.stroke();
                    });
                    // Zigzag mouth
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-6, 10);
                    ctx.lineTo(-3, 12); ctx.lineTo(0, 9); ctx.lineTo(3, 12); ctx.lineTo(6, 10);
                    ctx.stroke();
                } else if (racer.expression === 'surprised') {
                    // Big round eyes + small o mouth
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(-8, -3, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(-8, -3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Tiny highlight
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(-6, -5, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(8, -3, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(8, -3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(10, -5, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Small 'o' mouth
                    ctx.fillStyle = '#8B4513';
                    ctx.beginPath();
                    ctx.arc(0, 10, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (racer.expression === 'relieved') {
                    // Happy closed eyes + gentle smile
                    ctx.strokeStyle = '#2C1810';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    // Closed happy eyes (arcs)
                    ctx.beginPath();
                    ctx.arc(-8, -3, 5, Math.PI * 0.1, Math.PI * 0.9);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(8, -3, 5, Math.PI * 0.1, Math.PI * 0.9);
                    ctx.stroke();
                    // Gentle smile
                    ctx.strokeStyle = '#C0752A';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 7, 6, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                    // Blush marks
                    ctx.fillStyle = 'rgba(255, 150, 150, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(-13, 4, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(13, 4, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (racer.expression === 'determined') {
                    // Focused eyes + confident grin
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(-8, -3, 6, 5, -0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(-8, -3, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(8, -3, 6, 5, 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2C1810';
                    ctx.beginPath();
                    ctx.arc(8, -3, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Determined eyebrows (angled down)
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-12, -8); ctx.lineTo(-5, -10);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(12, -8); ctx.lineTo(5, -10);
                    ctx.stroke();
                    // Confident grin
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(0, 7, 7, 0.15, Math.PI - 0.15);
                    ctx.stroke();
                    // Tooth/highlight
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(0, 10, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // === SWEAT DROPS ===
            racer.sweatDrops.forEach(drop => {
                const alpha = Math.min(1, drop.life / drop.maxLife * 2);
                const dropScreenX = headX + drop.x;
                const dropScreenY = headY + drop.y;
                
                ctx.globalAlpha = alpha * 0.8;
                ctx.fillStyle = '#87CEEB';
                // Teardrop shape
                ctx.beginPath();
                ctx.moveTo(dropScreenX, dropScreenY - drop.size);
                ctx.quadraticCurveTo(dropScreenX + drop.size, dropScreenY, dropScreenX, dropScreenY + drop.size * 0.8);
                ctx.quadraticCurveTo(dropScreenX - drop.size, dropScreenY, dropScreenX, dropScreenY - drop.size);
                ctx.fill();
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(dropScreenX - 0.5, dropScreenY - drop.size * 0.3, drop.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });

            // === REACTION MARKS (exclamation, question, sparkles) ===
            racer.reactionMarks.forEach(mark => {
                const alpha = Math.min(1, mark.life / mark.maxLife * 2.5);
                const markX = headX + mark.x;
                const markY = headY + mark.y;
                const pop = mark.life / mark.maxLife; // Scale for pop-in
                const scale = pop < 0.8 ? 1.2 - (0.8 - pop) * 0.5 : 1.0 + (pop - 0.8) * 1.0;
                
                ctx.globalAlpha = alpha;
                ctx.save();
                ctx.translate(markX, markY);
                ctx.scale(scale, scale);
                
                if (mark.type === 'exclamation') {
                    // Bold exclamation mark
                    ctx.fillStyle = '#FF5722';
                    ctx.font = 'bold 20px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('!', 0, 0);
                    // Outline
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.strokeText('!', 0, 0);
                    ctx.fillText('!', 0, 0);
                } else if (mark.type === 'question') {
                    ctx.fillStyle = '#FFC107';
                    ctx.font = 'bold 18px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.strokeText('?', 0, 0);
                    ctx.fillText('?', 0, 0);
                } else if (mark.type === 'sparkle') {
                    // Four-point star sparkle
                    const sparkleSize = 5;
                    const rot = time * 3 + mark.x;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + rot;
                        const r = i % 2 === 0 ? sparkleSize : sparkleSize * 0.35;
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    // Inner bright dot
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            });

            ctx.restore();
        }

        // Render equipped cosmetic accessory on the player character
        // Uses the SAME transform pipeline as the character for pixel-perfect attachment
        function drawEquippedAccessory(screenX, screenY, drawW, drawH, racer) {
            const accessory = playerData.equippedAccessory;
            if (!accessory) return;

            const time = performance.now() * 0.001;
            
            // Reconstruct the exact same transform used by drawRacer
            const rot = racer.currentRotation || 0;
            const sX = racer.currentScaleX || 1;
            const sY = racer.currentScaleY || 1;
            const idleBob = (racer.state === 'idle' || racer.state === 'balancing') ? Math.sin(racer.breathTimer * 0.7) * 2 : 0;

            // Smooth velocity tracking for physics-based accessory motion
            // Uses racer's actual physics state for organic feel
            const velocityX = racer.speed || 0;
            const velocityY = racer.vy || 0;
            const isGrounded = racer.state !== 'airborne';
            
            // Derive accessory motion from character's body mechanics
            // Instead of separate offsets, accessories inherit from the body transform
            let bodySquash = 1.0; // How compressed the body is (charging/landing)
            let bodyLean = 0; // Forward/backward lean angle
            let bodyBounce = 0; // Vertical bounce offset
            let motionIntensity = 0; // Overall movement energy (0-1)
            
            if (racer.state === 'charging') {
                const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
                bodySquash = 1.0 - chargeRatio * 0.35; // Body compresses down
                bodyBounce = chargeRatio * 4; // Head drops with squat
                motionIntensity = chargeRatio * 0.6;
                bodyLean = Math.sin(time * (4 + chargeRatio * 10)) * chargeRatio * 0.02;
            } else if (racer.state === 'airborne') {
                const vyNorm = velocityY / 700; // -1 to 1 normalized
                bodySquash = 1.0 + Math.abs(vyNorm) * 0.15; // Stretch in air
                bodyLean = vyNorm * 0.03; // Lean back on ascent, forward on descent
                bodyBounce = vyNorm * -3; // Head lifts on ascent
                motionIntensity = 0.4 + Math.abs(vyNorm) * 0.4;
            } else if (racer.state === 'tumbling') {
                const t = racer.tumbleTimer;
                const tumbleProgress = Math.min(1, t / TUMBLE_DURATION);
                // Inertia lag — accessories trail behind the tumble
                const inertiaLag = 0.6; // How much accessories lag (0=perfect follow, 1=max lag)
                bodyLean = rot * inertiaLag * (1 - tumbleProgress); // Follow rotation with lag
                bodyBounce = Math.sin(t * 7) * (1 - tumbleProgress) * 4;
                bodySquash = 1.0 + Math.sin(t * 5) * 0.05 * (1 - tumbleProgress);
                motionIntensity = 0.8 * (1 - tumbleProgress * 0.5);
            } else if (racer.state === 'balancing') {
                const wobblePhase = time * 8;
                bodyLean = Math.sin(wobblePhase) * 0.04;
                bodyBounce = Math.sin(wobblePhase * 1.3) * 1.5;
                motionIntensity = 0.35;
                if (racer.mudWobble) {
                    bodyLean *= 2.5;
                    motionIntensity = 0.55;
                }
            } else if (racer.state === 'idle') {
                // Micro-breathing — accessories subtly follow body rhythm
                bodyBounce = Math.sin(racer.breathTimer * 0.7) * 0.6;
                bodyLean = Math.sin(racer.breathTimer * 0.4) * 0.005;
                bodySquash = 1.0 + Math.sin(racer.breathTimer) * 0.01;
                motionIntensity = 0.05;
            }

            // Enter character's local coordinate space (same as drawRacer)
            ctx.save();
            ctx.translate(screenX, screenY - drawH * 0.5 * sY + idleBob);
            ctx.rotate(rot);
            ctx.scale(sX, sY);

            if (accessory === 'red_headband') {
                // === HEADBAND: wraps around the forehead, flush against the hair ===
                // Anchor point: top of head, character is chibi so head is large (~40% height)
                const headTopY = -drawH * 0.42; // Top of head in local coords
                const headCenterX = 0;
                const headW = drawW * 0.52; // Head width at forehead level
                const headCurve = drawW * 0.26; // Curvature radius of head

                // Band sits on forehead — moves with bodySquash (compresses with squat)
                // Placed high on forehead, well above the eyes
                const bandY = headTopY + drawH * 0.04 * (2 - bodySquash) + bodyBounce * 0.4;
                const bandW = headW * 0.92; // Slightly narrower than head for natural wrap
                const bandH = 5.5 + drawH * 0.012; // Proportional thickness

                ctx.save();
                ctx.translate(headCenterX, bandY);
                // Headband follows body lean with slight inertia lag
                ctx.rotate(bodyLean * 0.7);
                // Subtle squash with body compression
                ctx.scale(1.0 + (1 - bodySquash) * 0.08, bodySquash * 0.95 + 0.05);

                // Main band — curved to match head shape with depth shading
                const bandGrad = ctx.createLinearGradient(0, -bandH * 1.5, 0, bandH * 1.5);
                bandGrad.addColorStop(0, '#E53935');
                bandGrad.addColorStop(0.2, '#FF5252');
                bandGrad.addColorStop(0.5, '#E53935');
                bandGrad.addColorStop(0.8, '#C62828');
                bandGrad.addColorStop(1, '#8E1318');
                ctx.fillStyle = bandGrad;

                // Draw band as a thick arc that wraps around the head
                ctx.beginPath();
                ctx.ellipse(0, 0, bandW, bandH * 1.8, 0, Math.PI + 0.12, -0.12);
                ctx.ellipse(0, bandH * 0.7, bandW * 0.94, bandH * 1.1, 0, -0.08, Math.PI + 0.08);
                ctx.fill();

                // Subtle inner shadow for depth (band sits INTO the hair)
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.beginPath();
                ctx.ellipse(0, -bandH * 0.3, bandW * 0.88, bandH * 0.5, 0, Math.PI + 0.3, -0.3);
                ctx.fill();

                // Fabric weave highlight — follows the curvature
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                ctx.ellipse(0, -bandH * 0.2, bandW * 0.7, bandH * 0.4, 0, Math.PI + 0.5, -0.5);
                ctx.stroke();

                // Knot at back-right — positioned at head edge
                const knotX = bandW * 0.78;
                const knotY = bandH * 1.2;

                ctx.fillStyle = '#B71C1C';
                ctx.beginPath();
                ctx.ellipse(knotX, knotY, 4.5, 3.5, 0.25, 0, Math.PI * 2);
                ctx.fill();
                // Knot highlight
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.beginPath();
                ctx.ellipse(knotX - 1, knotY - 1, 2, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ribbons — physics-driven by character movement
                // Wind from motion + ambient breeze + inertia from body rotation
                const motionWind = velocityX * 0.003 + (racer.state === 'airborne' ? 2.0 : 0.5);
                const inertiaSwing = -bodyLean * 15; // Ribbons swing opposite to lean
                const ribbon1Phase = time * 3.2 + 0.5;
                const ribbon2Phase = time * 3.8 + 1.8;

                const r1Sway = Math.sin(ribbon1Phase) * (2.5 + motionIntensity * 4) + motionWind + inertiaSwing;
                const r2Sway = Math.sin(ribbon2Phase) * (2.0 + motionIntensity * 3.5) + motionWind * 0.8 + inertiaSwing * 0.7;

                // Ribbon 1 (longer)
                ctx.strokeStyle = '#C62828';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(knotX + 1, knotY + 2);
                ctx.quadraticCurveTo(knotX + 5 + r1Sway * 0.6, knotY + 10, knotX + 4 + r1Sway, knotY + 19);
                ctx.quadraticCurveTo(knotX + 3 + r1Sway * 1.2, knotY + 24, knotX + 5 + r1Sway * 1.4, knotY + 27);
                ctx.stroke();

                // Ribbon 2 (shorter, slightly offset)
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(knotX - 1, knotY + 2.5);
                ctx.quadraticCurveTo(knotX + 4 + r2Sway * 0.5, knotY + 9, knotX + 3 + r2Sway, knotY + 17);
                ctx.quadraticCurveTo(knotX + 2 + r2Sway * 1.1, knotY + 21, knotX + 3 + r2Sway * 1.2, knotY + 23);
                ctx.stroke();

                // Ribbon tips (tapered, lighter color)
                ctx.strokeStyle = '#EF5350';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(knotX + 5 + r1Sway * 1.4, knotY + 27);
                ctx.lineTo(knotX + 5.5 + r1Sway * 1.5, knotY + 30);
                ctx.stroke();

                ctx.restore();

            } else if (accessory === 'lucky_charm') {
                // === NECKLACE: draped around neck, pendant hangs on chest ===
                // Anchor: neck/collar area of the character
                const neckAnchorY = -drawH * 0.14; // Neck area of the chibi character
                const shoulderW = drawW * 0.28; // Width at collar/neck level

                ctx.save();
                ctx.translate(0, neckAnchorY);

                // Pendulum physics for the charm
                // Accumulate swing from: gravity (lean), velocity (inertia), bounce
                const gravitySwing = bodyLean * 20; // Lean causes pendulum swing
                const inertiaSwing = -velocityX * 0.012; // Moving right = charm swings left
                const verticalForce = racer.state === 'airborne' ? velocityY * 0.005 : 0;
                const ambientSway = Math.sin(time * 1.8 + 0.7) * 0.8; // Subtle idle drift

                const totalSwing = gravitySwing + inertiaSwing + ambientSway;
                const clampedSwing = Math.max(-8, Math.min(8, totalSwing));

                // Sag amount — affected by vertical motion (lifts when jumping up, sags when landing)
                let baseSag = 13;
                if (racer.state === 'airborne') {
                    const vyNorm = velocityY / 700;
                    baseSag += vyNorm * -6; // Lifts during ascent, drops during descent
                } else if (racer.state === 'charging') {
                    const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
                    baseSag -= chargeRatio * 4; // Bunches up when squatting
                } else if (racer.state === 'tumbling') {
                    baseSag += Math.sin(racer.tumbleTimer * 5) * 3;
                }
                const sag = Math.max(7, Math.min(20, baseSag + Math.abs(clampedSwing) * 0.3));

                // String/rope — catenary curve from shoulder to shoulder through center
                const stringOffsetX = clampedSwing * 0.3; // String midpoint shifts with swing
                
                // Main rope strand
                ctx.strokeStyle = '#5D4037';
                ctx.lineWidth = 1.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-shoulderW, -4);
                ctx.quadraticCurveTo(-shoulderW * 0.35 + stringOffsetX * 0.5, sag * 0.65, stringOffsetX, sag);
                ctx.quadraticCurveTo(shoulderW * 0.35 + stringOffsetX * 0.5, sag * 0.65, shoulderW, -4);
                ctx.stroke();

                // Second strand (braided look, slightly offset)
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 1.1;
                ctx.beginPath();
                ctx.moveTo(-shoulderW + 1, -3.5);
                ctx.quadraticCurveTo(-shoulderW * 0.3 + stringOffsetX * 0.5, sag * 0.6 + 0.5, stringOffsetX + 0.5, sag - 0.5);
                ctx.quadraticCurveTo(shoulderW * 0.3 + stringOffsetX * 0.5, sag * 0.6 + 0.5, shoulderW - 1, -3.5);
                ctx.stroke();

                // Where string meets skin — subtle shadow for depth
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.beginPath();
                ctx.ellipse(-shoulderW, -3, 4, 2, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(shoulderW, -3, 4, 2, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Charm pendant — hangs from the lowest point of the catenary
                const pendulumAngle = clampedSwing * 0.08 + verticalForce * 0.5;
                const charmX = stringOffsetX + Math.sin(pendulumAngle) * 3;
                const charmY = sag + 2 + (racer.state === 'airborne' ? velocityY * -0.004 : 0);
                const charmR = 6;

                ctx.save();
                ctx.translate(charmX, charmY);
                ctx.rotate(pendulumAngle * 0.2); // Gentle tilt with swing

                // Connecting bail/loop
                ctx.strokeStyle = '#6D4C41';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.arc(0, -charmR - 1.5, 2.5, 0, Math.PI * 2);
                ctx.stroke();

                // Gold charm body — radial gradient for 3D form
                const charmGrad = ctx.createRadialGradient(-1.5, -1.5, 0, 0, 0, charmR);
                charmGrad.addColorStop(0, '#FFF59D');
                charmGrad.addColorStop(0.25, '#FFD700');
                charmGrad.addColorStop(0.6, '#FFA000');
                charmGrad.addColorStop(1, '#E65100');
                ctx.fillStyle = charmGrad;
                ctx.beginPath();
                ctx.arc(0, 0, charmR, 0, Math.PI * 2);
                ctx.fill();

                // Rim/edge
                ctx.strokeStyle = '#B8860B';
                ctx.lineWidth = 1.0;
                ctx.stroke();

                // Inner engraved circle (decorative)
                ctx.strokeStyle = 'rgba(139, 69, 19, 0.35)';
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                ctx.arc(0, 0, charmR * 0.55, 0, Math.PI * 2);
                ctx.stroke();

                // Center dot
                ctx.fillStyle = 'rgba(139, 69, 19, 0.45)';
                ctx.beginPath();
                ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Specular highlight — shifts subtly with rotation for living feel
                const hlAngle = time * 0.4 + pendulumAngle;
                const hlX = Math.cos(hlAngle) * 1.2 - 1.8;
                const hlY = Math.sin(hlAngle) * 0.6 - 2;
                ctx.fillStyle = 'rgba(255,255,255,0.38)';
                ctx.beginPath();
                ctx.ellipse(hlX, hlY, 2, 1.3, -0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore(); // charm
                ctx.restore(); // neck anchor
            }

            ctx.restore(); // main character space
        }

        function drawParticles() {
            particles.forEach(p => {
                const screenX = p.x - cameraX + canvas.width * 0.3;
                const img = imageCache['particle_dust_cloud'];
                ctx.globalAlpha = p.alpha;
                if (img && p.color === '#D2B48C') {
                    ctx.drawImage(img, screenX - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(screenX, p.y, p.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            });
        }

        function drawStartFinish() {
            const trackTop = canvas.height * TRACK_Y_START;
            const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
            const w = canvas.width;

            // --- START LINE ---
            const startX = 50; 
            const startScreenX = startX - cameraX + w * 0.3;
            
            if (startScreenX > -200 && startScreenX < w + 200) {
                // White painted start line
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(startScreenX - 10, trackTop, 20, trackH);

                // Small wooden "START" sign
                const signX = startScreenX;
                const signY = trackTop - 60;
                
                ctx.fillStyle = '#5D2906';
                ctx.fillRect(signX - 5, signY, 10, 50);
                
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(signX - 70, signY - 50, 140, 50);
                ctx.strokeStyle = '#3D1A04';
                ctx.lineWidth = 4;
                ctx.strokeRect(signX - 70, signY - 50, 140, 50);
                
                ctx.fillStyle = 'white';
                ctx.font = '700 28px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('START', signX, signY - 15);
            }

            // --- FINISH LINE ---
            if (!unlimitedMode && challengeMode !== 'jumpacar' && challengeMode !== 'parkour') {
            const finishScreenX = trackLength - cameraX + w * 0.3;
            if (finishScreenX > -200 && finishScreenX < w + 200) {
                // Grounded Checkered finish line
                const checkerSize = 25;
                const rows = Math.ceil(trackH / checkerSize);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < 3; c++) {
                        ctx.fillStyle = (r + c) % 2 === 0 ? '#111111' : '#EEEEEE';
                        ctx.fillRect(finishScreenX + (c * checkerSize) - (1.5 * checkerSize), trackTop + (r * checkerSize), checkerSize, checkerSize);
                    }
                }

                // Festive decorations at Finish
                const flagImg = imageCache['decoration_indonesian_flag'];
                if (flagImg) {
                    ctx.drawImage(flagImg, finishScreenX - 100, trackTop - 160, 60, 110);
                    ctx.drawImage(flagImg, finishScreenX + 50, trackTop - 160, 60, 110);
                }
            }
            } // end if (!unlimitedMode)
        }

        function drawHUD() {
            if (gameState !== 'racing' || challengeMode) {
                powerUpSlotPositions.length = 0; // avoid stale tap targets outside normal races
                return;
            }
            // Position
            let playerPos = 1;
            for (let i = 0; i < racers.length; i++) {
                if (racers[i] !== player && racers[i].x > player.x) playerPos++;
            }

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(16, 16, 100, 44);
            ctx.fillRect(canvas.width - 156, 16, 140, 44);

            ctx.fillStyle = 'white';
            ctx.font = '600 26px Fredoka';
            ctx.textAlign = 'left';
            ctx.fillText(`#${playerPos}`, 28, 47);

            ctx.textAlign = 'right';
            const timeStr = raceTime.toFixed(1) + 's';
            ctx.fillText(timeStr, canvas.width - 28, 47);

            // Progress bar
            const progress = Math.min(player.x / trackLength, 1);
            const barW = canvas.width - 32;
            const barH = 16;
            const barY = 70;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(16, barY, barW, barH);
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(16, barY, barW * progress, barH);

            // Opponent dots on progress bar
            racers.forEach(r => {
                if (r === player) return;
                const p = Math.min(r.x / trackLength, 1);
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.arc(16 + barW * p, barY + barH/2, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            // Player dot
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(16 + barW * progress, barY + barH/2, 6, 0, Math.PI * 2);
            ctx.fill();

            // ===== POWER-UP SHORTCUT SLOTS (below progress bar, left side) =====
            drawPowerUpSlots();
        }

        function drawPowerUpSlots() {
            const slotSize = 54;
            const slotGap = 8;
            const startX = 16;
            const startY = 96;
            const time = performance.now() * 0.001;

            powerUpSlotPositions = []; // Reset positions for tap detection

            for (let i = 0; i < 3; i++) {
                const puId = POWER_UP_SLOT_IDS[i];
                const def = POWER_UP_DEFS[puId];
                const count = playerData.powerUps[puId] || 0;
                const cooldown = powerUpCooldowns[i];
                const sx = startX + i * (slotSize + slotGap);
                const sy = startY;

                // Store position for tap detection
                powerUpSlotPositions.push({ x: sx, y: sy, w: slotSize, h: slotSize });

                ctx.save();

                // Slot background
                const hasStock = count > 0;
                const isReady = hasStock && cooldown <= 0;
                
                // Background shape
                ctx.beginPath();
                ctx.roundRect(sx, sy, slotSize, slotSize, 12);
                
                if (isReady) {
                    // Ready to use - vibrant colored bg with subtle pulse
                    const pulse = 1 + Math.sin(time * 3 + i) * 0.03;
                    ctx.fillStyle = `rgba(${def.color === '#4FC3F7' ? '79,195,247' : def.color === '#FFD54F' ? '255,213,79' : '102,187,106'}, 0.35)`;
                    ctx.fill();
                    ctx.strokeStyle = def.color;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                } else if (hasStock && cooldown > 0) {
                    // On cooldown
                    ctx.fillStyle = 'rgba(50,50,50,0.7)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else {
                    // Empty/no stock
                    ctx.fillStyle = 'rgba(30,30,30,0.6)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Icon
                ctx.font = `${hasStock ? '26' : '22'}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = hasStock ? 1.0 : 0.4;
                ctx.fillText(def.icon, sx + slotSize / 2, sy + slotSize / 2 - 2);
                ctx.globalAlpha = 1.0;

                // Cooldown overlay
                if (cooldown > 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.roundRect(sx, sy, slotSize, slotSize, 12);
                    ctx.fill();
                    // Cooldown sweep
                    const cdRatio = cooldown / 1.5;
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.moveTo(sx + slotSize/2, sy + slotSize/2);
                    ctx.arc(sx + slotSize/2, sy + slotSize/2, slotSize/2, -Math.PI/2, -Math.PI/2 + (1 - cdRatio) * Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                }

                // Count badge (bottom-right corner)
                if (count > 0) {
                    const badgeX = sx + slotSize - 10;
                    const badgeY = sy + slotSize - 10;
                    ctx.fillStyle = isReady ? '#FFFFFF' : 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(badgeX, badgeY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = 'bold 12px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${count}`, badgeX, badgeY);
                } else {
                    // "0" indicator when empty
                    const badgeX = sx + slotSize - 10;
                    const badgeY = sy + slotSize - 10;
                    ctx.fillStyle = 'rgba(100,100,100,0.6)';
                    ctx.beginPath();
                    ctx.arc(badgeX, badgeY, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = 'bold 11px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('0', badgeX, badgeY);
                }

                // Glow effect when ready
                if (isReady) {
                    const glowAlpha = 0.15 + Math.sin(time * 4 + i * 1.2) * 0.08;
                    ctx.shadowColor = def.color;
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = `rgba(255,255,255,${glowAlpha})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(sx - 1, sy - 1, slotSize + 2, slotSize + 2, 13);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }
        }

                    const id = btn.getAttribute('data-id');
                    const kind = btn.getAttribute('data-halloween-kind');
                    const item = HALLOWEEN_SHOP_ITEMS.find(entry => entry.id === id);
                    if (!item) return;
                    playUIClick();
                    const ownedList = kind === 'player' ? (playerData.ownedSkins || []) : (playerData.ownedOpponentSkins || []);

                        const contentEl = document.getElementById('halloween-shop-content');
                        if (contentEl) contentEl.innerHTML = generateHalloweenShopHTML();
                        attachHalloweenEventShopHandlers();
                    };
                    if (btn.getAttribute('data-action') === 'buy-halloween') {
                        if (ownedList.includes(id)) { showEquipToast('You already own this Halloween item!'); return; }
                        if ((playerData.totalMoney || 0) < item.price) { showEquipToast('Not enough money! 💸'); return; }
                        showPurchaseConfirmation(item, async () => {
                            playerData.totalMoney -= item.price;
                            if (kind === 'player') {
                                if (!playerData.ownedSkins) playerData.ownedSkins = [];
                                if (!playerData.ownedSkins.includes(id)) playerData.ownedSkins.push(id);
                                playerData.equippedSkin = id;

                    const category = card.getAttribute('data-category');
                    const canAfford = currentBalance >= price;
                    
                    if (category === 'skin') {
                        // Skin card update
                        const isOwned = currentOwnedSkins.includes(id);
                        const isEquipped = currentEquippedSkin === id;
