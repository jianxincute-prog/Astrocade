        // Main game loop
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let dt = (timestamp - lastTimestamp) / 1000;
            dt = Math.min(dt, 0.11);
            lastTimestamp = timestamp;
            frameDt = dt > 0 ? dt : 1 / 60;

            const rawDt = dt;
            updateEffectQuality(rawDt);
            enforceEffectBudgets();

            // Brief freeze-frame for collisions, followed by normal dt handling.
            if (hitStopTimer > 0 && mode !== 'edit') {
                hitStopTimer = Math.max(0, hitStopTimer - rawDt);
                dt = 0;
            }
            hitStopFlash = Math.max(0, hitStopFlash - rawDt * 3.5);

            // Screen shake decay (frame-rate independent)
            if (shakeMag > 0) {
                shakeMag *= Math.exp(-7 * rawDt);
                if (shakeMag < 0.3) shakeMag = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (mode === 'edit') {
                // Keep creator configuration and runtime player data separate in Edit mode.
                hitStopTimer = 0;
                hitStopFlash = 0;
                // Edit mode - show preview
                drawBackground();
                if (racers.length === 0) {
                    initRacers();
                    updateGroundY();
                }
                updateGroundY();
                racers.forEach(r => drawRacer(r));
                drawStartFinish();

                // Edit mode label
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(canvas.width/2 - 80, 16, 160, 40);
                ctx.fillStyle = 'white';
                ctx.font = '600 22px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('✏️ Edit Mode', canvas.width/2, 43);
            } else {
                // Play mode
                if (gameState === 'start') {
                    // Static camera at the start line for the menu
                    cameraX = 0;

                    // Periodic confetti in menu for festive vibe, capped by the adaptive FX budget.
                    if (confetti.length < MAX_CONFETTI && Math.random() < 0.02 * effectQuality) {
                        confetti.push(new Confetti(Math.random() * canvas.width, -20));
                    }
                    
                    // Keep racers at starting positions
                    racers.forEach(r => {
                        r.x = 50;
                        r.state = 'idle';
                        r.y = r.groundY;
                        r.vy = 0;
                        r.chargeTime = 0;
                        r.finished = false;
                        r.breathTimer += dt * 3;
                        r.updateExpression(dt);
                    });
                    
                    // Update confetti particles
                    confetti.forEach(c => c.update(dt));
                    confetti = confetti.filter(c => c.life > 0);
                }

                if (gameState === 'countdown') {
                    countdownTimer += dt;
                    // Update crowd during countdown
                    updateCrowdIdle(dt);
                    
                    racers.forEach(r => {
                        r.breathTimer += dt * 3;
                        r.updateExpression(dt);
                    });
                    
                    if (countdownTimer >= 1) {
                        countdownTimer = 0;
                        countdownValue--;
                        if (countdownValue === 0) {
                            // We hit 0, but we want to show "GO!" for 1 second
                            // startRace() will be called when countdownValue becomes -1
                        } else if (countdownValue < 0) {
                            startRace();
                        }
                    }
                }

                if (gameState === 'racing' && !challengeMode) {
                    raceTime += dt;

                    // Update power-up system
                    updatePowerUps(dt);

                    // Update crowd idle animations
                    updateCrowdIdle(dt);

                    // Update racers
                    racers.forEach(r => updateRacer(r, dt));

                    // Update stray chickens
                    updateStrayChickens(dt);

                    // Update banana throwing
                    if (config.difficulty !== 'easy' && !mp.active) {
                        const interval = config.difficulty === 'hard' ? 9.0 : 14.0;
                        bananaPeelThrowTimer += dt;
                        if (bananaPeelThrowTimer >= interval) {
                            bananaPeelThrowTimer = 0;
                            triggerBananaPeelThrow();
                        }
                    }

                    // Update projectiles
                    bananaPeelProjectiles.forEach(p => p.update(dt));
                    bananaPeelProjectiles = bananaPeelProjectiles.filter(p => p.active);

                    // Check if all finished
                    if (racers.every(r => r.finished) && gameState === 'racing') {
                        if (!player.finished) {
                            player.finished = true;
                            finishOrder.push(player);
                            player.placement = finishOrder.length;
                        }
                        finishRace();
                    }

                    // Update obstacles (animations)
                    obstacles.forEach(ob => ob.update(dt));
                    obstacles = obstacles.filter(ob => !ob.spent || ob.spentTimer < 0.5);

                    // Update particles
                    particles.forEach(p => p.update(dt));
                    particles = particles.filter(p => p.life > 0);

                    // Update footprints (persist during race, only remove if fully faded)
                    mudFootprints.forEach(fp => fp.update(dt));
                    mudFootprints = mudFootprints.filter(fp => fp.alpha > 0);

                    // Update floating texts
                    floatingTexts.forEach(ft => ft.update(dt));
                    floatingTexts = floatingTexts.filter(ft => ft.life > 0);

                    // Update crowd reactions
                    crowdReactions.forEach(cr => cr.update(dt));
                    crowdReactions = crowdReactions.filter(cr => cr.life > 0);

                    // Update confetti
                    confetti.forEach(c => c.update(dt));
                    confetti = confetti.filter(c => c.life > 0);

                    // Camera follows player with smooth damping
                    const targetCamX = player.x - canvas.width * 0.22;
                    cameraX += (targetCamX - cameraX) * (1 - Math.exp(-8 * dt));
                }

                if (gameState === 'finished') {
                    updateFinishCelebration(dt);
                    
                    // Update obstacles animations during celebration
                    obstacles.forEach(ob => ob.update(dt));
                    
                    // Update chickens during celebration
                    strayChickens.forEach(c => { if (c.active) c.update(dt); });
                    strayChickens = strayChickens.filter(c => c.active || c.featherParticles.length > 0);
                    
                    // Update particles & confetti during celebration
                    particles.forEach(p => p.update(dt));
                    particles = particles.filter(p => p.life > 0);
                    confetti.forEach(c => c.update(dt));
                    confetti = confetti.filter(c => c.life > 0);
                    floatingTexts.forEach(ft => ft.update(dt));
                    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
                    
                    racers.forEach(r => {
                        r.breathTimer += dt * 3;
                        r.updateExpression(dt);
                    });
                }

                // ===== UNLIMITED MODE UPDATE =====
                if (gameState === 'unlimited_racing') {
                    updateUnlimitedMode(dt);
                }
                
                if (gameState === 'unlimited_gameover') {
                    // Keep particles alive during game over
                    particles.forEach(p => p.update(dt));
                    particles = particles.filter(p => p.life > 0);
                    floatingTexts.forEach(ft => ft.update(dt));
                    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
                    confetti.forEach(c => c.update(dt));
                    confetti = confetti.filter(c => c.life > 0);
                    
                    racers.forEach(r => {
                        r.breathTimer += dt * 3;
                        r.updateExpression(dt);
                    });
                }

                // ===== CHALLENGE MODE UPDATES =====
                if (gameState === 'racing' && challengeMode === 'parkour') {
                    updateParkourMode(dt);
                }
                if (gameState === 'racing' && challengeMode === 'jumpacar') {
                    updateJumpACarMode(dt);
                }
                if (gameState === 'challenge_over') {
                    particles.forEach(p => p.update(dt));
                    particles = particles.filter(p => p.life > 0);
                    floatingTexts.forEach(ft => ft.update(dt));
                    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
                    confetti.forEach(c => c.update(dt));
                    confetti = confetti.filter(c => c.life > 0);
                    
                    racers.forEach(r => {
                        r.breathTimer += dt * 3;
                        r.updateExpression(dt);
                    });
                }

                updateGroundY();
                
                // Screen shake — applied to the whole world, slight overscan hides edges
                const shaking = shakeMag > 0.3;
                if (shaking) {
                    const shX = (Math.random() - 0.5) * shakeMag * 2;
                    const shY = (Math.random() - 0.5) * shakeMag * 2;
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.scale(1.025, 1.025);
                    ctx.translate(-canvas.width / 2 + shX, -canvas.height / 2 + shY);
                }

                // Apply camera zoom for finish celebration
                if (gameState === 'finished' && finishCameraZoom > 1.01) {
                    ctx.save();
                    const zoomCenterX = canvas.width * 0.4;
                    const zoomCenterY = canvas.height * 0.45;
                    ctx.translate(zoomCenterX, zoomCenterY);
                    ctx.scale(finishCameraZoom, finishCameraZoom);
                    ctx.translate(-zoomCenterX, -zoomCenterY);
                }
                
                drawBackground();
                drawStartFinish();

                // Depth sort: interleave obstacles and racers by lane for proper layering
                if (challengeMode === 'parkour' && (gameState === 'racing' || gameState === 'challenge_over' || gameState === 'countdown')) {
                    drawParkourPlatforms();
                    racers.forEach(r => drawRacer(r));
                } else {
                    const drawables = drawablesBuf;
                    drawables.length = 0;
                    const currentObstacles = (gameState === 'unlimited_racing' || gameState === 'unlimited_gameover') ? ulObstacles : obstacles;
                    currentObstacles.forEach(ob => drawables.push({ laneIndex: ob.laneIndex, type: 'obstacle', obj: ob }));
                    racers.forEach(r => drawables.push({ laneIndex: r.laneIndex, type: 'racer', obj: r }));
                    drawables.sort((a, b) => a.laneIndex - b.laneIndex || (a.type === 'obstacle' ? -1 : 1));
                    drawables.forEach(d => {
                        if (d.type === 'obstacle') d.obj.draw(cameraX, canvas.width);
                        else drawRacer(d.obj);
                    });
                }
                
                // Draw stray chickens
                strayChickens.forEach(chicken => chicken.draw(cameraX, canvas.width));
                
                // Draw projectiles
                bananaPeelProjectiles.forEach(p => p.draw(cameraX, canvas.width));
                
                // Draw unlimited mode pickups
                if (gameState === 'unlimited_racing' || gameState === 'unlimited_gameover') {
                    ulPickups.forEach(p => p.draw(cameraX, canvas.width));
                }
                
                drawParticles();
                
                // Ambient floating motes (drawn above track, below UI)
                ambientMotes.forEach(mote => {
                    mote.drift += mote.driftSpeed * dt;
                    const mx = (mote.x + Math.sin(mote.drift) * 30 - cameraX * 0.05) % (canvas.width + 100);
                    const drawMX = mx < -50 ? mx + canvas.width + 100 : mx;
                    const my = mote.y + Math.sin(mote.drift * 0.7 + mote.x) * 15;
                    ctx.globalAlpha = mote.opacity * (0.7 + Math.sin(mote.drift * 2) * 0.3);
                    ctx.fillStyle = mote.color;
                    ctx.beginPath();
                    ctx.arc(drawMX, my, mote.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
                
                floatingTexts.forEach(ft => ft.draw(cameraX, canvas.width));
                crowdReactions.forEach(cr => cr.draw(cameraX, canvas.width));
                confetti.forEach(c => c.draw());
                
                // Close zoom transform before drawing HUD
                if (gameState === 'finished' && finishCameraZoom > 1.01) {
                    ctx.restore();
                }
                if (shaking) ctx.restore();
                
                // Draw screen-space confetti on top (for finish)
                if (gameState === 'finished') {
                    confetti.forEach(c => c.draw());
                }
                
                // Punchy white impact flash is drawn in screen space after camera shake.
                if (hitStopFlash > 0) {
                    ctx.fillStyle = `rgba(255,255,255,${hitStopFlash})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Finish celebration overlay effects
                if (gameState === 'finished' && !finishShowResult) {
                    const isWin = player.placement === 1;
                    const isTop3 = player.placement <= 3;
                    
                    // Golden flash on win
                    if (isWin && finishCelebrationTimer < 0.5) {
                        const flashAlpha = (1 - finishCelebrationTimer / 0.5) * 0.3;
                        ctx.fillStyle = `rgba(255, 215, 0, ${flashAlpha})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    
                    // Big floating result text
                    const textY = canvas.height * 0.2 + Math.sin(finishCelebrationTimer * 2) * 10;
                    const textScale = Math.min(1, finishCelebrationTimer * 3);
                    ctx.save();
                    ctx.translate(canvas.width / 2, textY);
                    ctx.scale(textScale, textScale);
                    ctx.textAlign = 'center';
                    ctx.font = '700 64px Fredoka';
                    
                    if (isWin) {
                        ctx.fillStyle = '#FFD700';
                        ctx.strokeStyle = '#B8860B';
                        ctx.lineWidth = 4;
                        ctx.strokeText('🏆 JUARA! 🏆', 0, 0);
                        ctx.fillText('🏆 JUARA! 🏆', 0, 0);
                    } else if (isTop3) {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        ctx.lineWidth = 3;
                        const medal = player.placement === 2 ? '🥈' : '🥉';
                        ctx.strokeText(`${medal} Nice!`, 0, 0);
                        ctx.fillText(`${medal} Nice!`, 0, 0);
                    } else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        ctx.lineWidth = 3;
                        ctx.strokeText('Good Try! 💪', 0, 0);
                        ctx.fillText('Good Try! 💪', 0, 0);
                    }
                    ctx.restore();
                    
                    // Vignette during celebration
                    const vignetteAlpha = Math.min(0.3, finishCelebrationTimer * 0.15);
                    const vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.3, canvas.width/2, canvas.height/2, canvas.width*0.7);
                    vignette.addColorStop(0, 'rgba(0,0,0,0)');
                    vignette.addColorStop(1, `rgba(0,0,0,${vignetteAlpha})`);
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                drawHUD();
                
                // Unlimited mode HUD
                if (gameState === 'unlimited_racing') {
                    drawUnlimitedHUD();
                }

                // Challenge mode: draw cars and HUD
                if (challengeMode === 'jumpacar' && (gameState === 'racing' || gameState === 'challenge_over')) {
                    jacCars.forEach(car => car.draw(cameraX, canvas.width));
                }
                if (challengeMode === 'parkour') {
                    drawParkourHUD();
                }
                if (challengeMode === 'jumpacar') {
                    drawJumpACarHUD();
                }

                // Countdown display
                if (gameState === 'countdown') {
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '700 120px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const scale = 1 + (1 - countdownTimer) * 0.3;
                    ctx.save();
                    ctx.translate(canvas.width/2, canvas.height/2);
                    ctx.scale(scale, scale);
                    ctx.fillText(countdownValue > 0 ? countdownValue : 'GO!', 0, 0);
                    ctx.restore();
                    ctx.textBaseline = 'alphabetic';
                }

                if (gameState === 'start' && uiOverlay.children.length === 0) {
                    showStartScreen();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Start
        if (mode === 'edit') {
            initRacers();
            updateGroundY();
        } else {
            // First time ever (no saved data) → skip menu, go straight to race
            const isFirstTime = (playerData.totalRaces === 0 && playerData.totalMoney === 0 && !playerData.bestTimes.easy && !playerData.bestTimes.medium && !playerData.bestTimes.hard);
            if (isFirstTime) {
                challengeMode = null;
                unlimitedMode = false;
                startCountdown();
            } else {
                // Returning player → show main menu
                gameState = 'start';
                initRacers();
                updateGroundY();
                transitionAmbientTo('menu');
                showStartScreen();
            }
        }

        requestAnimationFrame(gameLoop);
    }
    </script>
</body>
</html>
