            playerData.dailyChallenges.forEach(challenge => {
                if (challenge.type === type && !challenge.claimed) {
                    if (type === 'collect_coins' || type === 'unlimited_score') {
                        challenge.progress = Math.min(challenge.target, challenge.progress + amount);
                    } else if (type === 'max_tumbles') {
                        if (amount <= challenge.target) {
                            challenge.progress = challenge.target;
                        }
                    } else {
                        challenge.progress = Math.min(challenge.target, challenge.progress + amount);
                    }
                    updated = true;
                }
            });
            if (updated) {

            }
        }

        // Update best time and rank after race
        function updatePersonalBests(difficulty, time, rank) {
            let isNewBestTime = false;

            if (rank === 1) playerData.totalWins = (playerData.totalWins || 0) + 1;
            
            // Check and update best time
            if (playerData.bestTimes[difficulty] === null || time < playerData.bestTimes[difficulty]) {
                playerData.bestTimes[difficulty] = time;
                isNewBestTime = true;
            }
            
            // Check and update highest rank (lower number is better)
            if (playerData.highestRanks[difficulty] === null || rank < playerData.highestRanks[difficulty]) {
                playerData.highestRanks[difficulty] = rank;
                isNewBestRank = true;
            }
            
            return { isNewBestTime, isNewBestRank };

        // Mud footprints & trail system
        let mudFootprints = [];
        const MAX_FOOTPRINTS = 200; // Performance cap
        class MudFootprint {
            constructor(x, y, laneIndex, options = {}) {
                this.x = x;
                this.y = y;
                this.laneIndex = laneIndex;
                this.angle = (Math.random() - 0.5) * 0.5;
                this.type = options.type || 'print'; // 'print', 'splatter', 'drag', 'splash_ring'
                this.size = options.size || (8 + Math.random() * 6);
                this.width = options.width || this.size;
                this.height = options.height || this.size * 0.5;
                this.opacity = options.opacity || (0.5 + Math.random() * 0.2);
                this.fadeDelay = options.fadeDelay || 999; // Seconds before starting to fade
                this.fadeTimer = 0;
                this.born = performance.now() * 0.001;
                // For splatter type
                this.splatDrops = [];
                if (this.type === 'splatter') {
                    const dropCount = 3 + Math.floor(Math.random() * 4);
                    for (let i = 0; i < dropCount; i++) {
                        this.splatDrops.push({
                            dx: (Math.random() - 0.5) * this.size * 1.5,
                            dy: (Math.random() - 0.5) * this.size * 0.8,
                            r: 2 + Math.random() * 4
                        });
                    }
                }
                // For drag type
                this.dragLength = options.dragLength || (15 + Math.random() * 20);
            }
            update(dt) {
                // Footprints persist during the race - only fade if fadeDelay passed
                this.fadeTimer += dt;
            }
            get alpha() {
                if (this.fadeTimer > this.fadeDelay) {
                    const fadeProgress = (this.fadeTimer - this.fadeDelay) / 2.0;
                    return Math.max(0, this.opacity * (1 - fadeProgress));
                }
                return this.opacity;
            }
        }

        function clearMudTrails() {
            mudFootprints = [];
        }

        function spawnMudTrail(racer, speed) {
            if (mudFootprints.length >= MAX_FOOTPRINTS) {
                // Remove oldest footprints to make room
                mudFootprints.splice(0, 10);
            }

            const trackTop = canvas.height * TRACK_Y_START;
            const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
            const laneHeight = trackH / 5;
            const baseY = trackTop + racer.laneIndex * laneHeight + laneHeight * 0.5;

            if (Math.abs(speed) > 150) {
                // Fast movement = drag marks
                mudFootprints.push(new MudFootprint(racer.x, baseY, racer.laneIndex, {
                    type: 'drag',
                    size: 12 + Math.random() * 8,
                    dragLength: 20 + Math.abs(speed) * 0.08,
                    opacity: 0.4 + Math.random() * 0.15
                }));
            } else if (Math.abs(speed) > 50) {
                // Medium speed = regular prints with occasional splatters
                if (Math.random() < 0.4) {
                    mudFootprints.push(new MudFootprint(racer.x, baseY, racer.laneIndex, {
                        type: 'splatter',
                        size: 10 + Math.random() * 8,
                        opacity: 0.35 + Math.random() * 0.15
                    }));
                } else {
                    mudFootprints.push(new MudFootprint(racer.x, baseY, racer.laneIndex, {
                        type: 'print',
                        size: 8 + Math.random() * 5,
                        opacity: 0.4 + Math.random() * 0.15
                    }));
                }
            } else {
                // Slow/idle = small drip prints
                mudFootprints.push(new MudFootprint(racer.x + (Math.random()-0.5)*15, baseY, racer.laneIndex, {
                    type: 'print',
                    size: 5 + Math.random() * 4,
                    opacity: 0.25 + Math.random() * 0.1
                }));
            }
        }


        class Obstacle {
            constructor(type, x, laneIndex) {
                this.type = type; // 'mud', 'moss', or 'rock'
                this.x = x;
                this.laneIndex = laneIndex;
                if (type === 'mud') { this.width = 120; this.height = 60; }
                else if (type === 'moss') { this.width = 100; this.height = 50; }
                else if (type === 'water_puddle') { this.width = 110; this.height = 55; }
                else if (type === 'banana_peel') { this.width = 50; this.height = 35; }
                else { this.width = 60; this.height = 45; }
                
                this.spent = false;
                this.spentTimer = 0;
                
                // Animation state
                this.animTime = Math.random() * Math.PI * 2;
                this.ripplePhase = Math.random() * Math.PI * 2;
                this.wobbleAmp = 0;
                this.splashActive = false;
                this.splashTimer = 0;
                this.splashParticles = [];
                // Moss sway
                this.swayPhase = Math.random() * Math.PI * 2;
                this.shimmerPhase = Math.random() * Math.PI * 2;
                // Water puddle specific
                this.waterRipples = [];
                if (type === 'water_puddle') {
                    for (let i = 0; i < 3; i++) {
                        this.waterRipples.push({
                            x: (Math.random() - 0.5) * this.width * 0.5,
                            y: (Math.random() - 0.5) * this.height * 0.3,
                            phase: Math.random() * Math.PI * 2,
                            speed: 1.5 + Math.random() * 1.5,
                            maxR: 12 + Math.random() * 10
                        });
                    }
                }
                // Ambient particles
                this.ambientParticles = [];
                if (type === 'mud') {
                    for (let i = 0; i < 3; i++) {
                        this.ambientParticles.push({
                            x: (Math.random() - 0.5) * this.width * 0.6,
                            y: (Math.random() - 0.5) * this.height * 0.4,
                            size: 2 + Math.random() * 3,
                            phase: Math.random() * Math.PI * 2,
                            speed: 1 + Math.random() * 2
                        });
                    }
                } else if (type === 'moss') {
                    for (let i = 0; i < 4; i++) {
                        this.ambientParticles.push({
                            x: (Math.random() - 0.5) * this.width * 0.7,
                            y: (Math.random() - 0.5) * this.height * 0.5,
                            size: 1.5 + Math.random() * 2.5,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.8 + Math.random() * 1.5,
                            shimmer: Math.random()
                        });
                    }
                }
            }
            
            triggerSplash() {
                if (this.type !== 'mud' && this.type !== 'water_puddle') return;
                this.splashActive = true;
                this.splashTimer = 0;
                this.wobbleAmp = 1.0;
                this.splashParticles = [];
                const splashCount = this.type === 'water_puddle' ? 6 : 8;
                const splashForce = this.type === 'water_puddle' ? 0.7 : 1.0;
                for (let i = 0; i < splashCount; i++) {
                    const angle = (i / splashCount) * Math.PI * 2 + Math.random() * 0.5;
                    this.splashParticles.push({
                        x: 0, y: 0,
                        vx: Math.cos(angle) * (30 + Math.random() * 40) * splashForce,
                        vy: (-Math.random() * 60 - 20) * splashForce,
                        size: 3 + Math.random() * 5,
                        life: 0.6 + Math.random() * 0.3,
                        maxLife: 0.9
                    });
                }
            }
            
            update(dt) {
                this.animTime += dt;
                this.ripplePhase += dt * 2.5;
                this.swayPhase += dt * 1.8;
                this.shimmerPhase += dt * 3;
                
                if (this.spent) {
                    this.spentTimer += dt;
                }
                
                // Wobble decay
                if (this.wobbleAmp > 0) {
                    this.wobbleAmp *= Math.exp(-4 * dt);
                    if (this.wobbleAmp < 0.01) this.wobbleAmp = 0;
                }
                
                // Splash particles
                if (this.splashActive) {
                    this.splashTimer += dt;
                    this.splashParticles.forEach(p => {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.vy += 150 * dt;
                        p.life -= dt;
                    });
                    this.splashParticles = this.splashParticles.filter(p => p.life > 0);
                    if (this.splashParticles.length === 0) this.splashActive = false;
                }
            }
            
            draw(cameraX, canvasWidth) {
                const screenX = this.x - cameraX + canvasWidth * 0.3;
                const trackTop = canvas.height * TRACK_Y_START;
                const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
                const laneHeight = trackH / 5;
                const groundY = trackTop + this.laneIndex * laneHeight + laneHeight * 0.5;
                
                if (screenX < -200 || screenX > canvasWidth + 200) return;

                if (this.spent) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - this.spentTimer * 2);
                    const scale = Math.max(0, 1 - this.spentTimer * 2.5);
                    ctx.translate(screenX, groundY);
                    ctx.scale(scale, scale);
                    if (this.type === 'banana_peel') {
                        this.drawBananaPeel(0, 0);
                    }
                    ctx.restore();
                    return;
                }

                if (this.type === 'mud') {
                    this.drawMud(screenX, groundY);
                } else if (this.type === 'moss') {
                    this.drawMoss(screenX, groundY);
                } else if (this.type === 'water_puddle') {
                    this.drawWaterPuddle(screenX, groundY);
                } else if (this.type === 'banana_peel') {
                    this.drawBananaPeel(screenX, groundY);
                } else {
                    this.drawRock(screenX, groundY);
                }
            }

            drawBananaPeel(screenX, groundY) {
                const time = this.animTime;
                ctx.save();
                ctx.translate(screenX, groundY);
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 5, this.width * 0.4, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Draw the yellow banana peel asset
                const img = imageCache['obstacle_banana_peel'];
                if (img) {
                    const breathe = 1 + Math.sin(time * 2) * 0.04;
                    ctx.scale(breathe, breathe);
                    ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback: procedural 2D cartoon banana peel
                    ctx.fillStyle = '#FFEB3B'; // yellow
                    ctx.strokeStyle = '#FBC02D';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    // Draw center nub
                    ctx.arc(0, -6, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Left peel
                    ctx.beginPath();
                    ctx.moveTo(-2, -6);
                    ctx.bezierCurveTo(-15, -4, -20, 4, -22, 6);
                    ctx.bezierCurveTo(-18, 0, -8, -2, -2, -6);
                    ctx.fill();
                    ctx.stroke();
                    // Right peel
                    ctx.beginPath();
                    ctx.moveTo(2, -6);
                    ctx.bezierCurveTo(15, -4, 20, 4, 22, 6);
                    ctx.bezierCurveTo(18, 0, 8, -2, 2, -6);
                    ctx.fill();
                    ctx.stroke();
                    // Center bottom peel
                    ctx.beginPath();
                    ctx.moveTo(0, -6);
                    ctx.bezierCurveTo(0, 2, -5, 10, -6, 12);
                    ctx.bezierCurveTo(2, 6, 2, 0, 0, -6);
                    ctx.fill();
                    ctx.stroke();
                }
                
                ctx.restore();
            }
            
            drawMud(screenX, groundY) {
                const time = this.animTime;
                const wobble = this.wobbleAmp * Math.sin(time * 12);
                const ripple = Math.sin(this.ripplePhase) * 0.03;
                
                ctx.save();
                ctx.translate(screenX, groundY);
                
                // Subtle surface wobble scale
                const scaleX = 1 + wobble * 0.05 + ripple;
                const scaleY = 1 - wobble * 0.03 - ripple * 0.5;
                ctx.scale(scaleX, scaleY);
                
                // Draw the new mud asset image
                const img = imageCache['obstacle_mud_patch_new'];
                if (img) {
                    ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback: procedural animated mud
                    // Base puddle shape with gradient
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width * 0.45);
                    grad.addColorStop(0, '#3d2815');
                    grad.addColorStop(0.4, '#5c3a1e');
                    grad.addColorStop(0.7, '#6d4c2e');
                    grad.addColorStop(1, 'rgba(109, 76, 46, 0.3)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Animated ripple rings
                const rippleAlpha = 0.15 + Math.sin(this.ripplePhase) * 0.08;
                ctx.strokeStyle = `rgba(180, 140, 80, ${rippleAlpha})`;
                ctx.lineWidth = 1.5;
                const rippleSize = 0.6 + Math.sin(this.ripplePhase * 0.7) * 0.15;
                ctx.beginPath();
                ctx.ellipse(this.width * 0.1, -this.height * 0.05, this.width * 0.2 * rippleSize, this.height * 0.15 * rippleSize, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                // Second smaller ripple
                const ripple2Alpha = 0.1 + Math.sin(this.ripplePhase + 1.5) * 0.06;
                ctx.strokeStyle = `rgba(200, 160, 90, ${ripple2Alpha})`;
                const ripple2Size = 0.5 + Math.sin(this.ripplePhase * 0.9 + 2) * 0.12;
                ctx.beginPath();
                ctx.ellipse(-this.width * 0.15, this.height * 0.08, this.width * 0.12 * ripple2Size, this.height * 0.1 * ripple2Size, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                // Wet shine/reflection highlights
                const shineAlpha = 0.25 + Math.sin(time * 1.5) * 0.1;
                ctx.fillStyle = `rgba(255, 255, 240, ${shineAlpha})`;
                ctx.beginPath();
                ctx.ellipse(-this.width * 0.12, -this.height * 0.12, 8, 4, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 255, 240, ${shineAlpha * 0.6})`;
                ctx.beginPath();
                ctx.ellipse(this.width * 0.15, -this.height * 0.05, 5, 3, 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Ambient tiny mud bubbles
                this.ambientParticles.forEach(p => {
                    const px = p.x + Math.sin(time * p.speed + p.phase) * 3;
                    const py = p.y + Math.cos(time * p.speed * 0.7 + p.phase) * 2;
                    const pAlpha = 0.3 + Math.sin(time * p.speed * 2 + p.phase) * 0.15;
                    ctx.fillStyle = `rgba(90, 60, 30, ${pAlpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    // Tiny highlight on bubble
                    ctx.fillStyle = `rgba(255, 220, 150, ${pAlpha * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(px - 1, py - 1, p.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Splash particles (when stepped on)
                if (this.splashActive) {
                    this.splashParticles.forEach(p => {
                        const alpha = Math.max(0, p.life / p.maxLife);
                        ctx.fillStyle = `rgba(75, 54, 33, ${alpha * 0.8})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                
                ctx.restore();
            }
            
            drawMoss(screenX, groundY) {
                const time = this.animTime;
                const sway = Math.sin(this.swayPhase) * 0.02;
                
                ctx.save();
                ctx.translate(screenX, groundY);
                ctx.rotate(sway);
                
                // Draw the new moss asset image
                const img = imageCache['obstacle_moss_patch_new'];
                if (img) {
                    ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback: procedural animated moss
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width * 0.4);
                    grad.addColorStop(0, '#2E7D32');
                    grad.addColorStop(0.5, '#4CAF50');
                    grad.addColorStop(0.8, '#81C784');
                    grad.addColorStop(1, 'rgba(129, 199, 132, 0.2)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Gentle shimmer moisture effect
                const shimmerAlpha = 0.12 + Math.sin(this.shimmerPhase) * 0.08;
                ctx.fillStyle = `rgba(200, 255, 200, ${shimmerAlpha})`;
                // Multiple shimmer spots that move
                for (let i = 0; i < 3; i++) {
                    const sx = Math.sin(time * 1.2 + i * 2.1) * this.width * 0.25;
                    const sy = Math.cos(time * 0.9 + i * 1.7) * this.height * 0.2;
                    const sSize = 4 + Math.sin(time * 2 + i) * 1.5;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sSize, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Dew drop highlights
                const dewAlpha = 0.3 + Math.sin(time * 2) * 0.12;
                ctx.fillStyle = `rgba(255, 255, 255, ${dewAlpha})`;
                ctx.beginPath();
                ctx.arc(-this.width * 0.2, -this.height * 0.1, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.width * 0.1, this.height * 0.08, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.width * 0.25, -this.height * 0.15, 1.8, 0, Math.PI * 2);
                ctx.fill();
                
                // Ambient moss spore/particle details
                this.ambientParticles.forEach(p => {
                    const px = p.x + Math.sin(time * p.speed + p.phase) * 4;
                    const py = p.y + Math.cos(time * p.speed * 0.6 + p.phase) * 3;
                    // Floating tiny spores
                    const floatY = py - Math.sin(time * p.speed * 1.5 + p.phase) * 5;
                    const pAlpha = 0.2 + p.shimmer * 0.15 + Math.sin(time * 3 + p.phase) * 0.1;
                    ctx.fillStyle = `rgba(144, 238, 144, ${pAlpha})`;
                    ctx.beginPath();
                    ctx.arc(px, floatY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Subtle edge glow to indicate slipperiness
                const glowAlpha = 0.06 + Math.sin(time * 1.5) * 0.03;
                ctx.strokeStyle = `rgba(100, 255, 100, ${glowAlpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.width/2 + 3, this.height/2 + 2, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
            
            drawWaterPuddle(screenX, groundY) {
                const time = this.animTime;
                
                ctx.save();
                ctx.translate(screenX, groundY);
                
                // Draw asset image
                const img = imageCache['obstacle_water_puddle'];
                if (img) {
                    ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback: procedural water puddle
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width * 0.45);
                    grad.addColorStop(0, 'rgba(100, 180, 220, 0.7)');
                    grad.addColorStop(0.5, 'rgba(70, 150, 200, 0.6)');
                    grad.addColorStop(0.8, 'rgba(50, 130, 180, 0.4)');
                    grad.addColorStop(1, 'rgba(50, 130, 180, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Animated ripple rings
                this.waterRipples.forEach(ripple => {
                    const phase = (time * ripple.speed + ripple.phase) % (Math.PI * 2);
                    const r = (phase / (Math.PI * 2)) * ripple.maxR;
                    const alpha = 0.3 * (1 - phase / (Math.PI * 2));
                    ctx.strokeStyle = `rgba(200, 230, 255, ${alpha})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.ellipse(ripple.x, ripple.y, r, r * 0.5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                });
                
                // Surface shine/reflection
                const shineAlpha = 0.2 + Math.sin(time * 1.8) * 0.1;
                ctx.fillStyle = `rgba(255, 255, 255, ${shineAlpha})`;
                ctx.beginPath();
                ctx.ellipse(-this.width * 0.15, -this.height * 0.1, 10, 5, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 255, 255, ${shineAlpha * 0.6})`;
                ctx.beginPath();
                ctx.ellipse(this.width * 0.12, -this.height * 0.05, 6, 3, 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Splash particles (when stepped on)
                if (this.splashActive) {
                    this.splashParticles.forEach(p => {
                        const alpha = Math.max(0, p.life / p.maxLife);
                        ctx.fillStyle = `rgba(120, 190, 230, ${alpha * 0.7})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                
                ctx.restore();
            }
            
            drawRock(screenX, groundY) {
                const time = this.animTime;
                
                ctx.save();
                ctx.translate(screenX, groundY);
                
                // Subtle idle wobble animation
                const wobble = Math.sin(time * 1.2) * 0.015;
                ctx.rotate(wobble);
                
                // Draw the new rock asset image
                const img = imageCache['obstacle_rock_new'];
                if (img) {
                    // Gentle breathing scale
                    const breathe = 1 + Math.sin(time * 1.5) * 0.02;
                    ctx.scale(breathe, breathe);
                    ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback: procedural rock with gradient
                    const grad = ctx.createRadialGradient(-5, -5, 0, 0, 0, this.width * 0.4);
                    grad.addColorStop(0, '#9E9E9E');
                    grad.addColorStop(0.5, '#757575');
                    grad.addColorStop(1, '#5D4037');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Ambient dust motes floating around rock
                for (let i = 0; i < 2; i++) {
                    const px = Math.sin(time * 0.8 + i * 3.1) * this.width * 0.4;
                    const py = Math.cos(time * 0.6 + i * 2.3) * this.height * 0.3 - 5;
                    const pAlpha = 0.15 + Math.sin(time * 2 + i) * 0.08;
                    ctx.fillStyle = `rgba(180, 160, 130, ${pAlpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + Math.sin(time + i) * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Subtle shadow pulse beneath
                const shadowAlpha = 0.12 + Math.sin(time * 1.5) * 0.03;
                ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.beginPath();
                ctx.ellipse(2, this.height * 0.35, this.width * 0.4, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // ===== STRAY CHICKEN CROSSING SYSTEM =====
        let strayChickens = [];
        let chickenSpawnTimer = 0;
        let chickenSpawnInterval = 8; // seconds between chicken spawns (adjusts with difficulty)
        const CHICKEN_SPEED_MIN = 180;
        const CHICKEN_SPEED_MAX = 300;
        const CHICKEN_WARN_DISTANCE = 600; // Spawn this far ahead of player
        const CHICKEN_SAFE_DISTANCE = 200; // Never spawn closer than this to player

        class StrayChicken {
            constructor(x, direction, trackTop, trackH) {
                this.x = x; // World X position where it crosses
                this.direction = direction; // 1 = top-to-bottom, -1 = bottom-to-top
                this.trackTop = trackTop;
                this.trackH = trackH;
                
                // Y position - starts off-track, crosses to other side
                const margin = 60;
                if (direction === 1) {
                    this.y = trackTop - margin; // Start above track
                    this.targetY = trackTop + trackH + margin; // End below
                } else {
                    this.y = trackTop + trackH + margin; // Start below track
                    this.targetY = trackTop - margin; // End above
                }
                
                this.speed = CHICKEN_SPEED_MIN + Math.random() * (CHICKEN_SPEED_MAX - CHICKEN_SPEED_MIN);
                this.vy = this.speed * direction;
                
                // Slight horizontal drift for natural movement
                this.vx = (Math.random() - 0.5) * 40;
                
                // Animation
                this.animTime = 0;
                this.legPhase = 0;
                this.wingPhase = 0;
                this.bobPhase = Math.random() * Math.PI * 2;
                this.headBob = 0;
                this.featherParticles = [];
                this.active = true;
                this.hasCollided = false;
                
                // Visual size
                this.width = 50;
                this.height = 45;
                
                // Warning indicator
                this.warningAlpha = 1.0;
                this.warningTimer = 0;
                
                // Sound played flag
                this.soundPlayed = false;
            }
            
            update(dt) {
                if (!this.active) return;
                
                this.animTime += dt;
                this.legPhase += dt * 18; // Fast leg movement
                this.wingPhase += dt * 8; // Wing flap
                this.bobPhase += dt * 12;
                this.headBob = Math.sin(this.bobPhase) * 3;
                this.warningTimer += dt;
                
                // Move chicken across track
                this.y += this.vy * dt;
                this.x += this.vx * dt;
                
                // Slight speed variation for natural feel
                this.vy += (Math.random() - 0.5) * 20 * dt;
                this.vy = Math.sign(this.direction) * Math.min(Math.abs(this.vy), CHICKEN_SPEED_MAX * 1.2);
                
                // Feather particles (occasionally shed)
                if (Math.random() < 0.15 * dt * 60) {
                    this.featherParticles.push({
                        x: (Math.random() - 0.5) * 15,
                        y: (Math.random() - 0.5) * 10,
                        vx: (Math.random() - 0.5) * 30,
                        vy: -20 - Math.random() * 20,
                        rotation: Math.random() * Math.PI * 2,
                        rv: (Math.random() - 0.5) * 5,
                        life: 0.8 + Math.random() * 0.4,
                        maxLife: 1.2,
                        size: 3 + Math.random() * 3
                    });
                }
                
                // Update feather particles
                this.featherParticles.forEach(f => {
                    f.x += f.vx * dt;
                    f.y += f.vy * dt;
                    f.vy += 80 * dt; // gravity
                    f.rotation += f.rv * dt;
                    f.life -= dt;
                });
                this.featherParticles = this.featherParticles.filter(f => f.life > 0);
                
                // Deactivate once fully off-screen on the other side
                if (this.direction === 1 && this.y > this.targetY + 50) this.active = false;
                if (this.direction === -1 && this.y < this.targetY - 50) this.active = false;
            }
            
            // Check if chicken is in a specific lane at a specific x
            isInLane(laneIndex, racerX, trackTop, trackH) {
                const laneH = trackH / 5;
                const laneTop = trackTop + laneIndex * laneH;
                const laneBot = laneTop + laneH;
                const chickenInLane = this.y > laneTop - 15 && this.y < laneBot + 15;
                const xOverlap = Math.abs(this.x - racerX) < 55;
                return chickenInLane && xOverlap;
            }
            
            draw(cameraX, canvasWidth) {
                if (!this.active) return;
                
                const screenX = this.x - cameraX + canvasWidth * 0.3;
                if (screenX < -100 || screenX > canvasWidth + 100) return;
                
                const screenY = this.y;
                const time = this.animTime;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                
                // Flip based on slight horizontal movement direction
                const flipX = this.vx < -5 ? -1 : 1;
                ctx.scale(flipX, 1);
                
                // Slight body tilt in movement direction
                const tilt = Math.sin(this.bobPhase * 0.5) * 0.08;
                ctx.rotate(tilt);
                
                const img = imageCache['obstacle_stray_chicken'];
                if (img) {
                    // Use the asset with running bob animation
                    const bob = Math.sin(this.bobPhase) * 3;
                    const squash = 1 + Math.sin(this.legPhase) * 0.05;
                    ctx.scale(1, squash);
                    ctx.drawImage(img, -this.width/2, -this.height/2 + bob, this.width, this.height);
                } else {
                    // Procedural chicken drawing (fallback)
                    this.drawProceduralChicken(time);
                }
                
                // Draw feather particles
                this.featherParticles.forEach(f => {
                    const alpha = Math.max(0, f.life / f.maxLife);
                    ctx.save();
                    ctx.globalAlpha = alpha * 0.8;
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rotation);
                    ctx.fillStyle = Math.random() > 0.5 ? '#8D6E63' : '#FFCC80';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, f.size, f.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                
                ctx.restore();
                
                // Draw warning indicator when chicken is approaching
                if (this.warningTimer < 1.5) {
                    this.drawWarningIndicator(screenX, canvasWidth);
                }
            }
            
            drawProceduralChicken(time) {
                const legOffset = Math.sin(this.legPhase) * 8;
                const wingFlap = Math.sin(this.wingPhase) * 0.3;
                const bob = Math.sin(this.bobPhase) * 2;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 18, 18, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Legs (animated running)
                ctx.strokeStyle = '#FFA000';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                // Left leg
                ctx.beginPath();
                ctx.moveTo(-5, 8);
                ctx.lineTo(-5 + legOffset * 0.5, 16);
                ctx.lineTo(-5 + legOffset, 18);
                ctx.stroke();

        function spawnStrayChicken() {
            const trackTop = canvas.height * TRACK_Y_START;
            const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
            
            // Don't spawn if player is too close to start or if not racing
            if (player.x < 300) return;
            
            // Spawn ahead of player (give reaction time)
            const spawnX = player.x + CHICKEN_WARN_DISTANCE + Math.random() * 400;
            
            // Safety check: don't spawn too close
            if (Math.abs(spawnX - player.x) < CHICKEN_SAFE_DISTANCE) return;
            
            // Check not too close to existing chickens
            const tooClose = strayChickens.some(c => c.active && Math.abs(c.x - spawnX) < 400);
            if (tooClose) return;
            
            // Random direction
            const direction = Math.random() > 0.5 ? 1 : -1;
            
            const chicken = new StrayChicken(spawnX, direction, trackTop, trackH);
            strayChickens.push(chicken);
            
            // Play cluck sound when chicken appears on screen
            setTimeout(() => {
                if (chicken.active) {
                    playSound('sfx_chicken_cluck', { volume: 0.5 });
                }
            }, 300);
        }

        function updateStrayChickens(dt) {
            if (mp.active) return;
            // Update spawn timer
            chickenSpawnTimer += dt;
            
            // Easy mode normal race: no chickens (to keep it forgiving)
            // But unlimited mode always has chickens regardless of difficulty
            if (config.difficulty === 'easy' && !unlimitedMode) {
                // Still update existing chickens (if any somehow exist)
                strayChickens.forEach(chicken => {
                    if (chicken.active) chicken.update(dt);
                });
                strayChickens = strayChickens.filter(c => c.active || c.featherParticles.length > 0);
                return;
            }
            
            // Difficulty affects spawn rate
            const diff = config.difficulty;
            let interval = diff === 'easy' ? 12 : (diff === 'hard' ? 6 : 8);
            
            // In unlimited mode, chickens become more frequent over time
            if (unlimitedMode && ulDifficultyTimer > 20) {
                interval *= Math.max(0.5, 1 - ulDifficultyTimer * 0.005);
            }
            
            chickenSpawnInterval = interval;
            
            if (chickenSpawnTimer >= chickenSpawnInterval) {
                chickenSpawnTimer = 0;
                // 70% chance to actually spawn (adds unpredictability)
                if (Math.random() < 0.7) {
                    spawnStrayChicken();
                }
            }
            
            // Update all active chickens
            strayChickens.forEach(chicken => {
                if (!chicken.active) return;
                chicken.update(dt);
                
                // Collision detection with player
                if (!chicken.hasCollided && player.state !== 'tumbling' && player.state !== 'recovering') {
                    const trackTop = canvas.height * TRACK_Y_START;
                    const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
                    
                    if (chicken.isInLane(player.laneIndex, player.x, trackTop, trackH)) {
                        // Player is on the ground - collision!
                        if (player.state !== 'airborne') {
                            chicken.hasCollided = true;
                            handleChickenCollision(chicken);
                        }
                    }
                }
            });
            
            // Clean up inactive chickens
            strayChickens = strayChickens.filter(c => c.active || c.featherParticles.length > 0);
        }

        class BananaPeelProjectile {
            constructor(startX, startY, targetX, targetY, targetLane) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.targetLane = targetLane;
                
                this.active = true;
                this.animTime = 0;
                
                // Calculate trajectory: parabola
                const dx = targetX - startX;
                const dy = targetY - startY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const speed = 400; // pixels per second
                this.duration = distance / speed;
                this.timer = 0;
                
                // Peak height of parabola
                this.peakHeight = 120 + Math.random() * 80;
                
                // Spin rotation
                this.rotation = Math.random() * Math.PI * 2;
                this.rv = 10 + Math.random() * 8; // fast spin
            }
            
            update(dt) {
                this.timer += dt;
                const t = Math.min(1, this.timer / this.duration);
                
                // Linear interpolation for X and Y
                const currentBaseX = this.startX + (this.targetX - this.startX) * t;
                const currentBaseY = this.startY + (this.targetY - this.startY) * t;
                
                // Add parabolic height arc: h = peak * 4 * t * (1-t)
                const arcY = -this.peakHeight * 4 * t * (1 - t);
                
                this.x = currentBaseX;
                this.y = currentBaseY + arcY;
                this.rotation += this.rv * dt;
                
                if (t >= 1) {
                    this.active = false;
                    // Landed! Spawn the actual banana peel obstacle
                    const ob = new Obstacle('banana_peel', this.targetX, this.targetLane);
                    if (unlimitedMode) {
                        ulObstacles.push(ob);
                    } else {
                        obstacles.push(ob);
                    }
                    
                    // Spawn a soft dust or splash effect on landing
                    spawnDust(this.targetX, this.targetY, 4, '#FFEB3B');
                }
            }
            
            draw(camX, canvasW) {
                const screenX = this.x - camX + canvasW * 0.3;
                if (screenX < -50 || screenX > canvasW + 50) return;
                
                // Draw target landing spot warning shadow on the track
                const t = Math.min(1, this.timer / this.duration);
                const targetScreenX = this.targetX - camX + canvasW * 0.3;
                
                // Shadow grows larger and darker as banana peel gets closer to landing
                ctx.save();
                ctx.fillStyle = `rgba(0, 0, 0, ${0.1 + t * 0.2})`;
                ctx.beginPath();
                ctx.ellipse(targetScreenX, this.targetY, 15 * t + 5, 4 * t + 1, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Flashing exclamation warning circle on landing target
                const flash = (Math.sin(performance.now() * 0.015) + 1) * 0.5;
                ctx.strokeStyle = `rgba(255, 235, 59, ${flash * (1 - t)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(targetScreenX, this.targetY - 10, 16, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = `rgba(255, 193, 7, ${flash * (1 - t) * 0.8})`;
                ctx.font = 'bold 12px Fredoka';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🍌', targetScreenX, this.targetY - 10);
                ctx.restore();
                
                // Draw the spinning banana peel
                ctx.save();
                ctx.translate(screenX, this.y);
                ctx.rotate(this.rotation);
                const img = imageCache['obstacle_banana_peel'];
                const w = 45;
                const h = 32;
                if (img) {
                    ctx.drawImage(img, -w/2, -h/2, w, h);
                } else {
                    // Fallback
                    ctx.fillStyle = '#FFEB3B';
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function triggerBananaPeelThrow() {
            if (gameState !== 'racing' && gameState !== 'unlimited_racing') return;
            
            // On-screen or slightly ahead crowd members, queried from sorted layers.
            const minX = player.x + 350;
            const maxX = player.x + 750;
            const potentialThrowers = [];
            [crowdTop, crowdBottom].forEach(layer => {
                let i = firstIndexAtOrAfter(layer, minX);
                while (i < layer.length && layer[i].x <= maxX) {
                    const c = layer[i++];
                    if (c.imageId === 'crowd_villager_1_cheering' || c.imageId === 'crowd_villager_4_balloons' || Math.random() < 0.4) {
                        potentialThrowers.push(c);
                    }
                }
            });
            
            if (potentialThrowers.length === 0) return;
            
            // Pick a random thrower
            const thrower = potentialThrowers[Math.floor(Math.random() * potentialThrowers.length)];
            
            // Pick a random target lane
            let targetLane;
            if (unlimitedMode) {
                targetLane = player.laneIndex; // Always player's lane in single lane mode
            } else {
                // Target the lane of a random active racer (or player) to make it competitive!
                const targets = racers.filter(r => !r.finished);
                if (targets.length > 0) {
                    targetLane = targets[Math.floor(Math.random() * targets.length)].laneIndex;
                } else {
                    targetLane = Math.floor(Math.random() * 5);
                }
            }
            
            // Target X should be ahead of player/racers
            const targetX = thrower.x + (Math.random() - 0.5) * 100;
            
            // Calculate start position
            const trackTop = canvas.height * TRACK_Y_START;
            const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
            const startY = thrower.side === 'top' ? trackTop - 50 : canvas.height - 70;
            
            // Calculate target position on the lane
            const laneH = trackH / 5;
            const targetY = trackTop + targetLane * laneH + laneH * 0.5;
            
            // Spawn the flying projectile!
            bananaPeelProjectiles.push(new BananaPeelProjectile(
                thrower.x + thrower.walkOffset,
                startY,
                targetX,
                targetY,
                targetLane
            ));
            
            // Make the thrower perform a funny throw animation/bob
            thrower.idleState = 'cheering';
            thrower.actionElapsed = 0;
            thrower.actionDuration = 1.5;
            thrower.targetScaleY = 0.7; // Squat to throw
            
            // Spawn little "throw" dust or sparkle near thrower
            spawnDust(thrower.x + thrower.walkOffset, startY + 20, 2, '#FFEB3B');
            
            // Swish sound

            // Display floating text from the kid throwing it!
            const kidTexts = ['Watch out, banana! 🍌', 'Hehe, don\'t slip!', 'Banana peel incoming!', 'Oops! 🍌', 'Catch this!'];
            const txt = kidTexts[Math.floor(Math.random() * kidTexts.length)];

                this.aiConsistency = 0.5 + Math.random() * 0.5;
                // Animation state
                this.breathTimer = Math.random() * Math.PI * 2;
                this.hopBob = 0;
                this.targetScaleX = 1;
                this.targetScaleY = 1;
                this.currentScaleX = 1;
                this.currentScaleY = 1;
                this.currentRotation = 0;
                this.targetRotation = 0;
                this.dustTimer = 0;
                this.lastX = 50;
                this.aiPanicThreshold = 0.7 + Math.random() * 0.2; // Distance % where they start panicking
                this.aiMistakeChance = 0.05; // Base chance for a "bad" hop or delay
                this.aiSpeedMultiplier = 1.0; 
            }

            get width() { return 104; } // Increased from 90
            get height() { return 138; } // Increased from 120

            // Trigger a facial expression reaction
            triggerExpression(type, duration = 1.2, intensity = 1.0) {
                const now = performance.now() * 0.001;
                // Cooldown to prevent expression spam (0.3s min between expressions)
                if (now - this.lastExpressionTime < 0.3) return;
                this.lastExpressionTime = now;
                
                this.expression = type;
                this.expressionTimer = 0;
                this.expressionDuration = duration;
                this.targetExpressionIntensity = intensity;
                
                // Add reaction marks based on type
                if (type === 'shocked' || type === 'panicked') {
                    this.reactionMarks.push({ type: 'exclamation', life: 0.8, maxLife: 0.8, x: (Math.random() - 0.5) * 20, y: -10 });
                    this.bodyShakeIntensity = Math.min(1, intensity * 0.6);
                } else if (type === 'nervous') {
                    // Add sweat drops
                    this.sweatDrops.push({ x: -12 + Math.random() * 5, y: -20, vy: 30, life: 1.0, maxLife: 1.0, size: 3 + Math.random() * 2 });
                    this.sweatDrops.push({ x: 10 + Math.random() * 5, y: -15, vy: 25, life: 1.2, maxLife: 1.2, size: 2.5 + Math.random() * 2 });
                } else if (type === 'surprised') {
                    this.reactionMarks.push({ type: 'question', life: 0.7, maxLife: 0.7, x: 15, y: -15 });
                    this.bodyShakeIntensity = Math.min(1, intensity * 0.4);
                } else if (type === 'relieved' || type === 'determined') {
                    this.reactionMarks.push({ type: 'sparkle', life: 0.9, maxLife: 0.9, x: (Math.random() - 0.5) * 30, y: -20 + Math.random() * 10 });
                    this.reactionMarks.push({ type: 'sparkle', life: 1.0, maxLife: 1.0, x: (Math.random() - 0.5) * 25, y: -25 + Math.random() * 10 });
                }
            }

            // Update expression state each frame
            updateExpression(dt) {
                // Timer and intensity
                if (this.expression !== 'neutral') {
                    this.expressionTimer += dt;
                    
                    // Smooth intensity ramp up and fade out
                    const progress = this.expressionTimer / this.expressionDuration;
                    if (progress < 0.15) {
                        this.expressionIntensity += (this.targetExpressionIntensity - this.expressionIntensity) * 0.3;
                    } else if (progress > 0.7) {
                        this.expressionIntensity *= 0.95;
                    }
                    
                    if (this.expressionTimer >= this.expressionDuration) {
                        this.expression = 'neutral';
                        this.expressionIntensity = 0;
                        this.targetExpressionIntensity = 0;
                    }
                } else {
                    this.expressionIntensity *= 0.9;
                }
                
                // Body shake decay
                this.bodyShakeIntensity *= Math.exp(-6 * dt);
                if (this.bodyShakeIntensity > 0.01) {
                    this.bodyShakeX = (Math.random() - 0.5) * this.bodyShakeIntensity * 4;
                    this.bodyShakeY = (Math.random() - 0.5) * this.bodyShakeIntensity * 2;
                } else {
                    this.bodyShakeX = 0;
                    this.bodyShakeY = 0;
                    this.bodyShakeIntensity = 0;
                }
                
                // Update sweat drops
                this.sweatDrops.forEach(drop => {
                    drop.y += drop.vy * dt;
                    drop.vy += 60 * dt;
                    drop.life -= dt;
                });
                this.sweatDrops = this.sweatDrops.filter(d => d.life > 0);
                
                // Update reaction marks
                this.reactionMarks.forEach(mark => {
                    mark.life -= dt;
                    mark.y -= 15 * dt; // Float up gently
                });
                this.reactionMarks = this.reactionMarks.filter(m => m.life > 0);
            }

            getImageId() {
                if (this.isPlayer) {
                    const skin = playerData.equippedSkin;
                    if (skin === 'merdeka_skin') return 'skin_merdeka_hopping';
                    if (skin === 'village_champion_skin') return 'skin_village_champion_hopping';
                    if (skin === 'halloween_village_skin') return 'skin_halloween_village_hopping';

                    switch(this.state) {
                        case 'charging': return 'player_character_charging';
                        case 'tumbling': return 'player_character_tumbling';
                        case 'balancing': return 'player_character_balancing';
                        case 'airborne': return 'player_character_hopping';
                        case 'idle': return 'player_character_hopping';
                        default: return 'player_character_hopping';
                    }
                }
                const opponentSkin = playerData.equippedOpponentSkin;
                const opponentSkinMap = {
                    halloween_witch: 'opponent_halloween_witch_hopping',
                    halloween_vampire: 'opponent_halloween_vampire_hopping',
                    halloween_frankenstein: 'opponent_halloween_frankenstein_hopping',
                    halloween_ghost: 'opponent_halloween_ghost_hopping'
                };
                return opponentSkinMap[opponentSkin] || this.imageId;
            }
        }

        let player;
        let racers = [];

        // Crowd Member class
        class CrowdMember {
            constructor(x, side, imageId) {
                this.x = x;
                this.side = side; // 'top' or 'bottom'
                this.imageId = imageId;
                this.animOffset = Math.random() * Math.PI * 2;
                this.animSpeed = 2 + Math.random() * 3;
                this.baseBounce = 5 + Math.random() * 8;
                this.bounceAmp = this.baseBounce;
                this.scale = 0.65 + Math.random() * 0.15;
                
                // Idle behavior state
                this.idleState = 'idle'; // idle, looking, cheering, walking, nodding
                this.idleTimer = Math.random() * 5; // stagger start
                this.idleNextAction = 2 + Math.random() * 6; // time until next action
                this.headTilt = 0;
                this.targetHeadTilt = 0;
                this.walkOffset = 0;
                this.walkDir = Math.random() > 0.5 ? 1 : -1;
                this.lookDir = 0;
                this.actionDuration = 0;
                this.actionElapsed = 0;
                
                // Squishing state
                this.scaleY = 1.0;
                this.targetScaleY = 1.0;
            }

            updateIdle(dt) {
                this.idleTimer += dt;

                // State machine for idle behaviors
                if (this.idleState === 'idle') {
                    // Subtle head sway while idle
                    this.targetHeadTilt = Math.sin(this.idleTimer * 0.8 + this.animOffset) * 0.03;
                    this.targetScaleY = 1.0;
                    this.bounceAmp = this.baseBounce;
                    
                    if (this.idleTimer > this.idleNextAction) {
                        // Pick a new action
                        const r = Math.random();
                        if (r < 0.3) {
                            this.idleState = 'looking';
                            this.lookDir = (Math.random() - 0.5) * 2;
                            this.actionDuration = 1.5 + Math.random() * 2;
                        } else if (r < 0.5) {
                            this.idleState = 'cheering';
                            this.actionDuration = 1.2 + Math.random() * 1.5;
                        } else if (r < 0.7) {
                            this.idleState = 'walking';
                            this.walkDir = Math.random() > 0.5 ? 1 : -1;
                            this.actionDuration = 2 + Math.random() * 2;
                        } else {
                            // Just stay idle longer with head nod
                            this.idleState = 'nodding';
                            this.actionDuration = 1 + Math.random() * 1.5;
                        }
                        this.actionElapsed = 0;
                        this.idleTimer = 0;
                        this.idleNextAction = 3 + Math.random() * 5;
                    }
                } else {
                    this.actionElapsed += dt;
                    
                    if (this.idleState === 'looking') {
                        this.targetHeadTilt = this.lookDir * 0.12;
                    } else if (this.idleState === 'cheering') {
                        this.bounceAmp = this.baseBounce + 8;
                        this.targetHeadTilt = Math.sin(this.actionElapsed * 12) * 0.08;
                        this.targetScaleY = 0.95 + Math.sin(this.actionElapsed * 15) * 0.05;
                    } else if (this.idleState === 'walking') {
                        this.walkOffset += this.walkDir * 15 * dt;
                        // Clamp walk range to stay near original position
                        if (this.walkOffset > 20) {
                            this.walkOffset = 20;
                            this.walkDir = -1;
                        } else if (this.walkOffset < -20) {
                            this.walkOffset = -20;
                            this.walkDir = 1;
                        }
                        this.targetHeadTilt = Math.sin(this.actionElapsed * 6) * 0.05;
                    } else if (this.idleState === 'nodding') {
                        this.targetHeadTilt = Math.sin(this.actionElapsed * 4) * 0.08;
                    }
                    
                    // Return to idle after action completes
                    if (this.actionElapsed > this.actionDuration) {
                        this.idleState = 'idle';
                        this.targetHeadTilt = 0;
                        this.targetScaleY = 1.0;
                    }
                }
                
                // Smooth head tilt interpolation (frame-rate independent)
                const kTilt = 1 - Math.exp(-5 * dt);
                const kScale = 1 - Math.exp(-6.5 * dt);
                this.headTilt += (this.targetHeadTilt - this.headTilt) * kTilt;
                this.scaleY += (this.targetScaleY - this.scaleY) * kScale;
            }

            draw(cameraX, canvasWidth, canvasHeight, trackTop) {
                const screenX = this.x - cameraX + canvasWidth * 0.3;
                if (screenX < -100 || screenX > canvasWidth + 100) return;

                const groundY = this.side === 'top' ? trackTop - 15 : canvasHeight - 40;
                
                // Base bounce
                const time = performance.now() * 0.001;
                const bounceSpeed = this.idleState === 'cheering' ? this.animSpeed * 2.5 : this.animSpeed;
                const bounce = (Math.sin(time * bounceSpeed + this.animOffset) + 1) * 0.5 * this.bounceAmp;
                
                const img = imageCache[this.imageId];
                if (img) {
                    const h = 100 * this.scale;
                    const w = (img.width / img.height) * h;
                    const drawX = screenX - w/2 + this.walkOffset;
                    
                    ctx.save();
                    ctx.translate(drawX + w/2, groundY);
                    
                    // Rotate slightly from the bottom anchor (feet)
                    ctx.rotate(this.headTilt);
                    
                    // Flip if walking left
                    const flipX = (this.idleState === 'walking' && this.walkDir < 0) ? -1 : 1;
                    ctx.scale(flipX, this.scaleY);
                    
                    ctx.drawImage(img, -w/2, -h - bounce, w, h);
                    
                    ctx.restore();
                }
            }
        }

        function initCrowd() {
            crowdMembers = [];
            const dist = metersToPixels(getRaceDistanceM() + 200);
            const crowdVariations = [
                'crowd_villager_1_cheering', 
                'crowd_villager_2_waving', 
                'crowd_villager_3_clapping', 
                'crowd_villager_4_balloons'
            ];

            // Add crowd to Top side - Reduced density
            for (let x = -200; x < dist; x += 220 + Math.random() * 180) {
                const topImg = crowdVariations[Math.floor(Math.random() * crowdVariations.length)];
                crowdMembers.push(new CrowdMember(x, 'top', topImg));
            }
            rebuildCrowdLayers();
        }

        function initObstacles() {
            obstacles = [];
            const dist = metersToPixels(config.raceDistance);
            const diff = config.difficulty;
            
            // Easy mode has no obstacles
            if (diff === 'easy') return;

            let numObstacles;
            let minGap;
            if (diff === 'medium') {
                numObstacles = 15;
                minGap = 400;
            } else { // Hard
                numObstacles = 25;
                minGap = 200;
            }

            // Ensure obstacles only spawn between 15% and 85% of the track length
            // to keep the start and finish lines clear and safe.
            const spawnStart = dist * 0.15;
            const spawnEnd = dist * 0.85;
            const spawnRange = spawnEnd - spawnStart;

            for (let i = 0; i < numObstacles * 2; i++) { // Try more times to find spots
                if (obstacles.length >= numObstacles) break;

                const x = spawnStart + Math.random() * spawnRange; 
                const lane = Math.floor(Math.random() * 5);
                
                let type;
                const r = Math.random();
                if (diff === 'hard') {
                    if (r < 0.35) type = 'mud';
                    else if (r < 0.7) type = 'moss';
                    else type = 'rock';
                } else { // Medium: only mud and moss
                    type = r > 0.5 ? 'mud' : 'moss';
                }

                const tooClose = obstacles.some(ob => ob.laneIndex === lane && Math.abs(ob.x - x) < minGap);
                if (!tooClose) {
                    obstacles.push(new Obstacle(type, x, lane));
                }
            }
        }

        function initRacers() {

            racers = [];

                'opponent_character_1_hopping', 'opponent_character_2_hopping',

            ];

            player = new Racer(true, 2, 'player_character_hopping');
            racers.push(player);

            for (let i = 0; i < numOpp; i++) {
                const lane = i < 2 ? i : i + 1;
                const opp = new Racer(false, lane, oppImages[i]);
                opp.opponentIndex = i;
                
                const diff = config.difficulty;
                if (diff === 'easy') {
                    opp.aiChargeTarget = 1.5 + Math.random() * 1.2; 
                    opp.aiBalanceSkill = 0.05 + Math.random() * 0.1; 
                    opp.aiConsistency = 0.05 + Math.random() * 0.1; 
                    opp.aiMistakeChance = 0.55; 
                    opp.aiPanicThreshold = 0.15; 
                    opp.aiSpeedMultiplier = 0.5 + Math.random() * 0.1; 
                    opp.aiRecoverySpeed = 0.05 + Math.random() * 0.1; 
                } else if (diff === 'medium') {
                    opp.aiChargeTarget = 0.8 + Math.random() * 0.7;
                    opp.aiBalanceSkill = 0.4 + Math.random() * 0.3;
                    opp.aiConsistency = 0.4 + Math.random() * 0.4;
                    opp.aiMistakeChance = 0.18;
                    opp.aiSpeedMultiplier = 0.78 + Math.random() * 0.15; 
                    opp.aiRecoverySpeed = 0.4 + Math.random() * 0.3;
                } else if (diff === 'hard') {
                    opp.aiChargeTarget = 0.4 + Math.random() * 0.3;
                    opp.aiBalanceSkill = 0.85 + Math.random() * 0.15;
                    opp.aiConsistency = 0.9 + Math.random() * 0.1;
                    opp.aiMistakeChance = 0.03;
                    opp.aiPanicThreshold = 0.95; 
                    opp.aiSpeedMultiplier = 1.05 + Math.random() * 0.1; 
                    opp.aiRecoverySpeed = 0.8 + Math.random() * 0.2;
                }

                // Random personality traits
                const trait = Math.random();
                if (trait < 0.2) { // Fast Starter but tires out
                    opp.aiChargeTarget *= 0.7;
                    opp.aiConsistency *= 0.5;
                    opp.aiSpeedMultiplier *= 1.1;
                } else if (trait < 0.4) { // Nervous racer
                    opp.aiPanicThreshold *= 0.6;
                    opp.aiMistakeChance += 0.15;
                }

                racers.push(opp);
            }
        }

        function updateGroundY() {
            if (challengeMode === 'parkour' && (gameState === 'racing' || gameState === 'countdown' || gameState === 'challenge_over')) return;
            const trackTop = canvas.height * TRACK_Y_START;
            const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
            const laneHeight = trackH / 5;
            racers.forEach(r => {
                r.groundY = trackTop + r.laneIndex * laneHeight + laneHeight * 0.5;
                if (r.y === 0 || r.state === 'idle') r.y = r.groundY;
            });
        }

        // Particles
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 100;
                this.vy = -Math.random() * 80 - 20;
                this.life = 0.5 + Math.random() * 0.3;
                this.maxLife = this.life;
                this.size = 20 + Math.random() * 20;
                this.color = '#D2B48C';
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 100 * dt;
                this.life -= dt;
            }
            get alpha() { return Math.max(0, this.life / this.maxLife); }
        }

        function spawnDust(x, y, count = 3, color = '#D2B48C') {
            const allowed = Math.max(1, Math.ceil(count * effectQuality));
            const room = Math.max(0, MAX_PARTICLES - particles.length);
            for (let i = 0; i < Math.min(allowed, room); i++) {
                const p = new Particle(x, y);
                p.color = color;
                if (particles.length < MAX_PARTICLES) particles.push(p);
            }
        }

        // Input handling
        function handleInputStart() {
            if (gameState === 'start') {
                startCountdown();
                return;
            }
            if (gameState !== 'racing' && gameState !== 'unlimited_racing') return;
            if (!audioCtx || audioCtx.state === 'suspended') getAudioContext().resume();

            if (player.state === 'idle' || player.state === 'balancing') {
                player.state = 'charging';
                player.chargeTime = 0;
                inputActive = true;
                inputStartTime = performance.now();
                playSound('sfx_hop_charge', { trackAs: 'charge', volume: 0.5 });
            } else if (player.state === 'tumbling' || player.state === 'recovering') {
                player.recoveryTaps++;
                playUIClick(); // Satisfying tap feedback
                if (player.recoveryTaps >= GET_RECOVERY_TAPS()) {
                    player.state = 'idle';
                    player.recoveryTaps = 0;
                    player.triggerExpression('determined', 1.0, 0.9);
                    playSound('sfx_recovery', { volume: 0.6 });
                }
            }
        }

        function handleInputEnd() {
            if (!inputActive) return;
            inputActive = false;
            stopSound('charge');

            if (player.state === 'charging') {
                executeHop(player);
            }
        }

        function executeHop(racer) {
            const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
            let hopPower = HOP_BASE_POWER + (HOP_MAX_POWER - HOP_BASE_POWER) * chargeRatio;
            
            // Mud penalty - heavier, stickier movement
            if (racer.mudTimer > 0) {
                const mudSlowdown = 0.5 + (1 - (racer.mudIntensity || 0.5)) * 0.15; // 50-65% power
                hopPower *= mudSlowdown;
            }

            // Player Buffs
            if (racer.isPlayer) {
                // Perfect timing bonus (80% - 95% charge is the "Sweet Spot")
                if (chargeRatio > 0.8 && chargeRatio < 0.96) {
                    hopPower *= 1.3; // 30% speed boost for perfect timing
                    // Juice: clear feedback for nailing the sweet spot
                    floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 20, 'PERFECT!', '#FFD54F'));
                    spawnDust(racer.x, racer.groundY, 5, '#FFE082');
                    addShake(3);
                    // Track perfect hop for daily challenge
                    updateChallengeProgress('perfect_hops', 1);
                    updateEventMilestone('perfect_hop', 1);
                    updateHalloweenMilestone('perfect_hop', 1);
                } else if (chargeRatio >= 0.96) {
                    // Slightly less power for over-charging/auto-release
                    hopPower *= 1.1;
                } else {
                    // Regular jumps are still strong
                    hopPower *= 1.05;
                }
            } else {
                // AI Speed Reduction (already slower, but keeping the multiplier logic)
                hopPower *= (racer.aiSpeedMultiplier || 0.8);
            }

            racer.speed = hopPower;
            // In Jump a Car mode, jump slightly higher to clear above the car (just a few inches)
            const vertMultiplier = (challengeMode === 'jumpacar') ? 1.15 : 1.0;
            racer.vy = HOP_VERTICAL * (0.6 + chargeRatio * 0.4) * vertMultiplier;
            racer.state = 'airborne';
            racer.chargeTime = 0;
            if (racer.isPlayer) {
                playSound('sfx_hop_release', { volume: 0.8 });
                playHopWhoosh(chargeRatio);
            }
            spawnDust(racer.x, racer.groundY, 6); 
        }

        // Touch events
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            // Check if tap hit a power-up slot (only during a normal race — not challenge modes)
            if (gameState === 'racing' && !challengeMode && powerUpSlotPositions.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const tapX = (e.clientX - rect.left) * scaleX;
                const tapY = (e.clientY - rect.top) * scaleY;

                for (let i = 0; i < powerUpSlotPositions.length; i++) {
                    const slot = powerUpSlotPositions[i];
                    if (tapX >= slot.x && tapX <= slot.x + slot.w &&
                        tapY >= slot.y && tapY <= slot.y + slot.h) {
                        // Tapped a power-up slot!
                        if (activatePowerUp(i)) {
                            return; // Don't process as hop input
                        } else {
                            // No stock or on cooldown - show feedback
                            const puId = POWER_UP_SLOT_IDS[i];
                            const count = playerData.powerUps[puId] || 0;
                            if (count <= 0) {
                                showEquipToast(`${POWER_UP_DEFS[puId].icon} No stock! Buy in Shop.`);
                            }
                            return;
                        }
                    }
                }
            }
            
            handleInputStart();
        });
        window.addEventListener('pointerup', (e) => {
            handleInputEnd();
        });
        window.addEventListener('pointercancel', (e) => {
            handleInputEnd();
        });

        // Keyboard
        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (keys[e.code]) return;
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInputStart();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInputEnd();
            }
        });

        // Game flow
        function startCountdown() {
            uiOverlay.innerHTML = '';
            gameState = 'countdown';
            countdownValue = 3;
            countdownTimer = 0;
            
            // Save last selected difficulty
            playerData.lastDifficulty = config.difficulty;
            
            // Reset daily challenge tracking for this race
            playerTumbleCount = 0;
            
            if (mp.active && mp.armed) { mp.armed = false; mpInitRacers(); }
            else { mp.active = false; initRacers(); }
            updateGroundY();
            transitionAmbientTo('racing');
            playSound('music_race_theme', { loop: true, trackAs: 'music', volume: 0.7 });
        }

        function startRace() {
            if (unlimitedMode) {
                gameState = 'unlimited_racing';
                raceTime = 0;
                ulHearts = ulMaxHearts;
                ulScore = 0;
                ulDistance = 0;

                ulInvincible = false;

                ulPickups = [];

                ulObstacleInterval = 2.0;
                ulPickupInterval = 3.5;
                ulDifficultyTimer = 0;
                ulDamageFlash = 0;
                ulGameOverShown = false;
                strayChickens = [];
                chickenSpawnTimer = 0;
                clearMudTrails();
                
                bananaPeelProjectiles = [];
                bananaPeelThrowTimer = 0;
                playSound('sfx_crowd_cheer', { loop: true, trackAs: 'crowd', volume: 0.25 });
                return;
            }
            if (challengeMode) {
                // Challenge modes just set racing state - their own update handles logic
                gameState = 'racing';
                raceTime = 0;
                playSound('sfx_crowd_cheer', { loop: true, trackAs: 'crowd', volume: 0.25 });
                return;
            }
            gameState = 'racing';
            raceTime = 0;
            finishOrder = [];
            lastPlayerRank = racers.length;
            strayChickens = [];
            chickenSpawnTimer = 0;
            // Clear all mud trails for a fresh clean race track
            clearMudTrails();
            
            bananaPeelProjectiles = [];
            bananaPeelThrowTimer = 0;
