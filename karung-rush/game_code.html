                        if (isEquipped) {
                            badgeContainer.innerHTML = `<div class="shop-owned-badge" style="background:rgba(255,215,0,0.2);color:#FFD700;border-color:rgba(255,215,0,0.3);margin-top:0;">✓ Equipped</div>`;
                            btn.className = 'shop-btn-action btn-equipped';
                            btn.setAttribute('data-action', 'unequip-skin');
                            btn.innerText = '✓ Equipped — Tap to Remove';
                            btn.disabled = false;
                        } else if (isOwned) {
                            badgeContainer.innerHTML = `<div class="shop-owned-badge" style="margin-top:0;">✓ Owned</div>`;
                            btn.className = 'shop-btn-action btn-equip';
                            btn.setAttribute('data-action', 'equip-skin');
                            btn.innerText = 'Equip Now';
                            btn.disabled = false;
                        } else if (canAfford) {
                            badgeContainer.innerHTML = '';
                            btn.className = 'shop-btn-action btn-buy';
                            btn.setAttribute('data-action', 'buy-skin');
                            btn.innerText = `Buy — Rp ${price.toLocaleString()}`;
                            btn.disabled = false;
                        } else {
                            badgeContainer.innerHTML = '';
                            btn.className = 'shop-btn-action btn-locked';
                            btn.setAttribute('data-action', 'locked');
                            btn.innerText = `Rp ${price.toLocaleString()} 🔒`;
                            btn.disabled = true;
                        }
                    } else {
                        // Accessory card update
                        const isOwned = currentOwned.includes(id);
                        const isEquipped = currentEquipped === id;

                        card.className = `shop-item-card${isEquipped ? ' equipped' : (isOwned ? ' owned' : '')}`;

                        if (isEquipped) {
                            badgeContainer.innerHTML = `<div class="shop-owned-badge" style="background:rgba(255,215,0,0.2);color:#FFD700;border-color:rgba(255,215,0,0.3);margin-top:0;">✓ Equipped</div>`;
                        } else if (isOwned) {
                            badgeContainer.innerHTML = `<div class="shop-owned-badge" style="margin-top:0;">✓ Owned</div>`;
                        } else {
                            badgeContainer.innerHTML = '';
                        }

                        if (isEquipped) {
                            btn.className = 'shop-btn-action btn-equipped';
                            btn.setAttribute('data-action', 'unequip');
                            btn.innerText = '✓ Equipped — Tap to Remove';
                            btn.disabled = false;
                        } else if (isOwned) {
                            btn.className = 'shop-btn-action btn-equip';
                            btn.setAttribute('data-action', 'equip');
                            btn.innerText = 'Equip Now';
                            btn.disabled = false;
                        } else if (canAfford) {
                            btn.className = 'shop-btn-action btn-buy';
                            btn.setAttribute('data-action', 'buy');
                            btn.innerText = `Buy — Rp ${price.toLocaleString()}`;
                            btn.disabled = false;
                        } else {
                            btn.className = 'shop-btn-action btn-locked';
                            btn.setAttribute('data-action', 'locked');
                            btn.innerText = `Rp ${price.toLocaleString()} 🔒`;
                            btn.disabled = true;
                        }
                    }
                });
            }
            
            // Handle shop actions
            uiOverlay.querySelectorAll('.shop-btn-action:not([data-action="buy-halloween"]):not([data-action="equip-halloween"]):not([data-action="unequip-halloween"])').forEach(btn => {
                btn.addEventListener('pointerdown', async (e) => {
                    e.stopPropagation();
                    const currentAction = btn.getAttribute('data-action');
                    const id = btn.getAttribute('data-id');
                    const item = accessories.find(a => a.id === id) || skins.find(s => s.id === id) || HALLOWEEN_SHOP_ITEMS.find(s => s.id === id);

                    if (currentAction === 'buy-halloween' && item) {
                        playUIClick();
                        const kind = btn.getAttribute('data-halloween-kind');
                        const ownedList = kind === 'player' ? (playerData.ownedSkins || []) : (playerData.ownedOpponentSkins || []);
                        if (ownedList.includes(id)) { showEquipToast('You already own this Halloween item!'); return; }
                        if ((playerData.totalMoney || 0) < item.price) { showEquipToast('Not enough money! 💸'); return; }
                        showPurchaseConfirmation(item, async () => {
                            playerData.totalMoney -= item.price;
                            if (kind === 'player') {
                                if (!playerData.ownedSkins) playerData.ownedSkins = [];
                                playerData.ownedSkins.push(id);
                                playerData.equippedSkin = id;
                            } else {
                                if (!playerData.ownedOpponentSkins) playerData.ownedOpponentSkins = [];
                                playerData.ownedOpponentSkins.push(id);
                                playerData.equippedOpponentSkin = id;
                            }
                            await savePlayerData();
                            showEquipToast('🎃 ' + item.name + ' purchased & equipped!');
                            const halloweenContent = document.getElementById('shop-tab-content-halloween');
                            if (halloweenContent) halloweenContent.innerHTML = generateHalloweenShopHTML();
                            attachHalloweenShopHandlers();
                            updateShopUI();
                        });
                        return;
                    }
                    if (currentAction === 'equip-halloween') {
                        playUIClick();
                        const kind = btn.getAttribute('data-halloween-kind');
                        if (kind === 'player') playerData.equippedSkin = id;
                        else playerData.equippedOpponentSkin = id;
                        await savePlayerData();
                        showEquipToast('🎃 ' + (item ? item.name : 'Halloween item') + ' equipped!');
                        const halloweenContent = document.getElementById('shop-tab-content-halloween');
                        if (halloweenContent) halloweenContent.innerHTML = generateHalloweenShopHTML();
                        attachHalloweenShopHandlers();
                        updateShopUI();
                        return;
                    }
                    if (currentAction === 'unequip-halloween') {
                        playUIClick();
                        const kind = btn.getAttribute('data-halloween-kind');
                        if (kind === 'player') playerData.equippedSkin = null;
                        else playerData.equippedOpponentSkin = null;
                        await savePlayerData();
                        showEquipToast('Halloween item removed');
                        const halloweenContent = document.getElementById('shop-tab-content-halloween');
                        if (halloweenContent) halloweenContent.innerHTML = generateHalloweenShopHTML();
                        attachHalloweenShopHandlers();
                        updateShopUI();
                        return;
                    }
                    
                    // Power-Up purchase
                    if (currentAction === 'buy-powerup') {
                        playUIClick();
                        const puId = btn.getAttribute('data-pu-id');
                        const puPrice = parseInt(btn.getAttribute('data-pu-price'), 10);
                        const puName = btn.getAttribute('data-pu-name');
                        
                        if ((playerData.totalMoney || 0) < puPrice) {
                            showEquipToast('Not enough money! 💸');
                            return;
                        }
                        
                        showPurchaseConfirmation({ name: puName, price: puPrice, desc: POWER_UP_DEFS[puId].desc }, async () => {
                            playerData.totalMoney -= puPrice;
                            if (!playerData.powerUps) playerData.powerUps = { freeze: 0, banana_storm: 0, moss_lane: 0 };
                            playerData.powerUps[puId] = (playerData.powerUps[puId] || 0) + 1;
                            await savePlayerData();
                            showEquipToast(`${POWER_UP_DEFS[puId].icon} ${puName} purchased! (x${playerData.powerUps[puId]})`);
                            // Refresh power-ups tab content
                            const puContent = document.getElementById('shop-tab-content-powerups');
                            if (puContent) puContent.innerHTML = generatePowerUpShopHTML();
                            // Re-attach power-up buy handlers
                            attachPowerUpBuyHandlers();
                            updateShopUI();
                        });
                        return;
                    }
                    
                    if (currentAction === 'buy' && item) {
                        playUIClick();
                        if ((playerData.ownedAccessories || []).includes(id)) {
                            showEquipToast('You already own this item!');
                            return;
                        }
                        if ((playerData.totalMoney || 0) < item.price) {
                            showEquipToast('Not enough money! 💸');
                            return;
                        }
                        showPurchaseConfirmation(item, async () => {
                            playerData.totalMoney -= item.price;
                            if (!playerData.ownedAccessories) playerData.ownedAccessories = [];
                            playerData.ownedAccessories.push(id);
                            playerData.equippedAccessory = id;
                            await savePlayerData();
                            showEquipToast(`🎉 ${item.name} purchased & equipped!`);
                            updateShopUI();
                        });
                    } else if (currentAction === 'buy-skin' && item) {
                        playUIClick();
                        if ((playerData.ownedSkins || []).includes(id)) {
                            showEquipToast('You already own this skin!');
                            return;
                        }
                        if ((playerData.totalMoney || 0) < item.price) {
                            showEquipToast('Not enough money! 💸');
                            return;
                        }
                        showPurchaseConfirmation(item, async () => {
                            playerData.totalMoney -= item.price;
                            if (!playerData.ownedSkins) playerData.ownedSkins = [];
                            playerData.ownedSkins.push(id);
                            playerData.equippedSkin = id;
                            await savePlayerData();
                            showEquipToast(`🎉 ${item.name} purchased & equipped!`);
                            updateShopUI();
                        });
                    } else if (currentAction === 'equip-skin') {
                        playUIClick();
                        playerData.equippedSkin = id;
                        await savePlayerData();
                        showEquipToast(`✨ ${item.name} equipped!`);
                        updateShopUI();
                    } else if (currentAction === 'unequip-skin') {
                        playUIClick();
                        playerData.equippedSkin = null;
                        await savePlayerData();
                        showEquipToast('Skin removed — Default look restored');
                        updateShopUI();
                    } else if (currentAction === 'equip') {
                        playUIClick();
                        const previousAccessory = playerData.equippedAccessory;
                        playerData.equippedAccessory = id;
                        await savePlayerData();
                        if (previousAccessory && previousAccessory !== id) {
                            const prevItem = accessories.find(a => a.id === previousAccessory);
                            showEquipToast(`✨ ${item.name} equipped! (${prevItem ? prevItem.name : 'Previous'} removed)`);
                        } else {
                            showEquipToast(`✨ ${item.name} equipped!`);
                        }
                        updateShopUI();
                    } else if (currentAction === 'unequip') {
                        playUIClick();
                        playerData.equippedAccessory = null;
                        await savePlayerData();
                        showEquipToast('Accessory removed');
                        updateShopUI();
                    }
                });
            });
            
            function attachPowerUpBuyHandlers() {
                document.querySelectorAll('[data-action="buy-powerup"]').forEach(btn => {
                    btn.addEventListener('pointerdown', async (e) => {
                        e.stopPropagation();
                        playUIClick();
                        const puId = btn.getAttribute('data-pu-id');
                        const puPrice = parseInt(btn.getAttribute('data-pu-price'), 10);
                        const puName = btn.getAttribute('data-pu-name');
                        
                        if ((playerData.totalMoney || 0) < puPrice) {
                            showEquipToast('Not enough money! 💸');
                            return;
                        }
                        
                        showPurchaseConfirmation({ name: puName, price: puPrice, desc: POWER_UP_DEFS[puId].desc }, async () => {
                            playerData.totalMoney -= puPrice;
                            if (!playerData.powerUps) playerData.powerUps = { freeze: 0, banana_storm: 0, moss_lane: 0 };
                            playerData.powerUps[puId] = (playerData.powerUps[puId] || 0) + 1;
                            await savePlayerData();
                            showEquipToast(`${POWER_UP_DEFS[puId].icon} ${puName} purchased! (x${playerData.powerUps[puId]})`);
                            const puContent = document.getElementById('shop-tab-content-powerups');
                            if (puContent) puContent.innerHTML = generatePowerUpShopHTML();
                            attachPowerUpBuyHandlers();
                            updateShopUI();
                        });
                    });
                });
            }
            function attachHalloweenShopHandlers() {
                uiOverlay.querySelectorAll('#shop-tab-content-halloween [data-action="buy-halloween"], #shop-tab-content-halloween [data-action="equip-halloween"], #shop-tab-content-halloween [data-action="unequip-halloween"]').forEach(btn => {
                    btn.addEventListener('pointerdown', async (e) => {
                        e.stopPropagation();
                        const currentAction = btn.getAttribute('data-action');
                        const id = btn.getAttribute('data-id');
                        const item = HALLOWEEN_SHOP_ITEMS.find(s => s.id === id);
                        if (!item) return;
                        const kind = btn.getAttribute('data-halloween-kind');
                        const ownedList = kind === 'player' ? (playerData.ownedSkins || []) : (playerData.ownedOpponentSkins || []);
                        playUIClick();
                        if (currentAction === 'buy-halloween') {
                            if ((playerData.totalMoney || 0) < item.price) { showEquipToast('Not enough money! 💸'); return; }
                            showPurchaseConfirmation(item, async () => {
                                playerData.totalMoney -= item.price;
                                if (kind === 'player') {
                                    if (!playerData.ownedSkins) playerData.ownedSkins = [];
                                    playerData.ownedSkins.push(id);
                                    playerData.equippedSkin = id;
                                } else {
                                    if (!playerData.ownedOpponentSkins) playerData.ownedOpponentSkins = [];
                                    playerData.ownedOpponentSkins.push(id);
                                    playerData.equippedOpponentSkin = id;
                                }
                                await savePlayerData();
                                showEquipToast('🎃 ' + item.name + ' purchased & equipped!');
                                const content = document.getElementById('shop-tab-content-halloween');
                                if (content) content.innerHTML = generateHalloweenShopHTML();
                                attachHalloweenShopHandlers();
                                updateShopUI();
                            });
                        } else if (currentAction === 'equip-halloween') {
                            if (!ownedList.includes(id)) return;
                            if (kind === 'player') playerData.equippedSkin = id;
                            else playerData.equippedOpponentSkin = id;
                            await savePlayerData();
                            showEquipToast('🎃 ' + item.name + ' equipped!');
                            const content = document.getElementById('shop-tab-content-halloween');
                            if (content) content.innerHTML = generateHalloweenShopHTML();
                            attachHalloweenShopHandlers();
                            updateShopUI();
                        } else if (currentAction === 'unequip-halloween') {
                            if (kind === 'player') playerData.equippedSkin = null;
                            else playerData.equippedOpponentSkin = null;
                            await savePlayerData();
                            showEquipToast('Halloween item removed');
                            const content = document.getElementById('shop-tab-content-halloween');
                            if (content) content.innerHTML = generateHalloweenShopHTML();
                            attachHalloweenShopHandlers();
                            updateShopUI();
                        }
                    });
                });
            }
            attachPowerUpBuyHandlers();
            attachHalloweenShopHandlers();
            
            document.getElementById('shop-back-btn').addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                playUIClick();
                showStartScreen();
            });
        }

        function ulSpawnObstacle() {
            const diffWeight = Math.min(1.0, ulDifficultyTimer / 90); // Gradual over 90 seconds
            
            // Type selection based on difficulty setting
            let type;
            const r = Math.random();
            if (config.difficulty === 'easy') {
                // Easy: mud, moss, and water puddles
                if (r < 0.35) type = 'mud';
                else if (r < 0.7) type = 'water_puddle';
                else type = 'moss';
            } else if (config.difficulty === 'hard') {
                // Hard: more rocks over time, water puddles added
                if (r < 0.25 + diffWeight * 0.15) type = 'rock';
                else if (r < 0.45) type = 'water_puddle';
                else if (r < 0.7) type = 'moss';
                else type = 'mud';
            } else {
                // Medium: balanced with water puddles
                if (r < 0.15 + diffWeight * 0.1) type = 'rock';
                else if (r < 0.4) type = 'water_puddle';
                else if (r < 0.7) type = 'moss';
                else type = 'mud';
            }
            
            // SINGLE LANE: All obstacles spawn in the player's lane
            const lane = player.laneIndex;
            
            // Spawn well ahead of the player so they can see and react
            const minSpawnDist = 900;
            const maxSpawnDist = 1500;
            const spawnX = player.x + minSpawnDist + Math.random() * (maxSpawnDist - minSpawnDist);
            
            // Single-lane requires larger minimum gap so player can hop between obstacles
            // Player needs space to: land (~0.3s) + charge (~0.5s) + hop over next
            const minGap = config.difficulty === 'easy' ? 550 : (config.difficulty === 'hard' ? 400 : 470);
            const tooClose = ulObstacles.some(ob => 
                Math.abs(ob.x - spawnX) < minGap
            );
            if (tooClose) return; // Skip this spawn, will try again next interval
            
            // Don't spawn on top of pickups
            const pickupConflict = ulPickups.some(p => 
                !p.collected && Math.abs(p.x - spawnX) < 150
            );
            if (pickupConflict) return;
            
            // Fairness: limit obstacle density ahead of player
            // Don't allow more than 3 obstacles within a 1200px stretch
            const nearbyObstacles = ulObstacles.filter(ob => 
                ob.x > player.x && Math.abs(ob.x - spawnX) < 1200
            );
            if (nearbyObstacles.length >= 3) return;
            
            const ob = new Obstacle(type, spawnX, lane);
            ulObstacles.push(ob);
            ulLastObstacleX = spawnX;
        }

        function ulSpawnPickup() {
            // Spawn ahead of player (visible before reaching)
            const spawnX = player.x + 700 + Math.random() * 500;
            const lane = player.laneIndex; // Single lane mode
            
            // Determine type - heart spawn rate increases at low health
            const r = Math.random();
            let type, value;
            const heartChance = ulHearts === 1 ? 0.15 : (ulHearts === 2 ? 0.1 : 0.06);
            if (r < heartChance && ulHearts < ulMaxHearts) {
                type = 'heart'; value = 1;
            } else if (r < 0.35) {
                type = 'coin_large'; value = 50;
            } else if (r < 0.65) {
                type = 'coin_medium'; value = 25;
            } else {
                type = 'coin_small'; value = 10;
            }
            
            // Don't spawn heart if already full
            if (type === 'heart' && ulHearts >= ulMaxHearts) {
                type = 'coin_medium'; value = 25;
            }
            
            // Single lane: check spacing - don't spawn on obstacles or other pickups
            const obstacleConflict = ulObstacles.some(ob => 
                Math.abs(ob.x - spawnX) < 180
            );
            const pickupConflict = ulPickups.some(p => 
                !p.collected && Math.abs(p.x - spawnX) < 140
            );
            if (obstacleConflict || pickupConflict) return; // Skip this spawn
            
            ulPickups.push(new ULPickup(type, spawnX, lane, value));
        }

        function ulTakeDamage() {
            if (ulInvincible || ulHearts <= 0) return;
            ulHearts--;
            ulInvincible = true;
            ulInvTimer = 0;
            ulDamageFlash = 1.0;
            
            playSound('sfx_rock_impact', { volume: 0.6 });
            player.triggerExpression('panicked', 1.5, 1.0);
            
            // Floating damage text
            floatingTexts.push(new FloatingText(player.x, player.y - player.height - 40, '-1 ❤️', '#FF1744'));
            
            impactFeedback(9, 0.06, 0.16);
            
            if (ulHearts <= 0) {
                // Game over
                setTimeout(() => ulTriggerGameOver(), 800);
            }
        }

        // ===== PARKOUR MODE =====
        function drawJumpACarBackground() {
            const w = canvas.width;
            const h = canvas.height;
            const time = performance.now() * 0.001;
            const trackTop = h * TRACK_Y_START;
            const trackH = h - trackTop - BOTTOM_MARGIN;

            // Sky
            const skyGrad = ctx.createLinearGradient(0, 0, 0, trackTop);
            skyGrad.addColorStop(0, '#4FC3F7');
            skyGrad.addColorStop(0.6, '#81D4FA');
            skyGrad.addColorStop(1, '#E1F5FE');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, trackTop);

            // Distant clouds
            const cloudImg = imageCache['bg_cloud'];
            if (cloudImg) {
                bgClouds.forEach(cloud => {
                    let cloudX = cloud.x - cameraX * cloud.speed + time * 6;
                    cloudX = ((cloudX % (w + 300)) + w + 300) % (w + 300) - 100;
                    const cw = 160 * cloud.scale;
                    const ch = (cloudImg.height / cloudImg.width) * cw;
                    ctx.globalAlpha = cloud.opacity;
                    ctx.drawImage(cloudImg, cloudX - cw/2, cloud.y, cw, ch);
                    ctx.globalAlpha = 1.0;
                });
            }

            // Distant hills
            const hillOffset = -(cameraX * 0.05) % w;
            ctx.fillStyle = '#66BB6A';
            ctx.beginPath();
            ctx.moveTo(hillOffset - w, trackTop);
            ctx.quadraticCurveTo(hillOffset - w * 0.5, trackTop - 40, hillOffset, trackTop - 10);
            ctx.quadraticCurveTo(hillOffset + w * 0.3, trackTop - 50, hillOffset + w * 0.7, trackTop - 15);
            ctx.quadraticCurveTo(hillOffset + w, trackTop - 45, hillOffset + w * 1.5, trackTop);
            ctx.lineTo(hillOffset + w * 2, trackTop);
            ctx.fill();

            // Green grass sidelines (top)
            ctx.fillStyle = '#388E3C';
            ctx.fillRect(0, trackTop - 20, w, 20);
            const grassGrad = ctx.createLinearGradient(0, trackTop - 20, 0, trackTop);
            grassGrad.addColorStop(0, '#4CAF50');
            grassGrad.addColorStop(1, '#2E7D32');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, trackTop - 20, w, 20);

            // === ROAD SURFACE (asphalt) ===
            const roadGrad = ctx.createLinearGradient(0, trackTop, 0, trackTop + trackH);
            roadGrad.addColorStop(0, '#37474F');
            roadGrad.addColorStop(0.15, '#455A64');
            roadGrad.addColorStop(0.5, '#546E7A');
            roadGrad.addColorStop(0.85, '#455A64');
            roadGrad.addColorStop(1, '#37474F');
            ctx.fillStyle = roadGrad;
            ctx.fillRect(0, trackTop, w, trackH);

            // Asphalt texture noise
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            for (let i = 0; i < 60; i++) {
                const rx = (Math.sin(i * 73.7 + cameraX * 0.001) * 0.5 + 0.5) * w;
                const ry = trackTop + (Math.cos(i * 37.3) * 0.5 + 0.5) * trackH;
                ctx.fillRect(rx, ry, 2 + Math.random(), 2 + Math.random());
            }

            // Road edge lines (white solid lines on top and bottom)
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, trackTop, w, 5);
            ctx.fillRect(0, trackTop + trackH - 5, w, 5);

            // Road shoulder stripes (red-white curb)
            const stripeW = 40;
            const scrollOffset = (cameraX * 1.0) % (stripeW * 2);
            // Top curb
            for (let sx = -scrollOffset - stripeW * 2; sx < w + stripeW * 2; sx += stripeW * 2) {
                ctx.fillStyle = '#DC143C';
                ctx.fillRect(sx, trackTop + 5, stripeW, 8);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(sx + stripeW, trackTop + 5, stripeW, 8);
            }
            // Bottom curb
            for (let sx = -scrollOffset - stripeW * 2; sx < w + stripeW * 2; sx += stripeW * 2) {
                ctx.fillStyle = '#DC143C';
                ctx.fillRect(sx, trackTop + trackH - 13, stripeW, 8);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(sx + stripeW, trackTop + trackH - 13, stripeW, 8);
            }

            // Center dashed line (yellow road marking)
            const dashW = 60;
            const dashGap = 40;
            const dashScroll = (cameraX * 1.0) % (dashW + dashGap);
            const centerY = trackTop + trackH / 2 - 3;
            ctx.fillStyle = '#FFC107';
            for (let dx = -dashScroll - dashW; dx < w + dashW; dx += dashW + dashGap) {
                ctx.fillRect(dx, centerY, dashW, 6);
            }

            // Additional lane lines (subtle white dashes)
            const laneH = trackH / 5;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let lane = 1; lane < 5; lane++) {
                if (lane === 2 || lane === 3) continue; // Skip center area (yellow line is there)
                const ly = trackTop + lane * laneH - 2;
                for (let dx = -dashScroll - dashW; dx < w + dashW; dx += dashW + dashGap) {
                    ctx.fillRect(dx, ly, 40, 4);
                }
            }

            // Bottom grass
            const botY = trackTop + trackH;
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, botY, w, h - botY);
            const botGrassGrad = ctx.createLinearGradient(0, botY, 0, botY + 30);
            botGrassGrad.addColorStop(0, '#388E3C');
            botGrassGrad.addColorStop(1, '#1B5E20');
            ctx.fillStyle = botGrassGrad;
            ctx.fillRect(0, botY, w, 30);

            // Trees on sides
            const treeImg = imageCache['bg_palm_tree'];
            if (treeImg) {
                for (let i = 0; i < 8; i++) {
                    const tx = (i * 350 + 100) - cameraX * 0.15;
                    const wrappedX = ((tx % (w + 400)) + w + 400) % (w + 400) - 200;
                    const th = 140;
                    const tw = (treeImg.width / treeImg.height) * th;
                    ctx.drawImage(treeImg, wrappedX - tw/2, trackTop - th + 5, tw, th);
                }
            }

            // Road signs / cones (decorative)
            const signSpacing = 500;
            const signScroll = cameraX * 1.0;
            for (let sx = Math.floor((signScroll - w * 0.18) / signSpacing) * signSpacing; sx < signScroll + w; sx += signSpacing) {
                const screenSX = sx - cameraX + w * 0.18;
                if (screenSX < -50 || screenSX > w + 50) continue;
                // Traffic cone
                ctx.fillStyle = '#FF5722';
                ctx.beginPath();
                ctx.moveTo(screenSX - 8, botY - 2);
                ctx.lineTo(screenSX + 8, botY - 2);
                ctx.lineTo(screenSX + 3, botY - 28);
                ctx.lineTo(screenSX - 3, botY - 28);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(screenSX - 5, botY - 18, 10, 5);
                ctx.fillRect(screenSX - 4, botY - 10, 8, 4);
            }

            // Draw crowd on sides
            forEachVisible(crowdTop, cameraX, w, (c) => c.draw(cameraX, w, h, trackTop));
            forEachVisible(crowdBottom, cameraX, w, (c) => c.draw(cameraX, w, h, trackTop));

            // Direction arrow on road surface (pointing right, showing car direction warning)
            const arrowScroll = (cameraX * 1.0) % 600;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            for (let ax = -arrowScroll; ax < w + 100; ax += 600) {
                ctx.save();
                ctx.translate(ax + 300, trackTop + trackH * 0.5);
                ctx.beginPath();
                ctx.moveTo(30, 0);
                ctx.lineTo(-10, -18);
                ctx.lineTo(-10, -8);
                ctx.lineTo(-30, -8);
                ctx.lineTo(-30, 8);
                ctx.lineTo(-10, 8);
                ctx.lineTo(-10, 18);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function drawParkourBackground() {
            const w = canvas.width;
            const h = canvas.height;
            const time = performance.now() * 0.001;

            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.5);
            skyGrad.addColorStop(0, '#4FC3F7');
            skyGrad.addColorStop(0.6, '#81D4FA');
            skyGrad.addColorStop(1, '#E1F5FE');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h * 0.5);

            // Distant clouds
            const cloudImg = imageCache['bg_cloud'];
            if (cloudImg) {
                bgClouds.forEach(cloud => {
                    let cloudX = cloud.x - cameraX * cloud.speed + time * 6;
                    cloudX = ((cloudX % (w + 300)) + w + 300) % (w + 300) - 100;
                    const cw = 160 * cloud.scale;
                    const ch = (cloudImg.height / cloudImg.width) * cw;
                    ctx.globalAlpha = cloud.opacity;
                    ctx.drawImage(cloudImg, cloudX - cw/2, cloud.y, cw, ch);
                    ctx.globalAlpha = 1.0;
                });
            }

            // Distant hills
            const hillOffset = -(cameraX * 0.08) % w;
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.moveTo(hillOffset - w, h * 0.45);
            ctx.quadraticCurveTo(hillOffset - w/2, h * 0.38, hillOffset, h * 0.43);
            ctx.quadraticCurveTo(hillOffset + w/2, h * 0.35, hillOffset + w, h * 0.42);
            ctx.quadraticCurveTo(hillOffset + w * 1.5, h * 0.36, hillOffset + w * 2, h * 0.45);
            ctx.lineTo(hillOffset + w * 2, h);
            ctx.lineTo(hillOffset - w, h);
            ctx.fill();

            // Dark abyss below platforms
            const abyssTop = h * 0.5;
            const abyssGrad = ctx.createLinearGradient(0, abyssTop, 0, h);
            abyssGrad.addColorStop(0, '#2E7D32');
            abyssGrad.addColorStop(0.2, '#1B5E20');
            abyssGrad.addColorStop(0.5, '#0D3B0E');
            abyssGrad.addColorStop(0.8, '#061F07');
            abyssGrad.addColorStop(1, '#020A03');
            ctx.fillStyle = abyssGrad;
            ctx.fillRect(0, abyssTop, w, h - abyssTop);

            // Fog at the bottom
            const fogGrad = ctx.createLinearGradient(0, h - 200, 0, h);
            fogGrad.addColorStop(0, 'rgba(0,0,0,0)');
            fogGrad.addColorStop(1, 'rgba(0,20,0,0.5)');
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, h - 200, w, 200);

            // Distant tree silhouettes
            const treeImg = imageCache['bg_palm_tree'];
            if (treeImg) {
                for (let i = 0; i < 6; i++) {
                    const tx = (i * 400 + 100) - cameraX * 0.06;
                    const wrappedX = ((tx % (w + 400)) + w + 400) % (w + 400) - 200;
                    ctx.globalAlpha = 0.15;
                    const th = 140;
                    const tw = (treeImg.width / treeImg.height) * th;
                    ctx.drawImage(treeImg, wrappedX - tw/2, h * 0.4 - th + 20, tw, th);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        function drawParkourPlatforms() {
            const w = canvas.width;
            const time = performance.now() * 0.001;

            pkPlatforms.forEach((plat, idx) => {
                const screenX = plat.x - cameraX + w * 0.3;
                const screenY = plat.y;

                if (screenX + plat.width/2 < -50 || screenX - plat.width/2 > w + 50) return;

                const halfW = plat.width / 2;
                const ph = plat.height;

                ctx.save();

                // Platform shadow
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(screenX, screenY + ph + 10, halfW * 0.7, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Platform colors based on type
                let topColor, bodyColor, darkColor, edgeColor;
                if (plat.type === 'grass') {
                    topColor = '#4CAF50'; bodyColor = '#8D6E63'; darkColor = '#5D4037'; edgeColor = '#388E3C';
                } else if (plat.type === 'dirt') {
                    topColor = '#A1887F'; bodyColor = '#795548'; darkColor = '#4E342E'; edgeColor = '#6D4C41';
                } else if (plat.type === 'stone') {
                    topColor = '#90A4AE'; bodyColor = '#607D8B'; darkColor = '#455A64'; edgeColor = '#78909C';
                } else {
                    topColor = '#FFE082'; bodyColor = '#FFCA28'; darkColor = '#F9A825'; edgeColor = '#FDD835';
                }

                // Main body
                const bodyGrad = ctx.createLinearGradient(0, screenY, 0, screenY + ph);
                bodyGrad.addColorStop(0, bodyColor);
                bodyGrad.addColorStop(0.7, darkColor);
                bodyGrad.addColorStop(1, darkColor);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(screenX - halfW, screenY, plat.width, ph, 4);
                ctx.fill();

                // Top surface layer
                const topH = 8;
                ctx.fillStyle = topColor;
                ctx.beginPath();
                ctx.roundRect(screenX - halfW, screenY - 2, plat.width, topH, [4, 4, 0, 0]);
                ctx.fill();

                // Top edge highlight
                ctx.fillStyle = edgeColor;
                ctx.beginPath();
                ctx.roundRect(screenX - halfW + 2, screenY - 2, plat.width - 4, 3, 2);
                ctx.fill();

                // Dirt texture spots
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                const seed = idx * 137;
                for (let d = 0; d < 3; d++) {
                    const dx = ((seed + d * 53) % 100) / 100 * (plat.width - 20) - (plat.width/2 - 10);
                    const dy = 10 + ((seed + d * 79) % 50) / 50 * (ph - 14);
                    const ds = 4 + ((seed + d * 31) % 30) / 30 * 6;
                    ctx.fillRect(screenX + dx - ds/2, screenY + dy - ds/2, ds, ds);
                }

                // Side edge shading
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(screenX - halfW, screenY, 3, ph);
                ctx.fillRect(screenX + halfW - 3, screenY, 3, ph);

                // Grass blades on grass type
                if (plat.type === 'grass') {
                    ctx.fillStyle = '#66BB6A';
                    for (let g = 0; g < Math.floor(plat.width / 15); g++) {
                        const gx = screenX - halfW + 8 + g * 15 + Math.sin(seed + g) * 4;
                        const sway = Math.sin(time * 2 + g + seed) * 2;
                        ctx.beginPath();
                        ctx.moveTo(gx, screenY - 2);
                        ctx.lineTo(gx + sway - 1, screenY - 8 - ((seed + g * 17) % 5));
                        ctx.lineTo(gx + 2, screenY - 2);
                        ctx.fill();
                    }
                }

                // Checkpoint flag
                if (plat.isCheckpoint && !plat.isFinish) {
                    const flagX = screenX;
                    const flagY = screenY - 4;
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(flagX - 2, flagY - 50, 4, 50);
                    const flagSway = Math.sin(time * 2.5 + idx) * 3;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.moveTo(flagX + 2, flagY - 50);
                    ctx.lineTo(flagX + 25 + flagSway, flagY - 42);
                    ctx.lineTo(flagX + 2, flagY - 34);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#FF8F00';
                    ctx.font = '10px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('⭐', flagX + 12 + flagSway * 0.5, flagY - 40);
                }

                // Finish platform decoration
                if (plat.isFinish) {
                    const flagX = screenX;
                    const flagY = screenY - 4;
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(flagX - 3, flagY - 80, 6, 80);
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(flagX, flagY - 83, 6, 0, Math.PI * 2);
                    ctx.fill();
                    const flagW = 40, flagH = 25;
                    for (let fy = 0; fy < 5; fy++) {
                        for (let fx = 0; fx < 8; fx++) {
                            ctx.fillStyle = (fx + fy) % 2 === 0 ? '#111' : '#EEE';
                            ctx.fillRect(flagX + 3 + fx * (flagW/8), flagY - 78 + fy * (flagH/5), flagW/8, flagH/5);
                        }
                    }
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 16px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏁 FINISH', flagX, flagY - 90);
                }

                // Current platform glow
                if (idx === pkCurrentPlatformIdx && !pkFalling) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(screenX - halfW - 2, screenY - 4, plat.width + 4, ph + 6, 6);
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        function startParkourMode() {
            challengeMode = 'parkour';
            unlimitedMode = false;
            uiOverlay.innerHTML = '';
            gameState = 'countdown';
            countdownValue = 3;
            countdownTimer = 0;
            raceTime = 0;
            pkPenaltyTime = 0;
            playerTumbleCount = 0;
            pkFalling = false;
            pkRespawnTimer = 0;
            pkCurrentPlatformIdx = 0;
            pkLastCheckpointIdx = 0;

            // Init player only
            racers = [];
            obstacles = [];
            player = new Racer(true, 2, 'player_character_hopping');
            racers.push(player);

            // Generate platform course
            pkPlatforms = [];

            // Starting platform (wide)
            pkPlatforms.push({ x: 100, y: 750, width: 250, height: 32, type: 'grass', isCheckpoint: true, isFinish: false });

            let lastX = 100;
            let lastY = 750;

            // Section 1: Easy (close, small height changes) - 15 platforms
            for (let i = 0; i < 15; i++) {
                const gapX = 140 + Math.random() * 80;
                const gapY = (Math.random() - 0.5) * 80;
                lastX += gapX;
                lastY = Math.max(400, Math.min(900, lastY + gapY));
                const w = 130 + Math.random() * 80;
                const isCP = (i === 14);
                pkPlatforms.push({ x: lastX, y: lastY, width: w, height: 32, type: 'grass', isCheckpoint: isCP, isFinish: false });
            }

            // Section 2: Medium (wider gaps, more height variation) - 15 platforms
            for (let i = 0; i < 15; i++) {
                const gapX = 170 + Math.random() * 100;
                const gapY = (Math.random() - 0.4) * 140;
                lastX += gapX;
                lastY = Math.max(350, Math.min(950, lastY + gapY));
                const w = 100 + Math.random() * 70;
                const isCP = (i === 14);
                pkPlatforms.push({ x: lastX, y: lastY, width: w, height: 32, type: 'dirt', isCheckpoint: isCP, isFinish: false });
            }

            // Section 3: Hard (big gaps, small platforms) - 15 platforms
            for (let i = 0; i < 15; i++) {
                const gapX = 190 + Math.random() * 120;
                const gapY = (Math.random() - 0.45) * 180;
                lastX += gapX;
                lastY = Math.max(320, Math.min(950, lastY + gapY));
                const w = 80 + Math.random() * 60;
                const isCP = (i === 14);
                pkPlatforms.push({ x: lastX, y: lastY, width: w, height: 32, type: 'stone', isCheckpoint: isCP, isFinish: false });
            }

            // Section 4: Expert (tiny platforms, big gaps) - 10 platforms
            for (let i = 0; i < 10; i++) {
                const gapX = 200 + Math.random() * 130;
                const gapY = (Math.random() - 0.5) * 200;
                lastX += gapX;
                lastY = Math.max(320, Math.min(950, lastY + gapY));
                const w = 70 + Math.random() * 50;
                pkPlatforms.push({ x: lastX, y: lastY, width: w, height: 32, type: 'sand', isCheckpoint: false, isFinish: false });
            }

            // Finish platform (wide)
            lastX += 200;
            lastY = 700;
            pkPlatforms.push({ x: lastX, y: lastY, width: 300, height: 32, type: 'grass', isCheckpoint: true, isFinish: true });

            pkCourseEndX = lastX;
            trackLength = pkCourseEndX + 200;
            pkDeathY = 1150;

            // Position player on first platform
            player.x = pkPlatforms[0].x;
            player.y = pkPlatforms[0].y;
            player.groundY = pkPlatforms[0].y;

            crowdMembers = [];
            rebuildCrowdLayers();
            initBackgroundDecor();
            strayChickens = [];
            chickenSpawnTimer = 0;
            bananaPeelProjectiles = [];
            clearMudTrails();

            transitionAmbientTo('racing');
            playSound('music_race_theme', { loop: true, trackAs: 'music', volume: 0.7 });
        }

        function updateParkourMode(dt) {
            if (gameState !== 'racing') return;
            raceTime += dt;

            // Handle respawn
            if (pkFalling) {
                pkRespawnTimer += dt;
                if (pkRespawnTimer >= 0.8) {
                    pkFalling = false;
                    pkRespawnTimer = 0;
                    const cp = pkPlatforms[pkLastCheckpointIdx];
                    player.x = cp.x;
                    player.y = cp.y;
                    player.groundY = cp.y;
                    player.vy = 0;
                    player.speed = 0;
                    player.state = 'idle';
                    player.chargeTime = 0;
                    pkCurrentPlatformIdx = pkLastCheckpointIdx;
                    player.triggerExpression('determined', 1.0, 0.8);
                    playSound('sfx_recovery', { volume: 0.6 });
                    spawnDust(player.x, player.y, 4, '#8D6E63');
                }
                const targetCamX = player.x - canvas.width * 0.3;
                cameraX += (targetCamX - cameraX) * (1 - Math.exp(-5 * dt));
                particles.forEach(p => p.update(dt));
                particles = particles.filter(p => p.life > 0);
                floatingTexts.forEach(ft => ft.update(dt));
                floatingTexts = floatingTexts.filter(ft => ft.life > 0);
                player.breathTimer += dt * 3;
                player.updateExpression(dt);
                return;
            }

            // Handle charging (auto-release)
            if (player.state === 'charging') {
                player.chargeTime += dt;
                if (player.chargeTime >= MAX_CHARGE_TIME) {
                    inputActive = false;
                    stopSound('charge');
                    executeHop(player);
                }
            }

            // Handle airborne physics
            if (player.state === 'airborne') {
                player.vy += GRAVITY * dt;
                player.y += player.vy * dt;
                player.x += player.speed * dt;

                // Check platform landing (only when descending)
                if (player.vy > 0) {
                    for (let i = 0; i < pkPlatforms.length; i++) {
                        const plat = pkPlatforms[i];
                        const halfW = plat.width / 2;
                        if (player.x >= plat.x - halfW && player.x <= plat.x + halfW) {
                            if (player.y >= plat.y && player.y - player.vy * dt < plat.y + 20) {
                                // Land on this platform
                                player.y = plat.y;
                                player.vy = 0;
                                player.groundY = plat.y;
                                player.state = 'idle';
                                pkCurrentPlatformIdx = i;

                                if (plat.isCheckpoint) {
                                    pkLastCheckpointIdx = i;
                                }

                                player.currentScaleX = 1.12;
                                player.currentScaleY = 0.88;
                                spawnDust(player.x, player.y, 3, '#8D6E63');
                                playSoftLanding(0.5);

                                if (plat.isFinish) {
                                    player.finished = true;
                                    finishParkour();
                                    return;
                                }
                                break;
                            }
                        }
                    }
                }

                // Check death zone
                if (player.y > pkDeathY) {
                    pkFalling = true;
                    pkRespawnTimer = 0;
                    pkPenaltyTime += 2.0;
                    playerTumbleCount++;
                    player.state = 'tumbling';
                    player.triggerExpression('panicked', 1.0, 1.0);
                    floatingTexts.push(new FloatingText(player.x, pkDeathY - 150, '+2s PENALTY!', '#FF5722'));
                    playSound('sfx_landing_tumble', { volume: 0.6 });
                    spawnFallText(player);
                }

                // Air resistance
                player.speed *= Math.exp(-0.5 * dt);
            }

            // Ground deceleration
            if (player.state !== 'airborne' && player.state !== 'charging') {
                player.speed *= Math.exp(-8 * dt);
                if (Math.abs(player.speed) < 2) player.speed = 0;
                player.x += player.speed * dt;

                // Check if walked off platform edge
                const currentPlat = pkPlatforms[pkCurrentPlatformIdx];
                if (currentPlat) {
                    const halfW = currentPlat.width / 2;
                    if (player.x < currentPlat.x - halfW || player.x > currentPlat.x + halfW) {
                        player.state = 'airborne';
                        player.vy = 0;
                    }
                }
            }

            // Animation
            player.breathTimer += dt * 3;
            player.updateExpression(dt);

            // Movement dust
            const moveDelta = player.x - player.lastX;
            player.lastX = player.x;
            if (player.state !== 'airborne' && Math.abs(moveDelta) > 0.5) {
                player.dustTimer += dt;
                if (player.dustTimer > 0.15) {
                    player.dustTimer = 0;
                    const p = new Particle(player.x + (Math.random()-0.5)*20, player.groundY);
                    p.size = 8 + Math.random() * 10;
                    p.vy = -20 - Math.random() * 30;
                    p.vx = -moveDelta * 0.5 + (Math.random()-0.5)*30;
                    p.life = 0.3 + Math.random() * 0.2;
                    p.maxLife = p.life;
                    particles.push(p);
                }
            }

            // Update effects
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);
            floatingTexts.forEach(ft => ft.update(dt));
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            confetti.forEach(c => c.update(dt));
            confetti = confetti.filter(c => c.life > 0);

            // Camera follows player
            const targetCamX = player.x - canvas.width * 0.3;
            cameraX += (targetCamX - cameraX) * (1 - Math.exp(-8 * dt));
        }

        function drawParkourHUD() {
            if (gameState !== 'racing' || challengeMode !== 'parkour') return;
            const w = canvas.width;

            // Timer (top-right)
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(w - 180, 16, 164, 48, 12);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '600 24px Fredoka';
            ctx.textAlign = 'right';
            ctx.fillText(`⏱️ ${raceTime.toFixed(1)}s`, w - 26, 48);

            // Penalty
            if (pkPenaltyTime > 0) {
                ctx.fillStyle = 'rgba(255,87,34,0.7)';
                ctx.beginPath();
                ctx.roundRect(w - 160, 72, 144, 32, 8);
                ctx.fill();
                ctx.fillStyle = '#FFCCBC';
                ctx.font = '500 16px Fredoka';
                ctx.fillText(`+${pkPenaltyTime.toFixed(1)}s penalty`, w - 26, 94);
            }

            // Progress bar
            const progress = Math.min(player.x / pkCourseEndX, 1);
            const barW = w - 32;
            const barH = 14;
            const barY = 116;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.roundRect(16, barY, barW, barH, 7);
            ctx.fill();

            // Fill
            const sectionColors = ['#4CAF50', '#FFC107', '#FF5722', '#9C27B0'];
            const sIdx = Math.min(3, Math.floor(progress * 4));
            ctx.fillStyle = sectionColors[sIdx];
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.roundRect(16, barY, barW * progress, barH, 7);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Player dot
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(16 + barW * progress, barY + barH/2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Checkpoint dots
            pkPlatforms.forEach((p, i) => {
                if (p.isCheckpoint) {
                    const cpProgress = p.x / pkCourseEndX;
                    ctx.fillStyle = i <= pkLastCheckpointIdx ? '#FFD700' : 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(16 + barW * cpProgress, barY + barH/2, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Platform counter (top-left)
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(16, 16, 170, 48, 12);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '600 20px Fredoka';
            ctx.textAlign = 'left';
            ctx.fillText(`🧱 ${pkCurrentPlatformIdx + 1}/${pkPlatforms.length}`, 28, 47);

            // Falls counter

            ctx.beginPath();
            ctx.roundRect(16, 72, 130, 32, 8);
            ctx.fill();
            ctx.fillStyle = '#FF8A80';
            ctx.font = '500 16px Fredoka';
            ctx.fillText(`💀 Falls: ${playerTumbleCount}`, 28, 94);

            // Section label
            const sectionNames = ['Easy', 'Medium', 'Hard', 'Expert'];
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(16, barY + 20, 140, 26, 8);
            ctx.fill();
            ctx.fillStyle = sectionColors[sIdx];
            ctx.font = '600 14px Fredoka';
            ctx.fillText(`§${sIdx + 1}: ${sectionNames[sIdx]}`, 26, barY + 38);

            // Falling warning

                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';

        function updateJumpACarMode(dt) {
            if (gameState !== 'racing' || !jacGameActive) return;
            raceTime += dt;
            
            // Update player physics (stays in place mostly, just hops)
            updateRacer(player, dt);
            
            // Damage flash
            if (jacDamageFlash > 0) jacDamageFlash = Math.max(0, jacDamageFlash - dt * 3);
            
            // Spawn cars (ONLY from right side)
            jacSpawnTimer += dt;
            if (jacSpawnTimer >= jacSpawnInterval) {
                jacSpawnTimer = 0;
                jacRound++;
                
                // Increase difficulty every 3 rounds
                if (jacRound % 3 === 0) {
                    jacCarSpeed += 40;
                    jacSpawnInterval = Math.max(1.2, jacSpawnInterval - 0.2);
                }
                
                const fromRight = true; // Always from right
                const speed = jacCarSpeed + Math.random() * 60;
                jacCars.push(new ChallengeCar(speed, fromRight));
                
                // Occasionally spawn double cars at higher rounds
                if (jacRound > 6 && Math.random() < 0.3) {
                    setTimeout(() => {
                        if (jacGameActive) {
                            jacCars.push(new ChallengeCar(speed * 0.9, true));
                        }
                    }, 800);
                }
            }
            
            // Update cars
            jacCars.forEach(car => {
                car.update(dt);
                
                // Collision detection with player
                if (!car.hit && !car.passed) {
                    const dx = Math.abs(car.x - player.x);
                    const isOverPlayer = dx < 70;
                    
                    if (isOverPlayer) {
                        // Check if player is airborne (jumped over successfully)
                        if (player.state === 'airborne' && player.y < player.groundY - 50) {
                            // Successful jump!
                            car.passed = true;
                            jacScore++;
                            floatingTexts.push(new FloatingText(player.x, player.y - player.height - 40, `+1 JUMP! 🚗✓`, '#4CAF50'));
                            playSound('sfx_crowd_cheer', { volume: 0.4 });
                            spawnDust(player.x, player.groundY, 4, '#FFD700');
                        } else if (player.state !== 'airborne' && player.state !== 'tumbling') {
                            // HIT! Player didn't jump
                            car.hit = true;
                            jacLives--;
                            jacDamageFlash = 1.0;
                            
                            player.state = 'tumbling';
                            player.tumbleTimer = 0;
                            player.tumbleType = 'rock_trip';
                            player.recoveryTaps = 0;
                            player.triggerExpression('panicked', 1.5, 1.0);
                            
                            floatingTexts.push(new FloatingText(player.x, player.y - player.height - 30, '💥 HIT!', '#FF1744'));
                            playSound('sfx_rock_impact', { volume: 0.7 });
                            playSound('sfx_landing_tumble', { volume: 0.5 });
                            spawnDust(player.x, player.groundY, 8, '#FF5722');
                            impactFeedback(11, 0.07, 0.2);
                            
                            if (jacLives <= 0) {
                                jacGameActive = false;
                                setTimeout(() => finishJumpACar(), 1200);
                            }
                        }
                    }
                    
                    // Mark as passed if car went past player without collision
                    if (!car.hit && !car.passed) {
                        if (car.fromRight && car.x < player.x - 100) {
                            car.passed = true;
                            jacScore++;
                            floatingTexts.push(new FloatingText(player.x, player.y - player.height - 40, `+1 🚗✓`, '#4CAF50'));
                        } else if (!car.fromRight && car.x > player.x + 100) {
                            car.passed = true;
                            jacScore++;
                            floatingTexts.push(new FloatingText(player.x, player.y - player.height - 40, `+1 🚗✓`, '#4CAF50'));
                        }
                    }
                }
            });
            
            // Remove off-screen cars
            jacCars = jacCars.filter(car => !car.isOffScreen());
            
            // Update crowd
            updateCrowdIdle(dt);
            
            // Update particles
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);
            floatingTexts.forEach(ft => ft.update(dt));
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            crowdReactions.forEach(cr => cr.update(dt));
            crowdReactions = crowdReactions.filter(cr => cr.life > 0);
            confetti.forEach(c => c.update(dt));
            confetti = confetti.filter(c => c.life > 0);
            
            // Camera: player on the LEFT side so we can see cars coming from right
            const targetCamX = player.x - canvas.width * 0.18;
            cameraX += (targetCamX - cameraX) * (1 - Math.exp(-5 * dt));
        }

        function ulCheckCollisions() {
            if (!player || player.state === 'tumbling') return;
            
            // Single lane mode - check pickup collisions (airborne or ground)
            // More generous pickup radius since everything is on one path
            ulPickups.forEach(pickup => {
                if (pickup.collected) return;
                if (Math.abs(pickup.x - player.x) < 65) {
                    pickup.collected = true;
                    
                    if (pickup.type === 'heart') {
                        ulHearts = Math.min(ulMaxHearts, ulHearts + 1);
                        floatingTexts.push(new FloatingText(player.x, player.y - player.height - 30, '+❤️', '#FF4081'));
                        playSound('sfx_recovery', { volume: 0.5 });
                    } else {
                        const coinMult = getEventCoinMultiplier();
                        const actualValue = pickup.value * coinMult;
                        ulCoinsCollected += actualValue;
                        ulScore += actualValue;
                        const coinText = coinMult > 1 ? `+Rp ${actualValue} (x${coinMult}!)` : `+Rp ${actualValue}`;
                        floatingTexts.push(new FloatingText(player.x, player.y - player.height - 30, coinText, coinMult > 1 ? '#81C784' : '#FFD700'));
                        playUIClick();
                        updateEventMilestone('coins', actualValue);
                        updateHalloweenMilestone('coins', actualValue);
                    }
                }
            });
        }

        function updateUnlimitedMode(dt) {
            if (gameState !== 'unlimited_racing') return;
            if (ulHearts <= 0) return;
            
            raceTime += dt;
            ulDifficultyTimer += dt;
            
            // Difficulty scaling - single lane means obstacles must be jumpable
            // Player must hop manually to clear obstacles - timing is key
            const diffMult = config.difficulty === 'easy' ? 0.7 : (config.difficulty === 'hard' ? 1.3 : 1.0);
            ulObstacleInterval = Math.max(1.5, 3.0 - ulDifficultyTimer * 0.01 * diffMult);
            ulPickupInterval = Math.max(2.0, 3.2 - ulDifficultyTimer * 0.008);
            
            // Update distance and score based on actual player hopping distance
            ulDistance = Math.max(0, (player.x - 50)) / PIXELS_PER_METER;
            ulScore = Math.floor(ulDistance) + ulCoinsCollected;
            
            // Invincibility timer
            if (ulInvincible) {
                ulInvTimer += dt;
                if (ulInvTimer >= ulInvDuration) {
                    ulInvincible = false;
                }
            }
            
            // Damage flash decay
            if (ulDamageFlash > 0) {
                ulDamageFlash -= dt * 3;
                if (ulDamageFlash < 0) ulDamageFlash = 0;
            }
            
            // Spawn obstacles ahead of player (only when player is moving forward)
            ulNextObstacleTimer -= dt;
            if (ulNextObstacleTimer <= 0) {
                ulSpawnObstacle();
                ulNextObstacleTimer = ulObstacleInterval + (Math.random() - 0.5) * 0.4;
            }
            
            // Spawn pickups
            ulNextPickupTimer -= dt;
            if (ulNextPickupTimer <= 0) {
                ulSpawnPickup();
                ulNextPickupTimer = ulPickupInterval + (Math.random() - 0.5) * 0.8;
            }
            
            // Update player using the SAME physics as normal mode (hop to move)
            updateRacer(player, dt);
            
            // Update stray chickens in unlimited mode
            updateStrayChickens(dt);
            
            // Update banana throwing
            const bananaInterval = config.difficulty === 'easy' ? 18.0 : (config.difficulty === 'hard' ? 9.0 : 13.0);
            bananaPeelThrowTimer += dt;
            if (bananaPeelThrowTimer >= bananaInterval) {
                bananaPeelThrowTimer = 0;
                triggerBananaPeelThrow();
            }

            // Update projectiles
            bananaPeelProjectiles.forEach(p => p.update(dt));
            bananaPeelProjectiles = bananaPeelProjectiles.filter(p => p.active);
            
            // Check collisions with pickups
            ulCheckCollisions();
            
            // Update obstacles
            ulObstacles.forEach(ob => ob.update(dt));
            // Remove spent or far behind obstacles
            ulObstacles = ulObstacles.filter(ob => (!ob.spent || ob.spentTimer < 0.5) && ob.x > player.x - 600);
            
            // Update pickups
            ulPickups.forEach(p => p.update(dt));
            ulPickups = ulPickups.filter(p => !p.collected && p.x > player.x - 600);
            
            // Update crowd
            updateCrowdIdle(dt);
            
            // Update particles
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);
            floatingTexts.forEach(ft => ft.update(dt));
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            crowdReactions.forEach(cr => cr.update(dt));
            crowdReactions = crowdReactions.filter(cr => cr.life > 0);
            confetti.forEach(c => c.update(dt));
            confetti = confetti.filter(c => c.life > 0);
            mudFootprints.forEach(fp => fp.update(dt));
            mudFootprints = mudFootprints.filter(fp => fp.alpha > 0);
            
            // Camera follows player with smooth damping
            const targetCamX = player.x - canvas.width * 0.22;
            cameraX += (targetCamX - cameraX) * (1 - Math.exp(-8 * dt));
        }
