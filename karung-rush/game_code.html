        class ChallengeCar {
            constructor(speed, fromRight) {
                this.fromRight = fromRight;
                this.speed = speed;
                const trackTop = canvas.height * TRACK_Y_START;
                const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
                const laneH = trackH / 5;
                this.y = trackTop + 2 * laneH + laneH * 0.5; // same lane as player
                this.groundY = this.y;
                this.width = 160;
                this.height = 80;
                if (fromRight) {
                    this.x = player.x + canvas.width * 0.9;
                } else {
                    this.x = player.x - canvas.width * 0.5;
                }
                this.passed = false;
                this.hit = false;
                this.animTime = 0;
                this.warningShown = true;
                this.hornPlayed = false;
            }
            update(dt) {
                this.animTime += dt;
                const dir = this.fromRight ? -1 : 1;
                this.x += this.speed * dir * dt;
                // Play horn when approaching
                if (!this.hornPlayed && Math.abs(this.x - player.x) < 600) {
                    this.hornPlayed = true;
                    playSound('sfx_car_horn', { volume: 0.6 });
                }
            }
            isOffScreen() {
                if (this.fromRight) return this.x < player.x - canvas.width;
                return this.x > player.x + canvas.width;
            }
            draw(camX, canvasW) {
                const screenX = this.x - camX + canvasW * 0.18;
                if (screenX < -200 || screenX > canvasW + 200) return;
                const screenY = this.groundY;
                const time = this.animTime;

                ctx.save();
                ctx.translate(screenX, screenY);
                if (this.fromRight) ctx.scale(-1, 1);

                // Car shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 15, this.width * 0.45, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Car body
                const bodyGrad = ctx.createLinearGradient(0, -this.height, 0, 0);
                bodyGrad.addColorStop(0, '#1565C0');
                bodyGrad.addColorStop(0.5, '#1976D2');
                bodyGrad.addColorStop(1, '#0D47A1');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(-this.width/2, -this.height + 15, this.width, this.height * 0.55, 8);
                ctx.fill();

                // Car roof/cabin
                ctx.fillStyle = '#90CAF9';
                ctx.beginPath();
                ctx.roundRect(-this.width * 0.3, -this.height - 5, this.width * 0.55, this.height * 0.4, 6);
                ctx.fill();

                // Windshield
                ctx.fillStyle = 'rgba(200,230,255,0.8)';
                ctx.beginPath();
                ctx.roundRect(-this.width * 0.25, -this.height - 2, this.width * 0.2, this.height * 0.32, 4);
                ctx.fill();

                // Wheels (animated rotation)
                const wheelRot = time * 10;
                [-this.width * 0.3, this.width * 0.25].forEach(wx => {
                    ctx.fillStyle = '#212121';
                    ctx.beginPath();
                    ctx.arc(wx, 8, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#616161';
                    ctx.beginPath();
                    ctx.arc(wx, 8, 8, 0, Math.PI * 2);
                    ctx.fill();
                    // Spoke
                    ctx.strokeStyle = '#424242';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(wx + Math.cos(wheelRot) * 6, 8 + Math.sin(wheelRot) * 6);
                    ctx.lineTo(wx - Math.cos(wheelRot) * 6, 8 - Math.sin(wheelRot) * 6);
                    ctx.stroke();
                });

                // Headlight
                ctx.fillStyle = '#FFEB3B';
                ctx.beginPath();
                ctx.ellipse(this.width/2 - 5, -this.height * 0.2, 5, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Exhaust puff
                const puffAlpha = 0.3 + Math.sin(time * 5) * 0.1;
                ctx.fillStyle = `rgba(150,150,150,${puffAlpha})`;
                ctx.beginPath();
                ctx.arc(-this.width/2 - 10 - Math.sin(time * 3) * 5, 0, 6 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Warning indicator (exclamation above)
                if (this.warningShown && Math.abs(this.x - player.x) < 500 && !this.passed) {
                    const warnAlpha = (Math.sin(performance.now() * 0.012) + 1) * 0.5;
                    ctx.save();
                    ctx.globalAlpha = warnAlpha;
                    ctx.fillStyle = '#FF5722';
                    ctx.font = 'bold 28px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚠️🚗', screenX, screenY - this.height - 30);
                    ctx.restore();
                }
            }
        }

        class ULPickup {
            constructor(type, x, laneIndex, value) {
                this.type = type; // 'heart', 'coin_small', 'coin_medium', 'coin_large'
                this.x = x;
                this.laneIndex = laneIndex;
                this.value = value;
                this.collected = false;
                this.animTime = Math.random() * Math.PI * 2;
                this.width = type === 'heart' ? 40 : (type === 'coin_large' ? 45 : (type === 'coin_medium' ? 38 : 30));
                this.height = this.width;
            }
            update(dt) { this.animTime += dt * 4; }
            draw(camX, canvasW) {
                if (this.collected) return;
                const screenX = this.x - camX + canvasW * 0.3;
                if (screenX < -60 || screenX > canvasW + 60) return;
                const trackTop = canvas.height * TRACK_Y_START;
                const trackH = canvas.height - trackTop - BOTTOM_MARGIN;
                const laneH = trackH / 5;
                const groundY = trackTop + this.laneIndex * laneH + laneH * 0.5;
                const bob = Math.sin(this.animTime) * 6;
                const pulse = 1 + Math.sin(this.animTime * 1.5) * 0.08;

                ctx.save();
                ctx.translate(screenX, groundY - 30 + bob);
                ctx.scale(pulse, pulse);

                if (this.type === 'heart') {
                    // Draw heart
                    ctx.fillStyle = '#FF4081';
                    ctx.font = '36px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('❤️', 0, 0);
                    // Glow
                    ctx.shadowColor = '#FF4081';
                    ctx.shadowBlur = 12;
                    ctx.fillText('❤️', 0, 0);
                } else {
                    // Draw coin
                    const coinSize = this.type === 'coin_large' ? 20 : (this.type === 'coin_medium' ? 16 : 12);
                    const coinGrad = ctx.createRadialGradient(-2, -2, 0, 0, 0, coinSize);
                    coinGrad.addColorStop(0, '#FFF59D');
                    coinGrad.addColorStop(0.4, '#FFD700');
                    coinGrad.addColorStop(0.8, '#FFA000');
                    coinGrad.addColorStop(1, '#E65100');
                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, coinSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#B8860B';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // Rp text
                    ctx.fillStyle = '#5D4037';
                    ctx.font = `bold ${coinSize * 0.8}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Rp', 0, 1);
                    // Shine
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(-coinSize * 0.25, -coinSize * 0.3, coinSize * 0.35, coinSize * 0.2, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        async function finishRace() {
            mpOnLocalFinish();
            gameState = 'finished';
            finishCelebrationTimer = 0;

            finishCameraTarget = player;

        function updateFinishCelebration(dt) {
            if (gameState !== 'finished') return;
            finishCelebrationTimer += dt;
            
            const isWin = player.placement === 1;
            const isTop3 = player.placement <= 3;
            
            // Smooth camera zoom toward winner
            const targetZoom = isWin ? 1.4 : (isTop3 ? 1.2 : 1.1);
            finishCameraZoom += (targetZoom - finishCameraZoom) * 2.0 * dt;
            
            // Camera pans to player
            if (finishCameraTarget) {
                const targetCamX = finishCameraTarget.x - canvas.width * 0.4 / finishCameraZoom;
                cameraX += (targetCamX - cameraX) * 3.0 * dt;
            }
            
            // Winner bounce animation
            if (isWin && !finishShowResult) {
                player.y = player.groundY + Math.sin(finishCelebrationTimer * 6) * 20 - 15;
                player.currentRotation = Math.sin(finishCelebrationTimer * 4) * 0.1;
                player.currentScaleX = 1.0 + Math.sin(finishCelebrationTimer * 5) * 0.08;
                player.currentScaleY = 1.0 - Math.sin(finishCelebrationTimer * 5) * 0.08;
                
                // Periodic dust bursts
                if (Math.sin(finishCelebrationTimer * 6) > 0.9) {
                    spawnDust(player.x, player.groundY, 2, '#FFD700');
                }
            } else if (!isWin && !finishShowResult) {
                // Cute "oh well" animation - gentle sway and a small shrug
                player.y = player.groundY;
                player.currentRotation = Math.sin(finishCelebrationTimer * 2) * 0.05;
                player.currentScaleY = 1.0 + Math.sin(finishCelebrationTimer * 3) * 0.03;
            }
            
            // Crowd goes wild during celebration
            forEachVisibleCrowd((c) => {
                if (isWin) {
                    c.bounceAmp = c.baseBounce + 15;
                } else {
                    c.bounceAmp = c.baseBounce + 5;
                }
                c.updateIdle(dt);
            });
            
            // Keep spawning confetti for winner
            if (isWin && finishCelebrationTimer < 2.5 && Math.random() < 0.15) {
                if (confetti.length < MAX_CONFETTI) confetti.push(new Confetti(
                    player.x - cameraX + canvas.width * 0.3 + (Math.random() - 0.5) * 300,
                    canvas.height * 0.2
                ));
            }
        }

        // AI update
        function updateAI(racer, dt) {
            if (racer.finished) return;
            if (racer.isFrozen) return; // Frozen - can't do anything
            racer.aiTimer += dt;

            // Calculate progress and panic
            const progress = racer.x / trackLength;
            const isPanicking = progress > racer.aiPanicThreshold;
            
            // Panic increases mistake chance and makes them jump too early/erratically
            const currentMistakeChance = isPanicking ? racer.aiMistakeChance * 4 : racer.aiMistakeChance;

            switch(racer.state) {
                case 'idle':
                    // Hop too late / Hesitation
                    const baseWait = isPanicking ? 0.15 : 0.4;
                    const randomWait = (1 - racer.aiConsistency) * 1.5; // More variance
                    if (racer.aiTimer > baseWait + Math.random() * randomWait) {
                        racer.state = 'charging';
                        racer.chargeTime = 0;
                        racer.aiTimer = 0;
                        
                        // Hop too early - rare chance to jump immediately with tiny power
                        if (Math.random() < currentMistakeChance * 0.3) {
                             executeHop(racer);
                        }
                    }
                    break;
                case 'charging':
                    racer.chargeTime += dt;
                    
                    // Obstacle Awareness / Prediction (Medium/Hard AI)
                    if (config.difficulty !== 'easy' && racer.chargeTime > 0.15) {
                        const intelligence = config.difficulty === 'hard' ? 0.9 : 0.45;
                        
                        if (Math.random() < intelligence) {
                            const chargeRatio = Math.min(racer.chargeTime / MAX_CHARGE_TIME, 1);
                            const currentVY = HOP_VERTICAL * (0.6 + chargeRatio * 0.4);
                            const currentSpeed = (HOP_BASE_POWER + (HOP_MAX_POWER - HOP_BASE_POWER) * chargeRatio) * (racer.aiSpeedMultiplier || 0.8);
                            const jumpTime = -2 * currentVY / GRAVITY;
                            const estLandingX = racer.x + currentSpeed * jumpTime;
                            
                            // Check if current landing point is an obstacle
                            const willHit = obstacles.some(ob => 
                                ob.laneIndex === racer.laneIndex && 
                                Math.abs(ob.x - estLandingX) < 45
                            );

                            if (willHit) {
                                // If landing on mud/rock, smart AI might release early or hold longer
                                // Let's make it try to "panic release" or "wait"
                                if (Math.random() < 0.5) {
                                    executeHop(racer);
                                    return;
                                } else {
                                    // Keep charging to overshoot the obstacle
                                    racer.aiChargeTarget += 0.2;
                                }
                            }
                        }
                    }

                    let target = racer.aiChargeTarget;
                    if (isPanicking) {
                        // Panicked jumps are smaller or weirdly timed
                        target *= (0.3 + Math.random() * 1.0); 
                    }

                    if (racer.chargeTime >= target) {
                        // Significant chance to just fail or hesitate
                        if (Math.random() < currentMistakeChance * 0.6) {
                            // Hesitate! Panic frozen
                            racer.aiTimer = isPanicking ? -1.5 : -0.8; 
                            racer.state = 'idle';
                            return;
                        }
                        
                        executeHop(racer);
                        
                        // Recalculate next target with more randomness
                        const diff = config.difficulty;
                        if (diff === 'easy') racer.aiChargeTarget = 1.0 + Math.random() * 1.0;
                        else if (diff === 'hard') racer.aiChargeTarget = 0.4 + Math.random() * 0.5;
                        else racer.aiChargeTarget = 0.6 + Math.random() * 0.9;
                    }
                    break;
            }
        }

        // Physics update
        function updateRacer(racer, dt) {
            if (racer.isRemote) { mpUpdateRemote(racer, dt); return; }
            if (racer.finished) return;
            if (racer.isFrozen) {
                // Frozen racer: don't move, just show ice particles occasionally
                racer.speed = 0;
                racer.updateExpression(dt);
                if (particles.length < MAX_PARTICLES && Math.random() < 0.1 * dt * 60 * effectQuality) {
                    const p = new Particle(racer.x + (Math.random()-0.5)*30, racer.y - Math.random() * racer.height);
                    p.color = '#B3E5FC';
                    p.size = 3 + Math.random() * 5;
                    p.vy = -10 - Math.random() * 20;
                    p.vx = (Math.random()-0.5) * 20;
                    p.life = 0.5 + Math.random() * 0.3;
                    p.maxLife = p.life;
                    particles.push(p);
                }
                return;
            }

            // Lead Change Cheer
            if (gameState === 'racing' && racer.isPlayer) {
                let currentRank = 1;
                for (let i = 0; i < racers.length; i++) {
                    if (racers[i] !== player && racers[i].x > player.x) currentRank++;
                }
                if (currentRank < lastPlayerRank && currentRank === 1) {
                    // Just took the lead!
                    playSound('sfx_crowd_cheer', { volume: 0.45 });
                    lib.log("Player took the lead!");
                }
                lastPlayerRank = currentRank;
            }

            if (racer.state === 'charging') {
                racer.chargeTime += (racer.isPlayer ? dt : 0);
                if (racer.isPlayer && racer.chargeTime >= MAX_CHARGE_TIME) {
                    inputActive = false;
                    stopSound('charge');
                    executeHop(racer);
                }
            }

            // Update mud effect and leave trails
            if (racer.mudTimer > 0) {
                racer.mudTimer -= dt;
                if (racer.mudIntensity) {
                    racer.mudIntensity = Math.max(0, racer.mudTimer / 3.0);
                }
                
                // Mud slip forward momentum
                if (racer.mudSlipForward && racer.mudSlipForward > 0 && racer.state === 'balancing') {
                    racer.x += racer.mudSlipForward * dt;
                    racer.mudSlipForward *= Math.exp(-5 * dt);
                    if (racer.mudSlipForward < 5) racer.mudSlipForward = 0;
                }
                
                // Mud wobble effect (struggling to stay upright)
                if (racer.mudWobble && racer.state === 'balancing') {
                    racer.balanceTimer -= dt * 0.3; // Slower recovery when muddy
                    if (racer.balanceTimer >= BALANCE_WINDOW) {
                        racer.mudWobble = false;
                    }
                }
                
                // Leave trail marks while moving on ground
                if (racer.state !== 'airborne') {
                    const trailChance = racer.mudIntensity > 0.5 ? 0.35 : 0.15;
                    if (Math.random() < trailChance * (1 + Math.abs(racer.speed) * 0.002)) {
                        spawnMudTrail(racer, racer.speed);
                    }
                    // Dripping mud particles when freshly coated
                    if (racer.mudIntensity > 0.4 && Math.random() < 0.25) {
                        const p = new Particle(racer.x + (Math.random()-0.5)*25, racer.y);
                        p.color = ['#4b3621', '#5d4037', '#6d4c41'][Math.floor(Math.random()*3)];
                        p.size = 3 + Math.random() * 6;
                        p.vy = Math.random() * 15 + 5; // Drips down
                        p.vx = (Math.random()-0.5) * 20;
                        p.life = 0.3 + Math.random() * 0.2;
                        p.maxLife = p.life;
                        particles.push(p);
                    }
                    // Sticky heavy movement particles
                    if (Math.abs(racer.speed) > 30 && Math.random() < 0.2) {
                        const p = new Particle(racer.x + (Math.random()-0.5)*15, racer.y);
                        p.color = '#3e2723';
                        p.size = 4 + Math.random() * 5;
                        p.vy = -Math.random() * 25 - 5;
                        p.vx = -racer.speed * 0.05 + (Math.random()-0.5)*15;
                        p.life = 0.25 + Math.random() * 0.15;
                        p.maxLife = p.life;
                        particles.push(p);
                    }
                }
            } else {
                racer.mudWobble = false;
                racer.mudSlipForward = 0;
            }

            if (racer.state === 'airborne') {
                racer.vy += GRAVITY * dt;
                racer.y += racer.vy * dt;
                
                let moveSpeed = racer.speed;
                if (racer.mudTimer > 0) {
                    moveSpeed *= 0.7;
                }
                racer.x += moveSpeed * dt;

                if (racer.y >= racer.groundY) {
                    racer.y = racer.groundY;
                    racer.vy = 0;
                    racer.speed *= (racer.isPlayer ? 0.25 : 0.12); 
                    spawnDust(racer.x, racer.y, 3);
                    
                    // Soft landing audio feedback
                    if (racer.isPlayer) {
                        playSoftLanding(0.5);
                    }

                    // Check obstacle collision on landing
                    let landedOnMud = false;
                    let landedOnMoss = false;
                    let landedOnRock = false;
                    let landedOnBananaPeel = false;
                    let hitBananaPeelObj = null;
                    
                    const obstacleList = unlimitedMode ? ulObstacles : obstacles;
                    obstacleList.forEach(ob => {
                        if (!ob.spent && ob.laneIndex === racer.laneIndex && Math.abs(ob.x - racer.x) < 45) {
                            if (ob.type === 'mud') landedOnMud = true;
                            if (ob.type === 'moss') landedOnMoss = true;
                            if (ob.type === 'rock') landedOnRock = true;
                            if (ob.type === 'banana_peel') {
                                landedOnBananaPeel = true;
                                hitBananaPeelObj = ob;
                            }
                        }
                    });

                    // Trigger expressions on hard landings (even without obstacles)
                    const landingForce = Math.abs(racer.vy);
                    if (!landedOnMud && !landedOnMoss && !landedOnRock && landingForce > 500) {
                        racer.triggerExpression('nervous', 0.8, 0.5);
                    }

                    let landedOnWater = false;
                    obstacleList.forEach(ob => {
                        if (ob.type === 'water_puddle' && ob.laneIndex === racer.laneIndex && Math.abs(ob.x - racer.x) < 50) landedOnWater = true;
                    });

                    if (landedOnWater) {
                        // Water puddle: slow down + chance of balance loss
                        racer.mudTimer = 2.0; // Reuse mud timer for slow effect
                        racer.mudIntensity = 0.4; // Lighter than mud
                        racer.triggerExpression('nervous', 1.2, 0.7);
                        
                        // Trigger splash animation
                        const obstList = unlimitedMode ? ulObstacles : obstacles;
                        obstList.forEach(ob => {
                            if (ob.type === 'water_puddle' && ob.laneIndex === racer.laneIndex && Math.abs(ob.x - racer.x) < 60) {
                                ob.triggerSplash();
                            }
                        });
                        
                        // Splash particles
                        for(let i=0; i<10; i++) {
                            const p = new Particle(racer.x + (Math.random()-0.5)*30, racer.y);
                            p.color = ['#87CEEB', '#B3E5FC', '#81D4FA'][Math.floor(Math.random()*3)];
                            p.vx = (Math.random()-0.5) * 120;
                            p.vy = -Math.random() * 100 - 30;
                            p.size = 5 + Math.random() * 10;
                            p.life = 0.4 + Math.random() * 0.3;
                            p.maxLife = p.life;
                            particles.push(p);
                        }
                        
                        // Chance of losing balance (less than mud)
                        const waterTumbleChance = config.difficulty === 'hard' ? 0.4 : (config.difficulty === 'easy' ? 0.1 : 0.25);
                        if (Math.random() < waterTumbleChance) {
                            racer.state = 'tumbling';
                            racer.tumbleTimer = 0;
                            racer.tumbleType = 'slide';
                            racer.recoveryTaps = 0;
                            racer.triggerExpression('surprised', 1.2, 0.8);
                            spawnFallText(racer);
                            if (unlimitedMode && racer.isPlayer) ulTakeDamage();
                        } else {
                            racer.state = 'balancing';
                            racer.balanceTimer = 0;
                        }
                        
                        const waterTexts = ['SPLASH!', 'WET!', 'PUDDLE!', 'SLIPPERY!'];
                        const waterText = waterTexts[Math.floor(Math.random() * waterTexts.length)];
                        if (racer.isPlayer) {
                            playSound('sfx_mud_splash', { volume: 0.4 });
                            floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 30, waterText, '#4FC3F7'));
                        }
                    } else if (landedOnMud) {
                        racer.mudTimer = 3.0;
                        racer.mudIntensity = 1.0; // Fresh mud coating
                        racer.triggerExpression('shocked', 1.5, 1.0);
                        triggerCrowdReaction(racer, 'mud');
                        
                        // Unlimited mode: lose heart on mud
                        if (unlimitedMode && racer.isPlayer) {
                            ulTakeDamage();
                        }
                        
                        // Trigger obstacle splash animation
                        const obstList = unlimitedMode ? ulObstacles : obstacles;
                        obstList.forEach(ob => {
                            if (ob.type === 'mud' && ob.laneIndex === racer.laneIndex && Math.abs(ob.x - racer.x) < 60) {
                                ob.triggerSplash();
                            }
                        });
                        
                        // Determine mud interaction type - varied and funny
                        const mudRoll = Math.random();
                        let mudText = 'MUDDY!';
                        let mudTextColor = '#654321';
                        
                        if (mudRoll < 0.3) {
                            // Full fall into mud - funny splat
                            racer.state = 'tumbling';
                            racer.tumbleTimer = 0;
                            racer.tumbleType = 'mud_splat';
                            racer.recoveryTaps = 0;
                            mudText = ['SPLOOSH!', 'MUD BATH!', 'SPLAT!', 'SO DIRTY!'][Math.floor(Math.random() * 4)];
                            mudTextColor = '#4E342E';
                            // Extra big splash for full fall
                            for(let i=0; i<20; i++) {
                                const p = new Particle(racer.x + (Math.random()-0.5)*40, racer.y);
                                p.color = ['#4b3621', '#5d4037', '#3e2723', '#6d4c41'][Math.floor(Math.random()*4)];
                                p.vx = (Math.random()-0.5) * 250;
                                p.vy = -Math.random() * 200 - 50;
                                p.size = 8 + Math.random() * 18;
                                p.life = 0.6 + Math.random() * 0.4;
                                p.maxLife = p.life;
                                particles.push(p);
                            }
                            // Splash ring footprint
                            mudFootprints.push(new MudFootprint(racer.x, racer.groundY, racer.laneIndex, {
                                type: 'splash_ring',
                                size: 35 + Math.random() * 15,
                                opacity: 0.6
                            }));
                        } else if (mudRoll < 0.6) {
                            // Struggle to stay upright - wobbly balance
                            racer.state = 'balancing';
                            racer.balanceTimer = 0;
                            racer.mudWobble = true;
                            racer.triggerExpression('nervous', 1.3, 0.8);
                            mudText = ['SLIPPERY!', 'WHOA!', 'STICKY!', 'YIKES!'][Math.floor(Math.random() * 4)];
                            mudTextColor = '#5D4037';
                            // Moderate splash
                            for(let i=0; i<12; i++) {
                                const p = new Particle(racer.x + (Math.random()-0.5)*30, racer.y);
                                p.color = '#5d4037';
                                p.vx = (Math.random()-0.5) * 150;
                                p.vy = -Math.random() * 120 - 30;
                                p.size = 6 + Math.random() * 12;
                                p.life = 0.4 + Math.random() * 0.3;
                                p.maxLife = p.life;
                                particles.push(p);
                            }
                        } else {
                            // Slip animation - slides forward a bit
                            racer.state = 'balancing';
                            racer.balanceTimer = 0;
                            racer.mudSlipForward = 80 + Math.random() * 60; // Momentum carry
                            racer.triggerExpression('surprised', 1.0, 0.7);
                            mudText = ['MUDDY!', 'EWW!', 'GROSS!', 'MUD!'][Math.floor(Math.random() * 4)];
                            // Standard splash
                            for(let i=0; i<15; i++) {
                                const p = new Particle(racer.x, racer.y);
                                p.color = '#4b3621';
                                p.vx = (Math.random()-0.5) * 180;
                                p.vy = -Math.random() * 150 - 40;
                                p.size = 8 + Math.random() * 14;
                                p.life = 0.5 + Math.random() * 0.3;
                                p.maxLife = p.life;
                                particles.push(p);
                            }
                        }
                        
                        if (racer.isPlayer) {
                            playSound('sfx_mud_splash', { volume: 0.6 });
                            floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 30, mudText, mudTextColor));
                        } else if (Math.random() < 0.35) {
                            floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 30, mudText, mudTextColor));
                        }
                        
                        // Initial big splatter footprint at landing spot
                        mudFootprints.push(new MudFootprint(racer.x, racer.groundY, racer.laneIndex, {
                            type: 'splatter',
                            size: 18 + Math.random() * 10,
                            opacity: 0.55
                        }));
                    } else if (landedOnBananaPeel) {
                        // Mark obstacle as spent so it doesn't trigger again
                        if (hitBananaPeelObj) {
                            hitBananaPeelObj.spent = true;
                            hitBananaPeelObj.spentTimer = 0;
                        }
                        
                        racer.state = 'tumbling';
                        racer.tumbleTimer = 0;
                        racer.tumbleType = 'slide'; // Slip and slide forward!
                        racer.recoveryTaps = 0;
                        racer.triggerExpression('panicked', 1.5, 1.0);
                        
                        if (racer.isPlayer) {
                            playerTumbleCount++;
                            playSound('sfx_slip_slide', { volume: 0.8 });
                            if (unlimitedMode) ulTakeDamage();
                        } else if (Math.random() < 0.5) {
                            playSound('sfx_slip_slide', { volume: 0.4 });
                        }
                        
                        const bananaTexts = ['SLIPPED!', 'SLIP!', 'BANANA!', 'WHOOPS!'];
                        const txt = bananaTexts[Math.floor(Math.random() * bananaTexts.length)];
                        floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 30, txt, '#FFD54F'));
                        
                        triggerCrowdReaction(racer, 'moss'); // Reuse moss crowd reaction for slippery slips!
                        spawnDust(racer.x, racer.y, 6, '#FFEB3B');
                    } else {
                        if (landedOnRock) {
                            racer.tumbleType = 'rock_trip';
                            racer.triggerExpression('panicked', 1.3, 1.0);
                        } else if (landedOnMoss) {
                        racer.tumbleType = 'slide';
                        racer.triggerExpression('surprised', 1.1, 0.9);
                    } else {
                        racer.tumbleType = 'roll';
                    }

                    // Check tumble
                    const chargeRatio = racer.chargeTime / MAX_CHARGE_TIME;
                    let tumbleChance = TUMBLE_CHANCE_BASE + (chargeRatio * 0.3);
                    
                    // In unlimited mode, obstacles always cause tumble
                    if (unlimitedMode && (landedOnRock || landedOnMoss)) {
                        tumbleChance = 1.0;
                    } else if (landedOnRock) {
                        tumbleChance = 1.0; 
                        if (racer.isPlayer) playSound('sfx_rock_impact', { volume: 0.55 });
                    } else if (landedOnMoss) {
                        // Moss is more dangerous if landing with high power/charge
                        tumbleChance = config.difficulty === 'hard' ? 1.0 : (chargeRatio > 0.4 ? 0.9 : 0.6);
                        if (racer.isPlayer) playSound('sfx_slip_slide', { volume: 0.5 });
                    }

                    // "Crowding" effect - extra stumble chance when racers are close
                    const nearby = racers.some(other => other !== racer && Math.abs(other.x - racer.x) < 45 && Math.abs(other.laneIndex - racer.laneIndex) <= 1);
                    if (nearby) tumbleChance += 0.25; // More impact from crowding

                    if (!racer.isPlayer) {
                        // AI specific tumble logic
                        const progress = racer.x / trackLength;
                        if (progress > racer.aiPanicThreshold) {
                            tumbleChance += 0.35; // Panic makes them much more likely to fall
                        }
                        
                        // Difficulty scaling for AI tumble
                        if (config.difficulty === 'easy') tumbleChance += 0.2;
                        if (config.difficulty === 'hard') tumbleChance -= 0.05;

                        // Clumsiness/Mistake chance
                        if (Math.random() < racer.aiMistakeChance) tumbleChance += 0.4;
                        } else {
                            // Player is slightly more stable on easy
                            if (config.difficulty === 'easy') tumbleChance *= 0.7;
                        }

                        if (Math.random() < tumbleChance) {
                            racer.state = 'tumbling';
                            racer.tumbleTimer = 0;
                            racer.recoveryTaps = 0;
                            // Track player tumbles for daily challenge
                            if (racer.isPlayer) {
                                playerTumbleCount++;
                            }
                            spawnFallText(racer);
                            // Expression triggered by obstacle type above, add generic fall expression if not already set
                            if (!landedOnRock && !landedOnMoss) racer.triggerExpression('shocked', 1.2, 0.8);
                            if (landedOnRock) triggerCrowdReaction(racer, 'rock');
                            else if (landedOnMoss) triggerCrowdReaction(racer, 'moss');
                            else triggerCrowdReaction(racer, 'fall');
                            if (racer.isPlayer) { playSound('sfx_landing_tumble', { volume: 0.5 }); impactFeedback(7, 0.045, 0.12); }
                            spawnDust(racer.x, racer.y, 5);
                            // Unlimited mode: lose a heart on obstacle hit
                            if (unlimitedMode && racer.isPlayer && (landedOnRock || landedOnMoss)) {
                                ulTakeDamage();
                            }
                        } else {
                            racer.state = 'balancing';
                            racer.balanceTimer = 0;
                            // Near-fall: nervous expression when barely keeping balance
                            if (tumbleChance > 0.4) {
                                racer.triggerExpression('nervous', 1.0, 0.7);
                            }
                            if (racer.isPlayer) playSound('sfx_landing_good', { volume: 0.45 });
                        }
                    }

                    // Landing squash effect (soft)
                    racer.currentScaleX = 1.12;
                    racer.currentScaleY = 0.88;
                }
            }

            if (racer.state === 'balancing' && racer.isPlayer) {
                racer.balanceTimer += dt;
                if (racer.balanceTimer >= BALANCE_WINDOW) {
                    racer.state = 'idle';
                    // Relieved expression after successfully recovering balance
                    if (racer.expression === 'nervous' || racer.expression === 'surprised') {
                        racer.triggerExpression('relieved', 0.9, 0.7);
                    }
                }
            }

            // Update expression system
            racer.updateExpression(dt);

            // Animation breathing and dust
            racer.breathTimer += dt * 3;
            const moveDelta = racer.x - racer.lastX;
            racer.lastX = racer.x;

            // Spawn movement dust when on ground and moving
            if (racer.state !== 'airborne' && Math.abs(moveDelta) > 0.5) {
                racer.dustTimer += dt;
                if (racer.dustTimer > 0.15) {
                    racer.dustTimer = 0;
                    const p = new Particle(racer.x + (Math.random()-0.5)*20, racer.groundY);
                    p.size = 8 + Math.random() * 10;
                    p.vy = -20 - Math.random() * 30;
                    p.vx = -moveDelta * 0.5 + (Math.random()-0.5)*30;
                    p.life = 0.3 + Math.random() * 0.2;
                    p.maxLife = p.life;
                    particles.push(p);
                }
            }

            if (racer.state === 'tumbling') {
                racer.tumbleTimer += dt;
                // Smooth tumble slide with deceleration
                let slideSpeed = (racer.isPlayer ? 50 : 25) * Math.max(0, 1 - racer.tumbleTimer * 0.5);
                // Moss slip slides further and faster
                if (racer.tumbleType === 'slide') {
                    slideSpeed = (racer.isPlayer ? 120 : 60) * Math.max(0, 1 - racer.tumbleTimer * 0.6);
                } else if (racer.tumbleType === 'mud_splat') {
                    // Mud splat: quick initial slide, then stuck
                    slideSpeed = (racer.isPlayer ? 80 : 40) * Math.max(0, 1 - racer.tumbleTimer * 1.5);
                    // Leave mud drag trail while sliding
                    if (slideSpeed > 10 && Math.random() < 0.4) {
                        spawnMudTrail(racer, slideSpeed * 3);
                    }
                }
                racer.x += slideSpeed * dt;
                
                // Player recovers 30% faster than before
                let duration = racer.isPlayer ? TUMBLE_DURATION * 0.7 : TUMBLE_DURATION * (1.1 + (1 - racer.aiRecoverySpeed) * 2.0);
                // Mud splat takes slightly longer (funnier)
                if (racer.tumbleType === 'mud_splat') {
                    duration *= 1.1;
                }
                
                if (racer.tumbleTimer >= duration) {
                    racer.state = 'idle';
                    racer.tumbleTimer = 0;
                    racer.mudWobble = false;
                    // Determined expression after getting back up
                    racer.triggerExpression('determined', 1.0, 0.8);
                }
            }

            // Decelerate ground movement with smooth easing
            if (racer.state !== 'airborne' && racer.state !== 'tumbling') {
                // Smooth exponential decay - feels natural and cozy
                let friction = 8.0; // Higher = stops faster but smoothly
                if (racer.mudTimer > 0) friction = 2.5; // Extra sticky in mud
                racer.speed *= Math.exp(-friction * dt);
                
                // Kill tiny residual speeds to prevent "stuck" feeling
                if (Math.abs(racer.speed) < 2) racer.speed = 0;
                
                let moveSpeed = racer.speed;
                if (racer.mudTimer > 0) moveSpeed *= 0.5;
                racer.x += moveSpeed * dt;

                // Soft collision response for ground obstacles
                if (racer.state === 'idle' || racer.state === 'balancing' || racer.state === 'charging') {
                    const groundObstacles = unlimitedMode ? ulObstacles : obstacles;
                    groundObstacles.forEach(ob => {
                        if (!ob.spent && ob.laneIndex === racer.laneIndex) {
                            const dist = Math.abs(ob.x - racer.x);
                            if (ob.type === 'mud' && dist < 40) {
                                racer.mudTimer = Math.max(racer.mudTimer, 0.5);
                            } else if (ob.type === 'banana_peel' && dist < 35) {
                                // Slip immediately!
                                ob.spent = true;
                                ob.spentTimer = 0;
                                racer.state = 'tumbling';
                                racer.tumbleTimer = 0;
                                racer.tumbleType = 'slide';
                                racer.recoveryTaps = 0;
                                racer.triggerExpression('panicked', 1.5, 1.0);
                                if (racer.isPlayer) {
                                    playerTumbleCount++;
                                    playSound('sfx_slip_slide', { volume: 0.8 });
                                    if (unlimitedMode) ulTakeDamage();
                                } else if (Math.random() < 0.5) {
                                    playSound('sfx_slip_slide', { volume: 0.4 });
                                }
                                const bananaTexts = ['SLIPPED!', 'SLIP!', 'BANANA!', 'WHOOPS!'];
                                const txt = bananaTexts[Math.floor(Math.random() * bananaTexts.length)];
                                floatingTexts.push(new FloatingText(racer.x, racer.y - racer.height - 30, txt, '#FFD54F'));
                                triggerCrowdReaction(racer, 'moss');
                                spawnDust(racer.x, racer.y, 6, '#FFEB3B');
                            } else if (ob.type === 'rock' && dist < 35) {
                                // Soft push-back before tripping threshold
                                if (dist > 20 && Math.abs(racer.speed) < 50) {
                                    // Gentle deflection - nudge away smoothly
                                    const pushDir = racer.x > ob.x ? 1 : -1;
                                    racer.x += pushDir * 40 * dt;
                                    racer.speed *= 0.3;
                                    // Near-miss nervousness
                                    racer.triggerExpression('nervous', 0.7, 0.5);
                                } else if (Math.abs(racer.speed) >= 50) {
                                    // Only trip when moving fast enough into the rock
                                    racer.state = 'tumbling';
                                    racer.tumbleTimer = 0;
                                    racer.tumbleType = 'rock_trip';
                                    racer.triggerExpression('panicked', 1.4, 1.0);
                                    spawnFallText(racer);
                                    if (racer.isPlayer) playSound('sfx_rock_impact', { volume: 0.55 });
                                    spawnDust(racer.x, racer.y, 8, '#777777');
                                }
                            }
                        }
                    });
                }

                // Spontaneous tripping and Collisions for AI
                if (!racer.isPlayer && gameState === 'racing' && racer.state === 'idle') {
                    const progress = racer.x / trackLength;
                    const isPanicking = progress > racer.aiPanicThreshold;
                    const currentMistakeChance = isPanicking ? racer.aiMistakeChance * 5 : racer.aiMistakeChance;

                    // 1. Spontaneous Trip
                    if (Math.random() < currentMistakeChance * dt * 0.5) {
                        racer.state = 'tumbling';
                        racer.tumbleTimer = 0;
                        racer.triggerExpression('shocked', 1.2, 0.9);
                        spawnFallText(racer);
                        triggerCrowdReaction(racer, 'fall');
                        spawnDust(racer.x, racer.y, 4);
                        lib.log(`AI ${racer.laneIndex} tripped!`);
                    }

                    // 2. Collision with others
                    const collider = racers.find(other => 
                        other !== racer && 
                        Math.abs(other.x - racer.x) < 35 && 
                        Math.abs(other.laneIndex - racer.laneIndex) <= 0.5 &&
                        other.state !== 'tumbling'
                    );

                    if (collider) {
                        // Bump! Both stumble or one falls
                        if (Math.random() < 0.3) {
                            racer.state = 'tumbling';
                            racer.tumbleTimer = 0;
                            racer.triggerExpression('panicked', 1.3, 1.0);
                            spawnFallText(racer);
                            if (Math.random() < 0.5) {
                                collider.state = 'tumbling';
                                collider.tumbleTimer = 0;
                                collider.triggerExpression('shocked', 1.2, 0.9);
                                spawnFallText(collider);
                            } else {
                                collider.triggerExpression('surprised', 0.8, 0.6);
                            }
                            spawnDust(racer.x, racer.y, 6);
                            lib.log("AI Collision!");
                        }
                    }
                }
            }

            // Check finish (not in unlimited mode or challenge mode)
            if (!unlimitedMode && !challengeMode && racer.x >= trackLength && !racer.finished) {
                racer.finished = true;
                racer.state = 'finished';
                finishOrder.push(racer);
                racer.placement = finishOrder.length;
                if (racer.isPlayer) {
                    finishRace();
                }
            }

            // Update AI timing logic
            if (!racer.isPlayer && gameState === 'racing') {
                if (racer.isFrozen) return; // Skip AI entirely when frozen
                if (racer.state === 'idle' || racer.state === 'balancing') {
                    racer.aiTimer += dt;
                    
                    // Added delay before AI jumps again
                    const baseDelay = config.difficulty === 'easy' ? 0.6 : (config.difficulty === 'medium' ? 0.3 : 0.1);
                    const waitTime = racer.state === 'balancing' ? 
                        (1 - racer.aiBalanceSkill) * 1.2 : 
                        baseDelay + Math.random() * 0.4;
                        
                    if (racer.aiTimer > waitTime) {
                        racer.state = 'charging';
                        racer.chargeTime = 0;
                        racer.aiTimer = 0;
                    }
                }
                updateAI(racer, dt);
            }
        }

        // Drawing
        function drawImage(id, x, y, w, h, flipX = false) {
            const img = imageCache[id];
            if (!img) {
                // Draw a simple loading placeholder instead of a flat grey box
                ctx.save();
                ctx.fillStyle = 'rgba(200, 200, 200, 0.5)';
                ctx.beginPath();
                ctx.roundRect(x - w*0.4, y - h, w*0.8, h, 20);
                ctx.fill();
                
                // Loading dots
                const time = performance.now() * 0.005;
                ctx.fillStyle = 'white';
                for(let i=0; i<3; i++) {
                    ctx.beginPath();
                    ctx.arc(x - 15 + i*15, y - h/2 + Math.sin(time + i)*5, 4, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
                return;
            }
            if (flipX) {
                ctx.save();
                ctx.translate(x, y - h);
                ctx.scale(-1, 1);
                ctx.drawImage(img, -w/2, 0, w, h);
                ctx.restore();
            } else {
                ctx.drawImage(img, x - w/2, y - h, w, h);
            }
        }

        function drawHalloweenFestivalDecor(trackTop, trackH, w, h) {
            const img = imageCache['decoration_halloween_village_festival'];
            const spacing = 360;
            const start = cameraX - w * 0.3 - spacing;
            const end = cameraX + w * 0.7 + spacing;
            for (let x = Math.floor(start / spacing) * spacing; x < end; x += spacing) {
                const sx = x - cameraX + w * 0.3;
                if (sx < -120 || sx > w + 120) continue;
                const bob = Math.sin(performance.now() * 0.002 + x * 0.01) * 2;
                if (img) ctx.drawImage(img, sx - 55, trackTop - 108 + bob, 110, 88);
                else {
                    ctx.fillStyle = '#FF9800'; ctx.beginPath(); ctx.arc(sx, trackTop - 45 + bob, 20, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#6A1B9A'; ctx.font = 'bold 22px Fredoka'; ctx.textAlign = 'center'; ctx.fillText('👻', sx + 34, trackTop - 56 + bob);
                }
            }
        }

        function drawBackground() {
            if (challengeMode === 'parkour' && (gameState === 'racing' || gameState === 'challenge_over' || gameState === 'countdown')) {
                drawParkourBackground();
                return;
            }
            if (challengeMode === 'jumpacar' && (gameState === 'racing' || gameState === 'challenge_over' || gameState === 'countdown')) {
                drawJumpACarBackground();
                return;
            }
            if (crowdMembers.length === 0) initCrowd();
            const w = canvas.width;
            const h = canvas.height;
            const trackTop = h * TRACK_Y_START;
            const trackH = h - trackTop - BOTTOM_MARGIN;
            const laneH = trackH / 5;
            const time = performance.now() * 0.001;
            const halloweenTheme = isHalloweenThemeActive();

            // 1. Sky Gradient - Enhanced with warm tones
            ctx.fillStyle = halloweenTheme ? '#24113F' : (skyGradient || '#4FC3F7');
            ctx.fillRect(0, 0, w, trackTop);
            if (halloweenTheme) {
                ctx.fillStyle = 'rgba(255,152,0,0.16)';
                ctx.beginPath(); ctx.arc(w * 0.78, trackTop * 0.24, 52, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,224,130,0.92)';
                ctx.beginPath(); ctx.arc(w * 0.78, trackTop * 0.24, 30, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(74,20,140,0.22)';
                ctx.beginPath(); ctx.arc(w * 0.78 + 10, trackTop * 0.24 - 4, 28, 0, Math.PI * 2); ctx.fill();
            }
            
            // Soft warm glow at horizon
            const horizonGlow = ctx.createLinearGradient(0, trackTop - 80, 0, trackTop);
            horizonGlow.addColorStop(0, 'rgba(255, 248, 220, 0)');
            horizonGlow.addColorStop(1, 'rgba(255, 248, 220, 0.3)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, trackTop - 80, w, 80);

            // 2. Distant Clouds (Parallax) with gentle drift - evenly spaced
            const cloudImg = imageCache['bg_cloud'];
            if (cloudImg) {
                const totalCloudWidth = w + 300;
                bgClouds.forEach(cloud => {
                    let cloudX = cloud.x - cameraX * cloud.speed + time * 6;
                    // Wrap smoothly across a wide range without bunching
                    cloudX = ((cloudX % totalCloudWidth) + totalCloudWidth) % totalCloudWidth - 100;
                    const cw = 160 * cloud.scale;
                    const ch = (cloudImg.height / cloudImg.width) * cw;
                    ctx.globalAlpha = cloud.opacity;
                    ctx.drawImage(cloudImg, cloudX - cw/2, cloud.y, cw, ch);
                    ctx.globalAlpha = 1.0;
                });
            }

            // 3. Distant Hills - Multiple soft layers for depth
            // Far hills (lighter, slower parallax)
            const hillOffset2 = -(cameraX * 0.05) % w;
            ctx.fillStyle = '#66BB6A';
            ctx.beginPath();
            ctx.moveTo(hillOffset2 - w, trackTop);
            ctx.quadraticCurveTo(hillOffset2 - w * 0.5, trackTop - 50, hillOffset2, trackTop - 10);
            ctx.quadraticCurveTo(hillOffset2 + w * 0.3, trackTop - 65, hillOffset2 + w * 0.7, trackTop - 20);
            ctx.quadraticCurveTo(hillOffset2 + w, trackTop - 55, hillOffset2 + w * 1.5, trackTop);
            ctx.lineTo(hillOffset2 + w * 2, trackTop);
            ctx.fill();
            
            // Near hills (darker, faster parallax)
            const hillOffset = -(cameraX * 0.1) % w;
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.moveTo(hillOffset - w, trackTop);
            ctx.quadraticCurveTo(hillOffset - w/2, trackTop - 80, hillOffset, trackTop);
            ctx.quadraticCurveTo(hillOffset + w/2, trackTop - 60, hillOffset + w, trackTop);
            ctx.quadraticCurveTo(hillOffset + w * 1.5, trackTop - 70, hillOffset + w * 2, trackTop);
            ctx.fill();
            
            // Soft shadow at hill base
            const hillShadow = ctx.createLinearGradient(0, trackTop - 15, 0, trackTop);
            hillShadow.addColorStop(0, 'rgba(0, 80, 0, 0)');
            hillShadow.addColorStop(1, 'rgba(0, 80, 0, 0.15)');
            ctx.fillStyle = hillShadow;
            ctx.fillRect(0, trackTop - 15, w, 15);

            // 4. Distant Palm Trees (Parallax) - stable positioning, no wrapping overlap
            const treeImg = imageCache['bg_palm_tree'];
            if (treeImg) {
                bgPalmTrees.forEach(tree => {
                    const depth = tree.depth || 0.2;
                    const drawX = tree.x - cameraX * depth;
                    // Only draw if on screen (with generous margin)
                    if (drawX < -200 || drawX > w + 200) return;
                    const th = 180 * tree.scale;
                    const tw = (treeImg.width / treeImg.height) * th;
                    // Soft tree shadow on ground
                    ctx.fillStyle = 'rgba(0, 60, 0, 0.1)';
                    ctx.beginPath();
                    ctx.ellipse(drawX, trackTop - 5, tw * 0.3, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.drawImage(treeImg, drawX - tw/2, trackTop - th + 10, tw, th);
                });
            }

            // 5. Top Sideline Grass - Enhanced with texture variation
            // Base grass
            ctx.fillStyle = halloweenTheme ? '#4A235A' : '#2E7D32';
            ctx.fillRect(0, trackTop - 30, w, 30);
            // Lighter grass highlight strip
            const grassHighlight = ctx.createLinearGradient(0, trackTop - 30, 0, trackTop);
            grassHighlight.addColorStop(0, 'rgba(76, 175, 80, 0.4)');
            grassHighlight.addColorStop(0.5, 'rgba(56, 142, 60, 0.2)');
            grassHighlight.addColorStop(1, 'rgba(27, 94, 32, 0.3)');
            ctx.fillStyle = grassHighlight;
            ctx.fillRect(0, trackTop - 30, w, 30);
            
            // Draw top sideline decorations (grass tufts, flowers, rocks) BELOW the fence
            forEachVisible(sidelineTop, cameraX, w, (dec) => {
                const screenX = dec.x - cameraX + w * 0.3;
                if (screenX < -50 || screenX > w + 50) return;
                const baseY = trackTop - 5;
                const sway = Math.sin(time * dec.swaySpeed + dec.swayOffset) * 2;
                
                if (dec.type === 'grass') {
                    // Small grass tuft
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.fillStyle = '#388E3C';
                    ctx.beginPath();
                    ctx.moveTo(-4, 0);
                    ctx.quadraticCurveTo(-6 + sway, -14, -2 + sway, -18);
                    ctx.quadraticCurveTo(0, -12, 0, 0);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(2, 0);
                    ctx.quadraticCurveTo(4 + sway, -12, 5 + sway, -16);
                    ctx.quadraticCurveTo(3, -10, 3, 0);
                    ctx.fill();
                    ctx.fillStyle = '#2E7D32';
                    ctx.beginPath();
                    ctx.moveTo(-1, 0);
                    ctx.quadraticCurveTo(sway * 0.5, -16, 1 + sway * 0.5, -20);
                    ctx.quadraticCurveTo(0, -14, 1, 0);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'flower') {
                    // Tiny flower
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    // Stem
                    ctx.strokeStyle = '#4CAF50';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(sway, -8, sway * 0.5, -14);
                    ctx.stroke();
                    // Petals
                    ctx.fillStyle = dec.color;
                    const fx = sway * 0.5;
                    const fy = -14;
                    for (let p = 0; p < 5; p++) {
                        const angle = (p / 5) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(fx + Math.cos(angle) * 3, fy + Math.sin(angle) * 3, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // Center
                    ctx.fillStyle = '#FFF176';
                    ctx.beginPath();
                    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'tinyrock') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.fillStyle = '#8D6E63';
                    ctx.beginPath();
                    ctx.ellipse(0, -3, 6, 4, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(-1, -5, 3, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'bush') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    // Bush body
                    ctx.fillStyle = '#2E7D32';
                    ctx.beginPath();
                    ctx.ellipse(0, -8, 14, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#388E3C';
                    ctx.beginPath();
                    ctx.ellipse(-4, -12, 8, 7, -0.2, 0, 0 + Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(5, -10, 7, 6, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // Subtle highlight
                    ctx.fillStyle = 'rgba(100,200,100,0.25)';
                    ctx.beginPath();
                    ctx.ellipse(-2, -14, 5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Tiny berry dots
                    if (Math.sin(dec.swayOffset * 3) > 0.3) {
                        ctx.fillStyle = dec.color;
                        ctx.beginPath(); ctx.arc(3, -9, 2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(-5, -7, 1.5, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                }
            });
            
            // Draw top crowd (NPCs clearly above decorations)
            forEachVisible(crowdTop, cameraX, w, (c) => c.draw(cameraX, w, h, trackTop));

            // 6. Track Surface - Enhanced with subtle variation
            ctx.fillStyle = trackGradient || '#D2691E';
            ctx.fillRect(0, trackTop, w, trackH);
            
            const trackTex = imageCache['track_surface'];
            if (trackTex) {
                ctx.globalAlpha = 0.2;
                const texX = -(cameraX * 1.0) % w;
                ctx.drawImage(trackTex, texX, trackTop, w, trackH);
                ctx.drawImage(trackTex, texX + w, trackTop, w, trackH);
                ctx.globalAlpha = 1.0;
            }
            
            // Soft top edge shadow on track (depth effect)
            const trackTopShadow = ctx.createLinearGradient(0, trackTop, 0, trackTop + 20);
            trackTopShadow.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
            trackTopShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = trackTopShadow;
            ctx.fillRect(0, trackTop, w, 20);

            // 7. Lanes Shading & Lines
            if (unlimitedMode && (gameState === 'unlimited_racing' || gameState === 'unlimited_gameover' || gameState === 'countdown')) {
                // SINGLE LANE MODE: Draw a wide highlighted center race path
                const centerLaneY = trackTop + 2 * laneH; // Lane 2 top edge
                const singleLaneH = laneH; // One lane height
                const pathPad = laneH * 0.3; // Extra visual padding on each side
                const pathTop = centerLaneY - pathPad;
                const pathH = singleLaneH + pathPad * 2;
                
                // Highlighted race path - slightly brighter dirt
                const pathGrad = ctx.createLinearGradient(0, pathTop, 0, pathTop + pathH);
                pathGrad.addColorStop(0, 'rgba(222, 184, 135, 0.15)');
                pathGrad.addColorStop(0.3, 'rgba(255, 235, 200, 0.12)');
                pathGrad.addColorStop(0.5, 'rgba(255, 248, 220, 0.1)');
                pathGrad.addColorStop(0.7, 'rgba(255, 235, 200, 0.12)');
                pathGrad.addColorStop(1, 'rgba(222, 184, 135, 0.15)');
                ctx.fillStyle = pathGrad;
                ctx.fillRect(0, pathTop, w, pathH);
                
                // Rope barriers along the race path edges
                const ropeOffset = cameraX * 1.0;
                
                // Top rope barrier
                ctx.save();
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, pathTop + 2);
                // Wavy rope effect
                for (let rx = 0; rx < w; rx += 20) {
                    const ry = pathTop + 2 + Math.sin((rx + ropeOffset) * 0.02) * 2;
                    ctx.lineTo(rx, ry);
                }
                ctx.stroke();
                // Rope highlight
                ctx.strokeStyle = 'rgba(188, 143, 95, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, pathTop);
                for (let rx = 0; rx < w; rx += 20) {
                    const ry = pathTop + Math.sin((rx + ropeOffset) * 0.02) * 2;
                    ctx.lineTo(rx, ry);
                }
                ctx.stroke();
                
                // Bottom rope barrier
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, pathTop + pathH - 2);
                for (let rx = 0; rx < w; rx += 20) {
                    const ry = pathTop + pathH - 2 + Math.sin((rx + ropeOffset) * 0.02 + 1) * 2;
                    ctx.lineTo(rx, ry);
                }
                ctx.stroke();
                ctx.strokeStyle = 'rgba(188, 143, 95, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, pathTop + pathH - 4);
                for (let rx = 0; rx < w; rx += 20) {
                    const ry = pathTop + pathH - 4 + Math.sin((rx + ropeOffset) * 0.02 + 1) * 2;
                    ctx.lineTo(rx, ry);
                }
                ctx.stroke();
                ctx.restore();
                
                // Rope posts (wooden stakes holding the rope)
                const postSpacing = 250;
                const postStartX = Math.floor((cameraX - w * 0.3) / postSpacing) * postSpacing;
                for (let px = postStartX; px < cameraX + w; px += postSpacing) {
                    const screenPX = px - cameraX + w * 0.3;
                    if (screenPX < -30 || screenPX > w + 30) continue;
                    
                    // Top post
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(screenPX - 4, pathTop - 20, 8, 25);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(screenPX - 2, pathTop - 20, 2, 8);
                    
                    // Bottom post
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(screenPX - 4, pathTop + pathH - 5, 8, 25);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(screenPX - 2, pathTop + pathH - 5, 2, 8);
                    
                    // Small flag on every other top post
                    if (Math.floor(px / postSpacing) % 2 === 0) {
                        const flagTime = time + px * 0.01;
                        const flagSway = Math.sin(flagTime * 2) * 3;
                        ctx.fillStyle = Math.floor(px / postSpacing) % 4 === 0 ? '#DC143C' : '#FFFFFF';
                        ctx.beginPath();
                        ctx.moveTo(screenPX + 4, pathTop - 20);
                        ctx.lineTo(screenPX + 18 + flagSway, pathTop - 15);
                        ctx.lineTo(screenPX + 4, pathTop - 10);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                
                // Soft edge shadows for depth
                const topEdgeShadow = ctx.createLinearGradient(0, pathTop, 0, pathTop + 15);
                topEdgeShadow.addColorStop(0, 'rgba(0, 0, 0, 0.12)');
                topEdgeShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = topEdgeShadow;
                ctx.fillRect(0, pathTop, w, 15);
                
                const botEdgeShadow = ctx.createLinearGradient(0, pathTop + pathH - 15, 0, pathTop + pathH);
                botEdgeShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
                botEdgeShadow.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
                ctx.fillStyle = botEdgeShadow;
                ctx.fillRect(0, pathTop + pathH - 15, w, 15);
                
                // Faint lane center guide line (subtle)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 2;
                ctx.setLineDash([20, 30]);
                const centerY = trackTop + 2.5 * laneH;
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(w, centerY);
                ctx.stroke();
                ctx.setLineDash([]);
            } else {
                // Normal mode: draw 5 lane dividers
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1.5;
                for (let i = 0; i <= 5; i++) {
                    const ly = trackTop + i * laneH;
                    ctx.beginPath();
                    ctx.setLineDash([12, 8]);
                    ctx.moveTo(0, ly);
                    ctx.lineTo(w, ly);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            if (halloweenTheme) drawHalloweenFestivalDecor(trackTop, trackH, w, h);

            // 8. Bottom Sideline Grass - Enhanced
            const botY = trackTop + trackH;
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, botY, w, h - botY);
            // Grass highlight
            const botGrassHighlight = ctx.createLinearGradient(0, botY, 0, botY + 25);
            botGrassHighlight.addColorStop(0, 'rgba(76, 175, 80, 0.3)');
            botGrassHighlight.addColorStop(1, 'rgba(56, 142, 60, 0)');
            ctx.fillStyle = botGrassHighlight;
            ctx.fillRect(0, botY, w, 25);
            
            // Draw bottom sideline decorations
            forEachVisible(sidelineBottom, cameraX, w, (dec) => {
                const screenX = dec.x - cameraX + w * 0.3;
                if (screenX < -50 || screenX > w + 50) return;
                const baseY = botY + 15;
                const sway = Math.sin(time * dec.swaySpeed + dec.swayOffset) * 2;
                
                if (dec.type === 'grass') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.fillStyle = '#388E3C';
                    ctx.beginPath();
                    ctx.moveTo(-4, 0);
                    ctx.quadraticCurveTo(-6 + sway, -12, -2 + sway, -16);
                    ctx.quadraticCurveTo(0, -10, 0, 0);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(2, 0);
                    ctx.quadraticCurveTo(4 + sway, -10, 5 + sway, -14);
                    ctx.quadraticCurveTo(3, -8, 3, 0);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'flower') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.strokeStyle = '#4CAF50';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(sway, -7, sway * 0.5, -12);
                    ctx.stroke();
                    ctx.fillStyle = dec.color;
                    const fx = sway * 0.5;
                    const fy = -12;
                    for (let p = 0; p < 5; p++) {
                        const angle = (p / 5) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(fx + Math.cos(angle) * 3, fy + Math.sin(angle) * 3, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#FFF176';
                    ctx.beginPath();
                    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'tinyrock') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.ellipse(0, -3, 5, 3.5, -0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(-1, -4, 2.5, 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (dec.type === 'bush') {
                    ctx.save();
                    ctx.translate(screenX, baseY);
                    ctx.scale(dec.scale, dec.scale);
                    ctx.fillStyle = '#1B5E20';
                    ctx.beginPath();
                    ctx.ellipse(0, -7, 12, 9, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2E7D32';
                    ctx.beginPath();
                    ctx.ellipse(-3, -11, 7, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(4, -9, 6, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(120,220,120,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(-1, -13, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
            
            // Bottom spectators drawn after fence (see step 10 below)

            // 10. Fences and Decorations - with soft shadows
            const drawSidelineDecor = (yBase, isBottom = false) => {
                const spacing = 400; 
                const startWorldX = cameraX - w * 0.3 - spacing;
                const endWorldX = cameraX + w * 0.7 + spacing;
                
                const flagImg = imageCache['decoration_indonesian_flag'];
                const buntImg = imageCache['decoration_bunting'];

                // Fence shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(0, yBase - 2, w, 12);

                // 1. Fence Posts & Post-top decorations
                ctx.fillStyle = isBottom ? '#4D2205' : '#5D2906'; 
                for (let x = Math.ceil(startWorldX / spacing) * spacing; x < endWorldX; x += spacing) {
                    const screenX = Math.floor(x - cameraX + w * 0.3);
                    
                    // Post shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.beginPath();
                    ctx.ellipse(screenX, yBase + 8, 12, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Post
                    ctx.fillStyle = isBottom ? '#4D2205' : '#5D2906';
                    ctx.fillRect(screenX - 8, yBase - 50, 16, 60);
                    // Post cap highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(screenX - 6, yBase - 50, 4, 8);
                    
                    // Flag
                    if (flagImg) ctx.drawImage(flagImg, screenX - 20, yBase - 130, 40, 80);
                    
                    // Bunting (drawn from this post to the next)
                    if (buntImg) {
                        ctx.drawImage(buntImg, screenX, yBase - 65, spacing, 50);
                    }
                }
                
                // 2. Continuous Fence Rails with subtle highlight
                ctx.fillStyle = isBottom ? '#311603' : '#3D1A04';
                ctx.fillRect(0, yBase - 45, w, 10);
                ctx.fillRect(0, yBase - 20, w, 10);
                // Rail highlight
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fillRect(0, yBase - 45, w, 3);
                ctx.fillRect(0, yBase - 20, w, 3);
            };

            // Top fence drawn after top crowd for top section
            drawSidelineDecor(trackTop);
            if (halloweenTheme) drawHalloweenFestivalDecor(trackTop, trackH, w, h);
            // Bottom fence drawn first, then spectators stand behind it
            drawSidelineDecor(h - 40, true);
            // 9. Bottom Spectators drawn AFTER fence so they appear behind it
            forEachVisible(crowdBottom, cameraX, w, (c) => c.draw(cameraX, w, h, trackTop));

            // Mud trails and footprints
            if (mudFootprints.length > 0) {
                ctx.save();
                mudFootprints.forEach(fp => {
                    const screenX = fp.x - cameraX + w * 0.3;
                    if (screenX < -80 || screenX > w + 80) return;
                    const alpha = fp.alpha;
                    if (alpha <= 0) return;
                    
                    ctx.globalAlpha = alpha;
                    
                    if (fp.type === 'print') {
                        // Simple oval footprint
                        ctx.fillStyle = '#5d4037';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.size, fp.size * 0.45, fp.angle, 0, Math.PI * 2);
                        ctx.fill();
                        // Subtle darker center
                        ctx.fillStyle = '#3e2723';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.size * 0.5, fp.size * 0.25, fp.angle, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (fp.type === 'splatter') {
                        // Irregular splat with droplets
                        ctx.fillStyle = '#4b3621';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.size * 0.8, fp.size * 0.5, fp.angle, 0, Math.PI * 2);
                        ctx.fill();
                        // Droplets
                        ctx.fillStyle = '#5d4037';
                        fp.splatDrops.forEach(drop => {
                            ctx.beginPath();
                            ctx.arc(screenX + drop.dx, fp.y + drop.dy, drop.r, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    } else if (fp.type === 'drag') {
                        // Elongated drag mark
                        ctx.fillStyle = '#4b3621';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.dragLength, fp.size * 0.3, fp.angle, 0, Math.PI * 2);
                        ctx.fill();
                        // Lighter inner streak
                        ctx.fillStyle = 'rgba(109, 76, 65, 0.5)';
                        ctx.beginPath();
                        ctx.ellipse(screenX, fp.y, fp.dragLength * 0.6, fp.size * 0.15, fp.angle, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (fp.type === 'splash_ring') {
                        // Ring-shaped splash mark from big falls
                        ctx.strokeStyle = '#4b3621';
