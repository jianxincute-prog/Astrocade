<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Block Card Duel</title>
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #141a3a; touch-action: none; user-select: none; -webkit-user-select: none;
        font-family: 'Trebuchet MS', Verdana, Arial, sans-serif; font-weight: 900; color: #fff;
    }
    #game-world { position: relative; width: 100%; height: 100%; overflow: hidden; }
    canvas#game-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    #ui { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui button, #hand, .overlay { pointer-events: auto; }
    .plate {
        position: absolute; background: rgba(10, 14, 32, .86); border: 4px solid #05070f;
        box-shadow: 0 5px 0 #05070f; border-radius: 10px; padding: 8px 12px; box-sizing: border-box;
    }
    .plate .nm { font-size: 22px; letter-spacing: 1px; }
    .bar { position: relative; height: 30px; margin-top: 4px; background: #05070f; border: 3px solid #05070f; border-radius: 6px; overflow: hidden; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .35s; }
    .bar b { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 20px; line-height: 30px; text-shadow: 0 2px 0 #000; }
    #eplate { left: 16px; top: 14px; width: 330px; }
    #eplate i { background: linear-gradient(#ff6b6b, #c0303f); }
    #pplate { left: 16px; top: 906px; width: 330px; }
    #pplate i { background: linear-gradient(#5cd6ff, #2d7fff); }
    #roundTag { position: absolute; right: 16px; top: 14px; width: 320px; height: 100px; box-sizing: border-box; text-align: right; }
    #roundTag .rd { font-size: 30px; text-shadow: 0 3px 0 #000; }
    .pips { display: flex; gap: 5px; justify-content: flex-end; margin-top: 6px; }
    .pips span { width: 22px; height: 26px; background: #1b2140; border: 3px solid #05070f; border-radius: 4px; }
    .pips span.on { background: linear-gradient(#ffe36b, #ffa21f); }
    #ehand { display: flex; gap: 4px; justify-content: flex-end; margin-top: 6px; }
    #ehand span { width: 22px; height: 30px; background: linear-gradient(#7b4bd6, #4a2a99); border: 3px solid #05070f; border-radius: 4px; }
    #pe { position: absolute; right: 16px; top: 916px; width: 340px; }
    #fightBtn {
        position: absolute; right: 16px; top: 808px; width: 220px; height: 92px;
        font: inherit; font-size: 36px; letter-spacing: 2px; color: #fff; cursor: pointer;
        background: linear-gradient(#ff7a3c, #d8341c); border: 5px solid #05070f; border-radius: 14px; box-shadow: 0 7px 0 #05070f;
        text-shadow: 0 3px 0 #000;
    }
    #fightBtn:active { transform: translateY(4px); box-shadow: 0 3px 0 #05070f; }
    #fightBtn.off { filter: grayscale(1) brightness(.55); }
    #hint {
        position: absolute; left: 16px; right: 16px; top: 984px; height: 54px; box-sizing: border-box; text-align: center;
        font-size: 21px; line-height: 27px; color: #ffe9a8; text-shadow: 0 2px 0 #000;
    }
    #hand { position: absolute; left: 0; right: 0; bottom: 14px; padding-top: 44px; display: flex; justify-content: center; gap: 8px; }
    .card {
        position: relative; flex: none; width: 128px; height: 196px; box-sizing: border-box; text-align: center;
        border: 4px solid #05070f; border-radius: 12px; background: linear-gradient(#262e57, #151a36);
        box-shadow: 0 6px 0 #05070f; transition: transform .12s; cursor: pointer;
    }
    .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 34px; background: var(--c); border-radius: 7px 7px 0 0; opacity: .95; }
    .card .cost {
        position: absolute; left: -12px; top: -12px; width: 46px; height: 46px; box-sizing: border-box; z-index: 2;
        background: linear-gradient(#4f8cff, #2250d8); border: 4px solid #05070f; border-radius: 9px; font-size: 27px; line-height: 38px; text-shadow: 0 2px 0 #000;
    }
    .card .art { position: relative; margin-top: 36px; height: 84px; }
    .card .art svg { width: 82px; height: 82px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); }
    .card .art img { width: 108px; height: 92px; margin-top: -4px; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); pointer-events: none; }
    .card .nm { position: relative; font-size: 15px; line-height: 17px; padding: 0 4px; text-shadow: 0 2px 0 #000; }
    .card .st { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 7px; }
    .card .st span, .lbl span { display: inline-block; min-width: 42px; height: 32px; line-height: 32px; font-size: 22px; border: 3px solid #05070f; text-shadow: 0 2px 0 #000; }
    .a { background: #ff9b2e; } .h { background: #e8454e; }
    .card .tp { position: relative; font-size: 14px; letter-spacing: 1px; margin-top: 10px; color: var(--c); text-shadow: 0 2px 0 #000; }
    .card .lvb { position: absolute; right: -10px; top: -10px; min-width: 46px; height: 30px; padding: 0 6px; box-sizing: border-box; z-index: 2; background: linear-gradient(#ffd75a, #e8a317); color: #3a2300; border: 4px solid #05070f; border-radius: 8px; font-size: 18px; line-height: 22px; text-shadow: none; }
    .card.maxlv { border-color: #ffcf3a; box-shadow: 0 0 14px rgba(255,207,58,.7), 0 6px 0 #05070f; }
    .card.sel { transform: translateY(-34px) scale(1.08); box-shadow: 0 0 0 4px #fff, 0 6px 0 4px #05070f; z-index: 5; }
    .card.off { filter: grayscale(.75) brightness(.6); }
    #banner {
        position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 76px; letter-spacing: 3px;
        text-shadow: 0 6px 0 #000, 0 0 24px rgba(255, 200, 80, .8); opacity: 0;
    }
    #banner.show { animation: banner 1.1s ease-out; }
    @keyframes banner { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
    #fxlayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
    .fxnum { position: absolute; transform: translate(-50%, -50%); font-size: 46px; text-shadow: 0 4px 0 #000; animation: fxup 1s ease-out forwards; white-space: nowrap; }
    .fxnum.dmg { color: #ff5a4a; } .fxnum.heal { color: #6dff8a; } .fxnum.info { color: #ffe36b; font-size: 38px; } .fxnum.cold { color: #7ed8ff; }
    @keyframes fxup { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -90px; } }
    #reveal { position: absolute; left: 50%; top: 360px; transform: translate(-50%, 0) scale(1.5); opacity: 0; transition: opacity .25s; }
    #reveal.show { opacity: 1; }
    #reveal .card { cursor: default; }
    .overlay {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(8, 10, 24, .82); text-align: center; z-index: 20;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 84px; line-height: 88px; margin: 0 0 14px; text-shadow: 0 8px 0 #000, 0 0 30px rgba(120, 170, 255, .8); }
    .overlay h1 em { color: #ffcf3a; font-style: normal; }
    .overlay p { font-size: 26px; line-height: 34px; margin: 6px 40px; color: #cdd6ff; text-shadow: 0 2px 0 #000; }
    .bigbtn {
        margin-top: 34px; font: inherit; font-size: 52px; letter-spacing: 3px; color: #fff; cursor: pointer; padding: 18px 70px;
        background: linear-gradient(#ffcf3a, #f08a12); border: 6px solid #05070f; border-radius: 18px; box-shadow: 0 9px 0 #05070f; text-shadow: 0 4px 0 #6a3a00;
    }
    .bigbtn:active { transform: translateY(5px); box-shadow: 0 4px 0 #05070f; }
    .stats { margin-top: 24px; font-size: 26px; color: #ffe9a8; }
    .hidden { display: none !important; }
    #hurt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; z-index: 12; background: radial-gradient(ellipse at 50% 55%, rgba(255,40,40,0) 52%, rgba(255,30,30,.55) 100%); }
    #hurt.on { animation: hurt .5s ease-out; }
    @keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
    #battleHud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #exitBtn { position: absolute; left: 16px; top: 120px; width: 120px; height: 56px; font: inherit; font-size: 22px; color: #fff; cursor: pointer; background: linear-gradient(#5b6b9c, #34406e); border: 4px solid #05070f; border-radius: 10px; box-shadow: 0 5px 0 #05070f; }
    .btn { font: inherit; font-size: 28px; letter-spacing: 1px; color: #fff; cursor: pointer; padding: 10px 26px; min-height: 64px; background: linear-gradient(#ffb23a, #e8791a); border: 5px solid #05070f; border-radius: 12px; box-shadow: 0 6px 0 #05070f; text-shadow: 0 3px 0 rgba(0,0,0,.6); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #05070f; }
    .btn.green { background: linear-gradient(#5ee07a, #1fa04a); } .btn.blue { background: linear-gradient(#5aa9ff, #2a5fd8); } .btn.grey { background: linear-gradient(#7b86ad, #4a5378); } .btn.red { background: linear-gradient(#ff6b6b, #c0303f); }
    .btn.off { filter: grayscale(1) brightness(.6); }

    /* ---- MAIN MENU (five tabs) ---- */
    #menuRoot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 15; }
    #menuRoot.solid { background: radial-gradient(circle at 50% 0%, #2d4aa8 0%, #18265a 55%, #0c1236 100%); }
    #menuRoot.solid::before { content: ""; position: absolute; inset: 0; opacity: .12; background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%); background-size: 80px 80px; background-position: 0 0, 40px 40px; pointer-events: none; }
    #mTop { position: absolute; left: 0; right: 0; top: 0; height: 112px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; background: linear-gradient(rgba(10,14,40,.92), rgba(10,14,40,0)); }
    .pbadge { display: flex; align-items: center; gap: 12px; }
    .pface { position: relative; width: 70px; height: 70px; background: #f0c39a; border: 5px solid #05070f; box-sizing: border-box; box-shadow: 0 4px 0 #05070f; }
    .pface::before { content: ""; position: absolute; left: -5px; right: -5px; top: -5px; height: 24px; background: #3a2314; border: 5px solid #05070f; box-sizing: border-box; }
    .pface::after { content: ""; position: absolute; left: 14px; top: 30px; width: 10px; height: 12px; background: #10131f; box-shadow: 24px 0 0 #10131f; }
    .pname { font-size: 26px; line-height: 28px; text-shadow: 0 3px 0 #000; } .pname small { font-size: 20px; color: #ffcf3a; }
    .chips { display: flex; gap: 10px; }
    .chip { display: flex; align-items: center; gap: 8px; min-width: 124px; height: 52px; padding: 0 12px; box-sizing: border-box; background: rgba(5,7,15,.82); border: 4px solid #05070f; border-radius: 26px; font-size: 26px; text-shadow: 0 2px 0 #000; }
    .chip svg { width: 32px; height: 32px; flex: none; }
    #pages { position: absolute; left: 0; right: 0; top: 112px; bottom: 150px; }
    .page { position: absolute; inset: 0; display: none; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; padding: 4px 18px 24px; box-sizing: border-box; }
    .page.on { display: block; animation: pgin .22s ease-out; }
    @keyframes pgin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .sect { font-size: 30px; margin: 16px 0 10px; text-shadow: 0 3px 0 #000; }
    .sect small { font-size: 20px; color: #9fb0e8; margin-left: 8px; }
    .panel { background: rgba(10,14,40,.82); border: 4px solid #05070f; border-radius: 14px; box-shadow: 0 5px 0 #05070f; padding: 12px 16px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 14px; }
    #tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; display: flex; background: linear-gradient(#1c2558, #0b0f2c); border-top: 6px solid #05070f; z-index: 3; }
    .tab { position: relative; flex: 1; border: 0; background: none; color: #8fa0d8; font: inherit; font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 14px; gap: 4px; cursor: pointer; text-shadow: 0 2px 0 #000; }
    .tab svg { width: 62px; height: 62px; transition: transform .15s; }
    .tab.active { color: #fff; background: linear-gradient(#34459c, #1e2a70); }
    .tab.active svg { transform: translateY(-8px) scale(1.14); }
    .tab.center { flex: 1.3; }
    .tab.center .ic { position: absolute; top: -40px; left: 50%; margin-left: -62px; width: 124px; height: 124px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: linear-gradient(#ffcf3a, #f08a12); border: 6px solid #05070f; border-radius: 26px; box-shadow: 0 8px 0 #05070f; transition: transform .15s; }
    .tab.center .ic svg { width: 84px; height: 84px; transform: none; }
    .tab.center.active { background: linear-gradient(#34459c, #1e2a70); } .tab.center.active .ic { transform: translateY(-6px) scale(1.06); }
    .tab.center { color: #ffe08a; }
    .dot { position: absolute; top: 8px; right: 36px; width: 22px; height: 22px; border-radius: 50%; background: #ff4a3a; border: 3px solid #05070f; }
    #toast { position: absolute; left: 50%; bottom: 176px; transform: translateX(-50%); max-width: 600px; padding: 12px 22px; background: rgba(5,7,15,.94); border: 4px solid #ffcf3a; border-radius: 12px; font-size: 24px; text-align: center; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
    #toast.show { opacity: 1; }
    /* battle tab */
    .arenaPlate { cursor: pointer; margin: 6px auto 0; width: 500px; text-align: center; padding: 10px 14px; }
    .arenaPlate b { font-size: 30px; text-shadow: 0 4px 0 #000; } .arenaPlate div { font-size: 22px; color: #9fd0ff; }
    #pg-battle.on { display: flex; flex-direction: column; justify-content: space-between; }
    .deckRow { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
    .deckRow .mi { width: 76px; height: 86px; background: rgba(10,14,40,.82); border: 4px solid #05070f; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .deckRow .mi svg, .deckRow .mi img { width: 66px; height: 66px; object-fit: contain; }
    #findBtn { display: block; width: 100%; height: 118px; font-size: 52px; letter-spacing: 3px; }
    .rec { text-align: center; font-size: 22px; color: #cdd6ff; margin-top: 12px; margin-bottom: 48px; text-shadow: 0 2px 0 #000; }
    /* deck tab */
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; justify-items: center; }
    .slot { position: relative; width: 150px; height: 188px; display: flex; justify-content: center; align-items: flex-start; cursor: pointer; }
    .slot .card { zoom: .78; transform-origin: top center; cursor: pointer; margin-top: 10px; }
    .slot.pick .card { box-shadow: 0 0 0 5px #ffcf3a, 0 6px 0 5px #05070f; }
    .slot.locked .card { filter: grayscale(.9) brightness(.45); }
    .slot .tag { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 18px; color: #ffe08a; text-shadow: 0 2px 0 #000; }
    .slot .lk { position: absolute; top: 44px; left: 0; right: 0; text-align: center; font-size: 48px; text-shadow: 0 3px 0 #000; }
    #deckInfo { min-height: 78px; font-size: 22px; line-height: 28px; color: #ffe9a8; }
    .cbar { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 22px; background: #05070f; border: 3px solid #05070f; border-radius: 6px; overflow: hidden; }
    .cbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#5ee07a, #1fa04a); }
    .cbar b { position: absolute; left: 0; right: 0; font-size: 15px; line-height: 16px; text-align: center; text-shadow: 0 2px 0 #000; }
    .cbar.ready i, .cbar.full i { background: linear-gradient(#ffd75a, #e8a317); }
    .cbar.big { position: relative; left: auto; right: auto; bottom: auto; flex: 1; height: 38px; } .cbar.big b { font-size: 20px; line-height: 32px; }
    .slot.indeck .card { box-shadow: 0 0 0 4px #5ee07a, 0 6px 0 4px #05070f; }
    .upgrow { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    .nextlv { margin-top: 8px; color: #9fd0ff; font-size: 20px; line-height: 25px; } .lvtxt { color: #ffcf3a; } .hintline { margin-top: 8px; font-size: 20px; color: #cdd6ff; }
    /* shop */
    .shopitem { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .shopitem .pic { width: 110px; height: 110px; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); border-radius: 10px; }
    .shopitem .pic img, .shopitem .pic svg { width: 100px; height: 100px; object-fit: contain; }
    .shopitem .info { flex: 1; font-size: 22px; line-height: 26px; } .shopitem .info b { font-size: 28px; }
    .coinc { display: inline-block; width: 22px; height: 22px; background: #ffcf3a; border: 3px solid #05070f; border-radius: 50%; vertical-align: -4px; margin-right: 4px; box-sizing: border-box; }
    /* rank */
    .rk { display: flex; align-items: center; gap: 12px; padding: 8px 14px; margin-bottom: 8px; font-size: 26px; }
    .rk .n { width: 56px; font-size: 30px; color: #ffcf3a; } .rk .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rk .sc { color: #ffe08a; }
    .rk.me { border-color: #ffcf3a; }
    /* settings */
    .setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; font-size: 26px; }
    .setrow input[type=range] { width: 300px; height: 44px; touch-action: none; accent-color: #ffb23a; }
    .seg { display: flex; gap: 8px; } .seg .btn { padding: 6px 16px; font-size: 22px; min-height: 52px; }
    .how { font-size: 21px; line-height: 27px; color: #cdd6ff; } .how b { color: #ffe08a; }
    /* search / popups */
    .vs { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 24px 0; }
    .vs .side { width: 250px; padding: 18px 10px; } .vs .side b { display: block; font-size: 30px; } .vs .side div { font-size: 24px; color: #ffe08a; }
    .vs .x { font-size: 64px; color: #ffcf3a; text-shadow: 0 5px 0 #000; }
    .spin { width: 90px; height: 90px; background: #ffb23a; border: 6px solid #05070f; margin: 30px; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .popcard { transform: scale(1.5); margin: 70px 0 60px; } .popcard .card { cursor: default; }
</style>
</head>
<body>
<div id="game-world">
    <canvas id="game-canvas"></canvas>
    <div id="ui">
        <div id="fxlayer"></div>
        <div id="hurt"></div>
        <div id="banner"></div>
        <div id="reveal"></div>
        <div id="battleHud" class="hidden">
            <div id="eplate" class="plate"><div class="nm" id="ename">RIVAL REX</div><div class="bar"><i id="ebar"></i><b id="etxt">20</b></div></div>
            <div id="roundTag"><div class="rd" id="rd">ROUND 1</div><div class="pips" id="epips"></div><div id="ehand"></div></div>
            <button id="exitBtn">EXIT</button>
            <button id="fightBtn" class="off">FIGHT!</button>
            <div id="pplate" class="plate"><div class="nm">YOU</div><div class="bar"><i id="pbar"></i><b id="ptxt">20</b></div></div>
            <div id="pe"><div class="pips" id="ppips"></div></div>
            <div id="hint"></div>
            <div id="hand"></div>
        </div>
        <div id="menuRoot">
            <div id="mTop">
                <div class="pbadge"><div class="pface"></div><div class="pname">PLAYER<br><small id="mLv">Lv 1</small></div></div>
                <div class="chips">
                    <div class="chip"><svg viewBox="0 0 64 64"><path d="M20 8h24v16a12 12 0 0 1-24 0z" fill="#ffcf3a" stroke="#05070f" stroke-width="4"/><rect x="26" y="38" width="12" height="10" fill="#ffcf3a"/><rect x="18" y="48" width="28" height="10" rx="2" fill="#e8a317" stroke="#05070f" stroke-width="3"/></svg><b id="mTro">0</b></div>
                    <div class="chip"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#ffcf3a" stroke="#05070f" stroke-width="5"/><rect x="26" y="18" width="12" height="28" fill="#e8a317"/></svg><b id="mCoin">0</b></div>
                </div>
            </div>
            <div id="pages">
                <section class="page on" id="pg-battle">
                    <div class="panel arenaPlate" id="arenaPlate"><b id="arenaName">BLOCK PLAINS</b><div id="arenaSub"></div><div class="cbar big" id="arenaBar" style="margin-top:6px"><i></i><b></b></div></div>
                    <div>
                        <div class="deckRow" id="deckRow"></div>
                        <button class="btn" id="findBtn">FIND OPPONENT</button>
                        <div class="rec" id="rec"></div>
                    </div>
                </section>
                <section class="page" id="pg-deck"></section>
                <section class="page" id="pg-shop"></section>
                <section class="page" id="pg-rank"></section>
                <section class="page" id="pg-set"></section>
            </div>
            <nav id="tabbar"></nav>
        </div>
        <div id="toast"></div>
        <div id="searchOv" class="overlay hidden"></div>
        <div id="popOv" class="overlay hidden"></div>
        <div id="exitOv" class="overlay hidden">
            <h1 style="font-size:60px">LEAVE DUEL?</h1>
            <p>Leaving counts as a loss.</p>
            <div class="row" style="margin-top:30px"><button class="btn red" id="leaveBtn">LEAVE</button><button class="btn green" id="stayBtn">STAY</button></div>
        </div>
        <div id="endscreen" class="overlay hidden">
            <h1 id="endTitle">VICTORY!</h1>
            <p id="endLine"></p>

<script>
/* ---- THREE.JS LOADER ----------------------------------------------------------
 * three.js ships ES modules only, so a tiny generated module script imports it and
 * publishes it on window.THREE. The game awaits this promise before touching THREE.
 * The version is pinned so a CDN update can never change how the game behaves. */
window.__threeReady = new Promise((resolve, reject) => {
    const SOURCES = [
        'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js',
        'https://unpkg.com/three@0.185.0/build/three.module.min.js'
    ];
    let i = 0;
    const tryNext = () => {
        if (window.THREE) { resolve(window.THREE); return; }
        if (i >= SOURCES.length) { reject(new Error('three.js could not be loaded')); return; }
        const url = SOURCES[i++];
        const tag = document.createElement('script');
        tag.type = 'module';
        tag.textContent = 'import * as T from "' + url + '";\nwindow.THREE = T;\nwindow.dispatchEvent(new Event("three-loaded"));';
        tag.onerror = tryNext;
        document.head.appendChild(tag);
        setTimeout(() => { if (!window.THREE) tryNext(); }, 5000);
    };
    window.addEventListener('three-loaded', () => resolve(window.THREE));
    tryNext();
});
</script>

    /* ============================ BATTLE ============================ */
    /* Free-roaming melee: an attacking monster runs to the nearest enemy monster (or the
       duelist when none is left), strikes once, then walks back home. All attackers move at
       the same time, each starting a beat after the previous one. */
    function nearestFoe(m) {
        let best = null, bd = 1e9;
        liveMons(other(m.side)).forEach((f) => { const d = dist2d(m.holder.position, f.holder.position); if (d < bd) { bd = d; best = f; } });
        return best;
    }
    function faceDir(holder, dx, dz, dt, rate) {
        let d = Math.atan2(dx, dz) - holder.rotation.y;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        holder.rotation.y += d * Math.min(1, dt * rate);
    }
    function approach(m, speed, maxT) {
        const res = { tgt: null, inReach: false };
        let t = 0;
        return task((dt) => {
            if (m.dead) return true;
            const tgt = nearestFoe(m);
            const pos = tgt ? tgt.holder.position : S[other(m.side)].avatar.group.position;
            const reach = m.ranged ? 8.5 : (tgt ? 2.3 : 4.2);
            const dx = pos.x - m.holder.position.x, dz = pos.z - m.holder.position.z, d = Math.hypot(dx, dz);
            res.tgt = tgt; res.inReach = d <= reach + 0.05;
            t += dt;
            if (res.inReach || t > maxT) return true;
            const step = Math.min(speed * dt, d - reach);
            m.holder.position.x += dx / d * step; m.holder.position.z += dz / d * step;
            m.holder.position.y = 0.2 + Math.abs(Math.sin(S.t * 14)) * 0.3;
            faceDir(m.holder, dx, dz, dt, 14);
            return false;
        }).then(() => res);
    }
    function walkHome(m, speed) {
        let t = 0;
        return task((dt) => {
            if (m.dead) return true;
            const dx = m.home.x - m.holder.position.x, dz = m.home.z - m.holder.position.z, d = Math.hypot(dx, dz);
            t += dt;
            if (d < 0.15 || t > 5) { m.holder.position.y = 0.2; return true; }
            const step = Math.min(speed * dt, d);
            m.holder.position.x += dx / d * step; m.holder.position.z += dz / d * step;
            m.holder.position.y = 0.2 + Math.abs(Math.sin(S.t * 14)) * 0.25;
            faceDir(m.holder, dx, dz, dt, 12);
            return false;
        });
    }
    /* ---- ATTACK STYLES. MELEE monsters charge in and hit with a body animation; RANGED monsters stop
       far away, take aim (a thin aim line) and fire a projectile. Effects are kept thin and light. ---- */
    const MELEE = {
        default: { wind: 0.18, back: 0.6, lunge: 0.12, dist: 1.5, hop: 0.6 },
        slime: { wind: 0.26, back: 0.1, lunge: 0.16, dist: 1.7, hop: 1.5, fx: 'splat' },
        golem: { wind: 0.42, back: 0, lunge: 0.12, dist: 0.5, hop: 0, fx: 'slam' },
        wolf: { wind: 0.16, back: 0.6, lunge: 0.13, dist: 2.1, hop: 1.6, fx: 'claw', trail: 0xff8a2b },
        drake: { wind: 0.32, back: 0.5, lunge: 0.14, dist: 1.8, hop: 0.5, fx: 'bite', trail: 0xffe14d },
        bat: { wind: 0.26, back: 0, rise: 2.6, lunge: 0.17, dist: 1.5, hop: 0, fx: 'rake', trail: 0xb07dff },
        treant: { wind: 0.36, back: 0, lunge: 0.2, dist: 0.9, hop: 0, fx: 'sweep', trail: 0x7dff8a },
        turtle: { wind: 0.3, back: 0.9, lunge: 0.22, dist: 2.0, hop: 0.1, fx: 'ram', trail: 0xff7a1a },
        creeper: { wind: 0.42, back: 0, lunge: 0.12, dist: 1.2, hop: 0.2, fx: 'none' }
    };
    const RANGED = {
        archer: { aim: 0.4, fly: 0.34, proj: 'arrow', color: 0x9fe4ff },
        priest: { aim: 0.5, fly: 0.42, proj: 'orb', color: 0xfff2b0 }
    };
    // a thin additive streak (slash mark / spark line) that fades quickly
    function streak(x, y, z, yaw, tilt, color, len, life) {
        const mat = glowMat(color, 0.85), mesh = new THREE.Mesh(boxGeo(1, 0.07, 0.07), mat);
        mesh.position.set(x, y, z); mesh.rotation.set(0, yaw, tilt); mesh.scale.x = len * 0.5; scene.add(mesh);
        tween(life, (k) => { mat.opacity = 0.85 * (1 - k); mesh.scale.x = len * (0.5 + 0.6 * k); }, linear).then(() => { scene.remove(mesh); mat.dispose(); });
    }
    function meleeFx(kind, m, ax, az, dir) {
        const yaw = Math.atan2(-dir.z, dir.x), h = 2.0, g = ELEM[m.def.elem].glow;
        switch (kind) {

    /* ============================ RIVAL AI ============================ */
    function aiPick() {
        const me = S.e, foe = S.p, smarts = aiSmarts();
        let best = null;
        me.hand.forEach((c, idx) => {
            if (canPlay('e', c)) return;
            const targets = validTargets(c.type === 'monster' ? { target: 'ground' } : c, 'e');
            const options = needsTarget(c) ? targets : [null];
            options.forEach((t) => {
                let s = 0;
                const foeMons = liveMons('p');
                switch (c.type) {
                    case 'monster':
                        s = 3 + c.atk * 0.6 + c.hp * 0.4 + (foeMons.length ? 0 : 2.5) + (capCount('e') >= MAX_MONS - 1 ? -1 : 0);
                        break;
                    case 'skill':
                        if (c.name === 'FIREBALL') {
                            if (t.kind === 'face') s = foe.hp <= lvVal(c, S.rivalLv, 'dmg') ? 99 : 1.5;
                            else s = t.mon.hp <= lvVal(c, S.rivalLv, 'dmg') ? 4 + t.mon.atk : 1 + t.mon.atk * 0.3;
                        } else if (c.name === 'HEAL PULSE') {
                            if (t.kind === 'face') s = me.hp <= 10 ? 4 : 0.3;
                            else s = t.mon.maxHp - t.mon.hp >= 3 ? 3.5 : 0.3;
                        } else s = foeMons.length >= 2 ? 3 + foeMons.length * 1.5 : (foeMons.length ? 1.8 : 0);
                        break;
                    case 'buff': s = 3 + t.mon.hp * 0.3 + t.mon.atk * 0.3; break;
                    case 'debuff': s = 2.5 + t.mon.atk * 0.8; break;
                    case 'trap': s = foeMons.length || liveMons('e').length ? 3.2 : 2; break;
                }
                s += (1 - smarts) * Math.random() * 5 + Math.random() * 0.3;
                if (s > 1 && (!best || s > best.s)) best = { idx, target: t, s };
            });
        });
        return best;
    }

            $('endReward').innerHTML = '+' + reward.coins + ' coins &nbsp; ' + (reward.trophies >= 0 ? '+' : '') + reward.trophies + ' trophies' + (reward.spoils ? '<br>Card copies: ' + esc(reward.spoils) : '');

    /* ============================ SAVE / LOAD ============================ */
    function sanitizeProfile() {
        profile.owned = Array.from(new Set((profile.owned || []).filter((k) => CARDS[k])));
        STARTER.forEach((k) => { if (!profile.owned.includes(k)) profile.owned.push(k); });
        let deck = Array.from(new Set((profile.deck || []).filter((k) => profile.owned.includes(k))));
        const fill = profile.owned.filter((k) => !deck.includes(k));
        while (deck.length < DECK_SIZE && fill.length) deck.push(fill.shift());
        profile.deck = deck.slice(0, DECK_SIZE);
        if (profile.deck.filter((k) => CARDS[k].type === 'monster').length < 2) profile.deck = STARTER.slice();
        ['coins', 'trophies', 'wins', 'losses', 'streak', 'best', 'lastGift', 'arenaBest'].forEach((k) => { profile[k] = Number(profile[k]) || 0; });
        if (!profile.lv || typeof profile.lv !== 'object') profile.lv = {};
        if (!profile.copies || typeof profile.copies !== 'object') profile.copies = {};
        Object.keys(CARDS).forEach((k) => {
            profile.lv[k] = profile.owned.includes(k) ? clampLv(profile.lv[k]) : 1;
            profile.copies[k] = Math.max(0, Math.floor(Number(profile.copies[k]) || 0));
        });
        if (!profile.offers || typeof profile.offers !== 'object' || !Array.isArray(profile.offers.bought)) profile.offers = { day: 0, bought: [] };
        profile.coins = Math.max(0, profile.coins); profile.trophies = Math.max(0, profile.trophies);
    }
    async function loadProfile() {
        try {
            const r = await lib.getUserGameState();
            if (r && r.state) {
                const st = r.state, setg = st.settings;
                delete st.settings;
                Object.assign(profile, st);
                if (setg) Object.assign(profile.settings, setg);
            }
        } catch (e) { lib.log('Load failed'); }
        sanitizeProfile();
    }
    let saveT = 0;
    function saveProfile() {
        if (mode !== 'play') return;
        clearTimeout(saveT);
        saveT = setTimeout(() => {
            try { lib.saveUserGameState(JSON.parse(JSON.stringify(profile))); } catch (e) { lib.log('Save failed'); }

    function submitScore() {
        if (mode !== 'play') return;
        try { Promise.resolve(lib.addPlayerScoreToLeaderboard(profile.trophies)).catch(() => lib.log('Leaderboard submit failed')); } catch (e) { lib.log('Leaderboard submit failed'); }
    }
    function addCopies(key, n) {                       // the first copy unlocks the card, later ones level it up
        const fresh = !profile.owned.includes(key);
        if (fresh) { profile.owned.push(key); profile.lv[key] = 1; n -= 1; }
        profile.copies[key] = (profile.copies[key] || 0) + Math.max(0, n);
        return fresh;
    }
    const upgradable = () => profile.owned.filter((k) => (profile.lv[k] || 1) < LV_MAX);
    function applyResult(won) {
        const mul = 1 + 0.15 * arenaIndex(profile.trophies);
        const reward = won ? { coins: Math.round(WIN_COINS * mul), trophies: WIN_TROPHIES } : { coins: Math.round(LOSS_COINS * mul), trophies: -Math.min(LOSS_TROPHIES, profile.trophies) };
        const pool = profile.deck.filter((k) => (profile.lv[k] || 1) < LV_MAX), got = {};
        for (let i = 0; i < (won ? 3 : 1) && pool.length; i++) { const k = pool[Math.floor(Math.random() * pool.length)]; got[k] = (got[k] || 0) + 1; addCopies(k, 1); }
        reward.spoils = Object.keys(got).map((k) => CARDS[k].name + ' +' + got[k]).join(', ');
        if (won) { profile.wins++; profile.streak++; profile.best = Math.max(profile.best, profile.streak); } else { profile.losses++; profile.streak = 0; }
        profile.coins += reward.coins; profile.trophies = Math.max(0, profile.trophies + reward.trophies);
        saveProfile(); submitScore();
        return reward;
    }

    /* ============================ MONSTER IDLE LIFE ============================ */
    function updateMonsters(dt) {
        const all = S.p.mons.concat(S.e.mons).filter((m) => !m.dead);
        // gentle separation so free-roaming monsters never stack on top of each other
        for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
            const a = all[i].holder.position, b = all[j].holder.position;
            const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = 1.5;
            if (d < min && d > 0.001) {
                const push = (min - d) * 0.5 * Math.min(1, dt * 8), nx = dx / d, nz = dz / d;
                a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
            }
        }
        for (const m of all) {
            if (!m.ready || m.state !== 'idle') continue;
            const pos = m.holder.position;
            m.wt -= dt;
            if (m.wt <= 0) {
                m.wt = 1.5 + Math.random() * 2.5;
                const a = Math.random() * Math.PI * 2, r = Math.random() * 1.5;
                m.wto = new THREE.Vector3(m.home.x + Math.cos(a) * r, 0.2, m.home.z + Math.sin(a) * r);
            }
            let moving = false;
            if (m.wto) {
                const dx = m.wto.x - pos.x, dz = m.wto.z - pos.z, d = Math.hypot(dx, dz);
                if (d > 0.1) { const st = Math.min(d, 1.8 * dt); pos.x += dx / d * st; pos.z += dz / d * st; moving = true; }
            }
            pos.x = Math.max(-ARENA_H + 1, Math.min(ARENA_H - 1, pos.x)); pos.z = Math.max(-ARENA_H + 1, Math.min(ARENA_H - 1, pos.z));
            const foe = nearestFoe(m), fp = foe ? foe.holder.position : S[other(m.side)].avatar.group.position;
            faceDir(m.holder, fp.x - pos.x, fp.z - pos.z, dt, 5);
            pos.y = 0.2 + (moving ? Math.abs(Math.sin(S.t * 10)) * 0.12 : 0);
        }
    }

    /* ============================ MAIN LOOP ============================ */
    let last = performance.now();
    function loop(ts) {
        const dt = Math.min(((ts || performance.now()) - last) / 1000, 0.11);
        last = ts || performance.now(); S.t += dt;
        const t = S.t;
        updateTweens(dt);
        updateTasks(dt);
        updateMonsters(dt);
        updateParticles(dt);
        // idle animation + auras
        for (const s of ['p', 'e']) {
            const side = S[s];
            side.mons.forEach((m) => {
                if (m.dead) return;
                if (m.model.idle && !m.posing) m.model.idle(t + m.id);
                if (m.buff) { m.buff.material.opacity = 0.22 + Math.sin(t * 4 + m.id) * 0.08; m.ember -= dt; if (m.ember <= 0) { m.ember = 0.14; emit(m.holder.position.x, 0.4, m.holder.position.z, m.auraCol || ELEM.fire.glow, 1, 1.2, 4, 0.3, 0.9, -2); } }
                if (m.debuff) { m.debuff.material.opacity = 0.14 + Math.sin(t * 3 + m.id) * 0.06; }
                if (m.flashT > 0) { m.flashT = Math.max(0, m.flashT - dt * 4); m.flash.material.opacity = m.flashT * 0.8; }
                if (m.chain) m.chain.rotation.y += dt * 0.6;
            });
            side.traps.forEach((tr, n) => { tr.mesh.position.y = Math.sin(t * 2 + n) * 0.2; tr.mesh.rotation.y += dt; });
            const av = side.avatar;
            if (av.hitT > 0) { av.hitT = Math.max(0, av.hitT - dt * 3.2); const e = Math.pow(av.hitT, 1.5); av.rig.rotation.x = -0.45 * e; av.rig.position.z = -0.7 * e; av.rig.position.x = Math.sin(t * 70) * 0.18 * e; }
            else { av.rig.rotation.x = 0; av.rig.position.z = 0; av.rig.position.x = 0; }
            av.update(t, dt);
            if (!S.over) {
                av.armL.rotation.x = Math.sin(t * 1.8 + (s === 'p' ? 0 : 2)) * 0.12;
                if (!av.throwing) av.armR.rotation.x = -Math.sin(t * 1.8 + (s === 'p' ? 0 : 2)) * 0.12;
                av.group.position.y = Math.abs(Math.sin(t * 2 + (s === 'p' ? 0 : 1))) * 0.1;
            }
            if (av.flash > 0) { av.flash = Math.max(0, av.flash - dt * 3); av.mats.forEach((m) => { const b = m.userData.base; m.emissive.setRGB(b.r + av.flash, b.g + av.flash * 0.15, b.b + av.flash * 0.15); }); }
        }
        if (spawnZone.visible) spawnZone.material.opacity = 0.26 + Math.sin(t * 5) * 0.12;
        markers.forEach((m, i) => { if (m.visible) { m.material.opacity = 0.55 + Math.sin(t * 7 + i) * 0.35; } });
        // camera (with hit shake)
        S.shake = Math.max(0, S.shake - dt * 2.2);
        if (S.debugCam) { camera.position.copy(S.debugCam.pos); camera.lookAt(S.debugCam.look); }
        else if (S.phase === 'menu') {                       // slow fly-around behind the menu
            const ang = t * 0.16;
            camera.position.set(Math.sin(ang) * 50, 34, Math.cos(ang) * 50);
            camera.lookAt(0, 0, 2);
        } else {
            camera.position.set(CAM_POS.x + (Math.random() - 0.5) * S.shake, CAM_POS.y + (Math.random() - 0.5) * S.shake, CAM_POS.z);
            camera.lookAt(CAM_LOOK);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
    }

        if (co) {
            const k = co.dataset.k;
            if (dsel.slot !== null && profile.owned.includes(k)) { placeCard(dsel.slot, k); return; }
            dsel = { slot: null, key: dsel.key === k ? null : k }; renderDeck();
        }
    });

    /* ---- SHOP tab ---- */
    const CHEST_SVG = '<svg viewBox="0 0 64 64"><rect x="8" y="24" width="48" height="30" rx="4" fill="#a8641e" stroke="#05070f" stroke-width="4"/><path d="M8 28a4 4 0 0 1 4-4h40a4 4 0 0 1 4 4v6H8z" fill="#c9822e" stroke="#05070f" stroke-width="4"/><rect x="28" y="30" width="8" height="12" fill="#ffcf3a" stroke="#05070f" stroke-width="3"/></svg>';
    const dayKey = () => Math.floor(Date.now() / 86400000);
    function dailyOffers() {
        let seed = dayKey() * 9301 + 49297;
        const arr = upgradable().sort();
        for (let i = arr.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = Math.floor(seed / 233280 * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr.slice(0, 3);
    }
    const offerPrice = (k) => Math.round(PRICE[k] * 0.4);
    function renderShop() {
        const left = giftLeft(), locked = Object.keys(CARDS).filter((k) => !profile.owned.includes(k));
        if (profile.offers.day !== dayKey()) profile.offers = { day: dayKey(), bought: [] };
        const afford = (n) => (profile.coins >= n ? '' : 'off');
        const offers = dailyOffers();
        $('pg-shop').innerHTML = `<div class="sect">DAILY GIFT</div>
            <div class="panel shopitem"><div class="pic">${CHEST_SVG}</div><div class="info"><b>FREE GIFT</b><br>${GIFT_COINS} coins every ${GIFT_HOURS} hours</div>${left ? `<button class="btn grey off">${fmtLeft(left)}</button>` : '<button class="btn green" data-gift>CLAIM</button>'}</div>
            <div class="sect">CARD CHEST</div>
            <div class="panel shopitem"><div class="pic">${CHEST_SVG}</div><div class="info"><b>WOODEN CHEST</b><br>5 random card copies - unlock new cards or level up old ones</div><button class="btn ${afford(CHEST_COST)}" data-chest>${coinI}${CHEST_COST}</button></div>
            <div class="sect">DAILY OFFERS <small>3 copies each</small></div>` + (offers.length ? offers.map((k) => {
                const c = CARDS[k], got = profile.offers.bought.includes(k);
                return `<div class="panel shopitem"><div class="pic">${iconSVG(c)}</div><div class="info"><b>${c.name} x3</b><br>Level ${profile.lv[k] || 1} card copies</div><button class="btn ${got ? 'grey off' : afford(offerPrice(k))}" data-offer="${k}">${got ? 'SOLD' : coinI + offerPrice(k)}</button></div>`;
            }).join('') : '<div class="panel">Everything is maxed out!</div>') + `<div class="sect">CARDS FOR SALE</div>` + (locked.length ? locked.map((k) => {
                const c = CARDS[k];
                return `<div class="panel shopitem"><div class="pic">${iconSVG(c)}</div><div class="info"><b>${c.name}</b><br>${c.type === 'monster' ? 'ATK ' + c.atk + ' / HP ' + c.hp + ' | ' : ''}Energy ${c.cost}</div><button class="btn ${afford(PRICE[k])}" data-buy="${k}">${coinI}${PRICE[k]}</button></div>`;
            }).join('') : '<div class="panel">You own every card!</div>');
        renderTop();
    }
    $('pg-shop').addEventListener('click', (e) => {
        const g = e.target.closest('[data-gift]'), ch = e.target.closest('[data-chest]'), by = e.target.closest('[data-buy]'), of = e.target.closest('[data-offer]');
        if (g && giftLeft() === 0) {
            profile.coins += GIFT_COINS; profile.lastGift = Date.now(); saveProfile(); sfx('heal');
            showPopup('GIFT!', null, '+' + GIFT_COINS + ' coins'); renderShop();
        } else if (ch) {
            if (profile.coins < CHEST_COST) { toast('Not enough coins - win duels to earn more!'); sfx('no'); return; }
            const pool = Object.keys(CARDS).filter((k) => !profile.owned.includes(k) || (profile.lv[k] || 1) < LV_MAX);
            if (!pool.length) { toast('Every card is maxed out!'); return; }
            profile.coins -= CHEST_COST;
            const got = {}, fresh = [];
            for (let i = 0; i < 5; i++) got[pool[Math.floor(Math.random() * pool.length)]] = 0;
            for (let i = 0; i < 5; i++) { const ks = Object.keys(got); got[ks[Math.floor(Math.random() * ks.length)]]++; }
            Object.keys(got).forEach((k) => { if (!got[k]) got[k] = 1; });
            Object.keys(got).forEach((k) => { if (addCopies(k, got[k])) fresh.push(k); });
            saveProfile(); sfx('summon');
            const show = fresh[0] || Object.keys(got)[0];
            showPopup('CHEST OPENED!', show, Object.keys(got).map((k) => esc(CARDS[k].name) + ' x' + got[k] + (fresh.includes(k) ? ' (NEW!)' : '')).join('<br>')); renderShop();
        } else if (of) {
            const k = of.dataset.offer;
            if (profile.offers.bought.includes(k)) return;
            if (profile.coins < offerPrice(k)) { toast('Not enough coins - win duels to earn more!'); sfx('no'); return; }
            profile.coins -= offerPrice(k); profile.offers.bought.push(k); addCopies(k, 3); saveProfile(); sfx('summon');
            showPopup('COPIES!', k, esc(CARDS[k].name) + ' +3 copies'); renderShop();
        } else if (by) {
            const k = by.dataset.buy;
            if (profile.coins < PRICE[k]) { toast('Not enough coins - win duels to earn more!'); sfx('no'); return; }
            profile.coins -= PRICE[k]; addCopies(k, 1); saveProfile(); sfx('summon');
            showPopup('CARD UNLOCKED!', k, 'Add it to your deck in the CARDS tab.'); renderShop();
        }
    });
    setInterval(() => { if (S.phase === 'menu' && curTab === 'shop') renderShop(); else if (S.phase === 'menu') renderTop(); }, 30000);

    /* ---- RANKS tab (leaderboard) ---- */
    async function renderRank() {
        const pg = $('pg-rank');
        pg.innerHTML = '<div class="sect">TOP DUELISTS</div><div class="panel">Loading...</div>';
        let res = null;
        try { res = await lib.getTopNEntriesFromLeaderboard(20); } catch (e) { lib.log('Leaderboard fetch failed'); }
        if (curTab !== 'rank') return;
        const me = `<div class="panel rk me"><span class="n">${res && res.userRank ? '#' + res.userRank : '-'}</span><span class="u">YOU${res && res.userRank ? '' : ' (win a duel to get ranked)'}</span><span class="sc">${profile.trophies}</span></div>`;
        if (!res || !res.entries) { pg.innerHTML = '<div class="sect">TOP DUELISTS</div>' + me + '<div class="panel">The leaderboard is unavailable right now. Try again later.</div>'; return; }
        pg.innerHTML = '<div class="sect">TOP DUELISTS <small>trophies</small></div>' + me +
            (res.entries.length ? res.entries.map((en, i) => `<div class="panel rk"><span class="n">${i + 1}</span><span class="u">${esc(en.username || 'Player')}</span><span class="sc">${esc(en.score)}</span></div>`).join('') : '<div class="panel">No scores yet - be the first!</div>');
    }

    /* ---- SETTINGS tab ---- */
    let resetArmed = false;
    function renderSettings() {
        const st = profile.settings;
        const tg = (k, label) => `<div class="setrow"><span>${label}</span><button class="btn ${st[k] ? 'green' : 'grey'}" data-tg="${k}">${st[k] ? 'ON' : 'OFF'}</button></div>`;
        const vol = (k) => `<div class="setrow"><span>Volume</span><input type="range" min="0" max="100" value="${Math.round(st[k] * 100)}" data-vol="${k}"></div>`;
        $('pg-set').innerHTML = `<div class="sect">AUDIO</div><div class="panel">${tg('music', 'Music')}${vol('musicVol')}${tg('sfx', 'Sound FX')}${vol('sfxVol')}</div>
            <div class="sect">RIVAL DIFFICULTY</div><div class="panel"><div class="seg">${['easy', 'normal', 'hard'].map((d) => `<button class="btn ${st.difficulty === d ? '' : 'grey'}" data-diff="${d}">${d.toUpperCase()}</button>`).join('')}</div></div>
            <div class="sect">HOW TO PLAY</div><div class="panel how"><b>1.</b> Tap a card, then tap where to summon it or aim it.<br><b>2.</b> Monsters roam the square arena. Buffs, curses and traps change how they look and fight.<br><b>3.</b> Press <b>FIGHT!</b> and your monsters rush the nearest enemy, or the rival duelist.<br><b>4.</b> Win duels for coins and trophies, then unlock new cards in the shop.</div>
            <div class="sect">DATA</div><div class="panel"><button class="btn red" id="resetBtn">${resetArmed ? 'TAP AGAIN TO CONFIRM' : 'RESET PROGRESS'}</button></div>`;
    }
    $('pg-set').addEventListener('click', (e) => {
        const t = e.target.closest('[data-tg]'), d = e.target.closest('[data-diff]'), r = e.target.closest('#resetBtn');
        if (t) { profile.settings[t.dataset.tg] = !profile.settings[t.dataset.tg]; updateMusic(); saveProfile(); renderSettings(); sfx('card'); }
        else if (d) { profile.settings.difficulty = d.dataset.diff; saveProfile(); renderSettings(); }
        else if (r) {
            if (!resetArmed) { resetArmed = true; renderSettings(); setTimeout(() => { resetArmed = false; if (curTab === 'set') renderSettings(); }, 3000); return; }
            resetArmed = false;
            Object.assign(profile, { wins: 0, losses: 0, streak: 0, best: 0, trophies: 0, coins: 150, lastGift: 0, lv: {}, copies: {}, arenaBest: 0, offers: { day: 0, bought: [] }, owned: STARTER.slice(), deck: STARTER.slice() }); sanitizeProfile();
            saveProfile(); renderTop(); renderSettings(); toast('Progress reset.');
        }
    });
    $('pg-set').addEventListener('input', (e) => {
        const v = e.target.dataset && e.target.dataset.vol;
        if (!v) return;
        profile.settings[v] = Number(e.target.value) / 100;
        if (v === 'musicVol') updateMusic();
    });
    $('pg-set').addEventListener('change', (e) => {
        const v = e.target.dataset && e.target.dataset.vol;
        if (!v) return;
        saveProfile(); if (v === 'sfxVol') sfx('hit');
    });

    /* ---- navigation ---- */
    function showTab(id) {
        curTab = id; dsel = { slot: null, key: null };
        document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
        document.querySelectorAll('.page').forEach((pg) => pg.classList.toggle('on', pg.id === 'pg-' + id));
        menuRoot.classList.toggle('solid', id !== 'battle');
        renderTop();
        ({ battle: renderBattle, deck: renderDeck, shop: renderShop, rank: renderRank, set: renderSettings })[id]();
    }
    function showMenu() {
        S.token++; S.over = true; S.phase = 'menu'; S.sel = null; S.valid = [];
        clearMarkers(); clearBoard(); setHint('');
        setRival(NAMES[Math.floor(Math.random() * NAMES.length)]);
        battleHud.classList.add('hidden'); $('endscreen').classList.add('hidden'); $('exitOv').classList.add('hidden');
        menuRoot.classList.remove('hidden');
        setMusic('music_menu');
        showTab(curTab || 'battle');
        const ai = arenaIndex(profile.trophies);
        if (ai > (profile.arenaBest || 0)) {
            profile.arenaBest = ai; saveProfile(); sfx('win');
            showPopup('NEW ARENA!', null, 'Welcome to <b>' + ARENAS[ai].name + '</b>!<br>Coin rewards +' + ai * 15 + '%. The rival\'s cards are now Lv ' + Math.min(LV_MAX, 1 + ai) + '.');
        }
    }
    $('exitBtn').addEventListener('click', () => { if (!S.over) $('exitOv').classList.remove('hidden'); });
    $('stayBtn').addEventListener('click', () => $('exitOv').classList.add('hidden'));
    $('leaveBtn').addEventListener('click', () => {
        if (!S.over) {                                     // leaving counts as a loss (no coins)
            profile.losses++; profile.streak = 0; profile.trophies = Math.max(0, profile.trophies - LOSS_TROPHIES);
            saveProfile(); submitScore();
        }
        showMenu();
    });
    $('menuBtn').addEventListener('click', () => { unlockAudio(); showMenu(); });
    $('againBtn').addEventListener('click', () => { unlockAudio(); newMatch(); });

    /* ============================ START ============================ */
    Object.keys(CARDS).forEach((k) => {
        const a = lib.getAsset('art_' + k);
        if (a && a.url) { const im = new Image(); im.src = a.url; }
    });
    await loadProfile();
    refreshUI();
    showMenu();
    window.__bcd = { S, CARDS, profile, THREE, setRival, avatarHit, select, playPlayerCard, startFight, damageMon, refreshUI, showTab: (t) => showTab(t) };   // handy for debugging in the console
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
