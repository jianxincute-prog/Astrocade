<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deluge Drifter</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06243a;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Naskh Arabic','Noto Sans Arabic',sans-serif;color:#fff}
  #root{position:fixed;inset:0;overflow:hidden}
  canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;pointer-events:none}
  #ui *{box-sizing:border-box}
  #loading{position:absolute;inset:0;z-index:100;background:linear-gradient(#0b3a5c,#06243a 70%,#031420);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;pointer-events:auto}
  #loading .logo{font-size:72px;font-weight:900;letter-spacing:2px;text-align:center;text-shadow:0 6px 0 #0a6aa3,0 12px 24px rgba(0,0,0,.5);line-height:1}
  #loading .logo small{display:block;font-size:30px;color:#ffd166;letter-spacing:6px;margin-top:10px}
  #loading .wave{font-size:96px;animation:bob 1.6s ease-in-out infinite}
  #loading .bar{width:480px;height:26px;border-radius:14px;background:rgba(255,255,255,.14);overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#27c3ff,#ffd166);transition:width .15s}
  #loading .tip{font-size:26px;opacity:.85;min-height:34px;text-align:center;padding:0 40px}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
</style>
</head>
<body>
<div id="root">
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="loading">
    <div class="wave">🌊</div>
    <div class="logo">DELUGE<br>DRIFTER<small>RAFT · DIVE · SURVIVE</small></div>
    <div class="bar"><i id="loadbar"></i></div>
    <div class="tip" id="loadtip">Loading...</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
