<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Secret Recipe Lab</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2430; overflow: hidden; }
  #app { position: relative; width: 720px; height: 1280px; margin: 0 auto; overflow: hidden;
         background: #fff1e6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 720px; height: 640px; }
  #stage canvas { display: block; width: 720px; height: 640px; }
  #hud { position: absolute; left: 0; top: 640px; width: 720px; height: 640px;
         background: linear-gradient(#ffe0cc, #ffd1b8); border-top: 6px solid #ffb5a7; box-sizing: border-box; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="hud"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
