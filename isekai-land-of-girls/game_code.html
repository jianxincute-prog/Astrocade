/*
 Isekai: Land of Girls (v6)
 A guy is thrown into a fantasy world where every human and monster is female.
 Overworld: oblique (Tibia-style) camera, flat square tiles, upright characters, y-sorted.
 Touching a monster girl (or hitting her with the sword = first strike) starts a Final Fantasy style
 ATB battle: Attack / Skill / Befriend / Item / Flee. Weaken her, then Befriend to recruit her.
 Maps: Village -> Slime Meadow -> Harpy Cliffs -> Lamia Cave (boss: Queen Lamia).
 Journal (book icon / J): Profile, Equipment, Party, Items, Quests, Bestiary, System (save / reset).
 Sprite sheets are 3 frames x 1 row.

    if (!(id in imgs)) {
      const a = (typeof lib !== 'undefined' && lib.getAsset) ? lib.getAsset(id) : null;
      if (a && a.url) { const im = new Image(); im.src = a.url; imgs[id] = im; } else imgs[id] = null;
    }
    return imgs[id];
  }
  const ready = id => { const im = loadImg(id); return !!(im && im.complete && im.naturalWidth > 0); };
  function srcRect(id, f) {
    const im = imgs[id], s = SHEET[id];
    const x0 = im.naturalWidth * s.l, x1 = im.naturalWidth * (1 - s.r);
    const y0 = im.naturalHeight * s.t, y1 = im.naturalHeight * (1 - s.b);
    const fw = (x1 - x0) / s.frames;
    return [x0 + fw * f, y0, fw, y1 - y0];
  }
  function drawTileS(id, f, x, y, s) {
    if (!ready(id)) return false;
    const r = srcRect(id, f);
    ctx.drawImage(imgs[id], r[0], r[1], r[2], r[3], x, y, s, s);
    return true;
  }
  function drawTile(id, f, x, y) { return drawTileS(id, f, x, y, TILE); }
  function drawFit(id, f, cx, by, bw, bh, flip) {
    if (!ready(id)) return false;
    const r = srcRect(id, f), k = Math.min(bw / r[2], bh / r[3]);
    const w = r[2] * k, h = r[3] * k;
    ctx.save(); ctx.translate(cx, by); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(imgs[id], r[0], r[1], r[2], r[3], -w / 2, -h, w, h);
    ctx.restore(); return true;
  }
  // fixed-height (characters); sc = extra scale
  function drawChar(id, f, cx, by, flip, alpha, sc) {
    if (!ready(id)) return false;
    const r = srcRect(id, f), k = SHEET[id].H / r[3] * (sc || 1);
    const w = r[2] * k, h = r[3] * k;
    ctx.save(); ctx.translate(cx, by); if (flip) ctx.scale(-1, 1);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.drawImage(imgs[id], r[0], r[1], r[2], r[3], -w / 2, -h, w, h);
    ctx.restore(); return true;
  }

  function updateBattle(dt) {
    B.t += dt; B.msgT -= dt;
    B.floats.forEach(f => { f.t += dt; });
    B.floats = B.floats.filter(f => f.t < 1.1);
    B.enemies.concat(B.allies).forEach(c => {
      if (c.flash > 0) c.flash -= dt; if (c.shake > 0) c.shake -= dt;
      if (c.side === 'e' && (c.ko || c.gone)) c.fade = Math.min(1, (c.fade || 0) + dt * 1.6);
    });
    if (B.state === 'intro') { if (B.t > 1.0) B.state = 'run'; return; }
    if (B.state === 'anim') {
      const an = B.anim; an.t += dt;
      const p = Math.min(1, an.t / an.dur), a = an.a;
      if (a.kind === 'attack' || a.kind === 'skill' || a.kind === 'aoe') a.actor.off = Math.sin(p * Math.PI) * 60 * (a.actor.side === 'e' ? 1 : -1);
      if (!an.applied && p >= 0.5) { an.applied = true; applyAction(a); }
      if (p >= 1) finishAction();
      return;
    }
    if (B.state === 'fled') { if (B.t - B.endT > 0.9) endBattle(); return; }
    if (B.state !== 'run') return;
    // ATB fill (paused while a menu is open or an action plays)
    let best = null;
    B.enemies.concat(B.allies).forEach(c => {
      if (!alive(c)) return;
      c.gauge = Math.min(100, c.gauge + c.spd * dt * 3.2);
      if (c.gauge >= 100 && (!best || c.gauge > best.gauge)) best = c;
    });
    if (best) {
      if (best.isPlayer) { B.state = 'menu'; B.menu = 'cmd'; B.pend = null; }
      else aiAct(best);
    }
  }

  const SIGNS = {

  // sword swing: hitting a monster girl = first strike (starts the battle with your turn ready)

  // ---- Collision ----
  function outAllowed(tx, ty) {
    return M.exits.some(e => (e.side === 'e' || e.side === 'w')
      ? (e.row === ty && ((e.side === 'e' && tx >= M.W) || (e.side === 'w' && tx < 0)))
      : (Math.abs(tx - e.col) <= 1 && ((e.side === 's' && ty >= M.H) || (e.side === 'n' && ty < 0))));
  }
  function blockedAt(px, py, hw, hh, withNpc) {
    const pts = [[px - hw, py], [px + hw, py], [px - hw, py - hh], [px + hw, py - hh]];
    for (const p of pts) {
      const tx = Math.floor(p[0] / TILE), ty = Math.floor(p[1] / TILE);
      if (tx < 0 || ty < 0 || tx >= M.W || ty >= M.H) { if (!outAllowed(tx, ty)) return true; continue; }
      if (M.solid.has(key(tx, ty))) return true;
    }
    if (withNpc) for (const n of M.npcs) if (Math.abs(px - n.x * TILE) < 30 && Math.abs(py - n.y * TILE) < 22) return true;
    return false;
  }

  // ---- Update ----
  function update(dt) {
    t += dt; playSec += dt;
    if (B) { updateBattle(dt); return; }
    if (journal.open || forge.open || shop.open) return;
    let ix = 0, iy = 0;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    if (joy.id !== null && Math.hypot(joy.dx, joy.dy) > 0.2) { ix = joy.dx; iy = joy.dy; }
    const mg = Math.hypot(ix, iy);
    player.moving = false;
    if (mg > 0.01 && !dlg) {
      ix /= Math.max(1, mg); iy /= Math.max(1, mg);
      const sp = player.atk > 0 ? 110 : 230;
      const nx = player.x + ix * sp * dt, ny = player.y + iy * sp * dt;
      if (!blockedAt(nx, player.y, 16, 14, true)) player.x = nx;
      if (!blockedAt(player.x, ny, 16, 14, true)) player.y = ny;
      player.moving = true;
      if (player.atk <= 0) {
        if (Math.abs(ix) > Math.abs(iy)) player.dir = ix < 0 ? 'left' : 'right'; else player.dir = iy < 0 ? 'up' : 'down';
      }
      const l = hist[hist.length - 1];
      if (!l || Math.hypot(player.x - l[0], player.y - l[1]) > 10) { hist.push([player.x, player.y]); if (hist.length > 60) hist.shift(); }
    }
    if (player.atk > 0) {
      player.atk -= dt;
      if (!player.atkHit && player.atk <= ATK_T * 0.5) { player.atkHit = true; doHit(); if (B) return; }
    }
    if (player.inv > 0) player.inv -= dt;
    if (exitCool > 0) exitCool -= dt;
    checkExits();
    updateMonsters(dt);
    if (B) return;
    updateParty(dt);
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    cam.x = Math.max(0, Math.min(M.W * TILE - VIEW_W, player.x - VIEW_W / 2));
    cam.y = Math.max(0, Math.min(M.H * TILE - VIEW_H, player.y - VIEW_H / 2 - 40));
  }
  function checkExits() {
    if (exitCool > 0) return;
    const row = Math.floor(player.y / TILE), col = Math.floor(player.x / TILE);
    for (const e of M.exits) {
      let hit = false;
      if (e.side === 'e' || e.side === 'w') {
        if (e.row !== row) continue;
        hit = e.side === 'e' ? player.x > (M.W - 0.4) * TILE : player.x < 0.4 * TILE;
      } else {
        if (Math.abs(col - e.col) > 1) continue;
        hit = e.side === 's' ? player.y > (M.H - 0.4) * TILE : player.y < 0.4 * TILE;
      }
      if (!hit) continue;
      const blockedMsg = e.locked ? (typeof e.locked === 'function' ? e.locked() : e.locked) : ((e.need && !e.need()) ? e.msg : null);
      if (blockedMsg) {
        showToast(blockedMsg); exitCool = 2;

        else if (e.side === 's') player.y = (M.H - 1.5) * TILE; else player.y = 1.5 * TILE;
        return;
      }
      loadMap(e.to, e.sx, e.sy); save();
      return;
    }
  }

      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, yy, w, 230);
      txt('SLOT ' + (i + 1), x + 14, yy + 32, 18, '#f0d070');
      if (p) {
        const T = MON[p.type];
        const f = [0, 1, 2, 1][Math.floor(t * 4 + i) % 4];
        if (!drawChar(T.sheet, f, x + 100, yy + 205, false, 1, 1.1)) { ctx.fillStyle = T.color; ctx.fillRect(x + 60, yy + 100, 80, 100); }
        txt(T.name, x + 200, yy + 76, 28, '#fff');
        txt('HP ' + p.maxHp + '  ATK ' + p.atk + '  DEF ' + p.def + '  SPD ' + p.spd, x + 200, yy + 104, 15, '#4fd0b8');
        txt('Skill: ' + T.ally.skill, x + 200, yy + 130, 18, '#f0d070');
        ctx.font = '16px monospace'; ctx.fillStyle = '#b8c0ff';
        wrap(T.role, w - 205).forEach((l, k) => ctx.fillText(l, x + 200, yy + 158 + k * 21));
        txt('Acts automatically in battle', x + 200, yy + 222, 14, '#7a85c8');
        const armed = journal.releaseSlot === i && t < journal.releaseUntil;
        ctx.fillStyle = '#000'; ctx.fillRect(x + w - 152, yy + 4, 140, 48);
        ctx.fillStyle = armed ? (Math.floor(t * 4) % 2 ? '#e0453a' : '#a02a2a') : '#5a2a2a'; ctx.fillRect(x + w - 150, yy + 6, 136, 44);
        txt(armed ? 'SURE?' : 'RELEASE', x + w - 82, yy + 36, 20, '#fff', 'center');
      } else {
        txt('- Empty -', x + 200, yy + 110, 26, '#7a85c8');
        txt('Befriend a monster girl', x + 200, yy + 142, 18, '#7a85c8');
      }
    }
  }
  function tabPartyFooter(x, y) {
    if (t < journal.relMsgUntil) txt(journal.relMsg, x, y + 790, 17, '#f0d070');
    else txt('Tap RELEASE twice to let a friend go home.', x, y + 790, 16, '#7a85c8');
  }
  function tabItems(x, y, w) {
    row('Gold', player.gold, x, y + 30, w);
    const list = Object.keys(LOOT).filter(k => (inv[k] || 0) > 0);
    let yy = y + 70;
    list.forEach(k => {
      const L = LOOT[k];
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, yy, w, 62);
      ctx.fillStyle = '#000'; ctx.fillRect(x + 8, yy + 10, 42, 42); ctx.fillStyle = L.color; ctx.fillRect(x + 11, yy + 13, 36, 36);
      txt(L.name, x + 64, yy + 26, 20, '#fff'); txt('x' + inv[k], x + w - 12, yy + 26, 20, '#f0d070', 'right');
      ctx.font = '14px monospace'; ctx.fillStyle = '#b8c0ff';
      wrap(L.desc, w - 80).slice(0, 2).forEach((l, i) => ctx.fillText(l, x + 64, yy + 42 + i * 16));
      yy += 68;
    });
    if (!list.length) txt('No items yet. Befriend monsters!', x, y + 110, 20, '#7a85c8');
    journal.max = Math.max(0, yy - 1250);
  }
  function bossTag(type) {
    const b = bs(type);
    return b.friend ? 'befriended' : b.done ? (bossAvailable(type) ? 'she returned!' : 'back in ' + fmtRemain(bossRemaining(type))) : 'boss';
  }
  function tabQuests(x, y, w) {
    const Q = [
      ['Speak with Elder Mira', !!flags.met['Elder Mira'], ''],
      ['Befriend a Slime Girl', (stats.slime || 0) > 0, ''],
      ['Befriend a Harpy Girl', (stats.harpy || 0) > 0, ''],
      ['Face Queen Lamia', !!bs('queen').done, bossTag('queen')],
      ['Fill your party', party.length >= MAX_PARTY, party.length + '/' + MAX_PARTY],
      ['Forge new gear (Smith Bruna)', Object.keys(owned).length > 2, ''],
      ['Face Wraith Queen', !!bs('wraith').done, bossTag('wraith')],
      ['Reach the Crossroads', !!seen.map_hub, ''],
      ['Face Dryad Queen', !!bs('dryadq').done, bossTag('dryadq')],
      ['Face Snow Queen', !!bs('snowq').done, bossTag('snowq')],
      ['Face Flame Queen', !!bs('flameq').done, bossTag('flameq')],
      ['Open the Court of Queens', !!seen.map_court, 'Sigils ' + sigilCount() + '/' + SIGIL_NEED],
      ['Face the Overqueen', !!bs('overq').done, bossTag('overq')]
    ];
    Q.forEach((q, i) => {
      const yy = y + i * 80;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, yy, w, 70);
      ctx.fillStyle = '#000'; ctx.fillRect(x + 14, yy + 17, 36, 36); ctx.fillStyle = q[1] ? '#4fd0b8' : '#2a3278'; ctx.fillRect(x + 17, yy + 20, 30, 30);
      if (q[1]) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 22, yy + 33, 8, 5); ctx.fillRect(x + 28, yy + 27, 6, 14); }
      txt(q[0], x + 66, yy + 42, 20, q[1] ? '#7a85c8' : '#fff');
      if (q[2]) txt(q[2], x + w - 14, yy + 42, 16, '#f0d070', 'right');
    });
    journal.max = Math.max(0, y + Q.length * 80 - 1250);
  }
  function tabBestiary(x, y, w) {
    const ids = ['slime', 'harpy', 'lamia', 'queen', 'undead', 'wraith', 'alraune', 'dryad', 'dryadq', 'yuki', 'iceharpy', 'snowq', 'salamander', 'sprite', 'flameq', 'guard', 'overq'];
    ids.forEach((id, i) => {
      const yy = y + i * 180, T = MON[id], known = !!seen[id];
      if (yy - journal.scroll > 1262 || yy - journal.scroll + 170 < 160) return;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, yy, w, 170);
      if (known) {
        const f = [0, 1, 2, 1][Math.floor(t * 4 + i) % 4];
        if (!drawChar(T.sheet, f, x + 90, yy + 158, false, 1, T.boss ? 0.95 : 1.1)) { ctx.fillStyle = T.color; ctx.fillRect(x + 50, yy + 70, 80, 88); }
        txt(T.name + (T.boss ? ' (BOSS)' : ''), x + 180, yy + 40, T.boss ? 22 : 26, T.boss ? '#f0d070' : '#fff');
        txt('Befriended: ' + (stats[id] || 0), x + 180, yy + 66, 16, '#4fd0b8');
        txt('HP ' + T.bhp + '  ATK ' + T.batk + '  Loot: ' + LOOT[T.loot].name, x + 180, yy + 90, 14, '#f0d070');
        ctx.font = '15px monospace'; ctx.fillStyle = '#b8c0ff';
        wrap(T.lore, w - 196).forEach((l, k) => { if (k < 4) ctx.fillText(l, x + 180, yy + 114 + k * 18); });
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x + 50, yy + 50, 80, 108);
        txt('???', x + 90, yy + 112, 30, '#7a85c8', 'center');
        txt('Unknown', x + 180, yy + 60, 26, '#7a85c8');
        txt('Not yet encountered', x + 180, yy + 90, 18, '#7a85c8');
      }
    });
    journal.max = Math.max(0, y + ids.length * 180 - 1250);
  }
  function tabSystem(x, y, w) {
    // Save button: y+50..y+130
    ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y + 48, w + 4, 84);
    ctx.fillStyle = '#2f8a6b'; ctx.fillRect(x, y + 50, w, 80);
    txt('SAVE GAME', x + w / 2, y + 100, 30, '#fff', 'center');
    if (t < journal.msgUntil) txt('Game saved!', x + w / 2, y + 168, 22, '#f0d070', 'center');
    // Reset button: y+190..y+270 (two taps to confirm)
    const armed = t < journal.resetUntil;
    ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y + 188, w + 4, 84);
    ctx.fillStyle = armed ? (Math.floor(t * 4) % 2 ? '#e0453a' : '#a02a2a') : '#7a2f2f'; ctx.fillRect(x, y + 190, w, 80);
    txt(armed ? 'TAP AGAIN TO CONFIRM' : 'RESET PROGRESS', x + w / 2, y + 226, armed ? 24 : 30, '#fff', 'center');
    txt('Deletes your save and restarts the game', x + w / 2, y + 254, 15, '#ffd0d0', 'center');
    ctx.font = '18px monospace'; ctx.fillStyle = '#b8c0ff';
    ['Move: joystick or WASD / arrows', 'A button or Space: talk or swing sword', 'J or Esc: open / close Journal', 'Up / Down: switch tabs (keyboard)', '',
     'Battle: touch a monster girl or hit her', 'with the sword (first strike).', 'Weaken her, then use Befriend.', 'Rest in the village to heal.', '', 'Isekai: Land of Girls  v14'].forEach((s, i) => ctx.fillText(s, x, y + 330 + i * 30));
  }
  function drawJournal() {
    ctx.fillStyle = '#070b2a'; ctx.fillRect(0, 0, 720, 1280);
    win(14, 14, 692, 66);
    txt('JOURNAL', 38, 58, 32, '#fff');
    ctx.fillStyle = '#000'; ctx.fillRect(620, 20, 80, 54); ctx.fillStyle = '#c0392b'; ctx.fillRect(623, 23, 74, 48);
    txt('X', 660, 58, 32, '#fff', 'center');
    win(14, 98, 186, 1166);
    TABS.forEach((name, i) => {
      const ty = 108 + i * 96, sel = i === journal.tab;
      if (sel) { ctx.fillStyle = 'rgba(240,208,112,0.22)'; ctx.fillRect(18, ty, 178, 88); }
      if (sel) { ctx.fillStyle = '#f0d070'; ctx.beginPath(); ctx.moveTo(26, ty + 30); ctx.lineTo(26, ty + 58); ctx.lineTo(44, ty + 44); ctx.fill(); }
      txt(name, 54, ty + 52, sel ? 22 : 20, sel ? '#f0d070' : '#e8e8f0');
    });
    win(216, 98, 490, 1166);
    txt(TABS[journal.tab].toUpperCase(), 240, 140, 24, '#f0d070');
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(240, 152, 442, 2);
    if (journal.lastTab !== journal.tab) { journal.lastTab = journal.tab; journal.scroll = 0; }
    journal.max = 0;
    ctx.save(); ctx.beginPath(); ctx.rect(216, 160, 490, 1102); ctx.clip();
    ctx.translate(0, -journal.scroll);
    [tabProfile, tabEquip, tabParty, tabItems, tabQuests, tabBestiary, tabSystem][journal.tab](240, 176, 442);
    ctx.restore();
    journal.scroll = Math.max(0, Math.min(journal.max, journal.scroll));
    scrollBar(698, 164, 1090, journal);
    if (journal.tab === 2) tabPartyFooter(240, 176);
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    if (B) { drawBattle(); return; }
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, 720, 1280);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
    drawGround();
    const items = [];
    M.trees.forEach(tp => items.push({ y: (tp[1] + 1) * TILE, f: () => drawObstacle(tp) }));
    M.houses.forEach(h => items.push({ y: (h.y + 2) * TILE, f: () => drawHouse(h) }));
    M.torches.forEach(tp => items.push({ y: (tp[1] + 1) * TILE, f: () => drawTorch(tp) }));
    M.signs.forEach(sg => items.push({ y: (sg.y + 1) * TILE, f: () => drawSign(sg) }));
    M.npcs.forEach(n => items.push({ y: n.y * TILE, f: () => drawNpc(n) }));
    M.monsters.forEach(m => items.push({ y: m.y, f: () => drawMon(m, false) }));
    party.forEach(p => items.push({ y: p.y, f: () => drawMon(p, true) }));
    items.push({ y: player.y, f: drawPlayer });
    items.sort((a, b) => a.y - b.y).forEach(i => i.f());
    if (M.tint) { ctx.fillStyle = M.tint; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    if (M.dark) drawDarkness();
    ctx.restore();
    drawHud();
    drawDialogue();
    if (toast) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(30, 110, 560, 56);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.fillText(toast.s, 310, 146); ctx.textAlign = 'left';
    }
    drawControls();
    if (journal.open) drawJournal();
    if (forge.open) drawForge();
    if (shop.open) drawShop();
  }

  function loop(ts) {
    const dt = Math.min(0.11, (ts - last) / 1000 || 0); last = ts;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(ts => { last = ts; loop(ts); });
}
window.run = run;
</script>
</body>
</html>
