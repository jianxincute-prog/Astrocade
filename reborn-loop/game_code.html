<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Soulshard Saga</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#gl,#hud,#touch{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#touch{touch-action:none}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;display:none;z-index:10}
.scr{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;background:rgba(8,5,20,.82);display:flex;flex-direction:column;align-items:center;padding:34px 40px 40px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.scr.mid{justify-content:center}
h1{margin:0;font:900 74px 'Trebuchet MS',sans-serif;color:#ffd740;letter-spacing:2px;text-shadow:0 5px 0 #7a1fa2,0 9px 22px rgba(0,0,0,.6);text-align:center}
h2{margin:26px 0 8px;font:900 34px sans-serif;color:#b9a6ff;letter-spacing:3px;align-self:flex-start}
.sub{font:700 24px sans-serif;color:#cfd8ff;text-align:center;margin:6px 0 4px;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin:12px 0 10px;font:800 26px sans-serif}
.stats b{color:#ffd740}
.big{width:620px;min-height:104px;border-radius:28px;border:5px solid #fff;background:linear-gradient(#e91e63,#a3144a);color:#fff;font:900 44px sans-serif;box-shadow:0 8px 0 #5a0b2c;margin:14px 0 6px;cursor:pointer;animation:pl 1.2s infinite}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 #5a0b2c}
.big.alt{background:linear-gradient(#3f8cff,#1f4fb0);box-shadow:0 8px 0 #112a63;animation:none}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.card{width:640px;box-sizing:border-box;margin:8px 0;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.09);border:3px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:16px}
.card .ic{font-size:50px;width:70px;text-align:center;flex:none}
.card .tx{flex:1;min-width:0}
.card .nm{font:900 28px sans-serif}
.card .ds{font:600 20px sans-serif;color:#cdd3ee;margin-top:2px}
.card .lv{font:800 20px sans-serif;color:#ffd740;margin-top:3px}
.card .bt{flex:none;min-width:150px;min-height:96px;border-radius:20px;border:4px solid #fff;background:linear-gradient(#43a047,#1b6b2a);color:#fff;font:900 26px sans-serif;cursor:pointer}
.card .bt[disabled]{background:#444;border-color:#777;color:#999}
.card.own{border-color:#ffd740}
.pick{cursor:pointer;min-height:150px;border-color:#b9a6ff;background:rgba(120,90,255,.18)}
.pick:active{transform:scale(.97)}
.tabs{display:flex;gap:10px;width:640px;margin:14px 0 6px}
.tab{flex:1;min-height:96px;border-radius:20px;border:4px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#cfd8ff;font:900 26px sans-serif;cursor:pointer}
.tab.on{background:linear-gradient(#7e57c2,#4527a0);border-color:#fff;color:#fff}
.slots{display:flex;gap:12px;width:640px;margin:8px 0}
.slot{flex:1;min-height:120px;border-radius:20px;border:4px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 20px sans-serif;background:rgba(0,0,0,.25);padding:6px;text-align:center}
.slot.on{border-style:solid;background:rgba(124,77,255,.3)}
.slot .si{font-size:44px}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
.card .top{display:flex;align-items:center;gap:16px}
.card .row{display:flex;gap:10px;justify-content:flex-end}
.card .row .bt{min-width:96px;min-height:96px;padding:0 10px}
.card .row .bt.wide{flex:1}
.card .row .bt.sl{min-width:96px;width:96px;background:linear-gradient(#546e7a,#2c3e46);font-size:34px}
.card .row .bt.sl.on{background:linear-gradient(#7e57c2,#4527a0);border-color:#ffd740}
.lines{font:700 22px sans-serif;color:#dfe6ff;text-align:center;line-height:1.55}
.dead h1{color:#ff5252}
.codex{display:flex;flex-wrap:wrap;gap:8px;width:640px}
.codex span{font:700 18px sans-serif;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.1)}
.codex span.on{background:rgba(124,77,255,.55)}
#loader{position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;background:radial-gradient(#3a2a6a,#0a0618);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#loader .lt{font:900 84px sans-serif;color:#ffd740;text-shadow:0 6px 0 #7a1fa2,0 10px 24px rgba(0,0,0,.5);text-align:center}
#loader .ls{font:800 28px sans-serif;margin-top:10px;opacity:.9}
.lbw{width:520px;height:30px;border-radius:15px;background:rgba(0,0,0,.55);border:4px solid #fff;overflow:hidden;margin-top:50px}
#lb{height:100%;width:0;background:linear-gradient(90deg,#aeea00,#64dd17)}
#lp{font:800 26px sans-serif;margin-top:16px}
/* Soulshard Saga — lightweight cinematic loading identity */
#loader{background:radial-gradient(ellipse at 50% 47%,#173d54 0%,#111c35 36%,#060914 78%);isolation:isolate;justify-content:flex-start;padding:140px 44px 70px;box-sizing:border-box;overflow:hidden}
#loader:before{content:'';position:absolute;inset:18px;border:1px solid rgba(222,193,126,.25);pointer-events:none}
#loader:after{content:'';position:absolute;width:620px;height:620px;top:350px;border-radius:50%;border:1px solid #63dfff33;box-shadow:0 0 100px #34d9ff12,inset 0 0 100px #34d9ff12;transform:rotateX(65deg);z-index:-1}
#loader .lk{font:700 18px sans-serif;letter-spacing:7px;color:#a9c5d4;margin-bottom:25px;text-align:center}
#loader .lt{font:900 76px/1.04 Georgia,serif;letter-spacing:3px;color:#ffe6ab;text-shadow:0 3px 0 #73542f,0 8px 25px #000;position:relative}
#loader .lt span{display:block;font-size:88px;letter-spacing:14px;color:#fff1cf;margin-top:8px}
#loader .ls{font:600 22px sans-serif;letter-spacing:2px;color:#b0cad8;margin-top:26px;text-align:center}
.soul-stage{position:relative;width:100%;height:390px;flex:1;min-height:260px;max-height:460px;display:grid;place-items:center;perspective:800px}
.soul-gem{width:130px;height:220px;position:relative;filter:drop-shadow(0 0 32px #36dfff);animation:soulFloat 4s ease-in-out infinite}
.soul-gem:before,.soul-gem:after{content:'';position:absolute;inset:0;clip-path:polygon(50% 0,100% 44%,50% 100%,0 44%);background:conic-gradient(from 10deg at 50% 44%,#e7ffff,#29bee5,#074977,#6ef4ff,#efffff);border-radius:4px}
.soul-gem:after{inset:10px 24px 27px 20px;background:linear-gradient(115deg,#ffffffcc,transparent 48%,#00376099);clip-path:polygon(50% 0,100% 44%,50% 100%,47% 44%)}
.soul-stage i{position:absolute;width:5px;height:5px;background:#c8fbff;box-shadow:0 0 12px #47e6ff;border-radius:50%;animation:soulMote 5s ease-in-out infinite;left:25%;top:60%}
.soul-stage i:nth-child(2){left:72%;top:36%;animation-delay:-2s}.soul-stage i:nth-child(3){left:65%;top:76%;animation-delay:-3s}.soul-stage i:nth-child(4){left:33%;top:24%;animation-delay:-1s}
#loader .load-panel{width:100%;max-width:540px;text-align:center}
#loader .lbw{width:100%;box-sizing:border-box;height:16px;border:1px solid #b1dce466;border-radius:8px;margin-top:22px;background:#030813;padding:3px}
#loader #lb{border-radius:4px;background:linear-gradient(90deg,#237ea4,#69ebff,#edffff);box-shadow:0 0 16px #5fe9ff;transition:width .25s ease}
#loader #lp{font:600 21px sans-serif;color:#d2e6ed;margin:18px 0 0;min-height:26px}
#loader .load-label{display:flex;justify-content:space-between;font:700 17px sans-serif;letter-spacing:3px;color:#c9b983}
#loader .load-note{font:400 20px/1.5 sans-serif;color:#91a9ba;margin:32px auto 0;max-width:480px;min-height:60px}
@keyframes soulFloat{0%,100%{transform:translateY(12px) rotateY(-18deg) rotateZ(-6deg)}50%{transform:translateY(-12px) rotateY(18deg) rotateZ(6deg)}}
@keyframes soulMote{0%,100%{transform:translateY(18px);opacity:.2}50%{transform:translateY(-22px);opacity:.9}}
@media(prefers-reduced-motion:reduce){.soul-gem,.soul-stage i{animation:none}}
</style>

</div>
<script>
/* ============================================================================
   REBORN LOOP: WORLD — a 3D third-person open-world action roguelite.
   The world is a 500 x 500 unit land split into four regions: the central
   Whispering Forest and three outer regions (Bone Crypt, Magma Depths, Void
   Spire, in a shuffled order). Your hero auto-attacks nearby enemies; you move,
   jump, dash and trigger a Soul Blast. Four Guardians rule the regions. You WILL
   die: each death pays out Soul Shards (exploration, kills, bosses, treasure)
   that buy permanent upgrades and talents, and adds a small permanent Echo
   bonus. During a life, kills level you up and you pick a boon.

   ============================================================================ */
'use strict';
const SW=720,SH=1280,HALF=250;
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

 {n:'Whispering Forest',top:'#5fb8f5',sky:'#bfe6ff',gr:'#56b04a',dirt:'#6d4c2f',water:'#2e86de',fogN:30,fogF:125,leaf:['#3f9a45','#4fae4e','#2f8a3c'],bark:'#6b4a2b',rock:'#8a8f98'},
 {n:'Bone Crypt',top:'#241d3a',sky:'#6a5a8c',gr:'#8f8ca6',dirt:'#4a465c',water:'#2f7d86',fogN:18,fogF:95,leaf:['#8d8aa0','#a7a4bb'],bark:'#5a5568',rock:'#6e6a80'},
 {n:'Magma Depths',top:'#340b0b',sky:'#b04414',gr:'#7a4430',dirt:'#3b1e14',water:'#8e3bb0',fogN:16,fogF:90,leaf:['#6a3a2a','#8a4a30'],bark:'#2a1a14',rock:'#4a2a22'},

 {k:'whirl',n:'Blade Whirlwind',ic:'🌀',col:'#b2ff59',cost:2800,cd:12,ds:'Spin with your blade, shredding all around you.',d:l=>(2+0.4*l).toFixed(1)+'s · hits ×'+(0.6+0.1*l).toFixed(1)+' · radius '+(4+0.3*l).toFixed(1)},
 {k:'aegis',n:'Aegis Barrier',ic:'🛡️',col:'#4fc3f7',cost:3600,cd:16,ds:'A holy barrier soaks up damage.',d:l=>'Absorbs '+Math.round((0.3+0.07*l)*100)+'% max HP · '+(6+l)+'s'},

];

 {k:'grace',n:'Deathward',ic:'☀️',ds:'Once per life, the goddess cheats death, even from instant-kill traps.',cost:10000},

];
const BOONS=[
 {k:'pow',n:'Berserk',ic:'⚔️',d:'+25% damage'},

 {k:'swift',n:'Windstep',ic:'💨',d:'+10% move speed'},

async function loadSave(){
  try{
    const r=await lib.getUserGameState();
    if(r&&r.state){
      const s=r.state,d=defaultState();
      S=Object.assign(d,s);S.sk=Object.assign(d.sk,s.sk);S.pas=Object.assign({},s.pas);S.tal=Object.assign(d.tal,s.tal);S.opt=Object.assign(d.opt,s.opt);

/* ============================ NOISE / HEIGHTMAP ============================ */
function makeNoise(seed){
  const r=mulberry(seed),P=new Uint8Array(512),p=[];for(let i=0;i<256;i++)p.push(i);
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)P[i]=p[i&255];
  const V=new Float32Array(256);for(let i=0;i<256;i++)V[i]=r();
  return(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=V[P[P[X]+Y]],b=V[P[P[X+1]+Y]],c=V[P[P[X]+Y+1]],d=V[P[P[X+1]+Y+1]];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
let N1,N2,N3,N4,N5,WRL=null;
const HM=new Float32Array(501*501);
function planWorld(route){
  const seed=1337+route*7919+(CFG().worldSeed|0)*31,rr=mulberry(seed);
  const order=[1,2,3];for(let i=2;i>0;i--){const j=(rr()*(i+1))|0;const t=order[i];order[i]=order[j];order[j]=t;}
  const th0=rr()*TAU;
  N1=makeNoise(seed+1);N2=makeNoise(seed+2);N3=makeNoise(seed+3);N4=makeNoise(seed+4);N5=makeNoise(seed+5);
  const arenas=[],a0=th0+Math.PI/3;
  arenas.push({x:Math.cos(a0)*78,z:Math.sin(a0)*78,zone:0,theme:0});
  for(let i=0;i<3;i++){const a=th0+i*TAU/3;arenas.push({x:Math.cos(a)*180,z:Math.sin(a)*180,zone:i+1,theme:order[i]});}
  const sites=[{x:0,z:0,r0:30,r1:46}];arenas.forEach(a=>sites.push({x:a.x,z:a.z,r0:22,r1:38}));
  // start points: 0 = village, k = shrine beside the arena of zone k-1, on the side facing the centre
  const sp=[{x:0,z:6}];
  for(let k=1;k<=3;k++){const a=arenas[k-1],d=Math.hypot(a.x,a.z)||1;sp.push({x:a.x-a.x/d*17,z:a.z-a.z/d*17});}
  WRL={route,seed,order,th0,zoneTheme:[0].concat(order),arenas,sites,sp,rr,altar:{x:0,z:-16},hub:{x:0,z:-5.6}};
}
function zoneAt(x,z){
  const r=Math.hypot(x,z),pn=N5(x*0.02,z*0.02)-0.5;
  if(r+pn*40<100)return 0;
  let a=Math.atan2(z,x)+pn*0.5-WRL.th0+Math.PI/3;a=((a%TAU)+TAU)%TAU;
  return 1+Math.min(2,(a/(TAU/3))|0);
}
const themeAt=(x,z)=>WRL.zoneTheme[zoneAt(x,z)];
function rawH(x,z){
  let h=3+(N1(x*0.010+7,z*0.010)-0.5)*12+(N2(x*0.035,z*0.035)-0.5)*3.5+(N3(x*0.13,z*0.13)-0.5)*0.6;
  const lk=N4(x*0.016+50,z*0.016+20);if(lk>0.64)h-=sstep(0.64,0.74,lk)*11;
  for(const s of WRL.sites){const d=Math.hypot(x-s.x,z-s.z);if(d<s.r1)h=lerp(h,2.2,1-sstep(s.r0,s.r1,d));}
  const e=Math.max(Math.abs(x),Math.abs(z));if(e>200)h+=sstep(200,248,e)*38;
  return h;
}
function bakeHeights(){for(let iz=0;iz<501;iz++)for(let ix=0;ix<501;ix++)HM[iz*501+ix]=rawH(ix-250,iz-250);}
function H(x,z){
  x=clamp(x+250,0,499.999);z=clamp(z+250,0,499.999);
  const ix=x|0,iz=z|0,fx=x-ix,fz=z-iz,i=iz*501+ix,a=HM[i],b=HM[i+1],c=HM[i+501],d=HM[i+502];
  return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;
}
const groundY=(x,z)=>Math.max(H(x,z),-0.55);
const inDeep=(x,z)=>H(x,z)<-1.0;
function nearSite(x,z,pad){for(const s of WRL.sites){if(Math.hypot(x-s.x,z-s.z)<s.r0+pad)return true;}return false;}

const _c1=new THREE.Color();
function groundCol(x,z,h,out){
  const T=THEMES[themeAt(x,z)],n=N3(x*0.21,z*0.21),n2=N2(x*0.05,z*0.05);
  const sl=Math.abs(H(x+1.6,z)-H(x-1.6,z))+Math.abs(H(x,z+1.6)-H(x,z-1.6));
  out.copy(T.cGr).lerp(T.cDirt,clamp(sl*0.32+(n2-0.5)*0.9+0.12,0,1));
  if(h<0.9)out.lerp(T.cDirt,clamp((0.9-h)*0.6,0,0.85));
  if(h<-0.3)out.multiplyScalar(0.7);
  const e=Math.max(Math.abs(x),Math.abs(z));if(e>192)out.lerp(_c1.set('#2b2b36'),sstep(192,232,e));
  out.multiplyScalar(0.9+n*0.2);
  return out;
}

function bakeMap(){
  mapBase=document.createElement('canvas');mapBase.width=mapBase.height=125;
  const x=mapBase.getContext('2d'),im=x.createImageData(125,125),c=new THREE.Color();
  for(let j=0;j<125;j++)for(let i=0;i<125;i++){
    const wx=i*4-248,wz=j*4-248,h=H(wx,wz),T=THEMES[themeAt(wx,wz)];
    if(h<0){c.copy(T.cWater).multiplyScalar(h<-1?0.7:0.95);}

    const o=(j*125+i)*4;im.data[o]=c.r*255;im.data[o+1]=c.g*255;im.data[o+2]=c.b*255;im.data[o+3]=255;
  }

function exploreAt(wx,wz){ // returns number of newly explored 8-unit cells
  let n=0;const cx=((wx+250)/8)|0,cz=((wz+250)/8)|0;
  for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){
    if(i*i+j*j>10)continue;const a=cx+i,b=cz+j;if(a<0||b<0||a>62||b>62)continue;
    const k=b*63+a;if(!exploredG[k]){exploredG[k]=1;n++;}
  }

}

  for(let i=PT_.length-1;i>=0;i--){
    const p=PT_[i];p.l-=dt;if(p.l<=0){PT_[i]=PT_[PT_.length-1];PT_.pop();continue;}
    p.vy-=16*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const gy=groundY(p.x,p.z);if(p.y<gy){p.y=gy;p.vy*=-0.3;p.vx*=0.8;p.vz*=0.8;}
  }

  for(let i=0;i<PT_.length;i++){
    const p=PT_[i];_dm.position.set(p.x,p.y,p.z);_dm.scale.setScalar(p.s*clamp(p.l/p.l0*1.6,0,1));_dm.updateMatrix();pInst.setMatrixAt(i,_dm.matrix);_pc.setRGB(p.r,p.g,p.b);pInst.setColorAt(i,_pc);

  for(let i=POPS.length-1;i>=0;i--){POPS[i].a-=dt;POPS[i].y+=dt*1.6;if(POPS[i].a<=0)POPS.splice(i,1);}

  o=o||{};const d=ED[t],zn=o.zone!=null?o.zone:(camp?camp.zone:zoneAt(x,z));
  const g=makeBody(t,d);
  const sc=o.scale||1,mh=d.hp*HPM*(o.hpMul||1)*(1+0.9*zn)*threat()*CFG().enemyScale;
  const e={t,d,x,z,y:groundY(x,z),vx:0,vz:0,vy:0,kx:0,kz:0,face:Math.random()*TAU,zone:zn,mhp:mh,hp:mh,dmg:d.dmg*DMGM*(1+0.6*zn)*(1+0.5*(threat()-1)),sp:d.sp*1.1,sp0:d.sp*1.1,slow:0,wind:d.wind||0.55,r:d.r*sc,sc,g,cd:0.6,tm:Math.random()*1.5,camp,flash:0,dead:false,dying:0,aggro:false,mini:!!o.mini,oa:Math.random()*TAU,mode:0,down:0,fuse:0,gasT:1,shT:2,atkw:0,hop:0,wk:0};
  g.scale.setScalar(sc);g.position.set(x,e.y,z);
  g.add(mkShadow(d.r*1.1));
  if(VCOL[t]){e.aura=mkAura(VCOL[t]);e.aura.position.y=0.15;e.aura.scale.setScalar(d.r*1.3);e.aura.visible=!!S.tal.sense;g.add(e.aura);}
  entRoot.add(g);E.push(e);if(camp)camp.members.push(e);return e;
}
function spawnBoss(zi){
  const a=WRL.arenas[zi],th=a.theme,b=BD[th],g=b.build();
  const mh=b.hp*1.5*(1+0.9*zi)*threat()*CFG().enemyScale;
  g.add(mkShadow(b.r*1.4));g.position.set(a.x,groundY(a.x,a.z),a.z);entRoot.add(g);
  const e={t:'boss',boss:true,bd:b,btype:th,d:{shape:'boss',sp:b.sp,xp:80+60*zi},x:a.x,z:a.z,y:g.position.y,vx:0,vz:0,vy:0,kx:0,kz:0,face:0,zone:zi,mhp:mh,hp:mh,dmg:b.dmg*1.4*(1+0.6*zi)*(1+0.5*(threat()-1)),sp:b.sp,sp0:b.sp,slow:0,r:b.r,sc:1,g,cd:1,tm:0,flash:0,dead:false,dying:0,aggro:false,arena:a,cdA:3,act:null,lock:0,ph:1,charge:null,wk:0,sum:0,mode:0,down:0,fuse:0};
  E.push(e);banner(b.n.toUpperCase(),'Guardian of '+THEMES[th].n,b.lbl);sfx.boss();return e;
}
function stepE(e,tx,tz,sp,dt){
  const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz);if(d<0.01)return;
  const vx=dx/d*sp,vz=dz/d*sp,nx=e.x+vx*dt,nz=e.z+vz*dt;
  if(e.d.fly||H(nx,e.z)>-0.7)e.x=nx;if(e.d.fly||H(e.x,nz)>-0.7)e.z=nz;
  e.face=Math.atan2(dx,dz);
}
function damageEnemy(e,dmg,kx,kz,crit){
  if(e.dead||e.down>0)return;
  if(S.tal.exec&&e.hp<e.mhp*0.3)dmg*=1.5;
  e.hp-=dmg;e.flash=0.1;e.aggro=true;
  popup(e.x,e.y+(e.boss?e.bd.r*2.4:2.4),e.z,String(Math.round(dmg)),crit?'#ffea00':'#ffffff',crit);
  const kb=e.boss?0.25:1;e.kx+=kx*kb;e.kz+=kz*kb;
  burst(e.x,e.y+1.2,e.z,crit?'#ffea00':'#ffffff',crit?8:4,5,0.4,0.2,2);
  crit?sfx.crit():sfx.hit();
  if(e.t==='leech'&&false)return;
  if(e.hp<=0){
    if(e.t==='rev'&&!e.revived){e.revived=true;e.hp=e.mhp*0.5;e.down=2.4;popup(e.x,e.y+2.6,e.z,'...','#b388ff',false);burst(e.x,e.y+1,e.z,'#b388ff',10,4,0.7,0.25,2);return;}
    killEnemy(e);
  }
}
function killEnemy(e,quiet){
  if(e.dead)return;e.dead=true;e.dying=e.boss?1.6:0.35;
  if(e.camp){e.camp.killed++;if(e.camp.killed>=e.camp.n){e.camp.state=2;e.camp.cool=150;}}
  if(quiet){burst(e.x,e.y+1,e.z,'#ff9800',14,7,0.6,0.3,3);return;}
  R.kills++;
  const xp=e.d.xp*(1+0.5*e.zone)*1.35*xpMul();gainXp(xp);
  burst(e.x,e.y+1,e.z,e.boss?'#ffd740':(e.d.col||'#fff'),e.boss?40:12,e.boss?12:6,0.7,0.3,3);
  if(S.tal.siphon){const h_=Math.round(maxHp()*0.02);P.hp=Math.min(maxHp(),P.hp+h_);popup(P.x,P.y+2.6,P.z,'+'+h_,'#69f0ae',false);}
  if(S.tal.momentum){for(let i=0;i<SLOTS;i++)P.cd[i]=Math.max(0,P.cd[i]-0.4);}
  if(!e.mini||Math.random()<0.4)drop('xp',e.x,e.z,xp/(e.boss?10:2),e.boss?10:(1+((Math.random()*2)|0)));
  if(Math.random()<(e.boss?0:(0.45+R.bn.magnet*0.1)))drop('sh',e.x,e.z,(2+e.zone*2)*(1+((Math.random()*2)|0)),1);
  if(Math.random()<(0.07+0.04*R.bn.magnet))drop('hp',e.x,e.z,maxHp()*0.14,1);
  if(e.t==='split'&&!e.mini){for(let i=0;i<2;i++)spawnEnemy('slime',e.x+(i?1:-1),e.z,e.camp&&null,{zone:e.zone,scale:0.6,hpMul:0.5,mini:true});}
  if(e.t==='fart'){addGas(e.x,e.z,3.2,4.5,7*(1+0.6*e.zone),'fart');}
  if(e.t==='shroom'){addGas(e.x,e.z,3.0,4.5,6*(1+0.6*e.zone),'spore');}
  if(e.boss)bossDown(e);
  else discoverKill(e);
}
function discoverKill(e){if(VCOL[e.t])discover(e.t);}
function bossDown(e){
  const z=e.zone;R.bossesKilled++;R.bossDead[z]=true;R.bossShards+=150*(z+1);
  S.bd[z]=1;S.bosses++;
  banner('GUARDIAN SLAIN',e.bd.n,'#ffd740');sfx.win();shake=1;
  drop('sh',e.x,e.z,40*(z+1),6);drop('hp',e.x,e.z,maxHp()*0.35,2);
  HZ.forEach(h=>{if(h.k==='tele'&&h.boss){h.t=-1;h.dmg=0;}});
  save();
  if(S.bd.every(v=>v))setTimeout(()=>{if(R&&!R.dead)finishRun(true);},2200);
}
function gainXp(v){R.xp+=v;while(R.xp>=R.need){R.xp-=R.need;R.lvl++;R.need=Math.floor(40+R.lvl*26);R.pend++;}}

function updateEnemies(dt){
  for(let i=E.length-1;i>=0;i--){
    const e=E[i];
    if(e.dead){
      e.dying-=dt;const k=Math.max(0.001,e.dying/(e.boss?1.6:0.35));e.g.scale.setScalar(e.sc*k);e.g.position.y=e.y+(e.boss?(1-k)*1.5:0);
      if(e.dying<=0){entRoot.remove(e.g);E.splice(i,1);}
      continue;
    }
    const dx=P.x-e.x,dz=P.z-e.z,dp=Math.hypot(dx,dz);
    if(e.flash>0){e.flash-=dt;if(e.flash<=0)setFlash(e.g,false);else setFlash(e.g,true);}
    e.cd-=dt;
    if(e.slow>0){e.slow-=dt;e.sp=e.sp0*(e.boss?0.75:0.4);if(Math.random()<dt*6)burst(e.x,e.y+1,e.z,'#b3e5fc',1,1,0.5,0.2,0.5);}else e.sp=e.sp0;
    const kk=Math.hypot(e.kx,e.kz);if(kk>0.1){e.x+=e.kx*dt;e.z+=e.kz*dt;e.kx*=Math.max(0,1-dt*7);e.kz*=Math.max(0,1-dt*7);}
    if(e.boss){updateBoss(e,dt,dx,dz,dp);}
    else{
      if(!e.aggro&&dp<21)e.aggro=true;
      if(e.aggro&&dp>48)e.aggro=false;
      if(e.down>0){
        e.down-=dt;e.g.scale.y=e.sc*0.25;if(e.down<=0){e.g.scale.y=e.sc;burst(e.x,e.y+1,e.z,'#b388ff',10,4,0.5,0.25,2);}
      }else if(e.aggro){
        const sh=e.d.shape,ai=e.d.ai;
        if(ai==='lunge')aiLunge(e,dt,dx,dz,dp);
        else if(ai==='shoot')aiShoot(e,dt,dx,dz,dp);
        else if(ai==='shroom')aiShroom(e,dt,dx,dz,dp);
        else if(ai==='melee'||sh==='skel')aiSkel(e,dt,dx,dz,dp);
        else if(sh==='slime')aiSlime(e,dt,dx,dz,dp);
        else aiBat(e,dt,dx,dz,dp);
      }else if(e.d.fly){e.y=groundY(e.x,e.z)+2.6+Math.sin(gt*2+e.oa)*0.3;}
      if(!e.d.fly){
        const gy=groundY(e.x,e.z);
        if(e.vy!==0||e.y>gy+0.02){e.vy-=24*dt;e.y+=e.vy*dt;if(e.y<=gy){e.y=gy;e.vy=0;}}else e.y=gy;
      }
      if(!e.d.phase)pushOut(e,e.r*0.8);
      e.x=clamp(e.x,-243,243);e.z=clamp(e.z,-243,243);
      animEnemy(e,dt);
    }
    e.g.position.set(e.x,e.y,e.z);e.g.rotation.y=e.face;
    if(e.d.fly){const s=e.g.children[e.g.children.length-(e.aura?2:1)];if(s&&s.geometry===SHADOW_G){s.position.y=groundY(e.x,e.z)-e.y+0.07;}}
  }
  // separation
  for(let i=0;i<E.length;i++){
    const a=E[i];if(a.dead||a.boss)continue;
    for(let j=i+1;j<E.length;j++){
      const b=E[j];if(b.dead||b.boss)continue;
      const dx=b.x-a.x,dz=b.z-a.z,rr=(a.r+b.r)*0.85,d2=dx*dx+dz*dz;
      if(d2<rr*rr&&d2>1e-4){const d=Math.sqrt(d2),p=(rr-d)/d*0.5;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}
    }
  }
}
function contactHit(e,dp,reach){
  if(e.cd<=0&&dp<e.r+0.6+(reach||0)&&Math.abs(P.y-e.y)<2.4){
    if(hurtPlayer(e.dmg,e.t,P.x-e.x,P.z-e.z)){e.cd=1.0;if(e.t==='leech'){e.hp=Math.min(e.mhp,e.hp+e.dmg*2);popup(e.x,e.y+2.4,e.z,'+'+Math.round(e.dmg*2),'#ff5252',false);}}
  }
}
function aiSlime(e,dt,dx,dz,dp){
  if(e.t==='bomb'){
    if(e.fuse>0){e.fuse-=dt;setFlash(e.g,Math.floor(e.fuse*12)%2===0);if(e.fuse<=0){
      setFlash(e.g,false);burst(e.x,e.y+1,e.z,'#ff6d00',30,10,0.7,0.4,4);burst(e.x,e.y+1,e.z,'#ffeb3b',16,8,0.5,0.3,3);sfx.boom();shake=Math.max(shake,0.6);
      const pd=Math.hypot(P.x-e.x,P.z-e.z);if(pd<5.0)hurtPlayer(e.dmg*3.2,'blast',P.x-e.x,P.z-e.z);
      killEnemy(e,true);return;}
      return;}
    if(dp<3.6)e.fuse=0.95;
  }
  e.tm-=dt;
  if(e.hop>0){e.hop-=dt;stepE(e,P.x,P.z,e.sp*2.4,dt);}
  else if(e.tm<=0){e.hop=0.45;e.vy=6;e.tm=0.55+Math.random()*0.5;e.face=Math.atan2(dx,dz);}
  if(e.t==='fart'){e.gasT-=dt;if(e.gasT<=0&&dp<24){addGas(e.x,e.z,2.0,4.0,6*(1+0.6*e.zone),'fart');e.gasT=1.8;}}
  if(e.t==='acid'){e.shT-=dt;if(e.shT<=0&&dp<17&&dp>4){fireProj(e.x,e.y+1,e.z,dx,dz,9,e.dmg*1.3,'#9be22b',{src:'acid'});sfx.spit();e.shT=2.6;}}
  contactHit(e,dp,0.3);
}
function aiSkel(e,dt,dx,dz,dp){
  if(e.atkw>0){
    e.atkw-=dt;e.face=Math.atan2(dx,dz);
    if(e.atkw<=0){
      const rc=e.d.reach||3.3;sfx.swing();if(dp<rc)hurtPlayer(e.dmg,e.t,dx,dz);e.cd=1.4;
      if(e.d.slam){const sx=e.x+Math.sin(e.face)*2.2,sz=e.z+Math.cos(e.face)*2.2;ringFx(sx,sz,rc,e.d.crys?'#d1b3ff':'#ff9e40');burst(sx,e.y+0.4,sz,e.d.crys?'#d1b3ff':'#ff9e40',18,7,0.6,0.3,3);shake=Math.max(shake,0.35);sfx.slam();}
    }
    return;
  }
  if(dp>1.8)stepE(e,P.x,P.z,e.sp,dt);else e.face=Math.atan2(dx,dz);
  if(dp<(e.d.reach||3.3)-0.7&&e.cd<=0){e.atkw=e.wind;}
}
function aiBat(e,dt,dx,dz,dp){
  const gy=groundY(e.x,e.z);
  if(e.mode===0){
    e.oa+=dt*1.5;e.tm-=dt;
    stepE(e,P.x+Math.cos(e.oa)*6,P.z+Math.sin(e.oa)*6,e.sp,dt);
    e.y=lerp(e.y,gy+2.8+Math.sin(gt*3+e.oa)*0.4,dt*4);
    if(e.tm<=0&&dp<22){e.mode=1;e.dt=1.0;e.tx=P.x;e.tz=P.z;}
  }else if(e.mode===1){
    e.dt-=dt;stepE(e,e.tx,e.tz,e.sp*2.4,dt);e.y=lerp(e.y,Math.max(gy,H(e.tx,e.tz))+1.0,dt*7);
    contactHit(e,dp,0.5);
    if(e.dt<=0){e.mode=2;e.dt=0.9;}
  }else{e.dt-=dt;e.y=lerp(e.y,gy+3.2,dt*3);if(e.dt<=0){e.mode=0;e.tm=1.8+Math.random()*1.5;}}
}
function animEnemy(e,dt){
  const p=e.g.userData.p,sh=e.d.shape;
  if(sh==='slime'){const s=e.vy>0?1.18:e.vy<0?0.9:1;p.body.scale.y=lerp(p.body.scale.y,s+(e.fuse>0?Math.sin(gt*40)*0.1:0),dt*12);}
  else if(sh==='skel'){e.wk+=dt*(e.aggro&&e.atkw<=0?9:0);p.lL.rotation.x=Math.sin(e.wk)*0.8;p.lR.rotation.x=-Math.sin(e.wk)*0.8;p.aL.rotation.x=-Math.sin(e.wk)*0.6;p.aR.rotation.x=e.atkw>0?-2.4+(1-e.atkw/0.55)*2.4:Math.sin(e.wk)*0.6;}
  else if(ANIM[sh])ANIM[sh](e,p,dt);
  else{const f=Math.sin(gt*(e.mode===1?24:14)+e.oa)*0.7;p.wL.rotation.z=f;p.wR.rotation.z=-f;}
}

/* ---------------- bosses ---------------- */
function bossAttackList(e){
  const t=e.btype,l=[];
  if(t===0){l.push('slam','roots','roots');if(!e.sum||e.ph===2)l.push('summon');}
  else if(t===1){l.push('orbs','rain','blink','orbs');if(e.ph===2)l.push('summon');}
  else if(t===2){l.push('charge','slam','quake','charge');}
  else{l.push('ring','blinkstrike','slam','ring');if(e.ph===2&&!e.sum)l.push('summon');}
  return l;
}
function bossAttack(e,k,dx,dz,dp){
  const d=e.dmg,ph2=e.ph===2,a=e.arena;
  const T=(x,z,r,t,dm,o)=>tele(x,z,r,t,dm,Object.assign({boss:true,src:e.bd.n},o||{}));
  switch(k){
    case 'slam':T(e.x,e.z,e.t==='boss'&&e.btype===2?8.5:7.5,1.1,d*1.2,{slam:1});e.lock=1.3;break;
    case 'roots':for(let i=0;i<3;i++){const ox=i?(Math.random()-0.5)*8:0,oz=i?(Math.random()-0.5)*8:0;T(P.x+ox,P.z+oz,3.2,1.0+i*0.35,d*0.8,{root:1.3});}e.lock=1.0;break;
    case 'summon':e.sum=1;for(let i=0;i<3;i++){const an=i/3*TAU;spawnEnemy(e.btype===0?'slime':e.btype===1?'skel':'rev',e.x+Math.cos(an)*4,e.z+Math.sin(an)*4,null,{zone:e.zone});}burst(e.x,e.y+2,e.z,'#b388ff',20,8,0.8,0.3,3);e.lock=1.2;break;
    case 'orbs':e.act={t:0.6,fn:()=>{const n=ph2?7:5,base=Math.atan2(P.x-e.x,P.z-e.z);for(let i=0;i<n;i++){const a2=base+(i-(n-1)/2)*0.28;fireProj(e.x,e.y+3.2,e.z,Math.sin(a2),Math.cos(a2),11,d*0.7,'#b388ff',{src:e.bd.n,sc:1.2});}sfx.spit();}};e.lock=0.9;break;
    case 'rain':for(let i=0;i<(ph2?7:5);i++){const an=Math.random()*TAU,rd=Math.random()*7;T(P.x+Math.cos(an)*rd*(i?1:0),P.z+Math.sin(an)*rd*(i?1:0),2.8,0.9+i*0.16,d);}e.lock=1.0;break;
    case 'blink':{const an=Math.random()*TAU,rd=8+Math.random()*7;burst(e.x,e.y+2,e.z,'#b388ff',16,6,0.5,0.3,2);e.x=a.x+Math.cos(an)*rd;e.z=a.z+Math.sin(an)*rd;burst(e.x,e.y+2,e.z,'#b388ff',16,6,0.5,0.3,2);e.lock=0.4;break;}
    case 'charge':{
      const an=Math.atan2(dx,dz);e.face=an;
      for(let i=1;i<=3;i++)T(e.x+Math.sin(an)*i*6,e.z+Math.cos(an)*i*6,2.6,0.9,0,{});
      e.act={t:0.9,fn:()=>{e.charge={vx:Math.sin(an)*(ph2?20:17),vz:Math.cos(an)*(ph2?20:17),t:0.85,hit:false};sfx.dash();}};e.lock=1.9;break;}
    case 'quake':for(let i=0;i<(ph2?8:6);i++){const an=Math.random()*TAU,rd=2+Math.random()*9;T(P.x+Math.cos(an)*rd,P.z+Math.sin(an)*rd,3.2,0.8+i*0.22,d*0.9,{slam:1});}e.lock=1.2;break;
    case 'ring':e.act={t:0.7,fn:()=>{const n=ph2?18:12;for(let i=0;i<n;i++){const an=i/n*TAU;fireProj(e.x,e.y+2.5,e.z,Math.sin(an),Math.cos(an),9,d*0.6,'#e040fb',{src:e.bd.n,sc:1.2});}if(ph2)setTimeout(()=>{if(!e.dead&&R)for(let i=0;i<18;i++){const an=(i+0.5)/18*TAU;fireProj(e.x,e.y+2.5,e.z,Math.sin(an),Math.cos(an),9,d*0.6,'#e040fb',{src:e.bd.n,sc:1.2});}},550);sfx.spit();}};e.lock=1.0;break;
    case 'blinkstrike':{const an=Math.random()*TAU,sx=P.x+Math.cos(an)*4,sz=P.z+Math.sin(an)*4;T(sx,sz,5,1.0,d*1.4,{slam:1});e.act={t:0.9,fn:()=>{burst(e.x,e.y+2,e.z,'#e040fb',16,6,0.5,0.3,2);e.x=sx;e.z=sz;burst(e.x,e.y+2,e.z,'#e040fb',16,6,0.5,0.3,2);}};e.lock=1.3;break;}
  }
}
function updateBoss(e,dt,dx,dz,dp){
  const a=e.arena,p=e.g.userData.p,ad=Math.hypot(P.x-a.x,P.z-a.z);
  if(!e.aggro&&ad<30)e.aggro=true;
  if(e.hp<e.mhp*0.5&&e.ph===1){e.ph=2;e.sum=0;banner('ENRAGED!',e.bd.n,'#ff5252');sfx.boss();shake=0.8;}
  if(e.aggro&&ad>85){ // player fled: leash and heal
    e.aggro=false;
  }
  if(!e.aggro){e.hp=Math.min(e.mhp,e.hp+e.mhp*0.1*dt);stepE(e,a.x,a.z,e.sp,dt);if(Math.hypot(e.x-a.x,e.z-a.z)<1)e.face=Math.atan2(dx,dz);}
  else{
    e.cdA-=dt;
    if(e.charge){
      const c=e.charge;c.t-=dt;e.x+=c.vx*dt;e.z+=c.vz*dt;e.face=Math.atan2(c.vx,c.vz);
      if(!c.hit&&dp<e.r+1.2){c.hit=true;hurtPlayer(e.dmg*1.2,e.bd.n,c.vx,c.vz);}
      if(c.t<=0)e.charge=null;
    }else if(e.act){e.act.t-=dt;e.face=Math.atan2(dx,dz);if(e.act.t<=0){const f=e.act.fn;e.act=null;f();}}
    else if(e.lock>0){e.lock-=dt;e.face=Math.atan2(dx,dz);}
    else{
      if(dp>e.bd.keep)stepE(e,P.x,P.z,e.sp*(e.ph===2?1.25:1),dt);else e.face=Math.atan2(dx,dz);

/* ---------------- per-frame trap state machines ---------------- */
function updateTraps(dt){
  const sense=!!S.tal.sense;
  for(const tr of TRAPS){
    const dx=P.x-tr.x,dz=P.z-tr.z,d=Math.hypot(dx,dz);
    tr.g.visible=d<75;
    if(d>60){
      if(tr.aura)tr.aura.visible=false;
      if(tr.k==='vent')tr.t-=dt;
      else if(d>90&&tr.st!==0&&!(tr.k==='pit'&&tr.st>=2))resetTrap(tr);
      continue;
    }
    const dmg=26*(1+0.45*tr.zone)*(1+0.4*(threat()-1));
    if(sense&&d<40){if(!tr.aura)trapAura(tr);tr.aura.visible=true;}else if(tr.aura)tr.aura.visible=false;
    if(sense&&d<12)discover(tr.k);
    const low=P.y<tr.y+0.9,r=d<58?ensureRig(tr):tr.rig;
    if(tr.hit>0)tr.hit-=dt;
    switch(tr.k){
      case 'plate':{
        const sp=r&&r.sp;
        if(tr.st===0){if(d<1.15&&low){tr.st=1;tr.t=0.4;tone(900,0.05,'square',0.1);tone(500,0.06,'square',0.08,0,0.05);}}
        else if(tr.st===1){ // anticipation: plate sinks, spikes tremble below the surface
          tr.t-=dt;tr.tile.position.y=lerp(0.04,-0.02,clamp((0.4-tr.t)/0.08,0,1));
          if(sp){sp.visible=true;sp.scale.y=0.12+0.05*Math.sin(tr.t*80);}

function aiLunge(e,dt,dx,dz,dp){
  const d=e.d;
  if(e.mode===1){ // pounce
    e.dt-=dt;const nx=e.x+e.lx*dt,nz=e.z+e.lz*dt;if(H(nx,nz)>-0.7){e.x=nx;e.z=nz;}
    contactHit(e,dp,0.7);if(e.dt<=0){e.mode=2;e.dt=0.8;}return;
  }
  if(e.mode===2){e.dt-=dt;if(e.dt<=0)e.mode=0;return;}
  if(e.atkw>0){
    e.atkw-=dt;e.face=Math.atan2(dx,dz);setFlash(e.g,Math.floor(e.atkw*16)%2===0);
    if(e.atkw<=0){
      setFlash(e.g,false);
      if(d.blink){burst(e.x,e.y+1.2,e.z,'#d500f9',16,6,0.5,0.3,2);e.x=P.x-Math.sin(P.face)*3.4;e.z=P.z-Math.cos(P.face)*3.4;pushOut(e,e.r);burst(e.x,e.y+1.2,e.z,'#d500f9',16,6,0.5,0.3,2);}
      const ex=P.x-e.x,ez=P.z-e.z,L=Math.hypot(ex,ez)||1;e.face=Math.atan2(ex,ez);e.lx=ex/L*(d.blink?17:15);e.lz=ez/L*(d.blink?17:15);e.mode=1;e.dt=0.38;sfx.swing();
    }
    return;
  }
  if(dp>7.5)stepE(e,P.x,P.z,e.sp,dt);
  else{e.oa+=dt*(e.id||1.8);stepE(e,P.x+Math.cos(e.oa)*5.4,P.z+Math.sin(e.oa)*5.4,e.sp*0.85,dt);e.face=Math.atan2(dx,dz);}
  e.shT-=dt;
  if(e.shT<=0&&dp<10&&dp>2.2){e.atkw=0.55;e.shT=2+Math.random()*1.6;}
  contactHit(e,dp,0);
}
function aiShoot(e,dt,dx,dz,dp){
  const d=e.d,pr=d.proj,gy=groundY(e.x,e.z);
  e.face=Math.atan2(dx,dz);
  if(e.atkw>0){
    e.atkw-=dt;setFlash(e.g,Math.floor(e.atkw*18)%2===0);
    if(e.atkw<=0){
      setFlash(e.g,false);

    }
  }else{
    const lo=pr.range[0],hi=pr.range[1];

      h+='<div class="card'+(own?' own':'')+'"><div class="ic">'+t.ic+'</div><div class="tx"><div class="nm">'+t.n+'</div><div class="ds">'+t.ds+'</div></div><button class="bt" data-a="tal" data-k="'+t.k+'"'+(own||S.shards<t.cost?' disabled':'')+'>'+(own?'OWNED':'◆ '+t.cost)+'</button></div>';});
  }
  h+='<h2>CODEX '+Object.keys(S.seen).length+'/'+DISC.length+'</h2><div class="codex">';
  DISC.forEach(d=>{h+='<span class="'+(S.seen[d.k]?'on':'')+'">'+(S.seen[d.k]?d.n:'???')+'</span>';});
  h+='</div><div class="sub" style="margin-top:22px;opacity:.7">'+TIPS[S.deaths%TIPS.length]+'</div>';
  h+='<button class="big alt" data-a="snd" style="min-height:84px;font-size:32px;width:420px">'+(S.opt.mute?'🔇 Sound OFF':'🔊 Sound ON')+'</button></div>';
  ui.innerHTML=h;if(keep)$('hubscr').scrollTop=old;
}
function showBoons(){
  const b=chooseBoons();
  let h='<div class="scr mid"><h1 style="font-size:60px">LEVEL UP!</h1><div class="sub">Level '+R.lvl+' · choose a boon</div><div style="height:16px"></div>';
  b.forEach(o=>{const n=R.bn[o.k];h+='<div class="card pick" data-a="boon" data-k="'+o.k+'"><div class="ic">'+o.ic+'</div><div class="tx"><div class="nm">'+o.n+(n?' <span style="color:#ffd740">→ Lv '+(n+1)+'</span>':'')+'</div><div class="ds" style="font-size:24px">'+o.d+'</div></div></div>';});
  h+='</div>';ui.innerHTML=h;
}
function showEnd(win){
  const p=R.pay;
  let h='<div class="scr mid '+(win?'':'dead')+'"><h1>'+(win?'WORLD REBORN!':'YOU DIED')+'</h1>';
  h+='<div class="sub" style="margin-top:14px">'+(win?'All four Guardians have fallen. The loop begins anew, stronger and crueler.':'Slain by '+esc(R.lastHit))+'</div>';
  h+='<div class="sub" style="opacity:.8">'+(win?'':DEATH_LINES[(S.deaths-1)%DEATH_LINES.length])+'</div><div style="height:12px"></div>';
  h+='<div class="lines">Survived '+Math.floor(R.alive/60)+'m '+Math.floor(R.alive%60)+'s · Level '+R.lvl+'<br>Explored '+R.explored+' areas · '+R.kills+' kills · '+R.chests+' chests<br>';
  h+='◆ Exploration '+p.explore+' · Kills '+p.kills+' · Guardians '+p.boss+' · Treasure '+p.bonus+'<br>'+(win?'◆ World bonus '+p.winBonus+'<br>':'')+'Multiplier ×'+p.mult.toFixed(2)+'</div>';
  h+='<div class="stats" style="font-size:44px;margin-top:18px">+<b>'+p.pay+'</b> ◆</div>';
  h+='<div class="sub">Echo grows: +'+Math.min(S.deaths,100)+'% to all stats'+(p.newBest?' · NEW BEST '+p.score:' · score '+p.score)+'</div>';
  h+='<button class="big" data-a="again">REBORN NOW ▶</button><button class="big alt" data-a="hub">PRAY AT THE ALTAR</button></div>';
  ui.innerHTML=h;
}
async function enterRun(){
  if(!WRL||WRL.route!==routeOf()){
    const ld=$('loader');ld.style.display='flex';ld.style.opacity=1;setLoad(0,'The world shifts...');
    ui.style.display='none';
    await buildWorld(routeOf(),setLoad);
    ld.style.opacity=0;setTimeout(()=>{ld.style.display='none';},400);
  }
  startRun();
}
ui.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;unlock();
  const a=t.dataset.a,k=t.dataset.k;
  if(a==='go'||a==='again')enterRun();
  else if(a==='hub'){placeIdle();setScr('hub');}
  else if(a==='tab'){hubTab=k;showHub(true);}
  else if(a==='sbuy'){const d=skDef(k);if(!skLv(k)&&S.shards>=d.cost){S.shards-=d.cost;S.sk[k]=1;const e=S.loadout.indexOf(null);if(e>=0)S.loadout[e]=k;save();sfx.lvl();showHub(true);}}
  else if(a==='sup'){const d=skDef(k),l=skLv(k),c=skUpCost(d,l);if(l>0&&l<SK_MAX&&S.shards>=c){S.shards-=c;S.sk[k]=l+1;save();sfx.coin();showHub(true);}}
  else if(a==='seq'){if(skLv(k)>0){equipSkill(k,+t.dataset.i);save();sfx.orb();showHub(true);}}
  else if(a==='pup'){const p=PAS.find(x=>x.k===k),l=S.pas[k]||0,c=pasCost(p);if(l<p.max&&S.shards>=c){S.shards-=c;S.pas[k]=l+1;save();sfx.coin();showHub(true);}}
  else if(a==='tal'){const x=TALS.find(y=>y.k===k);if(!S.tal[k]&&S.shards>=x.cost){S.shards-=x.cost;S.tal[k]=1;save();sfx.lvl();showHub(true);}}
  else if(a==='snd'){setMute(!S.opt.mute);showHub(true);}
  else if(a==='boon'){applyBoon(k);setScr('play');}
});

/* ============================ INPUT ============================ */
const touch=$('touch'),ptrs=new Map();
function toHud(e){const r=touch.getBoundingClientRect();return[(e.clientX-r.left)*SW/r.width,(e.clientY-r.top)*SH/r.height];}
function hitBtn(x,y){let best=null,bd=1e9;for(const k in BTN){const b=BTN[k],d=Math.hypot(x-b.x,y-b.y);if(d<b.r+14&&d<bd){bd=d;best=k;}}return best;}
touch.addEventListener('pointerdown',e=>{
  unlock();
  if(scr==='map'){setScr('play');return;}
  if(scr!=='play'||!R)return;
  e.preventDefault();try{touch.setPointerCapture(e.pointerId);}catch(_){}
  const[x,y]=toHud(e),b=hitBtn(x,y);
  if(b){
    ptrs.set(e.pointerId,{k:'btn',b});
    if(b==='jump'){act.jump=true;act.jumpEdge=true;}
    else if(b==='dash')act.dash=true;
    else if(b.length===2&&b[0]==='s')castSlot(+b[1]);
    else if(b==='map'){setScr('map');ptrs.clear();clearInput();}
    else if(b==='snd'){setMute(!S.opt.mute);}
    return;
  }
  if(e.pointerType!=='mouse'&&x<430&&y>460&&!joy.on){joy.on=true;joy.id=e.pointerId;joy.ox=clamp(x,90,340);joy.oy=clamp(y,560,1190);joy.dx=joy.dy=0;ptrs.set(e.pointerId,{k:'joy'});return;}
  ptrs.set(e.pointerId,{k:'cam',x,y});
});
touch.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const[x,y]=toHud(e);
  if(p.k==='joy'){let dx=(x-joy.ox)/60,dy=(y-joy.oy)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}const m=Math.hypot(dx,dy);if(m<0.12){dx=dy=0;}joy.dx=dx;joy.dy=dy;}
  else if(p.k==='cam'){camS.yaw+=(x-p.x)*0.0085;camS.pitch=clamp(camS.pitch+(y-p.y)*0.005,0.12,1.2);p.x=x;p.y=y;}
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(p.k==='joy'){joy.on=false;joy.dx=joy.dy=0;joy.id=-1;}
  else if(p.k==='btn'&&p.b==='jump')act.jump=false;
}
touch.addEventListener('pointerup',endPtr);touch.addEventListener('pointercancel',endPtr);
function clearInput(){joy.on=false;joy.dx=joy.dy=0;act.jump=act.dash=false;for(const k in keys)keys[k]=false;}
window.addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;unlock();
  if(scr==='hub'&&(k==='Enter'||k===' ')){e.preventDefault();enterRun();return;}
  if(scr==='map'){setScr('play');return;}
  if(scr!=='play')return;
  keys[k]=true;
  if(k===' '){e.preventDefault();if(!act.jump)act.jumpEdge=true;act.jump=true;}
  else if(k==='Shift')act.dash=true;
  else if(k==='1'||k==='j')castSlot(0);
  else if(k==='2'||k==='k')castSlot(1);
  else if(k==='3'||k==='l')castSlot(2);
  else if(k==='m')setScr('map');
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k===' ')act.jump=false;});
window.addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{lastT=null;clearInput();try{if(AC){document.hidden?AC.suspend():AC.resume();}}catch(e){}});

/* ============================ LOOP / BOOT ============================ */
let lastT=null,slowT=0,rawEma=0.016;
/* adaptive quality: if the device struggles, drop render resolution and draw distance */
function adaptQuality(raw){
  rawEma=lerp(rawEma,Math.min(raw,0.2),0.05);
  if(rawEma>0.045&&QLV<2){slowT+=raw;if(slowT>3){slowT=0;QLV++;
    if(QLV===1){renderer.setSize(576,1024,false);CHUNK_R=120;}else{renderer.setSize(432,768,false);CHUNK_R=95;}
    updateChunks(P.x,P.z,true);}}
  else slowT=Math.max(0,slowT-raw*0.5);
}
function placeIdle(){
  const hp=WRL.hub;P.x=hp.x;P.z=hp.z;P.y=groundY(P.x,P.z);P.face=Math.PI;hero.position.set(P.x,P.y,P.z);hero.rotation.set(0,P.face,0);animHero(hero,0,0,0,0.28);
  camS.yaw=0;camS.pitch=0.3;camS.dist=12;envTo(0,0,true);updateChunks(P.x,P.z,true);cloneM.visible=false;
}
function updateIdle(dt){
  gt+=dt;animateBase(dt);updateFx(dt);
  for(const s of SHRINES){s.c.rotation.y+=dt*1.5;s.c.position.y=2.2+Math.sin(gt*2)*0.15;}
  if(scr==='hub'){ // pray at the goddess altar: the hero kneels, camera sways below the statue
    heroSalute(hero,gt);
    hero.position.set(P.x,P.y,P.z);hero.rotation.set(0,P.face,0);hero.children[hero.children.length-1].position.y=0.07;
    const yaw=Math.sin(gt*0.22)*0.5,cp=Math.cos(0.2),sp_=Math.sin(0.2),d=15.5;
    envTo(3,dt,false);
    camera.position.set(P.x+Math.sin(yaw)*cp*d,P.y+sp_*d+2.4,P.z+Math.cos(yaw)*cp*d);
    camera.lookAt(WRL.altar.x,P.y+4.6,WRL.altar.z);
    return;
  }
  camS.yaw+=dt*0.18;
  hero.position.set(P.x,P.y,P.z);hero.rotation.set(0,P.face,0);
  animHero(hero,0,0,0,0.28,3.1);
  hero.children[hero.children.length-1].position.y=0.07;
  const cp=Math.cos(camS.pitch),sp=Math.sin(camS.pitch),tx=P.x,ty=P.y+1.6,tz=P.z;
  camera.position.set(tx+Math.sin(camS.yaw)*cp*camS.dist,Math.max(ty+sp*camS.dist,H(tx+Math.sin(camS.yaw)*cp*camS.dist,tz+Math.cos(camS.yaw)*cp*camS.dist)+1.4),tz+Math.cos(camS.yaw)*cp*camS.dist);
  camera.lookAt(tx,ty+1.2,tz);
}
function frame(ts){
  requestAnimationFrame(frame);
  if(lastT===null)lastT=ts;
  const raw=(ts-lastT)/1000;let dt=Math.min(0.11,raw);lastT=ts;
  if(scr==='play')adaptQuality(raw);
  try{
    if(!WRL||!renderer)return;
    if(scr==='play'){
      if(keys.q)camS.yaw-=2.2*dt;if(keys.e)camS.yaw+=2.2*dt;
      updatePlay(dt);
    }else if(scr==='hub'||scr==='dead'||scr==='win'){updateIdle(dt);}
    updateEnv(dt,envC.th);
    renderer.render(scene,camera);drawHud();
  }catch(err){try{lib.log('err '+err.message+' '+(err.stack||'').split('\n')[1]);}catch(_){}}
}
function setLoad(f,t){const percent=Math.round(clamp(f,0,1)*100);$('lb').style.width=percent+'%';$('loadPercent').textContent=percent+'%';$('lp').textContent=t;}
async function boot(){
  initGL();initFx();initEnv();initSkillFx();
  setLoad(0.02,'Loading save...');
  await loadSave();
  await buildWorld(routeOf(),setLoad);
  placeIdle();setScr('hub');
  const ld=$('loader');ld.style.opacity=0;setTimeout(()=>{ld.style.display='none';},450);
  requestAnimationFrame(frame);
}
function run(mode){
  const gp=window.gameConfig||(window.gameConfig={});
  gp.settings=Object.assign({enemyScale:1,rewardMult:1,worldSeed:0},gp.settings);
  try{
    lib.showGameParameters({name:'Soulshard Saga',params:{
      'Enemy Strength':{key:'settings.enemyScale',type:'slider',min:0.5,max:2,step:0.1},
      'Reward Multiplier':{key:'settings.rewardMult',type:'slider',min:0.5,max:3,step:0.1},
      'World Seed Offset':{key:'settings.worldSeed',type:'slider',min:0,max:50,step:1}
    }});
  }catch(e){}
  boot().catch(err=>{try{lib.log('boot failed: '+err.message+' '+err.stack);}catch(_){} $('lp').textContent='Failed to start: '+err.message;});
}
</script>
