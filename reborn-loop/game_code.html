<script>
/* ============================================================================
   REBORN LOOP — a 2D blocky side-scroller "life simulation".
   Walk left/right and jump; your hero attacks automatically. You WILL die.
   Each death ends the simulation and pays out Soul Shards (distance, kills,
   bosses). Spend them in the hub on permanent upgrades and talents, and every
   death also adds a small permanent "Echo" bonus, so each new life is stronger.
   Hidden traps and look-alike mutant monsters (poison fart, blood leech, blast, revenant)
   punish the unwary; survival time and kill count multiply the death payout.
   Every 5 deaths the route reshuffles (zone order, traps, lakes); within a route the layout is
   fixed, so deaths teach you its secrets. Lakes mean swimming (jump = swim up, breath meter)
   and floating-platform obby sections.
   World = one endless strip split into 9600px zones; each zone ends with a boss
   wall you must beat to continue. Progress is saved with lib.saveUserGameState.
   ============================================================================ */
const W=720,H=1280,GY=900,ZL=9600,POOL_B=GY+230;

/* ---------- audio (procedural SFX + per-zone music sequencer) ---------- */
let AC=null,MG=null,MU=null,MV=null,SG=null,MB=null,ML=null,NB=null;
function applyVol(){
  const o=S.opt,b=$('bM');if(b)b.innerHTML=o.mute?'&#128263;':'&#128266;';
  if(!AC||!MV||!SG)return;
  try{const n=AC.currentTime;MV.gain.cancelScheduledValues(n);MV.gain.setTargetAtTime(o.mute?0:o.mv,n,0.05);SG.gain.cancelScheduledValues(n);SG.gain.setTargetAtTime(o.mute?0:o.sv,n,0.05);}catch(e){}
}const sLast={};const MVOL=0.32;
function unlock(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;MG=AC.createGain();MG.gain.value=0.9;MG.connect(cp);cp.connect(AC.destination);
  SG=AC.createGain();SG.connect(MG);MU=AC.createGain();MU.gain.value=0.0001;MV=AC.createGain();MV.gain.value=S.opt.mute?0:S.opt.mv;MU.connect(MV);MV.connect(MG);SG.gain.value=S.opt.mute?0:S.opt.sv;
  MB=AC.createBiquadFilter();MB.type='lowpass';MB.frequency.value=1100;MB.connect(MU);
  ML=AC.createGain();ML.connect(MU);const dl=AC.createDelay(1);dl.delayTime.value=0.27;const fb=AC.createGain();fb.gain.value=0.3;const wet=AC.createGain();wet.gain.value=0.35;
  ML.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MU);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state!=='running')AC.resume();}catch(e){}}
const mf=m=>440*Math.pow(2,(m-69)/12);
const sThr=(k,s)=>{if(!AC)return false;const n=AC.currentTime;if(sLast[k]&&n-sLast[k]<s)return false;sLast[k]=n;return true;};
function osc(n,f,d,t,v,f2,dest,atk){
  try{const o=AC.createOscillator(),gn=AC.createGain();
    o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
    const a=atk||0.004;gn.gain.setValueAtTime(0.0001,n);gn.gain.linearRampToValueAtTime(v||0.04,n+a);gn.gain.exponentialRampToValueAtTime(0.0001,n+Math.max(d,a+0.01));
    o.connect(gn);gn.connect(dest||SG);o.start(n);o.stop(n+d+0.03);}catch(e){}
}
function nzAt(n,d,v,ft,f,f2,q,dest){
  try{const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=ft||'lowpass';fl.frequency.setValueAtTime(f||2000,n);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,n+d);fl.Q.value=q||1;const gn=AC.createGain();gn.gain.setValueAtTime(v,n);gn.gain.exponentialRampToValueAtTime(0.0001,n+d);
    s.connect(fl);fl.connect(gn);gn.connect(dest||SG);s.start(n,Math.random()*0.4,d+0.05);}catch(e){}
}
const tone=(f,d,t,v,f2,dl)=>{if(AC&&SG)osc(AC.currentTime+(dl||0),f,d,t,v,f2,SG);};
const noise=(d,v,ft,f,f2,q,dl)=>{if(AC&&NB)nzAt(AC.currentTime+(dl||0),d,v,ft,f,f2,q,SG);};
const beep=(f,d,t,v,f2)=>tone(f,d,t,v,f2);
function fartS(){
  if(!AC||!SG||!sThr('fart',0.12))return;
  try{const n=AC.currentTime,d=0.55,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),fl=AC.createBiquadFilter(),gn=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(85+Math.random()*35,n);o.frequency.exponentialRampToValueAtTime(45,n+d);
    l.frequency.value=16+Math.random()*10;lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);
    fl.type='lowpass';fl.frequency.value=700;fl.Q.value=4;
    gn.gain.setValueAtTime(0.0001,n);gn.gain.linearRampToValueAtTime(0.13,n+0.03);gn.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(fl);fl.connect(gn);gn.connect(SG);o.start(n);l.start(n);o.stop(n+d+0.02);l.stop(n+d+0.02);}catch(e){}
  noise(0.4,0.05,'lowpass',500,150);
}
function roarS(){
  if(!AC||!SG)return;
  try{const n=AC.currentTime,d=1.5,fl=AC.createBiquadFilter(),gn=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
    fl.type='lowpass';fl.Q.value=6;fl.frequency.setValueAtTime(250,n);fl.frequency.exponentialRampToValueAtTime(1600,n+0.35);fl.frequency.exponentialRampToValueAtTime(180,n+d);
    gn.gain.setValueAtTime(0.0001,n);gn.gain.linearRampToValueAtTime(0.22,n+0.12);gn.gain.exponentialRampToValueAtTime(0.0001,n+d);
    l.frequency.value=8;lg.gain.value=7;l.connect(lg);
    [72,108,54].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*0.65,n+d);lg.connect(o.frequency);o.connect(fl);o.start(n);o.stop(n+d+0.02);});
    fl.connect(gn);gn.connect(SG);l.start(n);l.stop(n+d+0.02);}catch(e){}
  noise(1.2,0.16,'bandpass',500,200,0.8);
}
const sfx={

  fart:()=>fartS(),

  boom:()=>{if(!sThr('boom',0.06))return;noise(0.9,0.28,'lowpass',3500,90);tone(90,0.7,'sine',0.3,28);tone(55,0.5,'square',0.04,30);},

    }
  }else if(MUS.sw){MUS.sw=0;MU.gain.cancelScheduledValues(n);MU.gain.setValueAtTime(Math.max(0.0001,MU.gain.value),n);MU.gain.exponentialRampToValueAtTime(MVOL,n+0.4);}

}

    popup(p.x,p.y-150,'SECOND WIND!','#ffd740',36);burst(p.x,p.y-40,'#ffd740',24,360);ring(p.x,p.y-45,'#ffd740',220);sfx.revive();
  }else{
    screen='dying';dyingT=0;sfx.die();
    ['bL','bR','bJ','bM'].forEach(i=>$(i).style.display='none');input.l=input.r=input.j=false;
  }
}
function damageEnemy(e,d){
  const crit=Math.random()<0.1;if(crit)d*=2;
  e.hp-=d;e.fl=0.12;if(crit)sfx.crit();else sfx.hit();
  if(crit)ring(e.x,e.y-e.h/2,'#ffeb3b',90,0.3);
  if(e.t==='boss'&&!e.p2&&e.hp>0&&e.hp<e.maxhp*0.5){e.p2=true;sfx.roar();shake=14;hitStop=Math.max(hitStop,0.15);ring(e.x,e.y-70,'#ff1744',360,0.7);banner(e.name.toUpperCase()+' IS ENRAGED!',2.2);}
  burst(e.x-R.p.face*10,e.y-e.h/2,crit?'#ffeb3b':'#ffffff',crit?8:3,crit?300:180);
  if(crit){hitStop=Math.max(hitStop,0.05);shake=Math.max(shake,4);}
  popup(e.x,e.y-e.h-12,String(Math.ceil(d)),crit?'#ffeb3b':'#fff',crit?34:26);
  if(e.t!=='boss')e.x+=R.p.face*14;
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.v==='rev'&&!e.rev){e.rev=true;e.down=1.5;e.hp=e.maxhp*0.6;e.att=false;sfx.tick();return;}
  e.dead=true;R.kills++;sfx.kill();
  hitStop=Math.max(hitStop,e.t==='boss'?0.28:0.045);shake=Math.max(shake,4);
  if(e.v==='fart'){R.gas.push({x:e.x,r:105,life:5,dmg:e.dmg*0.3});discover('fart');sfx.fart();}
  if(e.v==='split'){
    for(let i=-1;i<=1;i++)R.ens.push({t:'slime',v:null,mini:true,x:e.x+i*34,y:e.y,w:30,h:26,hp:e.maxhp*0.25,maxhp:e.maxhp*0.25,dmg:e.dmg*0.55,sp:115,vy:-380,fl:0,ft:9,seed:Math.random()*9});
    discover('split');
  }
  burst(e.x,e.y-e.h/2,e.t==='boss'?'#ffd740':'#b388ff',e.t==='boss'?40:10,e.t==='boss'?420:240);
  if(S.tal.siphon&&e.t!=='boss'){const p=R.p;p.hp=Math.min(maxHp(),p.hp+4);}
  if(e.t==='boss'){
    R.bossKills++;R.cleared++;R.bossOn=false;R.next=R.cleared*ZL+400;shake=14;
    S.bosses=Math.max(S.bosses,R.cleared);
    R.p.hp=Math.min(maxHp(),R.p.hp+maxHp()*0.3);
    banner('GUARDIAN DEFEATED! The path opens.',3);sfx.boom();sfx.victory();ring(e.x,e.y-70,'#ffd740',420,0.8);ring(e.x,e.y-70,'#ffffff',260,0.6);popup(e.x,e.y-170,'BOSS DOWN!','#ffd740',44);
    R.proj=[];R.hz=[];
  }
}

/* ---------- update ---------- */
function update(dt){
  gt+=dt;
  if(screen==='play'||screen==='dying'){
    R.t+=dt;
    updateFx(dt);
    if(screen==='play')updatePlay(dt);
    else{
      dyingT+=dt;
      if(dyingT>1.6)endRun();
    }
  }
  shake=Math.max(0,shake-dt*30);
  if(screen==='hub'){
    if(shownShards===null)shownShards=S.shards;
    const d=S.shards-shownShards;shownShards=Math.abs(d)<1?S.shards:shownShards+d*Math.min(1,dt*4);
  }
  if(screen==='hub')MUS.want='hub';
  else if(screen==='play'&&R)MUS.want=R.intro?null:(R.bossOn?(R.bossE&&R.bossE.p2?'boss2':'boss'):'z'+R.order[Math.floor(R.p.x/ZL)%4]);
  else MUS.want=null;
}
function updateFx(dt){
  R.fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=700*dt;f.t-=dt;});R.fx=R.fx.filter(f=>f.t>0);
  R.pop.forEach(p=>{p.t-=dt;p.y-=40*dt;});R.pop=R.pop.filter(p=>p.t>0);
  if(R.banner){R.banner.t-=dt;if(R.banner.t<=0)R.banner=null;}
  if(R.hurtF>0)R.hurtF-=dt;
  R.rings.forEach(r=>{r.t+=dt;});R.rings=R.rings.filter(r=>r.t<r.d);
}
function poolAt(x){for(let i=0;i<R.pools.length;i++){const q=R.pools[i];if(x>q.x0&&x<q.x1)return q;}return null;}
const floorAt=x=>poolAt(x)?POOL_B:GY;
const inWater=p=>p.y>GY+8&&!!poolAt(p.x);
function updatePlay(dt){
  if(R.intro){updateIntro(dt);return;}
  const p=R.p;
  // movement
  const rooted=p.root>0;if(rooted)p.root-=dt;
  const dir=rooted?0:(input.r?1:0)-(input.l?1:0);
  const prevX=p.x,prevY=p.y,inW=inWater(p);
  const on=!inW&&(!!p.onPlat||p.y>=floorAt(p.x)-0.5);
  p.vx+=(dir*moveSp()*(inW?0.65:1)-p.vx)*Math.min(1,dt*(on?14:(inW?5:6)));
  if(dir)p.face=dir;
  const jEdge=input.j&&!p.jPrev;p.jPrev=input.j;
  if(inW&&!p.wasW){sfx.splash();burst(p.x,GY,'rgba(200,240,255,.9)',8,240);}p.wasW=inW;
  if(inW){
    discover('swim');
    const atS=p.y<=GY+34;
    if(jEdge&&atS&&!rooted){p.vy=-720;sfx.jump();}
    else if(input.j&&!rooted){if(atS)p.vy=(GY+26-p.y)*4;else p.vy=Math.max(p.vy-2600*dt,-330);}
    else p.vy=Math.min(p.vy+700*dt,110);
  }else{
    if(on)p.coy=0.1;else p.coy=Math.max(0,(p.coy||0)-dt);
    if(jEdge)p.jb=0.13;else p.jb=Math.max(0,(p.jb||0)-dt);
    if(!rooted&&p.vy>=-10&&((input.j&&on)||(p.jb>0&&p.coy>0))){p.vy=-880;p.coy=0;p.jb=0;p.sq=-0.2;sfx.jump();dust(p.x,p.y,6);}
    if(!input.j&&p.vy<0)p.vy+=1800*dt;
    p.vy+=2300*dt;
  }
  if(dir)R.lt=dir;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const pl0=poolAt(prevX);
  if(pl0&&p.y>GY+40)p.x=Math.max(pl0.x0+12,Math.min(pl0.x1-12,p.x));
  // floating platforms (obby)
  R.plats.forEach(pl=>{
    if(pl.kind==='move'){const nx=pl.ox+Math.sin(gt*1.3+pl.ph)*pl.amp;pl.dx=nx-pl.x;pl.x=nx;}
    if(pl.kind==='crumble'){
      if(pl.alive&&pl.st>0.55){pl.alive=false;pl.rt=2.5;pl.st=0;burst(pl.x,pl.y,'#b98a52',8,160);}
      else if(!pl.alive){pl.rt-=dt;if(pl.rt<=0)pl.alive=true;}
      else if(p.onPlat!==pl)pl.st=Math.max(0,pl.st-dt*0.5);
    }
  });
  const fallV=p.vy;
  p.onPlat=null;
  if(p.vy>=0)for(const pl of R.plats){
    if(pl.alive&&prevY<=pl.y+4&&p.y>=pl.y&&Math.abs(p.x-pl.x)<pl.w/2+8){p.y=pl.y;p.vy=0;p.onPlat=pl;break;}
  }
  if(p.onPlat){p.x+=p.onPlat.dx;if(p.onPlat.kind==='crumble')p.onPlat.st+=dt;}
  else{const fl=floorAt(p.x);if(p.y>=fl){p.y=fl;p.vy=0;}}
  p.sq=(p.sq||0)*Math.max(0,1-dt*12);
  if(!on&&!inW&&fallV>450&&(p.onPlat||p.y>=GY-0.5)&&!inWater(p)){p.sq=Math.min(0.28,fallV/3200);dust(p.x,p.y,8);sfx.land();}
  // breath
  if(inWater(p)&&p.y-90>GY){
    p.o2-=dt/9;
    if(p.o2<=0){p.o2=0;p.dT=(p.dT||0)-dt;if(p.dT<=0){p.dT=0.5;dotPlayer(maxHp()*0.05,'Drowning');}}
  }else p.o2=Math.min(1,p.o2+dt*0.7);
  p.x=Math.max(R.startX+20,Math.min(wallX(),p.x));
  // pearls
  R.pearls.forEach(pe=>{
    if(!pe.got&&Math.hypot(p.x-pe.x,(p.y-45)-pe.y)<48){pe.got=true;R.bonus+=20;popup(pe.x,pe.y-20,'+20 ◆','#80deea',28);sfx.coin();}
  });
  p.wk+=dt*(Math.abs(p.vx)/300);
  if(p.hpG==null||p.hpG<p.hp)p.hpG=p.hp;else p.hpG=Math.max(p.hp,p.hpG-maxHp()*0.7*dt);
  p.inv=Math.max(0,p.inv-dt);p.flash=Math.max(0,p.flash-dt);p.swing=Math.max(0,p.swing-dt);
  R.maxX=Math.max(R.maxX,p.x);R.alive+=dt;

  // zone banner
  const z=Math.floor(p.x/ZL);
  if(z!==R.zoneShown){if(R.zoneShown>=0)banner('ZONE '+(z+1)+' — '+themeAt(z).n,2.6);R.zoneShown=z;}

  // spawning
  while(!R.bossOn&&R.next<p.x+900){
    if(R.next>=bossX()){spawnBoss();R.bossOn=true;break;}
    R.next+=spawnSegment(R.next);
  }

  // enemies
  R.ens.forEach(e=>{
    e.fl=Math.max(0,(e.fl||0)-dt);
    if(e.t==='spike')return;
    if(e.down>0){e.down-=dt;if(e.down<=0){discover('rev');burst(e.x,e.y-30,'#b388ff',16,280);}return;}
    const dx=p.x-e.x,fd=Math.sign(dx)||1;
    if(e.t==='boss'){
      updateBoss(e,dt,p);
    }else if(e.att){
      e.x=p.x+p.face*8;e.y=p.y-72+Math.sin(gt*20)*4;e.dn-=dt;
      if(e.dn<=0){
        e.dn=0.4;e.dc++;
        const dd=e.dmg*0.45*(1+0.12*e.dc);
        dotPlayer(dd,'Blood Leech Bat');e.hp=Math.min(e.maxhp,e.hp+dd*1.5);sfx.drain();
      }
    }else if(e.fuse>0){
      e.fuse-=dt;if(e.fuse<=0)explode(e);
    }else if(e.t==='fish'){
      const pl=e.pool,inP=inWater(p)&&p.x>pl.x0&&p.x<pl.x1;
      const tx=inP?p.x:(pl.x0+pl.x1)/2+Math.sin(gt*0.8+e.seed)*(pl.x1-pl.x0)*0.35;
      const ty=inP?Math.min(p.y-30,pl.B-20):GY+110+Math.sin(gt*1.1+e.seed)*50;
      const sp=inP?e.sp:e.sp*0.45;
      e.x+=Math.sign(tx-e.x)*Math.min(Math.abs(tx-e.x),sp*dt);
      e.y+=Math.sign(ty-e.y)*Math.min(Math.abs(ty-e.y),sp*0.8*dt);
      e.x=Math.max(pl.x0+20,Math.min(pl.x1-20,e.x));e.y=Math.max(GY+30,Math.min(pl.B-8,e.y));
    }else if(Math.abs(dx)<850){
      if(e.t==='bat'){e.x+=fd*e.sp*dt;e.y=e.by+Math.sin(gt*3+e.seed)*28;}
      else{
        e.x+=fd*e.sp*dt;
        if(e.t==='skel'&&e.y>=GY&&Math.abs(dx)<220&&Math.random()<dt*1.2)e.vy=-700;
        if(e.v==='fart'&&Math.abs(dx)<600){
          e.ft-=dt;
          if(e.ft<=0){e.ft=rnd(1.8,2.8);R.gas.push({x:e.x-fd*24,r:62,life:3.8,dmg:e.dmg*0.25});discover('fart');sfx.fart();}
        }
        if(e.v==='bomb'&&Math.abs(dx)<110&&p.y>GY-60){e.fuse=0.9;discover('bomb');sfx.tick();}
        if(e.v==='acid'){
          e.ft-=dt;
          if(e.ft<=0){e.ft=0.8;R.gas.push({x:e.x,r:32,life:3.2,dmg:e.dmg*0.4,low:true});discover('acid');}
        }
      }
    }
    if(e.t!=='bat'&&e.t!=='fish'){
      e.vy+=2300*dt;e.y+=e.vy*dt;if(e.y>=GY){e.y=GY;e.vy=0;}
      if(e.t!=='boss'){const pq=poolAt(e.x);if(pq)e.x=(e.x-pq.x0<pq.x1-e.x)?pq.x0-1:pq.x1+1;}
    }
    if(e.att||e.fuse>0)return;
    // contact
    if(Math.abs(p.x-e.x)<(18+e.w/2)&&p.y>e.y-e.h&&p.y-70<e.y){
      if(e.t==='fish')discover('fish');
      if(e.v==='leech'){e.att=true;e.dn=0.3;e.dc=0;discover('leech');sfx.drain();}
      else hurtPlayer(e.dmg,Math.sign(p.x-e.x)||1,nameOf(e));
    }
  });
  // spikes
  R.ens.forEach(e=>{if(e.t==='spike'&&Math.abs(p.x-e.x)<(14+e.w/2)&&p.y>e.y-e.h+6)hurtPlayer(e.dmg,p.vx>=0?-1:1,'Spikes');});

  updateTraps(dt);
  updateHazards(dt);
  // poison gas
  R.gas.forEach(q=>{q.life-=dt;});R.gas=R.gas.filter(q=>q.life>0);
  p.gasT=Math.max(0,p.gasT-dt);
  const ing=R.gas.find(q=>Math.abs(p.x-q.x)<q.r+14&&p.y>GY-(q.low?20:90)&&p.y<=GY+4);
  if(ing&&p.gasT<=0){p.gasT=0.45;dotPlayer(ing.dmg,'Toxic Gas');}

  // projectiles
  R.proj.forEach(q=>{
    if(q.delay>0){q.delay-=dt;return;}
    q.x+=q.vx*dt;if(q.vy)q.y+=q.vy*dt;q.life-=dt;
    if(q.y>GY+40)q.life=0;
    if(Math.abs(p.x-q.x)<(18+q.w/2)&&p.y>q.y-q.h&&p.y-96<q.y){hurtPlayer(q.dmg,Math.sign(q.vx),q.src||'Guardian');q.life=0;}
  });
  R.proj=R.proj.filter(q=>q.life>0);

  // auto attack
  p.atkT-=dt;
  if(p.atkT<=0){
    const range=115;
    let near=null,nd=1e9;
    R.ens.forEach(e=>{
      if(e.t==='spike'||e.dead||e.down>0)return;
      const dx=e.x-p.x,reach=range+e.w/2;
      const cy=e.y-e.h/2,py=p.y-45;
      if(Math.abs(dx)<reach&&Math.abs(cy-py)<(e.t==='boss'?130:95)&&Math.abs(dx)<nd){near=e;nd=Math.abs(dx);}
    });
    if(near){
      p.face=Math.sign(near.x-p.x)||p.face;p.swing=0.26;p.atkT=atkCd();sfx.swing();
      R.ens.forEach(e=>{
        if(e.t==='spike'||e.dead||e.down>0)return;
        const dx=(e.x-p.x)*p.face,cy=e.y-e.h/2,py=p.y-45;
        if(dx>-30&&dx<range+e.w/2&&Math.abs(cy-py)<(e.t==='boss'?130:95))damageEnemy(e,atkDmg());
      });
    }
  }
  const c=R.clone;
  if(c){
    const tx=p.x-p.face*80;
    if(Math.abs(c.x-p.x)>520)c.x=tx;
    c.vx=(tx-c.x)*6;c.x+=c.vx*dt;c.y+=(p.y-c.y)*Math.min(1,dt*10);
    c.wk+=dt*Math.abs(c.vx)/300;c.swing=Math.max(0,c.swing-dt);c.atkT-=dt;c.face=p.face;
    if(c.atkT<=0){
      let t=null,td=1e9;
      R.ens.forEach(e=>{
        if(e.t==='spike'||e.dead||e.down>0)return;
        const dd=Math.abs(e.x-c.x);
        if(dd<115+e.w/2&&Math.abs((e.y-e.h/2)-(c.y-45))<110&&dd<td){t=e;td=dd;}
      });
      if(t){c.face=Math.sign(t.x-c.x)||c.face;c.swing=0.26;c.atkT=atkCd()*1.15;damageEnemy(t,atkDmg()*0.6);}
    }
  }
  R.ens=R.ens.filter(e=>!e.dead&&(e.t==='boss'||e.x>p.x-1000));
  R.traps=R.traps.filter(t=>t.x>p.x-1000);
  R.pools=R.pools.filter(q=>q.x1>p.x-1200);R.plats=R.plats.filter(q=>q.x>p.x-1200);R.pearls=R.pearls.filter(q=>q.x>p.x-1200);

  // camera
  camLead+=((R.lt||1)*110-camLead)*Math.min(1,dt*2.5);
  camX+=(Math.max(R.startX,p.x-360+camLead)-camX)*Math.min(1,dt*8);
}

function explode(e){
  const p=R.p;e.dead=true;shake=14;sfx.boom();
  burst(e.x,e.y-20,'#ff5252',30,420);burst(e.x,e.y-20,'#ffd740',16,320);ring(e.x,e.y-20,'#ff9100',150,0.4);
  if(Math.abs(p.x-e.x)<140&&p.y>GY-130)hurtPlayer(e.dmg*2.2,Math.sign(p.x-e.x)||1,'Blast Slime');
}
function updateTraps(dt){
  const p=R.p;
  R.traps.forEach(t=>{
    const dx=p.x-t.x,gnd=p.y>=GY-6;
    if(t.k==='plate'){
      if(t.s===0){if(Math.abs(dx)<30&&gnd){t.s=1;t.tm=0.28;sfx.tick();}}
      else if(t.s===1){
        t.tm-=dt;
        if(t.tm<=0){t.s=2;t.tm=1.0;discover('plate');sfx.metal();shake=5;}
      }else if(t.s===2){
        t.tm-=dt;
        if(t.tm>0.2&&Math.abs(dx)<46&&p.y>GY-34)hurtPlayer(t.dmg,dx>=0?1:-1,'Hidden Spike Plate');
        if(t.tm<=0)t.s=3;
      }
    }else if(t.k==='rock'){
      if(t.s===0){if(dx>-250&&dx<0){t.s=1;t.tm=0.85;sfx.tick();}}
      else if(t.s===1){
        t.tm-=dt;
        if(t.tm<=0){
          t.s=2;t.tm=1.0;shake=12;sfx.boom();discover('rock');burst(t.x,GY-10,'#8d6e63',18,320);
          if(Math.abs(p.x-t.x)<62&&p.y>GY-50)hurtPlayer(t.dmg,dx>=0?1:-1,'Falling Boulder');
        }
      }else if(t.s===2){t.tm-=dt;if(t.tm<=0)t.s=3;}
    }else if(t.k==='dart'){
      if(t.s===0){if(Math.abs(dx)<30&&gnd){t.s=1;t.tm=0.55;t.n=3;discover('dart');sfx.tick();}}
      else if(t.s===1){
        t.tm-=dt;
        if(t.tm<=0){
          R.proj.push({x:p.x+520,y:GY-12,h:18,w:56,vx:-760,dmg:t.dmg,life:2,k:'dart',src:'Dart Tripwire'});
          sfx.swing();t.n--;t.tm=0.45;if(t.n<=0)t.s=3;
        }
      }
    }else if(t.k==='vent'){
      if(t.s===0&&Math.abs(dx)<30&&gnd){t.s=3;discover('vent');R.gas.push({x:t.x,r:95,life:4.5,dmg:t.dmg*0.35});sfx.fart();shake=5;}
    }else if(t.k==='bear'){
      if(t.s===0&&Math.abs(dx)<26&&gnd){
        t.s=2;t.tm=1.5;discover('bear');sfx.metal();
        hurtPlayer(t.dmg,0,'Bear Trap');p.root=1.4;p.vx=0;
      }else if(t.s===2){t.tm-=dt;}
    }
  });
}
function calcReward(){
  const dist=Math.max(0,R.maxX-R.startX);
  const base=dist/30+R.kills*3+R.bonus+R.bossKills*100*(1+R.cleared*0.5);
  const km=1+Math.min(2,R.kills*0.025),tm=1+Math.min(2,R.alive/90);
  const disc=R.found.length*30,gift=S.tal.gift?1.3:1;
  return{base:base,km:km,tm:tm,disc:disc,total:Math.round((base*km*tm+disc)*gift*CFG().rewardMult)};
}
function endRun(){
  const rw=calcReward(),gained=rw.total;
  const meters=Math.floor(R.maxX/40);
  S.shards+=gained;S.deaths++;S.bosses=Math.max(S.bosses,R.cleared);
  const newBest=meters>S.best;S.best=Math.max(S.best,meters);
  const sec=Math.floor(R.alive);
  window.lastRun={life:S.deaths,meters:meters,kills:R.kills,boss:R.bossKills,gained:gained,newBest:newBest,
    time:Math.floor(sec/60)+':'+(sec%60<10?'0':'')+(sec%60),km:rw.km,tm:rw.tm,found:R.found.length,cause:R.cause,
    line:DEATH_LINES[(S.deaths-1)%DEATH_LINES.length]};
  save();
  try{const p=lib.addPlayerScoreToLeaderboard(S.best);if(p&&p.catch)p.catch(()=>{});}catch(e){}
  hubMsg=(Math.floor(S.deaths/5)>Math.floor((S.deaths-1)/5))?'[SYSTEM] The path has shifted. Memorized routes are lost.':'';screen='hub';

  const sun=new T.DirectionalLight(0xffffff,0.95);sun.position.set(4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  const shc=sun.shadow.camera;shc.left=-6;shc.right=6;shc.top=6;shc.bottom=-6;sc.add(sun);

  const box=(w,h,d,m,x,y,z,par)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=true;b.receiveShadow=true;(par||sc).add(b);return b;};

    const tg=new T.Group();tg.position.set(x,0,z);sc.add(tg);const s=1+hash(i+5)*0.7;

  }
  for(let i=0;i<8;i++){const a=hash(i+30)*6.28,r=2.5+hash(i+40)*3.5;box(0.3+hash(i)*0.3,0.25,0.3+hash(i+1)*0.3,M(0x8f8ca6),Math.cos(a)*r,0.12,Math.sin(a)*r);}
  // player
  const P=new T.Group();sc.add(P);
  const mArm=M(0x2f4a9e),mArm2=M(0x1f3170),mSkin=M(0xf6c9a0),mHair=M(0x2b1f3d),mGold=M(0xffca28,{metalness:0.5,roughness:0.4}),
        mMetal=M(0xcfd8dc,{metalness:0.6,roughness:0.35}),mCape=M(0xd32f2f),mBoot=M(0x4e342e),mDark=M(0x1b1b3a),mWhite=M(0xffffff);
  const legs=[];
  [-0.17,0.17].forEach(z=>{const lg=new T.Group();lg.position.set(0,0.72,z);P.add(lg);box(0.26,0.6,0.26,mArm2,0,-0.3,0,lg);box(0.36,0.2,0.3,mBoot,0.04,-0.62,0,lg);legs.push(lg);});
  const up=new T.Group();P.add(up);
  box(0.46,0.72,0.66,mArm,0,1.08,0,up);box(0.06,0.42,0.5,mMetal,0.24,1.2,0,up);
  box(0.5,0.12,0.7,M(0x6d4c41),0,0.76,0,up);box(0.04,0.1,0.12,mGold,0.26,0.76,0,up);
  box(0.58,0.56,0.58,mSkin,0.02,1.74,0,up);
  box(0.64,0.2,0.64,mHair,-0.02,2.1,0,up);box(0.2,0.5,0.64,mHair,-0.25,1.82,0,up);
  [[0.1,0.1],[-0.1,-0.15],[0,0.2],[-0.15,0.05],[0.12,-0.18]].forEach(c=>{const k=new T.Mesh(new T.ConeGeometry(0.13,0.34,4),mHair);k.position.set(c[0],2.34,c[1]);k.castShadow=true;up.add(k);});
  box(0.62,0.08,0.62,mCape,0.02,1.96,0,up);
  [-0.13,0.13].forEach(z=>{box(0.04,0.14,0.1,mWhite,0.32,1.76,z,up);box(0.04,0.1,0.06,mDark,0.335,1.75,z+0.015,up);});
  box(0.03,0.03,0.12,M(0xa1553b),0.32,1.58,0,up);
  const cape=new T.Group();cape.position.set(-0.25,1.42,0);up.add(cape);box(0.04,0.95,0.6,mCape,0,-0.47,0,cape);
  box(0.34,0.16,0.26,mMetal,0,1.44,0.42,up);
  const farArm=new T.Group();farArm.position.set(0,1.36,-0.42);up.add(farArm);box(0.18,0.5,0.18,mArm,0,-0.25,0,farArm);box(0.18,0.14,0.18,mSkin,0,-0.56,0,farArm);
  const sArm=new T.Group();sArm.position.set(0,1.36,0.44);up.add(sArm);
  box(0.18,0.5,0.18,mArm,0,-0.25,0,sArm);box(0.18,0.14,0.18,mSkin,0,-0.56,0,sArm);
  box(0.08,0.3,0.08,M(0x5d4037),0,-0.58,0,sArm);box(0.4,0.07,0.12,mGold,0,-0.7,0,sArm);
  const blade=box(0.13,1.25,0.04,M(0xe3ebf1,{metalness:0.8,roughness:0.2,emissive:0x2a4560}),0,-1.35,0,sArm);
  // slime
  const Sg=new T.Group();Sg.position.set(1.7,0,0);sc.add(Sg);
  const blob=new T.Group();Sg.add(blob);
  const mSl=new T.MeshPhysicalMaterial({color:0x7cc62f,roughness:0.25,clearcoat:0.9,transparent:true,opacity:0.94});
  const body=new T.Mesh(new T.SphereGeometry(0.9,32,24),mSl);body.scale.set(1.15,0.95,1.15);body.position.y=0.86;body.castShadow=true;blob.add(body);
  const sph=(r,m,x,y,z)=>{const s=new T.Mesh(new T.SphereGeometry(r,16,12),m);s.position.set(x,y,z);blob.add(s);return s;};
  const mBlk=new T.MeshStandardMaterial({color:0x17210f}),mEw=new T.MeshStandardMaterial({color:0xffffff,roughness:0.3});
  [-0.32,0.32].forEach(z=>{sph(0.19,mEw,-0.9,1.04,z);sph(0.1,mBlk,-1.06,1.02,z);const br=box(0.06,0.06,0.32,M(0x1b3a0a),-1.0,1.3,z,blob);br.rotation.x=z>0?0.35:-0.35;});
  box(0.06,0.1,0.34,mBlk,-1.02,0.64,0,blob);
  const hl=sph(0.2,new T.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.55}),-0.4,1.5,0.45);hl.scale.set(1,0.6,1);
  // fart puffs
  const pGeo=new T.IcosahedronGeometry(0.35,1),puffs=[];
  function puff(x,y,z,vx,vy,vz,life,s){
    const m=new T.MeshStandardMaterial({color:0xa5e635,emissive:0x2e4a00,transparent:true,opacity:0.78,depthWrite:false,roughness:1,flatShading:true});
    const me=new T.Mesh(pGeo,m);me.position.set(x,y,z);sc.add(me);puffs.push({m:me,vx:vx,vy:vy,vz:vz,t:0,life:life,s:s,r:Math.random()*3});
  }
  let t=0,ct=0,trick=0,flash=0,green=0,knock=0,shk=0,hit=false,landed=false;
  const CY=2.8;
  function step(dt){
    t+=dt;ct+=dt;if(ct>CY){ct-=CY;hit=false;landed=false;}
    // hero attack
    let lunge=0,ang=0.9;
    if(ct<0.55){const k=ct/0.55;lunge=Math.sin(k*Math.PI)*0.5;ang=k<0.45?0.9+2.0*(k/0.45):2.9-2.7*Math.min(1,(k-0.45)/0.12);}
    else if(ct<0.95)ang=0.2+0.7*((ct-0.55)/0.4);
    if(!hit&&ct>0.33){hit=true;flash=0.18;knock=0.35;for(let i=0;i<6;i++)puff(1.0,1.0,0.3,-0.2+Math.random()*0.4,1+Math.random(),Math.random()-0.5,0.5,0.25);}
    sArm.rotation.z=ang;farArm.rotation.z=-0.3+Math.sin(t*3)*0.05;
    // slime hop + toxic fart
    let hy=0,sqx=1,sqy=1;
    if(ct>0.95&&ct<1.15){const k=(ct-0.95)/0.2;sqy=1-0.22*k;sqx=1+0.15*k;}
    else if(ct>=1.15&&ct<1.8){const k=(ct-1.15)/0.65;hy=Math.sin(k*Math.PI)*1.2;sqy=1.12;sqx=0.92;}
    else if(ct>=1.8&&ct<2.05){const k=(ct-1.8)/0.25;sqy=0.72+0.28*k;sqx=1.25-0.25*k;}
    else{sqy=1+Math.sin(t*6)*0.05;sqx=1-Math.sin(t*6)*0.03;}
    if(!landed&&ct>=1.8){
      landed=true;shk=0.35;green=1;sfxSafe();
      for(let i=0;i<9;i++)puff(2.7,0.6+Math.random()*0.5,(Math.random()-0.5)*0.8,1.2+Math.random(),0.6+Math.random()*0.8,(Math.random()-0.5)*1.4,2.2,1.1+Math.random()*0.5);
      for(let i=0;i<14;i++){const a=i/14*6.28;puff(1.7+Math.cos(a)*0.9,0.25,Math.sin(a)*0.9,Math.cos(a)*2.6,0.25,Math.sin(a)*2.6,1.8,0.9);}
      for(let i=0;i<5;i++)puff(0.6,0.5+i*0.25,(Math.random()-0.5)*0.6,-2.4-Math.random(),0.3,(Math.random()-0.5)*0.6,1.6,1);
    }
    if(flash>0){sqx*=1.15;sqy*=0.85;}
    blob.scale.set(sqx,sqy,sqx);blob.position.y=hy;
    knock=Math.max(0,knock-dt*1.2);Sg.position.x=1.7+knock;
    flash=Math.max(0,flash-dt);mSl.emissive.setScalar(flash>0?0.55:0);
    // trickle of gas from the slime's rear
    trick-=dt;if(trick<=0){trick=0.22;puff(2.75,0.55+hy,(Math.random()-0.5)*0.5,0.5+Math.random()*0.4,0.5+Math.random()*0.4,(Math.random()-0.5)*0.4,1.6,0.45);}
    // hero recoil from gas
    let rec=0;if(ct>1.8&&ct<2.6)rec=Math.sin((ct-1.8)/0.8*Math.PI)*0.35;
    P.position.x=-1.7+lunge-rec;P.position.y=Math.abs(Math.sin(t*3))*0.03;
    up.rotation.z=-rec*0.5+lunge*-0.15;
    legs[0].rotation.z=lunge*0.8;legs[1].rotation.z=-lunge*0.8;
    cape.rotation.z=-0.15-lunge*0.6-Math.sin(t*5)*0.08;
    green=Math.max(0,green-dt*0.8);mSkin.emissive.setRGB(0.1*green,0.35*green,0);
    blade.material.emissive.setRGB(0.16+(ct<0.55?0.5:0),0.27+(ct<0.55?0.5:0),0.38+(ct<0.55?0.5:0));
    // puffs
    for(let i=puffs.length-1;i>=0;i--){
      const q=puffs[i];q.t+=dt;const k=q.t/q.life;
      if(k>=1){sc.remove(q.m);q.m.material.dispose();puffs.splice(i,1);continue;}
      const dmp=Math.pow(0.3,dt);q.vx*=dmp;q.vz*=dmp;q.vy+=0.25*dt;
      q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.position.z+=q.vz*dt;
      q.m.scale.setScalar(q.s*(0.4+k*1.6));q.m.rotation.set(q.r+t,q.r*2+t*0.7,0);q.m.material.opacity=0.78*(1-k);
    }
    // camera orbit
    shk=Math.max(0,shk-dt);const a=Math.sin(t*0.3)*0.35,sx=(Math.random()-0.5)*shk*0.5,sy=(Math.random()-0.5)*shk*0.5;
    cam.position.set(0.4+Math.sin(a)*10.5+sx,3.6+sy,Math.cos(a)*10.5);cam.lookAt(0.4,1.4,0);
    rd.render(sc,cam);
  }
  function sfxSafe(){try{if(AC)sfx.fart();}catch(e){}}
  function dispose(){puffs.forEach(q=>{sc.remove(q.m);q.m.material.dispose();});try{rd.dispose();}catch(e){}}
  return{step:step,dispose:dispose};
}
function startLoader(loadP){
  const el=$('loader');el.style.display='block';loaderOn=true;
  let ready=false,prog=0,done=false,scene3=null,lastT=null,tipI=0,tipT=0;
  loadP.then(()=>{ready=true;},()=>{ready=true;});
  try{if(window.THREE)scene3=build3D($('lc'));}catch(e){scene3=null;try{lib.log('3D loader failed: '+e.message);}catch(_){}}
  const tips=["Tip: Toxic Fart Slimes leave poison gas behind. Don't breathe it in!",'Tip: Every death makes you permanently stronger.','Tip: The route reshuffles every 5 deaths.','Tip: Some slimes look normal... until they explode.','Tip: Your hero swings the sword automatically.'];
  function loop(ts){
    if(done)return;
    if(lastT===null)lastT=ts;const dt=Math.min(0.11,Math.max(0,(ts-lastT)/1000));lastT=ts;
    prog=Math.min(ready?1:0.9,prog+dt*0.36);
    $('lb').style.width=(prog*100)+'%';
    $('lp').textContent=prog>=1?'READY!':'LOADING '+Math.floor(prog*100)+'%';
    if(prog>=1)$('ltap').style.display='block';
    tipT+=dt;if(tipT>3){tipT=0;tipI=(tipI+1)%tips.length;$('ltip').textContent=tips[tipI];}
    if(scene3){try{scene3.step(dt);}catch(e){scene3=null;}}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  const close=()=>{
    if(prog<1||done)return;done=true;loaderOn=false;unlock();sfx.buy();
    el.style.opacity='0';setTimeout(()=>{el.style.display='none';if(scene3)scene3.dispose();},460);
  };
  el.addEventListener('pointerdown',e=>{e.preventDefault();unlock();close();});
  window._closeLoader=close;
}

/* ---------- loop & input ---------- */
function draw(){
  g.clearRect(0,0,W,H);
  if(screen==='hub')drawHub();else drawPlay();
}
function frame(ts){
  if(last===null)last=ts;
  const dt=Math.min(0.11,Math.max(0,(ts-last)/1000));last=ts;
  let sdt=dt;
  if(hitStop>0){hitStop-=dt;sdt=dt*0.08;}
  if(screen==='dying')sdt*=0.7;
  try{musicTick();}catch(e){}
  try{update(sdt);if(!loaderOn)draw();}catch(e){try{lib.log('err '+e.message);}catch(_){}}
  requestAnimationFrame(frame);
}
function bindBtn(id,k){
  const el=$(id);
  const on=e=>{e.preventDefault();input[k]=true;el.classList.add('on');unlock();};
  const off=e=>{e.preventDefault();input[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));
}
function run(mode){
  const gp=window.gameConfig||(window.gameConfig={});
  gp.settings=Object.assign({enemyScale:1,rewardMult:1},gp.settings);
  try{
    lib.showGameParameters({name:'Reborn Loop',params:{
      'Enemy Strength':{key:'settings.enemyScale',type:'slider',min:0.5,max:2,step:0.1},
      'Reward Multiplier':{key:'settings.rewardMult',type:'slider',min:0.5,max:3,step:0.1}
    }});
  }catch(e){}
  bindBtn('bL','l');bindBtn('bR','r');bindBtn('bJ','j');
  $('bM').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlock();S.opt.mute=S.opt.mute?0:1;applyVol();save();});
  cv.addEventListener('pointerdown',e=>{
    unlock();
    if(screen!=='hub')return;
    const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
    for(let i=regions.length-1;i>=0;i--){const q=regions[i];if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){q.fn();break;}}
  });
  const key=(e,d)=>{
    const k=e.key;
    if(loaderOn){if(d&&(k==='Enter'||k===' ')){e.preventDefault();if(window._closeLoader)window._closeLoader();}return;}
    if(k==='ArrowLeft'||k==='a'||k==='A')input.l=d;
    else if(k==='ArrowRight'||k==='d'||k==='D')input.r=d;
    else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){input.j=d;if(d)e.preventDefault();}
    else if(d&&(k==='m'||k==='M')){S.opt.mute=S.opt.mute?0:1;applyVol();save();}
    else if(d&&k==='Escape'&&sndOpen){sndOpen=false;save();}
    else if(d&&k==='Enter'&&screen==='hub'){unlock();if(sndOpen){sndOpen=false;save();}else startRun();}
    if(d)unlock();
  };
  window.addEventListener('keydown',e=>key(e,true));
  window.addEventListener('keyup',e=>key(e,false));
  const clr=()=>{input.l=input.r=input.j=false;['bL','bR','bJ'].forEach(i=>$(i).classList.remove('on'));};
  window.addEventListener('blur',clr);
  document.addEventListener('visibilitychange',()=>{last=null;clr();try{if(AC){if(document.hidden)AC.suspend();else AC.resume();}}catch(e){}});
  const lp=load();
  startLoader(lp);
  requestAnimationFrame(frame);
}
