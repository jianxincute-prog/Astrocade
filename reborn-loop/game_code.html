<body>
<div id="app">

  <canvas id="hud" width="720" height="1280"></canvas>

</div>
<script>
/* ============================================================================
   REBORN LOOP: WORLD — a 3D third-person open-world action roguelite.
   The world is a 500 x 500 unit land split into four regions: the central
   Whispering Forest and three outer regions (Bone Crypt, Magma Depths, Void
   Spire, in a shuffled order). Your hero auto-attacks nearby enemies; you move,
   jump, dash and trigger a Soul Blast. Four Guardians rule the regions. You WILL
   die: each death pays out Soul Shards (exploration, kills, bosses, treasure)
   that buy permanent upgrades and talents, and adds a small permanent Echo
   bonus. During a life, kills level you up and you pick a boon.
   The route (terrain, lakes, traps, camps) is fixed for 5 lives so deaths teach
   you its secrets, then the world shifts. Progress saved with lib.saveUserGameState.
   ============================================================================ */
'use strict';
const SW=720,SH=1280,HALF=250;
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const CFG=()=>Object.assign({enemyScale:1,rewardMult:1,worldSeed:0},(window.gameConfig||{}).settings);

const THEMES=[
 {n:'Whispering Forest',top:'#5fb8f5',sky:'#bfe6ff',gr:'#56b04a',dirt:'#6d4c2f',water:'#2e86de',fogN:30,fogF:125,leaf:['#3f9a45','#4fae4e','#2f8a3c'],bark:'#6b4a2b',rock:'#8a8f98'},
 {n:'Bone Crypt',top:'#241d3a',sky:'#6a5a8c',gr:'#8f8ca6',dirt:'#4a465c',water:'#2f7d86',fogN:18,fogF:95,leaf:['#8d8aa0','#a7a4bb'],bark:'#5a5568',rock:'#6e6a80'},
 {n:'Magma Depths',top:'#340b0b',sky:'#b04414',gr:'#7a4430',dirt:'#3b1e14',water:'#8e3bb0',fogN:16,fogF:90,leaf:['#6a3a2a','#8a4a30'],bark:'#2a1a14',rock:'#4a2a22'},
 {n:'Void Spire',top:'#08081f',sky:'#3d1f73',gr:'#6a55b0',dirt:'#2a2250',water:'#5b3fd0',fogN:14,fogF:85,leaf:['#8a6bff','#b388ff'],bark:'#3a2f66',rock:'#3a3070'}
];
const UPS=[
 {k:'vit',n:'Vitality',ic:'❤️',sh:'+25 HP',ds:'Raises your maximum HP.',d:l=>'Max HP '+(120+25*l),max:30,base:30,f:1.32},
 {k:'pow',n:'Strength',ic:'⚔️',sh:'+4 DMG',ds:'Your auto-attacks hit harder.',d:l=>'Damage '+(10+4*l),max:30,base:30,f:1.32},
 {k:'spd',n:'Swiftness',ic:'⚡',sh:'+10% SPD',ds:'Swing your blade faster.',d:l=>'Attack speed +'+(l*10)+'%',max:20,base:40,f:1.34},
 {k:'agi',n:'Agility',ic:'💨',sh:'+4% MOVE',ds:'Run faster to explore and dodge.',d:l=>'Move speed +'+(l*4)+'%',max:15,base:40,f:1.34},
 {k:'mem',n:'Memory Anchor',ic:'⚓',sh:'+1 SHRINE',ds:'Begin each life at a shrine beside a guardian you have already beaten.',d:l=>l?('Start shrine '+l+' / 3'):'Start at the village',max:3,base:400,f:2.4}
];
const TALS=[
 {k:'second',n:'Second Wind',ic:'🪽',ds:'Revive once per life with 50% HP.',cost:6500},
 {k:'siphon',n:'Soul Siphon',ic:'🩸',ds:'Heal 4 HP for every monster you slay.',cost:7500},
 {k:'sense',n:'Sixth Sense',ic:'👁️',ds:'Reveal hidden traps and mutant monsters with a faint aura.',cost:9000},

 {k:'clone',n:'Shadow Clone',ic:'👥',ds:'A shadow clone fights beside you with 60% of your damage.',cost:16000}
];
const BOONS=[
 {k:'pow',n:'Berserk',ic:'⚔️',d:'+25% damage'},
 {k:'haste',n:'Frenzy',ic:'⚡',d:'+20% attack speed'},
 {k:'swift',n:'Windstep',ic:'💨',d:'+10% move speed'},
 {k:'vital',n:'Vigor',ic:'❤️',d:'+40 max HP and heal 40'},
 {k:'reach',n:'Long Reach',ic:'🗡️',d:'+30% blade reach'},
 {k:'bolt',n:'Arcane Bolt',ic:'🔮',d:'Auto-fire bolts at foes (stacks)'},
 {k:'flame',n:'Flame Aura',ic:'🔥',d:'Burn all nearby enemies (stacks)'},
 {k:'magnet',n:'Soul Magnet',ic:'🧲',d:'Pull orbs from afar, more heals'}
];
const DISC=[
 {k:'fart',n:'Toxic Fart Slime'},{k:'bomb',n:'Blast Slime'},{k:'leech',n:'Blood Leech Bat'},{k:'rev',n:'Revenant Skeleton'},
 {k:'split',n:'Splitting Slime'},{k:'acid',n:'Acid Slime'},{k:'swim',n:'Deep Waters'},
 {k:'plate',n:'Hidden Spike Plate'},{k:'rock',n:'Falling Boulder Trap'},{k:'dart',n:'Dart Tripwire'},{k:'bear',n:'Bear Trap'},{k:'vent',n:'Poison Vent'}
];
const ZNAMES=['Elder Treant','Crypt Lich','Magma Brute','Void Warden'];
const NAMES={slime:'Slime',skel:'Skeleton',bat:'Bat',fart:'Toxic Fart Slime',bomb:'Blast Slime',leech:'Blood Leech Bat',rev:'Revenant Skeleton',split:'Splitting Slime',acid:'Acid Slime',plate:'Spike Plate',rock:'Boulder Trap',dart:'Dart Trap',bear:'Bear Trap',vent:'Poison Vent',gas:'Poison Gas',drown:'Drowning',blast:'Explosion'};
const VCOL={fart:'#aeea00',bomb:'#ff1744',leech:'#d50000',rev:'#b388ff',split:'#ff80ab',acid:'#76ff03'};
const DEATH_LINES=[
 'Host terminated. Memory fragments harvested.','Simulation reset. Your body remembers the pain.','Death recorded. Echo strengthened.',
 'The system whispers: "Again."','Another life consumed. Another lesson kept.','Reincarnation successful. Stats synchronized.'
];
const TIPS=['Unexplored land pays Soul Shards. Wander far.','Gold glints hide chests, and chests hide traps.','Toxic Fart Slimes leave poison gas behind. Do not breathe it in!','Dash through danger: you are invulnerable for a moment.','Deep water drains your breath. Pearls float out there.','Follow the colored light beams to find the Guardians.'];

let S=defaultState();
function defaultState(){return{shards:0,up:{vit:0,pow:0,spd:0,agi:0,mem:0},tal:{second:0,siphon:0,gift:0,sense:0,clone:0},seen:{},deaths:0,bosses:0,best:0,zoneMax:0,bd:[0,0,0,0],clears:0,opt:{mute:0}};}
const threat=()=>Math.min(3.5,1+0.05*S.deaths)*(1+0.25*S.clears);
const echo=()=>1+0.01*Math.min(S.deaths,100);
const upCost=u=>Math.floor(u.base*Math.pow(u.f,S.up[u.k]));
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const p=lib.saveUserGameState(JSON.parse(JSON.stringify(S)));if(p&&p.catch)p.catch(()=>{});}catch(e){}},250);}
async function loadSave(){
  try{
    const r=await lib.getUserGameState();
    if(r&&r.state){const s=r.state,d=defaultState();
      S=Object.assign(d,s);S.up=Object.assign(d.up,s.up);S.tal=Object.assign(d.tal,s.tal);S.opt=Object.assign(d.opt,s.opt);
      if(!Array.isArray(S.bd)||S.bd.length!==4)S.bd=[0,0,0,0];
      S.up.mem=Math.min(3,S.up.mem|0);
    }
  }catch(e){}
}

/* ---------- audio: procedural SFX + a slow ambient drone per region ---------- */
let AC=null,MG=null,DR=null;const sLast={};
function unlock(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=4;MG=AC.createGain();MG.gain.value=S.opt.mute?0:0.9;MG.connect(cp);cp.connect(AC.destination);
      DR=[0,1].map(i=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i?'triangle':'sine';o.frequency.value=110*(i?1.5:1);g.gain.value=0.035;o.connect(g);g.connect(MG);o.start();return o;});
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function setMute(m){S.opt.mute=m?1:0;if(MG)MG.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.05);save();}
function droneFor(theme){if(!DR)return;const b=[110,98,73.4,65.4][theme];DR[0].frequency.setTargetAtTime(b,AC.currentTime,1.2);DR[1].frequency.setTargetAtTime(b*1.498,AC.currentTime,1.2);}
function tone(f,d,type,v,sl,delay){
  if(!AC||S.opt.mute)return;
  try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
    g.gain.setValueAtTime(v||0.15,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
function hiss(d,v,f0){
  if(!AC||S.opt.mute)return;
  try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f0||1500;g.gain.value=v||0.2;s.connect(fl);fl.connect(g);g.connect(MG);s.start();}catch(e){}
}
function sfxOnce(k,gap,fn){const n=performance.now();if(sLast[k]&&n-sLast[k]<gap)return;sLast[k]=n;fn();}
const sfx={
  swing(){sfxOnce('sw',60,()=>hiss(0.1,0.1,2500));},
  hit(){sfxOnce('hit',35,()=>{tone(200,0.09,'square',0.13,-110);hiss(0.05,0.1,900);});},
  crit(){tone(520,0.1,'square',0.12,300);tone(300,0.12,'sawtooth',0.1,-120);},
  hurt(){sfxOnce('hurt',90,()=>{tone(150,0.22,'sawtooth',0.2,-90);hiss(0.15,0.15,600);});},
  jump(){tone(280,0.14,'square',0.1,320);},
  dash(){hiss(0.18,0.18,3500);tone(180,0.15,'triangle',0.1,260);},
  blast(){tone(110,0.5,'sawtooth',0.22,-70);hiss(0.4,0.25,900);},
  coin(){sfxOnce('coin',50,()=>{tone(880,0.07,'square',0.08);tone(1320,0.1,'square',0.08,0,0.06);});},
  orb(){sfxOnce('orb',40,()=>tone(620+Math.random()*200,0.06,'sine',0.07));},
  lvl(){[523,659,784,1046].forEach((f,i)=>tone(f,0.16,'square',0.1,0,i*0.08));},
  boss(){tone(70,1.0,'sawtooth',0.25,-30);tone(75,1.0,'square',0.12,-30);},
  trap(){tone(120,0.2,'square',0.2,-60);hiss(0.12,0.2,1800);},
  splash(){hiss(0.3,0.15,1200);},
  boom(){tone(80,0.5,'sawtooth',0.28,-50);hiss(0.5,0.3,500);},
  die(){tone(300,0.9,'sawtooth',0.22,-250);tone(150,1.1,'square',0.12,-100,0.1);},
  win(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,0.3,'triangle',0.14,0,i*0.12));},
  spit(){tone(400,0.15,'sine',0.1,-200);},
  slam(){tone(60,0.35,'sawtooth',0.25,-20);hiss(0.25,0.2,400);}
};

/* ============================ RENDERER / SCENE ============================ */
let renderer,scene,camera,hemi,sun,worldRoot=null;
const camS={yaw:0.6,pitch:0.5,dist:9.5,x:0,y:3,z:0};
const envC={bg:new THREE.Color('#bfe6ff'),top:new THREE.Color('#5fb8f5'),gr:new THREE.Color('#556655'),fn:30,ff:125,th:0};
function initGL(){
  renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(1);renderer.setSize(SW,SH,false);
  scene=new THREE.Scene();scene.fog=new THREE.Fog('#bfe6ff',30,125);scene.background=new THREE.Color('#bfe6ff');
  camera=new THREE.PerspectiveCamera(58,SW/SH,0.3,700);
  hemi=new THREE.HemisphereLight('#ffffff','#556655',0.78);scene.add(hemi);
  sun=new THREE.DirectionalLight('#fff2cc',0.62);sun.position.set(40,80,25);scene.add(sun);
  THEMES.forEach(t=>{t.cGr=new THREE.Color(t.gr);t.cDirt=new THREE.Color(t.dirt);t.cWater=new THREE.Color(t.water);t.cSky=new THREE.Color(t.sky);t.cTop=new THREE.Color(t.top);});
}
function envTo(theme,dt,snap){
  const T=THEMES[theme],k=snap?1:Math.min(1,dt*1.2);
  envC.bg.lerp(T.cSky,k);envC.top.lerp(T.cTop,k);envC.gr.lerp(T.cDirt,k);envC.fn=lerp(envC.fn,T.fogN,k);envC.ff=lerp(envC.ff,T.fogF,k);
  scene.background.copy(envC.bg);scene.fog.color.copy(envC.bg);scene.fog.near=envC.fn;scene.fog.far=envC.ff;
  hemi.color.copy(envC.top).lerp(new THREE.Color('#ffffff'),0.55);hemi.groundColor.copy(envC.gr).lerp(new THREE.Color('#888888'),0.3);
  if(envC.th!==theme){envC.th=theme;droneFor(theme);}
}

/* ============================ NOISE / HEIGHTMAP ============================ */
function makeNoise(seed){
  const r=mulberry(seed),P=new Uint8Array(512),p=[];for(let i=0;i<256;i++)p.push(i);
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)P[i]=p[i&255];
  const V=new Float32Array(256);for(let i=0;i<256;i++)V[i]=r();
  return(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=V[P[P[X]+Y]],b=V[P[P[X+1]+Y]],c=V[P[P[X]+Y+1]],d=V[P[P[X+1]+Y+1]];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
let N1,N2,N3,N4,N5,WRL=null;
const HM=new Float32Array(501*501);
function planWorld(route){
  const seed=1337+route*7919+(CFG().worldSeed|0)*31,rr=mulberry(seed);
  const order=[1,2,3];for(let i=2;i>0;i--){const j=(rr()*(i+1))|0;const t=order[i];order[i]=order[j];order[j]=t;}
  const th0=rr()*TAU;
  N1=makeNoise(seed+1);N2=makeNoise(seed+2);N3=makeNoise(seed+3);N4=makeNoise(seed+4);N5=makeNoise(seed+5);
  const arenas=[],a0=th0+Math.PI/3;
  arenas.push({x:Math.cos(a0)*62,z:Math.sin(a0)*62,zone:0,theme:0});
  for(let i=0;i<3;i++){const a=th0+i*TAU/3;arenas.push({x:Math.cos(a)*180,z:Math.sin(a)*180,zone:i+1,theme:order[i]});}
  const sites=[{x:0,z:0,r0:13,r1:28}];arenas.forEach(a=>sites.push({x:a.x,z:a.z,r0:22,r1:38}));
  // start points: 0 = village, k = shrine beside the arena of zone k-1, on the side facing the centre
  const sp=[{x:0,z:3}];
  for(let k=1;k<=3;k++){const a=arenas[k-1],d=Math.hypot(a.x,a.z)||1;sp.push({x:a.x-a.x/d*17,z:a.z-a.z/d*17});}
  WRL={route,seed,order,th0,zoneTheme:[0].concat(order),arenas,sites,sp,rr};
}
function zoneAt(x,z){
  const r=Math.hypot(x,z),pn=N5(x*0.02,z*0.02)-0.5;
  if(r+pn*40<100)return 0;
  let a=Math.atan2(z,x)+pn*0.5-WRL.th0+Math.PI/3;a=((a%TAU)+TAU)%TAU;
  return 1+Math.min(2,(a/(TAU/3))|0);
}
const themeAt=(x,z)=>WRL.zoneTheme[zoneAt(x,z)];
function rawH(x,z){
  let h=3+(N1(x*0.010+7,z*0.010)-0.5)*12+(N2(x*0.035,z*0.035)-0.5)*3.5+(N3(x*0.13,z*0.13)-0.5)*0.6;
  const lk=N4(x*0.016+50,z*0.016+20);if(lk>0.64)h-=sstep(0.64,0.74,lk)*11;
  for(const s of WRL.sites){const d=Math.hypot(x-s.x,z-s.z);if(d<s.r1)h=lerp(h,2.2,1-sstep(s.r0,s.r1,d));}
  const e=Math.max(Math.abs(x),Math.abs(z));if(e>200)h+=sstep(200,248,e)*38;
  return h;
}
function bakeHeights(){for(let iz=0;iz<501;iz++)for(let ix=0;ix<501;ix++)HM[iz*501+ix]=rawH(ix-250,iz-250);}
function H(x,z){
  x=clamp(x+250,0,499.999);z=clamp(z+250,0,499.999);
  const ix=x|0,iz=z|0,fx=x-ix,fz=z-iz,i=iz*501+ix,a=HM[i],b=HM[i+1],c=HM[i+501],d=HM[i+502];
  return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;
}
const groundY=(x,z)=>Math.max(H(x,z),-0.55);
const inDeep=(x,z)=>H(x,z)<-1.0;
function nearSite(x,z,pad){for(const s of WRL.sites){if(Math.hypot(x-s.x,z-s.z)<s.r0+pad)return true;}return false;}

const _c1=new THREE.Color();
function groundCol(x,z,h,out){
  const T=THEMES[themeAt(x,z)],n=N3(x*0.21,z*0.21),n2=N2(x*0.05,z*0.05);
  const sl=Math.abs(H(x+1.6,z)-H(x-1.6,z))+Math.abs(H(x,z+1.6)-H(x,z-1.6));
  out.copy(T.cGr).lerp(T.cDirt,clamp(sl*0.32+(n2-0.5)*0.9+0.12,0,1));
  if(h<0.9)out.lerp(T.cDirt,clamp((0.9-h)*0.6,0,0.85));
  if(h<-0.3)out.multiplyScalar(0.7);
  const e=Math.max(Math.abs(x),Math.abs(z));if(e>192)out.lerp(_c1.set('#2b2b36'),sstep(192,232,e));
  out.multiplyScalar(0.9+n*0.2);
  return out;
}

/* ============================ WORLD OBJECTS ============================ */
const CHN=10,CHS=50;
let chunks=[],OBS=[],CAMPS=[],TRAPS=[],CHESTS=[],PEARLS=[],SHRINES=[],mapBase=null,mapFog=null,mapFx=null,exploredG=null,terrain=null,water=null;
const GEO={};
const PG={
  trunk:()=>new THREE.CylinderGeometry(0.35,0.5,3.2,6).translate(0,1.6,0),
  crown:()=>new THREE.ConeGeometry(2.0,4.4,6).translate(0,5.0,0),
  bush:()=>new THREE.IcosahedronGeometry(1,0).translate(0,0.5,0),
  rock:()=>new THREE.DodecahedronGeometry(1,0).translate(0,0.4,0),
  stone:()=>new THREE.BoxGeometry(1.1,1.7,0.35).translate(0,0.85,0),
  pillar:()=>new THREE.CylinderGeometry(0.6,0.8,5,6).translate(0,2.5,0),
  spire:()=>new THREE.ConeGeometry(1.3,6.5,5).translate(0,3.2,0),
  crystal:()=>new THREE.OctahedronGeometry(1,0).scale(0.8,2.2,0.8).translate(0,2,0),
  cube:()=>new THREE.BoxGeometry(1.6,1.6,1.6).translate(0,0,0),
  dead:()=>new THREE.CylinderGeometry(0.16,0.38,4.6,5).translate(0,2.3,0)
};
let PMAT=null;
function propMats(){
  if(PMAT)return PMAT;
  PMAT={n:new THREE.MeshLambertMaterial(),g:new THREE.MeshLambertMaterial({emissive:new THREE.Color('#5a3aa0')}),l:new THREE.MeshLambertMaterial({emissive:new THREE.Color('#ff5a10')})};
  for(const k in PG)GEO[k]=PG[k]();
  return PMAT;
}
const PROPMAT={crystal:'g',cube:'g',lava:'l'};
const chunkIdx=(x,z)=>clamp(((x+250)/CHS)|0,0,9)*CHN+clamp(((z+250)/CHS)|0,0,9);

function randLand(rr,minH,pad){
  for(let t=0;t<40;t++){
    const x=(rr()*2-1)*205,z=(rr()*2-1)*205,h=H(x,z);
    if(h<minH||nearSite(x,z,pad))continue;
    return{x,z,h};
  }
  return null;
}

function buildTerrain(){
  const SEG=192,g=new THREE.PlaneGeometry(500,500,SEG,SEG);g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,n=pos.count,col=new Float32Array(n*3),c=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos.getX(i),z=pos.getZ(i),y=H(x,z);pos.setY(i,y);groundCol(x,z,y,c);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
  terrain=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));worldRoot.add(terrain);
  const wg=new THREE.PlaneGeometry(500,500,100,100);wg.rotateX(-Math.PI/2);
  const wp=wg.attributes.position,wc=new Float32Array(wp.count*3);
  for(let i=0;i<wp.count;i++){const T=THEMES[themeAt(wp.getX(i),wp.getZ(i))];wp.setY(i,-0.1);wc[i*3]=T.cWater.r;wc[i*3+1]=T.cWater.g;wc[i*3+2]=T.cWater.b;}
  wg.setAttribute('color',new THREE.BufferAttribute(wc,3));
  water=new THREE.Mesh(wg,new THREE.MeshLambertMaterial({vertexColors:true,transparent:true,opacity:0.76,depthWrite:false}));water.renderOrder=1;worldRoot.add(water);
}

function pushObs(x,z,r){const ci=clamp(((x+250)/10)|0,0,49)*50+clamp(((z+250)/10)|0,0,49);(OBS[ci]||(OBS[ci]=[])).push(x,z,r);}
function pushOut(o,rad){
  const cx=clamp(((o.x+250)/10)|0,0,49),cz=clamp(((o.z+250)/10)|0,0,49);
  for(let i=Math.max(0,cx-1);i<=Math.min(49,cx+1);i++)for(let j=Math.max(0,cz-1);j<=Math.min(49,cz+1);j++){
    const a=OBS[i*50+j];if(!a)continue;
    for(let k=0;k<a.length;k+=3){
      const dx=o.x-a[k],dz=o.z-a[k+1],rr=a[k+2]+rad,d2=dx*dx+dz*dz;
      if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2),p=(rr-d)/d;o.x+=dx*p;o.z+=dz*p;}
    }
  }
}

function buildProps(rr){
  propMats();
  const bk=[];for(let i=0;i<CHN*CHN;i++)bk.push({});
  const cl=new THREE.Color();
  const add=(type,x,y,z,ry,sx,sy,sz,col)=>{
    const b=bk[chunkIdx(x,z)];cl.set(col);(b[type]||(b[type]=[])).push(x,y,z,ry,sx,sy,sz,cl.r,cl.g,cl.b);
  };
  const pick=a=>a[(rr()*a.length)|0];
  for(let gx=0;gx<100;gx++)for(let gz=0;gz<100;gz++){
    const x=-250+gx*5+rr()*5,z=-250+gz*5+rr()*5,e=Math.max(Math.abs(x),Math.abs(z));
    const th=themeAt(x,z),T=THEMES[th],k=rr(),dens=[0.42,0.26,0.22,0.2][th];
    if(rr()>dens||e>218)continue;
    const h=H(x,z);if(h<0.5||nearSite(x,z,6))continue;
    const s=0.8+rr()*0.9,ry=rr()*TAU;
    if(th===0){
      if(k<0.68){add('trunk',x,h,z,ry,s,s,s,T.bark);add('crown',x,h,z,ry,s,s*(0.9+rr()*0.4),s,pick(T.leaf));pushObs(x,z,0.6*s);}
      else if(k<0.86)add('bush',x,h,z,ry,s*0.9,s*0.7,s*0.9,pick(T.leaf));
      else{add('rock',x,h,z,ry,s,s*0.8,s,T.rock);pushObs(x,z,0.9*s);}
    }else if(th===1){
      if(k<0.3){add('dead',x,h,z,ry,s,s,s,T.bark);pushObs(x,z,0.4*s);}
      else if(k<0.7){add('stone',x,h,z,ry*0.2,1,s,1,'#9a98ac');pushObs(x,z,0.55);}
      else if(k<0.82){add('pillar',x,h,z,ry,1,0.6+rr()*0.8,1,'#d8d2c0');pushObs(x,z,0.85);}
      else{add('rock',x,h,z,ry,s,s*0.8,s,T.rock);pushObs(x,z,0.9*s);}
    }else if(th===2){
      if(k<0.4){add('spire',x,h,z,ry,s,s*(0.8+rr()),s,pick(['#3a2220','#5a2a20','#2a1a18']));pushObs(x,z,1.0*s);}
      else if(k<0.72){add('rock',x,h,z,ry,s*1.2,s,s*1.2,T.rock);pushObs(x,z,1.1*s);}
      else if(k<0.88){add('dead',x,h,z,ry,s,s,s,'#241612');pushObs(x,z,0.4*s);}
      else add('lava',x,h,z,ry,s*0.7,s*0.5,s*0.7,'#ff8a30');
    }else{
      if(k<0.45){add('crystal',x,h,z,ry,s,s,s,pick(T.leaf));pushObs(x,z,0.7*s);}
      else if(k<0.7)add('cube',x,h+2.2+rr()*2.4,z,ry,s*0.8,s*0.8,s*0.8,'#4a3a90');
      else if(k<0.86){add('spire',x,h,z,ry,s,s,s,'#5a46b0');pushObs(x,z,1.0*s);}
      else{add('rock',x,h,z,ry,s,s*0.8,s,T.rock);pushObs(x,z,0.9*s);}
    }
  }
  const dm=new THREE.Object3D(),col=new THREE.Color();
  chunks=[];
  for(let ci=0;ci<CHN*CHN;ci++){
    const cx=(ci/CHN)|0,cz=ci%CHN,g=new THREE.Group();
    for(const type in bk[ci]){
      const a=bk[ci][type],n=a.length/10,m=new THREE.InstancedMesh(GEO[type],PMAT[PROPMAT[type]||'n'],n);
      for(let i=0;i<n;i++){
        const o=i*10;dm.position.set(a[o],a[o+1],a[o+2]);dm.rotation.set(0,a[o+3],0);dm.scale.set(a[o+4],a[o+5],a[o+6]);dm.updateMatrix();
        m.setMatrixAt(i,dm.matrix);col.setRGB(a[o+7],a[o+8],a[o+9]);m.setColorAt(i,col);
      }
      m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;m.frustumCulled=false;g.add(m);
    }
    g.visible=false;worldRoot.add(g);
    chunks.push({g,mx:-250+cx*CHS+CHS/2,mz:-250+cz*CHS+CHS/2});
  }
}
let chunkT=0,CHUNK_R=150,QLV=0;
function updateChunks(px,pz,force){
  chunkT-=force?9:0.016;if(chunkT>0&&!force)return;chunkT=0.2;
  for(const c of chunks){c.g.visible=Math.hypot(c.mx-px,c.mz-pz)<CHUNK_R;}
}

const POOLS=[
 [['slime',55],['fart',12],['bomb',8],['bat',18],['skel',7]],
 [['skel',45],['rev',18],['bat',20],['leech',10],['slime',7]],
 [['bomb',22],['acid',20],['split',20],['skel',22],['bat',16]],
 [['split',18],['acid',18],['leech',20],['rev',22],['bomb',12],['bat',10]]
];
function pickWeighted(list,rr){let t=0;for(const a of list)t+=a[1];let r=rr()*t;for(const a of list){r-=a[1];if(r<=0)return a[0];}return list[0][0];}
const TRAPW=[['plate',30],['rock',20],['dart',15],['bear',20],['vent',15]];
const BEACON_COL=['#7cff6a','#8ab4ff','#ff7a2a','#c07bff'];

function mkAura(col){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.9,1.25,18).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.75,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.visible=false;return m;
}
function buildGameplayObjects(rr){
  CAMPS=[];TRAPS=[];CHESTS=[];PEARLS=[];SHRINES=[];
  // enemy camps
  for(let t=0;t<5000&&CAMPS.length<260;t++){
    const p=randLand(rr,0.8,10);if(!p)continue;
    if(Math.hypot(p.x,p.z)<42)continue;
    let ok=true;for(const c of CAMPS){if(Math.hypot(c.x-p.x,c.z-p.z)<21){ok=false;break;}}
    if(!ok)continue;
    const zn=zoneAt(p.x,p.z),th=WRL.zoneTheme[zn],n=3+((rr()*3)|0),types=[];
    for(let i=0;i<n;i++)types.push(pickWeighted(POOLS[th],rr));
    CAMPS.push({x:p.x,z:p.z,zone:zn,theme:th,n,types,killed:0,state:0,members:[],cool:0});
  }
  const chunkAdd=(m,x,z)=>chunks[chunkIdx(x,z)].g.add(m);
  // chests (with bait traps)
  for(let t=0,made=0;t<400&&made<85;t++){
    const p=randLand(rr,1.0,10);if(!p)continue;
    const zn=zoneAt(p.x,p.z),g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.7,0.9),new THREE.MeshLambertMaterial({color:'#8d5a2b'}));base.position.y=0.35;g.add(base);
    const lid=new THREE.Mesh(new THREE.BoxGeometry(1.34,0.38,0.94),new THREE.MeshLambertMaterial({color:'#b07a3a'}));lid.position.y=0.88;g.add(lid);
    const band=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,1.0),new THREE.MeshBasicMaterial({color:'#ffd740'}));band.position.y=0.55;g.add(band);
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,6,5),new THREE.MeshBasicMaterial({color:'#ffe066',transparent:true,opacity:0.45,depthWrite:false}));beam.position.y=3.5;g.add(beam);
    g.position.set(p.x,p.h,p.z);g.rotation.y=rr()*TAU;chunkAdd(g,p.x,p.z);
    CHESTS.push({x:p.x,z:p.z,y:p.h,zone:zn,val:Math.round((30+rr()*50)*(1+zn*0.8)),open:false,mesh:g,lid,seen:false});made++;
    if(rr()<0.65){const nt=1+((rr()*2)|0);for(let i=0;i<nt;i++){const a=rr()*TAU,d=2.5+rr()*3;makeTrap(rr,p.x+Math.cos(a)*d,p.z+Math.sin(a)*d);}}
  }
  for(let i=0;i<120;i++){const p=randLand(rr,0.8,10);if(p)makeTrap(rr,p.x,p.z);}
  // pearls floating in deep water
  for(let t=0,made=0;t<2500&&made<55;t++){
    const x=(rr()*2-1)*205,z=(rr()*2-1)*205;if(H(x,z)>-1.6)continue;
    const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.4,0),new THREE.MeshBasicMaterial({color:'#80deea'}));m.position.set(x,0.55,z);chunkAdd(m,x,z);
    PEARLS.push({x,z,got:false,mesh:m});made++;
  }
}
function makeTrap(rr,x,z){
  const h=H(x,z);if(h<0.8||Math.max(Math.abs(x),Math.abs(z))>205||nearSite(x,z,6))return;
  const k=pickWeighted(TRAPW,rr),zn=zoneAt(x,z),g=new THREE.Group(),tr={k,x,z,y:h,zone:zn,st:0,t:0,ang:rr()*Math.PI,g,aura:null,spikes:null};
  const gc=groundCol(x,z,h,new THREE.Color());
  if(k==='plate'||k==='rock'){
    const c=gc.clone().multiplyScalar(k==='plate'?1.14:0.88);
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.07,1.8),new THREE.MeshLambertMaterial({color:c}));p.position.y=0.04;g.add(p);
    if(k==='plate'){const sg=new THREE.Group();for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(0.16,1.3,4),new THREE.MeshLambertMaterial({color:'#c9ced6'}));s.position.set(i%2?0.45:-0.45,0.6,i<2?0.45:-0.45);sg.add(s);}sg.visible=false;sg.scale.y=0.01;g.add(sg);tr.spikes=sg;}
    tr.rad=1.0;
  }else if(k==='bear'){
    const sg=new THREE.Group();for(let i=0;i<8;i++){const a=i/8*TAU,s=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.7,4),new THREE.MeshLambertMaterial({color:'#9aa0a8'}));s.position.set(Math.cos(a)*0.7,0.4,Math.sin(a)*0.7);s.rotation.z=Math.cos(a)*0.5;s.rotation.x=-Math.sin(a)*0.5;sg.add(s);}
    sg.visible=false;g.add(sg);tr.spikes=sg;tr.rad=0.95;
  }else if(k==='vent'){
    const d=new THREE.Mesh(new THREE.CircleGeometry(0.85,10).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:gc.clone().multiplyScalar(0.4)}));d.position.y=0.06;g.add(d);
    const cr=new THREE.Mesh(new THREE.CircleGeometry(0.28,8).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#7cb342'}));cr.position.y=0.08;g.add(cr);tr.rad=1.7;tr.t=rr()*5;
  }else{ // dart tripwire
    const post=(sx)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.3,5),new THREE.MeshLambertMaterial({color:'#6d5a3a'}));p.position.set(sx*2.4,0.65,0);g.add(p);};
    post(-1);post(1);
    const w=new THREE.Mesh(new THREE.BoxGeometry(4.8,0.025,0.025),new THREE.MeshBasicMaterial({color:'#ddd',transparent:true,opacity:0.35}));w.position.y=0.5;g.add(w);
    g.rotation.y=tr.ang;tr.rad=0.7;
  }
  tr.aura=mkAura(k==='vent'||k==='dart'?'#ffab00':'#ff1744');tr.aura.position.y=0.15;g.add(tr.aura);
  g.position.set(x,h,z);chunks[chunkIdx(x,z)].g.add(g);TRAPS.push(tr);
}

function buildSite(a,col,huts){
  const g=new THREE.Group(),T=THEMES[a.theme||0];
  for(let i=0;i<10;i++){
    const an=i/10*TAU,x=Math.cos(an)*20,z=Math.sin(an)*20;
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,5.5,6),new THREE.MeshLambertMaterial({color:T.rock}));p.position.set(x,H(a.x+x,a.z+z)+2.7-0.0,z);g.add(p);
    const t=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.6,1.1),new THREE.MeshBasicMaterial({color:col}));t.position.set(x,p.position.y+3.1,z);g.add(t);
    pushObs(a.x+x,a.z+z,0.9);
  }
  g.position.set(a.x,0,a.z);
  worldRoot.add(g);
}
function buildCrystalShrine(x,z,col){
  const y=H(x,z),g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2.0,0.7,8),new THREE.MeshLambertMaterial({color:'#7d7d8a'}));base.position.y=0.35;g.add(base);
  const c=new THREE.Mesh(new THREE.OctahedronGeometry(0.9,0).scale(0.8,1.6,0.8),new THREE.MeshBasicMaterial({color:col}));c.position.y=2.2;g.add(c);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.07,5,18).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:col}));ring.position.y=1.4;g.add(ring);
  g.position.set(x,y,z);worldRoot.add(g);SHRINES.push({x,z,c,ring});pushObs(x,z,1.8);
}
function buildLandmarks(){
  const sp=WRL.sp;
  buildCrystalShrine(sp[0].x,sp[0].z-3,'#7cff6a');
  // little village huts around the spawn
  for(let i=0;i<3;i++){
    const an=i*2.1+0.5,x=Math.cos(an)*10,z=Math.sin(an)*10,y=H(x,z),g=new THREE.Group();
    const w=new THREE.Mesh(new THREE.BoxGeometry(3,2.2,3),new THREE.MeshLambertMaterial({color:'#c9a26a'}));w.position.y=1.1;g.add(w);
    const r=new THREE.Mesh(new THREE.ConeGeometry(2.6,1.6,4).rotateY(Math.PI/4),new THREE.MeshLambertMaterial({color:'#a8452f'}));r.position.y=3;g.add(r);
    g.position.set(x,y,z);g.rotation.y=-an;worldRoot.add(g);pushObs(x,z,1.9);
  }
  WRL.arenas.forEach((a,i)=>{
    buildSite(a,BEACON_COL[a.theme],false);
    const bm=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,200,12,1,true),new THREE.MeshBasicMaterial({color:BEACON_COL[a.theme],transparent:true,opacity:0.2,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    bm.position.set(a.x,100,a.z);worldRoot.add(bm);
    if(i>0)buildCrystalShrine(sp[i].x,sp[i].z,BEACON_COL[WRL.arenas[i-1].theme]);
  });
}

/* ---------- minimap: terrain bake + fog of war ---------- */
function bakeMap(){
  mapBase=document.createElement('canvas');mapBase.width=mapBase.height=125;
  const x=mapBase.getContext('2d'),im=x.createImageData(125,125),c=new THREE.Color();
  for(let j=0;j<125;j++)for(let i=0;i<125;i++){
    const wx=i*4-248,wz=j*4-248,h=H(wx,wz),T=THEMES[themeAt(wx,wz)];
    if(h<0){c.copy(T.cWater).multiplyScalar(h<-1?0.7:0.95);}
    else{groundCol(wx,wz,h,c);const sh=1+clamp((H(wx-4,wz-4)-H(wx+4,wz+4))*0.05,-0.3,0.3);c.multiplyScalar(sh);}
    const o=(j*125+i)*4;im.data[o]=c.r*255;im.data[o+1]=c.g*255;im.data[o+2]=c.b*255;im.data[o+3]=255;
  }
  x.putImageData(im,0,0);
  mapFog=document.createElement('canvas');mapFog.width=mapFog.height=125;
  exploredG=new Uint8Array(63*63);resetFog();
}
function resetFog(){
  const x=mapFog.getContext('2d');x.globalCompositeOperation='source-over';x.fillStyle='#10101c';x.fillRect(0,0,125,125);
  exploredG.fill(0);
}
function revealMap(wx,wz,r){
  const x=mapFog.getContext('2d');x.globalCompositeOperation='destination-out';x.beginPath();x.arc((wx+250)/4,(wz+250)/4,r/4,0,TAU);x.fill();
}
function exploreAt(wx,wz){ // returns number of newly explored 8-unit cells
  let n=0;const cx=((wx+250)/8)|0,cz=((wz+250)/8)|0;
  for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){
    if(i*i+j*j>10)continue;const a=cx+i,b=cz+j;if(a<0||b<0||a>62||b>62)continue;
    const k=b*63+a;if(!exploredG[k]){exploredG[k]=1;n++;}
  }
  return n;
}

function updateFx(dt){
  for(let i=PT_.length-1;i>=0;i--){
    const p=PT_[i];p.l-=dt;if(p.l<=0){PT_[i]=PT_[PT_.length-1];PT_.pop();continue;}
    p.vy-=16*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const gy=groundY(p.x,p.z);if(p.y<gy){p.y=gy;p.vy*=-0.3;p.vx*=0.8;p.vz*=0.8;}
  }
  pInst.count=PT_.length;
  for(let i=0;i<PT_.length;i++){
    const p=PT_[i];_dm.position.set(p.x,p.y,p.z);_dm.scale.setScalar(p.s*clamp(p.l/p.l0*1.6,0,1));_dm.updateMatrix();pInst.setMatrixAt(i,_dm.matrix);_pc.setRGB(p.r,p.g,p.b);pInst.setColorAt(i,_pc);
  }
  pInst.instanceMatrix.needsUpdate=true;if(pInst.instanceColor)pInst.instanceColor.needsUpdate=true;
  for(let i=POPS.length-1;i>=0;i--){POPS[i].a-=dt;POPS[i].y+=dt*1.6;if(POPS[i].a<=0)POPS.splice(i,1);}

const MAXE=34;
function spawnEnemy(t,x,z,camp,o){
  o=o||{};const d=ED[t],zn=o.zone!=null?o.zone:(camp?camp.zone:zoneAt(x,z));
  const g=d.shape==='slime'?buildSlime(d.col,d.tell):d.shape==='skel'?buildSkel(d.col,d.tell):buildBat(d.col,d.tell);
  const sc=o.scale||1,mh=d.hp*(o.hpMul||1)*(1+0.7*zn)*threat()*CFG().enemyScale;
  const e={t,d,x,z,y:groundY(x,z),vx:0,vz:0,vy:0,kx:0,kz:0,face:Math.random()*TAU,zone:zn,mhp:mh,hp:mh,dmg:d.dmg*(1+0.45*zn)*(1+0.5*(threat()-1)),r:d.r*sc,sc,g,cd:0.6,tm:Math.random()*1.5,camp,flash:0,dead:false,dying:0,aggro:false,mini:!!o.mini,oa:Math.random()*TAU,mode:0,down:0,fuse:0,gasT:1,shT:2,atkw:0,hop:0,wk:0};
  g.scale.setScalar(sc);g.position.set(x,e.y,z);

  if(VCOL[t]){e.aura=mkAura(VCOL[t]);e.aura.position.y=0.15;e.aura.scale.setScalar(d.r*1.3);e.aura.visible=!!S.tal.sense;g.add(e.aura);}
  entRoot.add(g);E.push(e);if(camp)camp.members.push(e);return e;
}
function spawnBoss(zi){
  const a=WRL.arenas[zi],th=a.theme,b=BD[th],g=b.build();
  const mh=b.hp*(1+0.7*zi)*threat()*CFG().enemyScale;
  g.add(mkShadow(b.r*1.4));g.position.set(a.x,groundY(a.x,a.z),a.z);entRoot.add(g);
  const e={t:'boss',boss:true,bd:b,btype:th,d:{shape:'boss',sp:b.sp,xp:80+60*zi},x:a.x,z:a.z,y:g.position.y,vx:0,vz:0,vy:0,kx:0,kz:0,face:0,zone:zi,mhp:mh,hp:mh,dmg:b.dmg*(1+0.45*zi)*(1+0.5*(threat()-1)),r:b.r,sc:1,g,cd:1,tm:0,flash:0,dead:false,dying:0,aggro:false,arena:a,cdA:3,act:null,lock:0,ph:1,charge:null,wk:0,sum:0,mode:0,down:0,fuse:0};
  E.push(e);banner(b.n.toUpperCase(),'Guardian of '+THEMES[th].n,b.lbl);sfx.boss();return e;
}
function stepE(e,tx,tz,sp,dt){
  const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz);if(d<0.01)return;
  const vx=dx/d*sp,vz=dz/d*sp,nx=e.x+vx*dt,nz=e.z+vz*dt;
  if(e.d.fly||H(nx,e.z)>-0.7)e.x=nx;if(e.d.fly||H(e.x,nz)>-0.7)e.z=nz;
  e.face=Math.atan2(dx,dz);
}
function damageEnemy(e,dmg,kx,kz,crit){
  if(e.dead||e.down>0)return;
  e.hp-=dmg;e.flash=0.1;e.aggro=true;
  popup(e.x,e.y+(e.boss?e.bd.r*2.4:2.4),e.z,String(Math.round(dmg)),crit?'#ffea00':'#ffffff',crit);
  const kb=e.boss?0.25:1;e.kx+=kx*kb;e.kz+=kz*kb;
  burst(e.x,e.y+1.2,e.z,crit?'#ffea00':'#ffffff',crit?8:4,5,0.4,0.2,2);
  crit?sfx.crit():sfx.hit();
  if(e.t==='leech'&&false)return;
  if(e.hp<=0){
    if(e.t==='rev'&&!e.revived){e.revived=true;e.hp=e.mhp*0.5;e.down=2.4;popup(e.x,e.y+2.6,e.z,'...','#b388ff',false);burst(e.x,e.y+1,e.z,'#b388ff',10,4,0.7,0.25,2);return;}
    killEnemy(e);
  }
}
function killEnemy(e,quiet){
  if(e.dead)return;e.dead=true;e.dying=e.boss?1.6:0.35;
  if(e.camp){e.camp.killed++;if(e.camp.killed>=e.camp.n){e.camp.state=2;e.camp.cool=150;}}
  if(quiet){burst(e.x,e.y+1,e.z,'#ff9800',14,7,0.6,0.3,3);return;}
  R.kills++;
  const xp=e.d.xp*(1+0.5*e.zone);gainXp(xp);
  burst(e.x,e.y+1,e.z,e.boss?'#ffd740':(e.d.col||'#fff'),e.boss?40:12,e.boss?12:6,0.7,0.3,3);
  if(S.tal.siphon&&R.hp_ok!==false){P.hp=Math.min(maxHp(),P.hp+4);popup(P.x,P.y+2.6,P.z,'+4','#69f0ae',false);}
  if(!e.mini||Math.random()<0.4)drop('xp',e.x,e.z,xp/(e.boss?10:2),e.boss?10:(1+((Math.random()*2)|0)));
  if(Math.random()<(e.boss?0:(0.45+R.bn.magnet*0.1)))drop('sh',e.x,e.z,(2+e.zone*2)*(1+((Math.random()*2)|0)),1);
  if(Math.random()<(0.07+0.04*R.bn.magnet))drop('hp',e.x,e.z,maxHp()*0.14,1);
  if(e.t==='split'&&!e.mini){for(let i=0;i<2;i++)spawnEnemy('slime',e.x+(i?1:-1),e.z,e.camp&&null,{zone:e.zone,scale:0.6,hpMul:0.5,mini:true});}
  if(e.t==='fart'){addGas(e.x,e.z,3.2,4.5,5*(1+0.45*e.zone),'fart');}
  if(e.boss)bossDown(e);
  else discoverKill(e);
}
function discoverKill(e){if(VCOL[e.t])discover(e.t);}
function bossDown(e){
  const z=e.zone;R.bossesKilled++;R.bossDead[z]=true;R.bossShards+=150*(z+1);
  S.bd[z]=1;{let c=0;while(c<4&&S.bd[c])c++;S.zoneMax=Math.max(S.zoneMax,c);}S.bosses++;
  banner('GUARDIAN SLAIN',e.bd.n,'#ffd740');sfx.win();shake=1;
  drop('sh',e.x,e.z,40*(z+1),6);drop('hp',e.x,e.z,maxHp()*0.35,2);
  HZ.forEach(h=>{if(h.k==='tele'&&h.boss){h.t=-1;h.dmg=0;}});
  save();
  if(S.bd.every(v=>v))setTimeout(()=>{if(R&&!R.dead)finishRun(true);},2200);
}
function gainXp(v){R.xp+=v;while(R.xp>=R.need){R.xp-=R.need;R.lvl++;R.need=Math.floor(40+R.lvl*26);R.pend++;}}

function updateEnemies(dt){
  for(let i=E.length-1;i>=0;i--){
    const e=E[i];
    if(e.dead){
      e.dying-=dt;const k=Math.max(0.001,e.dying/(e.boss?1.6:0.35));e.g.scale.setScalar(e.sc*k);e.g.position.y=e.y+(e.boss?(1-k)*1.5:0);
      if(e.dying<=0){entRoot.remove(e.g);E.splice(i,1);}
      continue;
    }
    const dx=P.x-e.x,dz=P.z-e.z,dp=Math.hypot(dx,dz);
    if(e.flash>0){e.flash-=dt;if(e.flash<=0)setFlash(e.g,false);else setFlash(e.g,true);}
    e.cd-=dt;
    const kk=Math.hypot(e.kx,e.kz);if(kk>0.1){e.x+=e.kx*dt;e.z+=e.kz*dt;e.kx*=Math.max(0,1-dt*7);e.kz*=Math.max(0,1-dt*7);}
    if(e.boss){updateBoss(e,dt,dx,dz,dp);}
    else{
      if(!e.aggro&&dp<17)e.aggro=true;
      if(e.aggro&&dp>48)e.aggro=false;
      if(e.down>0){
        e.down-=dt;e.g.scale.y=e.sc*0.25;if(e.down<=0){e.g.scale.y=e.sc;burst(e.x,e.y+1,e.z,'#b388ff',10,4,0.5,0.25,2);}
      }else if(e.aggro){
        const sh=e.d.shape;
        if(sh==='slime')aiSlime(e,dt,dx,dz,dp);
        else if(sh==='skel')aiSkel(e,dt,dx,dz,dp);
        else aiBat(e,dt,dx,dz,dp);
      }else if(e.d.fly){e.y=groundY(e.x,e.z)+2.6+Math.sin(gt*2+e.oa)*0.3;}
      if(!e.d.fly){
        const gy=groundY(e.x,e.z);
        if(e.vy!==0||e.y>gy+0.02){e.vy-=24*dt;e.y+=e.vy*dt;if(e.y<=gy){e.y=gy;e.vy=0;}}else e.y=gy;
      }
      pushOut(e,e.r*0.8);
      e.x=clamp(e.x,-243,243);e.z=clamp(e.z,-243,243);
      animEnemy(e,dt);
    }
    e.g.position.set(e.x,e.y,e.z);e.g.rotation.y=e.face;
    if(e.d.fly){const s=e.g.children[e.g.children.length-(e.aura?2:1)];if(s&&s.geometry===SHADOW_G){s.position.y=groundY(e.x,e.z)-e.y+0.07;}}
  }
  // separation
  for(let i=0;i<E.length;i++){
    const a=E[i];if(a.dead||a.boss)continue;
    for(let j=i+1;j<E.length;j++){
      const b=E[j];if(b.dead||b.boss)continue;
      const dx=b.x-a.x,dz=b.z-a.z,rr=(a.r+b.r)*0.85,d2=dx*dx+dz*dz;
      if(d2<rr*rr&&d2>1e-4){const d=Math.sqrt(d2),p=(rr-d)/d*0.5;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}
    }
  }
}
function contactHit(e,dp,reach){
  if(e.cd<=0&&dp<e.r+0.6+(reach||0)&&Math.abs(P.y-e.y)<2.4){
    if(hurtPlayer(e.dmg,e.t,P.x-e.x,P.z-e.z)){e.cd=1.0;if(e.t==='leech'){e.hp=Math.min(e.mhp,e.hp+e.dmg*2);popup(e.x,e.y+2.4,e.z,'+'+Math.round(e.dmg*2),'#ff5252',false);}}
  }
}
function aiSlime(e,dt,dx,dz,dp){
  if(e.t==='bomb'){
    if(e.fuse>0){e.fuse-=dt;setFlash(e.g,Math.floor(e.fuse*12)%2===0);if(e.fuse<=0){
      setFlash(e.g,false);burst(e.x,e.y+1,e.z,'#ff6d00',30,10,0.7,0.4,4);burst(e.x,e.y+1,e.z,'#ffeb3b',16,8,0.5,0.3,3);sfx.boom();shake=Math.max(shake,0.6);
      const pd=Math.hypot(P.x-e.x,P.z-e.z);if(pd<5.0)hurtPlayer(e.dmg*3.2,'blast',P.x-e.x,P.z-e.z);
      killEnemy(e,true);return;}
      return;}
    if(dp<3.6)e.fuse=0.95;
  }
  e.tm-=dt;
  if(e.hop>0){e.hop-=dt;stepE(e,P.x,P.z,e.d.sp*2.4,dt);}
  else if(e.tm<=0){e.hop=0.45;e.vy=6;e.tm=0.55+Math.random()*0.5;e.face=Math.atan2(dx,dz);}
  if(e.t==='fart'){e.gasT-=dt;if(e.gasT<=0&&dp<24){addGas(e.x,e.z,2.0,4.0,4.5*(1+0.45*e.zone),'fart');e.gasT=1.8;}}
  if(e.t==='acid'){e.shT-=dt;if(e.shT<=0&&dp<17&&dp>4){fireProj(e.x,e.y+1,e.z,dx,dz,9,e.dmg*1.3,'#9be22b',{src:'acid'});sfx.spit();e.shT=2.6;}}
  contactHit(e,dp,0.3);
}
function aiSkel(e,dt,dx,dz,dp){
  if(e.atkw>0){
    e.atkw-=dt;e.face=Math.atan2(dx,dz);
    if(e.atkw<=0){sfx.swing();if(dp<3.3)hurtPlayer(e.dmg,e.t,dx,dz);e.cd=1.4;}
    return;
  }
  if(dp>1.8)stepE(e,P.x,P.z,e.d.sp,dt);else e.face=Math.atan2(dx,dz);
  if(dp<2.6&&e.cd<=0){e.atkw=0.55;}
}
function aiBat(e,dt,dx,dz,dp){
  const gy=groundY(e.x,e.z);
  if(e.mode===0){
    e.oa+=dt*1.5;e.tm-=dt;
    stepE(e,P.x+Math.cos(e.oa)*6,P.z+Math.sin(e.oa)*6,e.d.sp,dt);
    e.y=lerp(e.y,gy+2.8+Math.sin(gt*3+e.oa)*0.4,dt*4);
    if(e.tm<=0&&dp<22){e.mode=1;e.dt=1.0;e.tx=P.x;e.tz=P.z;}
  }else if(e.mode===1){
    e.dt-=dt;stepE(e,e.tx,e.tz,e.d.sp*2.4,dt);e.y=lerp(e.y,Math.max(gy,H(e.tx,e.tz))+1.0,dt*7);
    contactHit(e,dp,0.5);
    if(e.dt<=0){e.mode=2;e.dt=0.9;}
  }else{e.dt-=dt;e.y=lerp(e.y,gy+3.2,dt*3);if(e.dt<=0){e.mode=0;e.tm=1.8+Math.random()*1.5;}}
}
function animEnemy(e,dt){
  const p=e.g.userData.p,sh=e.d.shape;
  if(sh==='slime'){const s=e.vy>0?1.18:e.vy<0?0.9:1;p.body.scale.y=lerp(p.body.scale.y,s+(e.fuse>0?Math.sin(gt*40)*0.1:0),dt*12);}
  else if(sh==='skel'){e.wk+=dt*(e.aggro&&e.atkw<=0?9:0);p.lL.rotation.x=Math.sin(e.wk)*0.8;p.lR.rotation.x=-Math.sin(e.wk)*0.8;p.aL.rotation.x=-Math.sin(e.wk)*0.6;p.aR.rotation.x=e.atkw>0?-2.4+(1-e.atkw/0.55)*2.4:Math.sin(e.wk)*0.6;}
  else{const f=Math.sin(gt*(e.mode===1?24:14)+e.oa)*0.7;p.wL.rotation.z=f;p.wR.rotation.z=-f;}
}

/* ---------------- bosses ---------------- */
function bossAttackList(e){
  const t=e.btype,l=[];
  if(t===0){l.push('slam','roots','roots');if(!e.sum||e.ph===2)l.push('summon');}
  else if(t===1){l.push('orbs','rain','blink','orbs');if(e.ph===2)l.push('summon');}
  else if(t===2){l.push('charge','slam','quake','charge');}
  else{l.push('ring','blinkstrike','slam','ring');if(e.ph===2&&!e.sum)l.push('summon');}
  return l;
}
function bossAttack(e,k,dx,dz,dp){
  const d=e.dmg,ph2=e.ph===2,a=e.arena;
  const T=(x,z,r,t,dm,o)=>tele(x,z,r,t,dm,Object.assign({boss:true,src:e.bd.n},o||{}));
  switch(k){
    case 'slam':T(e.x,e.z,e.t==='boss'&&e.btype===2?8.5:7.5,1.1,d*1.2,{slam:1});e.lock=1.3;break;
    case 'roots':for(let i=0;i<3;i++){const ox=i?(Math.random()-0.5)*8:0,oz=i?(Math.random()-0.5)*8:0;T(P.x+ox,P.z+oz,3.2,1.0+i*0.35,d*0.8,{root:1.3});}e.lock=1.0;break;
    case 'summon':e.sum=1;for(let i=0;i<3;i++){const an=i/3*TAU;spawnEnemy(e.btype===0?'slime':e.btype===1?'skel':'rev',e.x+Math.cos(an)*4,e.z+Math.sin(an)*4,null,{zone:e.zone});}burst(e.x,e.y+2,e.z,'#b388ff',20,8,0.8,0.3,3);e.lock=1.2;break;
    case 'orbs':e.act={t:0.6,fn:()=>{const n=ph2?7:5,base=Math.atan2(P.x-e.x,P.z-e.z);for(let i=0;i<n;i++){const a2=base+(i-(n-1)/2)*0.28;fireProj(e.x,e.y+3.2,e.z,Math.sin(a2),Math.cos(a2),11,d*0.7,'#b388ff',{src:e.bd.n,sc:1.2});}sfx.spit();}};e.lock=0.9;break;
    case 'rain':for(let i=0;i<(ph2?7:5);i++){const an=Math.random()*TAU,rd=Math.random()*7;T(P.x+Math.cos(an)*rd*(i?1:0),P.z+Math.sin(an)*rd*(i?1:0),2.8,0.9+i*0.16,d);}e.lock=1.0;break;
    case 'blink':{const an=Math.random()*TAU,rd=8+Math.random()*7;burst(e.x,e.y+2,e.z,'#b388ff',16,6,0.5,0.3,2);e.x=a.x+Math.cos(an)*rd;e.z=a.z+Math.sin(an)*rd;burst(e.x,e.y+2,e.z,'#b388ff',16,6,0.5,0.3,2);e.lock=0.4;break;}
    case 'charge':{
      const an=Math.atan2(dx,dz);e.face=an;
      for(let i=1;i<=3;i++)T(e.x+Math.sin(an)*i*6,e.z+Math.cos(an)*i*6,2.6,0.9,0,{});
      e.act={t:0.9,fn:()=>{e.charge={vx:Math.sin(an)*(ph2?20:17),vz:Math.cos(an)*(ph2?20:17),t:0.85,hit:false};sfx.dash();}};e.lock=1.9;break;}
    case 'quake':for(let i=0;i<(ph2?8:6);i++){const an=Math.random()*TAU,rd=2+Math.random()*9;T(P.x+Math.cos(an)*rd,P.z+Math.sin(an)*rd,3.2,0.8+i*0.22,d*0.9,{slam:1});}e.lock=1.2;break;
    case 'ring':e.act={t:0.7,fn:()=>{const n=ph2?18:12;for(let i=0;i<n;i++){const an=i/n*TAU;fireProj(e.x,e.y+2.5,e.z,Math.sin(an),Math.cos(an),9,d*0.6,'#e040fb',{src:e.bd.n,sc:1.2});}if(ph2)setTimeout(()=>{if(!e.dead&&R)for(let i=0;i<18;i++){const an=(i+0.5)/18*TAU;fireProj(e.x,e.y+2.5,e.z,Math.sin(an),Math.cos(an),9,d*0.6,'#e040fb',{src:e.bd.n,sc:1.2});}},550);sfx.spit();}};e.lock=1.0;break;
    case 'blinkstrike':{const an=Math.random()*TAU,sx=P.x+Math.cos(an)*4,sz=P.z+Math.sin(an)*4;T(sx,sz,5,1.0,d*1.4,{slam:1});e.act={t:0.9,fn:()=>{burst(e.x,e.y+2,e.z,'#e040fb',16,6,0.5,0.3,2);e.x=sx;e.z=sz;burst(e.x,e.y+2,e.z,'#e040fb',16,6,0.5,0.3,2);}};e.lock=1.3;break;}
  }
}
function updateBoss(e,dt,dx,dz,dp){
  const a=e.arena,p=e.g.userData.p,ad=Math.hypot(P.x-a.x,P.z-a.z);
  if(!e.aggro&&ad<30)e.aggro=true;
  if(e.hp<e.mhp*0.5&&e.ph===1){e.ph=2;e.sum=0;banner('ENRAGED!',e.bd.n,'#ff5252');sfx.boss();shake=0.8;}
  if(e.aggro&&ad>85){ // player fled: leash and heal
    e.aggro=false;
  }
  if(!e.aggro){e.hp=Math.min(e.mhp,e.hp+e.mhp*0.1*dt);stepE(e,a.x,a.z,e.d.sp,dt);if(Math.hypot(e.x-a.x,e.z-a.z)<1)e.face=Math.atan2(dx,dz);}
  else{
    e.cdA-=dt;
    if(e.charge){
      const c=e.charge;c.t-=dt;e.x+=c.vx*dt;e.z+=c.vz*dt;e.face=Math.atan2(c.vx,c.vz);
      if(!c.hit&&dp<e.r+1.2){c.hit=true;hurtPlayer(e.dmg*1.2,e.bd.n,c.vx,c.vz);}
      if(c.t<=0)e.charge=null;
    }else if(e.act){e.act.t-=dt;e.face=Math.atan2(dx,dz);if(e.act.t<=0){const f=e.act.fn;e.act=null;f();}}
    else if(e.lock>0){e.lock-=dt;e.face=Math.atan2(dx,dz);}
    else{
      if(dp>e.bd.keep)stepE(e,P.x,P.z,e.d.sp*(e.ph===2?1.25:1),dt);else e.face=Math.atan2(dx,dz);
      if(e.cdA<=0&&dp<45){const l=bossAttackList(e);bossAttack(e,l[(Math.random()*l.length)|0],dx,dz,dp);e.cdA=(e.ph===2?1.6:2.4)+Math.random()*1.2;}
    }
    if(e.cd<=0&&dp<e.r+0.9&&e.lock<=0&&!e.act&&!e.charge){if(hurtPlayer(e.dmg*0.6,e.bd.n,dx,dz))e.cd=1.2;}
  }
  const o=Math.hypot(e.x-a.x,e.z-a.z);if(o>24&&!e.charge){e.x=a.x+(e.x-a.x)/o*24;e.z=a.z+(e.z-a.z)/o*24;}
  e.y=groundY(e.x,e.z);
  // animation
  const w=Math.sin(gt*(e.aggro?5:2));
  if(p.aL){p.aL.rotation.x=e.act||e.lock>0?-2.2:w*0.4;p.aR.rotation.x=e.act||e.lock>0?-2.2:-w*0.4;}

let campT=0;
function updateCamps(dt){
  campT-=dt;if(campT>0)return;campT=0.35;
  let active=0;for(const e of E)if(!e.dead&&!e.boss)active++;
  for(const c of CAMPS){
    const d=Math.hypot(P.x-c.x,P.z-c.z);
    if(c.state===0&&d<62&&active+c.n-c.killed<=MAXE){
      c.state=1;c.members=[];
      for(let i=0;i<c.n-c.killed;i++){const a=i/c.n*TAU+0.5,rd=2+((i*37)%5)*0.7;spawnEnemy(c.types[i],c.x+Math.cos(a)*rd,c.z+Math.sin(a)*rd,c);}

    }else if(c.state===1&&d>100){
      for(const e of c.members){if(!e.dead){e.dead=true;e.dying=0.001;e.removeNoKill=true;}}
      c.members=[];c.state=0;
    }else if(c.state===2){

    const d=Math.hypot(P.x-a.x,P.z-a.z),b=E.find(e=>e.boss&&e.zone===zi);

}

  drawBtn(BTN.dash,P.dashCd/1.3,false);
  drawBtn(BTN.blast,P.blastCd/9,false,P.blastCd>0?String(Math.ceil(P.blastCd)):'BLAST');
  if(!S.deaths&&R.alive<20){txt('Left side: move   ·   Right side: look around',360,1230,22,'#fff','center');}
}

/* ============================ SCREENS (DOM) ============================ */
const ui=$('ui');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function clearEntities(){
  for(const e of E)entRoot.remove(e.g);E=[];
  for(const h of HZ){if(h.m)freeMesh(h.k,h.m);}HZ=[];
  for(const q of PR){freeMesh(q.ring?'ring':'proj',q.m);}PR=[];
  for(const k of PK)freeMesh('pk',k.m);PK=[];PT_.length=0;POPS=[];
}
function setScr(s){
  scr=s;
  if(s==='play'||s==='map'){ui.style.display='none';ui.innerHTML='';return;}
  ui.style.display='block';
  if(s==='hub'){clearEntities();showHub();}
  else if(s==='lvl')showBoons();
  else if(s==='dead')showEnd(false);
  else if(s==='win')showEnd(true);
  else ui.style.display='none';
}
function startPos(){return WRL.sp[Math.min(S.up.mem,S.zoneMax,3)];}
function showHub(keep){
  const old=keep&&$('hubscr')?$('hubscr').scrollTop:0;
  const e=1+0.01*Math.min(S.deaths,100),left=5-(S.deaths%5);
  let h='<div class="scr hub" id="hubscr" style="background:linear-gradient(rgba(8,5,20,.2),rgba(8,5,20,.88) 34%)">';
  h+='<h1>REBORN LOOP</h1><div class="sub">Open World · 500 × 500 · Third Person</div>';
  h+='<div class="stats"><span>◆ <b>'+S.shards+'</b></span><span>Lives <b>'+S.deaths+'</b></span><span>Best <b>'+S.best+'</b></span><span>Echo <b>+'+Math.round((e-1)*100)+'%</b></span></div>';
  h+='<button class="big" data-a="go">ENTER THE LOOP ▶</button>';
  h+='<div class="sub">Start: '+(Math.min(S.up.mem,S.zoneMax,3)?'Guardian shrine '+Math.min(S.up.mem,S.zoneMax,3):'Forest village')+' · Guardians slain '+S.bd.filter(v=>v).length+'/4</div>';
  h+='<div class="sub" style="opacity:.7">The world shifts in '+left+' '+(left===1?'life':'lives')+(S.clears?' · Cycle '+(S.clears+1):'')+'</div>';
  h+='<h2>UPGRADES</h2>';
  UPS.forEach(u=>{const l=S.up[u.k],mx=l>=u.max,c=upCost(u);
    h+='<div class="card"><div class="ic">'+u.ic+'</div><div class="tx"><div class="nm">'+u.n+' <span style="color:#ffd740;font-size:20px">Lv '+l+'/'+u.max+'</span></div><div class="ds">'+u.ds+'</div><div class="lv">'+u.d(l)+'</div></div><button class="bt" data-a="up" data-k="'+u.k+'"'+(mx||S.shards<c?' disabled':'')+'>'+(mx?'MAX':'◆ '+c)+'</button></div>';});
  h+='<h2>TALENTS</h2>';
  TALS.forEach(t=>{const own=S.tal[t.k];
    h+='<div class="card'+(own?' own':'')+'"><div class="ic">'+t.ic+'</div><div class="tx"><div class="nm">'+t.n+'</div><div class="ds">'+t.ds+'</div></div><button class="bt" data-a="tal" data-k="'+t.k+'"'+(own||S.shards<t.cost?' disabled':'')+'>'+(own?'OWNED':'◆ '+t.cost)+'</button></div>';});
  h+='<h2>CODEX '+Object.keys(S.seen).length+'/'+DISC.length+'</h2><div class="codex">';
  DISC.forEach(d=>{h+='<span class="'+(S.seen[d.k]?'on':'')+'">'+(S.seen[d.k]?d.n:'???')+'</span>';});
  h+='</div><div class="sub" style="margin-top:22px;opacity:.7">'+TIPS[S.deaths%TIPS.length]+'</div>';
  h+='<button class="big alt" data-a="snd" style="min-height:84px;font-size:32px;width:420px">'+(S.opt.mute?'🔇 Sound OFF':'🔊 Sound ON')+'</button></div>';
  ui.innerHTML=h;if(keep)$('hubscr').scrollTop=old;
}
function showBoons(){
  const b=chooseBoons();
  let h='<div class="scr mid"><h1 style="font-size:60px">LEVEL UP!</h1><div class="sub">Level '+R.lvl+' · choose a boon</div><div style="height:16px"></div>';
  b.forEach(o=>{const n=R.bn[o.k];h+='<div class="card pick" data-a="boon" data-k="'+o.k+'"><div class="ic">'+o.ic+'</div><div class="tx"><div class="nm">'+o.n+(n?' <span style="color:#ffd740">→ Lv '+(n+1)+'</span>':'')+'</div><div class="ds" style="font-size:24px">'+o.d+'</div></div></div>';});
  h+='</div>';ui.innerHTML=h;
}
function showEnd(win){
  const p=R.pay;
  let h='<div class="scr mid '+(win?'':'dead')+'"><h1>'+(win?'WORLD REBORN!':'YOU DIED')+'</h1>';
  h+='<div class="sub" style="margin-top:14px">'+(win?'All four Guardians have fallen. The loop begins anew, stronger and crueler.':'Slain by '+esc(R.lastHit))+'</div>';
  h+='<div class="sub" style="opacity:.8">'+(win?'':DEATH_LINES[(S.deaths-1)%DEATH_LINES.length])+'</div><div style="height:12px"></div>';
  h+='<div class="lines">Survived '+Math.floor(R.alive/60)+'m '+Math.floor(R.alive%60)+'s · Level '+R.lvl+'<br>Explored '+R.explored+' areas · '+R.kills+' kills · '+R.chests+' chests<br>';
  h+='◆ Exploration '+p.explore+' · Kills '+p.kills+' · Guardians '+p.boss+' · Treasure '+p.bonus+'<br>'+(win?'◆ World bonus '+p.winBonus+'<br>':'')+'Multiplier ×'+p.mult.toFixed(2)+'</div>';
  h+='<div class="stats" style="font-size:44px;margin-top:18px">+<b>'+p.pay+'</b> ◆</div>';
  h+='<div class="sub">Echo grows: +'+Math.min(S.deaths,100)+'% to all stats'+(p.newBest?' · NEW BEST '+p.score:' · score '+p.score)+'</div>';
  h+='<button class="big" data-a="again">REBORN NOW ▶</button><button class="big alt" data-a="hub">UPGRADES</button></div>';
  ui.innerHTML=h;
}
async function enterRun(){
  if(!WRL||WRL.route!==routeOf()){
    const ld=$('loader');ld.style.display='flex';ld.style.opacity=1;$('lp').textContent='The world shifts...';$('lb').style.width='0%';
    ui.style.display='none';
    await buildWorld(routeOf(),(f,t)=>{$('lb').style.width=Math.round(f*100)+'%';$('lp').textContent=t;});
    ld.style.opacity=0;setTimeout(()=>{ld.style.display='none';},400);
  }
  startRun();
}
ui.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;unlock();
  const a=t.dataset.a,k=t.dataset.k;
  if(a==='go'||a==='again')enterRun();
  else if(a==='hub'){placeIdle();setScr('hub');}
  else if(a==='up'){const u=UPS.find(x=>x.k===k),c=upCost(u);if(S.up[k]<u.max&&S.shards>=c){S.shards-=c;S.up[k]++;save();sfx.coin();showHub(true);}}
  else if(a==='tal'){const x=TALS.find(y=>y.k===k);if(!S.tal[k]&&S.shards>=x.cost){S.shards-=x.cost;S.tal[k]=1;save();sfx.lvl();showHub(true);}}
  else if(a==='snd'){setMute(!S.opt.mute);showHub(true);}
  else if(a==='boon'){applyBoon(k);setScr('play');}
});

/* ============================ INPUT ============================ */
const touch=$('touch'),ptrs=new Map();
function toHud(e){const r=touch.getBoundingClientRect();return[(e.clientX-r.left)*SW/r.width,(e.clientY-r.top)*SH/r.height];}
function hitBtn(x,y){for(const k in BTN){const b=BTN[k];if(Math.hypot(x-b.x,y-b.y)<b.r+14)return k;}return null;}
touch.addEventListener('pointerdown',e=>{
  unlock();
  if(scr==='map'){setScr('play');return;}
  if(scr!=='play'||!R)return;
  e.preventDefault();try{touch.setPointerCapture(e.pointerId);}catch(_){}
  const[x,y]=toHud(e),b=hitBtn(x,y);
  if(b){
    ptrs.set(e.pointerId,{k:'btn',b});
    if(b==='jump'){act.jump=true;act.jumpEdge=true;}
    else if(b==='dash')act.dash=true;
    else if(b==='blast')act.blast=true;
    else if(b==='map'){setScr('map');ptrs.clear();clearInput();}
    else if(b==='snd'){setMute(!S.opt.mute);}
    return;
  }
  if(e.pointerType!=='mouse'&&x<430&&y>460&&!joy.on){joy.on=true;joy.id=e.pointerId;joy.ox=clamp(x,90,340);joy.oy=clamp(y,560,1190);joy.dx=joy.dy=0;ptrs.set(e.pointerId,{k:'joy'});return;}
  ptrs.set(e.pointerId,{k:'cam',x,y});
});
touch.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const[x,y]=toHud(e);
  if(p.k==='joy'){let dx=(x-joy.ox)/60,dy=(y-joy.oy)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}const m=Math.hypot(dx,dy);if(m<0.12){dx=dy=0;}joy.dx=dx;joy.dy=dy;}
  else if(p.k==='cam'){camS.yaw+=(x-p.x)*0.0085;camS.pitch=clamp(camS.pitch+(y-p.y)*0.005,0.12,1.2);p.x=x;p.y=y;}
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(p.k==='joy'){joy.on=false;joy.dx=joy.dy=0;joy.id=-1;}
  else if(p.k==='btn'&&p.b==='jump')act.jump=false;
}
touch.addEventListener('pointerup',endPtr);touch.addEventListener('pointercancel',endPtr);
function clearInput(){joy.on=false;joy.dx=joy.dy=0;act.jump=act.dash=act.blast=false;for(const k in keys)keys[k]=false;}
window.addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;unlock();
  if(scr==='hub'&&(k==='Enter'||k===' ')){e.preventDefault();enterRun();return;}
  if(scr==='map'){setScr('play');return;}
  if(scr!=='play')return;
  keys[k]=true;
  if(k===' '){e.preventDefault();if(!act.jump)act.jumpEdge=true;act.jump=true;}
  else if(k==='Shift')act.dash=true;
  else if(k==='f'||k==='r')act.blast=true;
  else if(k==='m')setScr('map');
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k===' ')act.jump=false;});
window.addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{lastT=null;clearInput();try{if(AC){document.hidden?AC.suspend():AC.resume();}}catch(e){}});

/* ============================ LOOP / BOOT ============================ */
let lastT=null,slowT=0,rawEma=0.016;
/* adaptive quality: if the device struggles, drop render resolution and draw distance */
function adaptQuality(raw){
  rawEma=lerp(rawEma,Math.min(raw,0.2),0.05);
  if(rawEma>0.045&&QLV<2){slowT+=raw;if(slowT>3){slowT=0;QLV++;
    if(QLV===1){renderer.setSize(576,1024,false);CHUNK_R=120;}else{renderer.setSize(432,768,false);CHUNK_R=95;}
    updateChunks(P.x,P.z,true);}}
  else slowT=Math.max(0,slowT-raw*0.5);
}
function placeIdle(){
  const sp=startPos();P.x=sp.x;P.z=sp.z;P.y=groundY(P.x,P.z);P.face=0.4;hero.position.set(P.x,P.y,P.z);hero.rotation.set(0,P.face,0);animHero(hero,0,0,0,0.28);
  camS.yaw=P.face+Math.PI*0.8;camS.pitch=0.3;camS.dist=12;envTo(themeAt(P.x,P.z),0,true);updateChunks(P.x,P.z,true);cloneM.visible=false;
}
function updateIdle(dt){
  gt+=dt;camS.yaw+=dt*0.18;
  hero.position.set(P.x,P.y,P.z);hero.rotation.set(0,P.face,0);
  const sw=Math.sin(gt*2)*0.04;hero.userData.p.aR.rotation.x=sw;hero.userData.p.aL.rotation.x=-sw;
  hero.children[hero.children.length-1].position.y=0.07;
  for(const s of SHRINES){s.c.rotation.y+=dt*1.5;s.c.position.y=2.2+Math.sin(gt*2)*0.15;}
  updateFx(dt);
  const cp=Math.cos(camS.pitch),sp=Math.sin(camS.pitch),tx=P.x,ty=P.y+1.6,tz=P.z;
  camera.position.set(tx+Math.sin(camS.yaw)*cp*camS.dist,Math.max(ty+sp*camS.dist,H(tx+Math.sin(camS.yaw)*cp*camS.dist,tz+Math.cos(camS.yaw)*cp*camS.dist)+1.4),tz+Math.cos(camS.yaw)*cp*camS.dist);
  camera.lookAt(tx,ty+1.2,tz);
}
function frame(ts){
  requestAnimationFrame(frame);
  if(lastT===null)lastT=ts;
  const raw=(ts-lastT)/1000;let dt=Math.min(0.11,raw);lastT=ts;
  if(scr==='play')adaptQuality(raw);
  try{
    if(!WRL||!renderer)return;
    if(scr==='play'){
      if(keys.q)camS.yaw-=2.2*dt;if(keys.e)camS.yaw+=2.2*dt;
      updatePlay(dt);
    }else if(scr==='hub'||scr==='dead'||scr==='win'){updateIdle(dt);}
    renderer.render(scene,camera);drawHud();
  }catch(err){try{lib.log('err '+err.message+' '+(err.stack||'').split('\n')[1]);}catch(_){}}
}
function setLoad(f,t){$('lb').style.width=Math.round(f*100)+'%';$('lp').textContent=t;}
async function boot(){
  initGL();initFx();
  setLoad(0.02,'Loading save...');
  await loadSave();
  await buildWorld(routeOf(),setLoad);
  placeIdle();setScr('hub');
  const ld=$('loader');ld.style.opacity=0;setTimeout(()=>{ld.style.display='none';},450);
  requestAnimationFrame(frame);
}
function run(mode){
  const gp=window.gameConfig||(window.gameConfig={});
  gp.settings=Object.assign({enemyScale:1,rewardMult:1,worldSeed:0},gp.settings);
  try{
    lib.showGameParameters({name:'Reborn Loop',params:{
      'Enemy Strength':{key:'settings.enemyScale',type:'slider',min:0.5,max:2,step:0.1},
      'Reward Multiplier':{key:'settings.rewardMult',type:'slider',min:0.5,max:3,step:0.1},
      'World Seed Offset':{key:'settings.worldSeed',type:'slider',min:0,max:50,step:1}
    }});
  }catch(e){}
  boot().catch(err=>{try{lib.log('boot failed: '+err.message+' '+err.stack);}catch(_){} $('lp').textContent='Failed to start: '+err.message;});
}
</script>
