<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low-Poly Human Preview</title>
<style>
html,body{margin:0;height:100%;background:#cfe3f2;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
button{padding:12px 16px;min-height:48px;border:0;border-radius:12px;background:#1d2b3a;color:#fff;font-size:15px}
button.on{background:#e4572e}
</style></head><body>
<canvas id="c"></canvas><div id="ui"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { createCharacter, ANIMATIONS } from './lowpoly-human.js';

const q = Object.fromEntries(new URLSearchParams(location.search));
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe3f2');
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
scene.add(new THREE.HemisphereLight('#ffffff', '#7a8a99', 1.1));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
sun.position.set(3, 5, 4); sun.castShadow = true;
sun.shadow.camera.left = -2; sun.shadow.camera.right = 2; sun.shadow.camera.top = 2.5; sun.shadow.camera.bottom = -1;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.1, 20), new THREE.MeshStandardMaterial({ color: '#9fb8a0', flatShading: true }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const hero = createCharacter(THREE, q);
scene.add(hero.root);
hero.play(q.anim || 'idle', q.t !== undefined ? { blend: 0 } : undefined);

let yaw = Number(q.yaw ?? 0.5), auto = q.spin !== '0', drag = null;
canvas.addEventListener('pointerdown', e => { drag = e.clientX; auto = false; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (drag !== null) { yaw += (e.clientX - drag) * 0.01; drag = e.clientX; } });

const ui = document.getElementById('ui');
ANIMATIONS.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { hero.play(n); mark(n); }; ui.appendChild(b); });
const mark = (cur) => [...ui.children].forEach(b => b.classList.toggle('on', b.textContent === cur)); mark(q.anim || 'idle');
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now(), frame = 0;
const fixed = q.t !== undefined;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (fixed) { if (frame++ === 0) hero.update(Number(q.t)); } else hero.update(dt);
  if (auto) yaw += dt * 0.5;
  const d = Math.max(4.4, 2.6 / Math.min(1, cam.aspect));
  cam.position.set(Math.sin(yaw) * d, 1.3, Math.cos(yaw) * d);
  cam.lookAt(0, 0.82, 0);
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__hero = hero; window.__THREE = THREE;
</script></body></html>
