<!doctype html><meta charset="utf-8"><title>Sprite preview</title>
<style>
 body{margin:0;background:#0b1020;color:#e8ecff;font-family:system-ui,sans-serif;padding:24px;width:1100px}
 h1{font-size:22px;margin:0 0 4px} p{color:#8f9bd0;margin:0 0 14px;font-size:14px}
 .row{display:flex;align-items:center;gap:22px;background:#141b33;border:1px solid #2c3868;border-radius:12px;padding:10px 16px;margin-bottom:8px}
 .nm{width:80px;font-size:17px} canvas{image-rendering:pixelated;background:#60b048;border-radius:6px}
 .lbl{font-size:11px;color:#8f9bd0;text-align:center;margin-top:3px}
 .sec{font-size:16px;margin:20px 0 8px;color:#ffcf4a} .fr{display:flex;gap:8px;align-items:flex-start}
 .cell{text-align:center}
</style>
<h1>Astro World — sprite 10×10 (revisi)</h1><p>Per makhluk: A &amp; B = jalan, C = serang. Ukuran 1× (asli) dan 6×.</p>
<div id="rows"></div>
<div class="sec">Rumah per ras (1× dan 6×)</div><div class="row" id="houses"></div>
<div class="sec">Efek mati: jatuh (dibunuh) &amp; arwah (mati tua)</div><div class="row" id="death"></div>
<div class="sec">Mini adegan (3×) — ada rumah, serangan, dan korban</div><canvas id="scene" width="1050" height="330" style="image-rendering:pixelated"></canvas>
<script src="sprites.js"></script>
<script>
const NAMES={human:'Manusia',elf:'Elf',dwarf:'Kurcaci',orc:'Orc',sheep:'Domba',wolf:'Serigala'};
const HN={human:'Gubuk jerami',elf:'Rumah pohon',dwarf:'Rumah batu',orc:'Tenda kulit'};
function put(parent,spr,s,label,bg){const cell=document.createElement('div');cell.className='cell';const c=document.createElement('canvas');c.width=10*s+4;c.height=10*s+4;if(bg)c.style.background=bg;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(spr,2,2,10*s,10*s);cell.appendChild(c);const l=document.createElement('div');l.className='lbl';l.textContent=label;cell.appendChild(l);parent.appendChild(cell);}
const rows=document.getElementById('rows');
for(const k in SPRITES){const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="nm">${NAMES[k]}</div>`;
  for(const s of [1,6]){const g=document.createElement('div');g.className='fr';for(const f of ['A','B','C']){if(!SPRITES[k][f])continue;put(g,buildSprite(SPRITES[k],f),s,f+(s===1?'':''));}r.appendChild(g);}rows.appendChild(r);}
const hs=document.getElementById('houses');
for(const k in HOUSES){const g=document.createElement('div');g.className='fr';put(g,buildSprite(HOUSES[k],'A'),1,'1×');put(g,buildSprite(HOUSES[k],'A'),6,HN[k]);hs.appendChild(g);}
const death=document.getElementById('death');
function deathStrip(kind){const g=document.createElement('div');g.className='fr';const spr=buildSprite(SPRITES.human,'A');
  [0,6,12,18,24,29].forEach(t=>{const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
    const S=40;if(kind==='fall'){const a=Math.min(1,t/8)*Math.PI/2;x.globalAlpha=t<14?1:Math.max(0,1-(t-14)/16);x.translate(32,56);x.rotate(a);x.drawImage(spr,-S/2,-S,S,S);}
    else{x.globalAlpha=.7*(1-t/30);x.drawImage(spr,32-S/2,56-S-t*.9,S,S);}
    const cell=document.createElement('div');cell.className='cell';cell.appendChild(c);const l=document.createElement('div');l.className='lbl';l.textContent='t='+t;cell.appendChild(l);g.appendChild(cell);});return g;}
death.appendChild(deathStrip('fall'));const sep=document.createElement('div');sep.style.width='30px';death.appendChild(sep);death.appendChild(deathStrip('ghost'));
const T={grass:'#60b048',forest:'#287438',sand:'#e2d090',hill:'#968c62'};
const sc=document.getElementById('scene'),x=sc.getContext('2d');x.imageSmoothingEnabled=false;
for(let gy=0;gy<11;gy++)for(let gx=0;gx<35;gx++){const t=Math.sin(gx*.5)+Math.cos(gy*.7);x.fillStyle=t>1.1?T.forest:t>-.6?T.grass:t>-1.2?T.sand:T.hill;x.fillRect(gx*30,gy*30,30,30);}
const D=(spr,px,py,flip)=>{x.save();if(flip){x.translate(px+30,py);x.scale(-1,1);x.drawImage(spr,0,0,30,30);}else x.drawImage(spr,px,py,30,30);x.restore();};
const B=(o,f)=>buildSprite(o,f);
// villages
[[2,2,'human'],[3.2,3,'human'],[14,1,'elf'],[16,2.3,'elf'],[26,2,'dwarf'],[28,3.2,'dwarf'],[8,7,'orc'],[10,8,'orc']].forEach(([gx,gy,r])=>D(B(HOUSES[r],'A'),gx*30,gy*30));
const spots=[['human',4,3,'A'],['human',5,4,'B'],['elf',15,3,'A'],['elf',18,4,'B'],['dwarf',27,4,'A'],['sheep',6,6,'A'],['sheep',7,6,'B'],['sheep',21,6,'A'],['wolf',22,7,'B'],['human',12,5,'A']];
spots.forEach(([k,gx,gy,f])=>D(B(SPRITES[k],f),gx*30,gy*30));
// battle: orc C vs human A, dwarf C vs orc A, wolf C vs sheep
D(B(SPRITES.orc,'C'),11*30,8*30);D(B(SPRITES.human,'A'),12*30,8*30,true);
D(B(SPRITES.dwarf,'C'),24*30,8*30);D(B(SPRITES.orc,'A'),25*30,8*30,true);
D(B(SPRITES.wolf,'C'),19*30,9*30);D(B(SPRITES.sheep,'A'),20*30,9*30,true);
// fallen
x.save();x.translate(14*30+15,9*30+30);x.rotate(Math.PI/2);x.globalAlpha=.7;x.drawImage(B(SPRITES.human,'A'),-15,-30,30,30);x.restore();
</script>
